  <title>Ransom Note</title>

  <style>
    :root {
      --ink: #201a17;
      --paper: #f2ede2;
      --cream: #fff8ef;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
    }

    /* faint ruled-paper backing so the wall reads as a real sheet */
    #wall {
      position: absolute;
      inset: 0;
      padding: clamp(16px, 4vw, 48px);
      overflow: hidden;
      text-align: justify;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(1rem, 2.7vw, 1.55rem);
      line-height: 2.05;
      cursor: crosshair;
      background:
        radial-gradient(120% 120% at 50% 0%, rgba(255,248,239,0.6), rgba(0,0,0,0) 60%),
        repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent calc(2.05em - 1px),
          rgba(32,26,23,0.05) calc(2.05em - 1px),
          rgba(32,26,23,0.05) 2.05em
        );
    }

    .word {
      display: inline-block;
      padding: 0 0.04em;
      transition: color 0.12s ease;
    }

    /* a word cut loose and pinned back — the sticker recipe */
    .word.cut {
      padding: 0.02em 0.2em;
      margin: 0 0.03em;
      border: 2px solid var(--ink);
      border-radius: 4px;
      box-shadow: 2px 2px 0 var(--ink);
      transform: rotate(var(--r, 0deg));
      position: relative;
      z-index: 1;
      transition: none;
    }

    /* the ones that knew too much */
    .word.redacted {
      color: var(--ink) !important;
      background: var(--ink) !important;
      box-shadow: 2px 2px 0 rgba(32,26,23,0.4);
    }

    h1 {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    #hint {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      font-family: Georgia, serif;
      font-style: italic;
      font-size: clamp(0.85rem, 2.2vw, 1.05rem);
      color: rgba(32,26,23,0.6);
      background: rgba(255,248,239,0.85);
      padding: 4px 14px;
      border-radius: 999px;
      pointer-events: none;
      transition: opacity 0.8s ease;
      z-index: 5;
      text-align: center;
      max-width: 90vw;
    }

    #pill {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: rgba(32,26,23,0.82);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 999px;
      z-index: 6;
      opacity: 1;
      transition: opacity 0.4s ease;
      max-width: 94vw;
    }
    #pill.dim { opacity: 0.12; }
    #pill:hover { opacity: 1; }

    #pill button {
      font-family: 'Arial Black', Arial, sans-serif;
      font-weight: 900;
      text-transform: uppercase;
      font-size: 0.72rem;
      letter-spacing: 0.03em;
      color: var(--ink);
      background: var(--cream);
      border: 2px solid var(--ink);
      border-radius: 999px;
      box-shadow: 2px 2px 0 rgba(0,0,0,0.35);
      padding: 7px 13px;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    #pill button:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 rgba(0,0,0,0.35); }
    #pill button:active { transform: translate(1px,1px); box-shadow: 1px 1px 0 rgba(0,0,0,0.35); }
    #pill button.punch { background: #f0563e; color: var(--cream); }

    #count {
      font-family: Georgia, serif;
      font-style: italic;
      font-size: 0.78rem;
      color: var(--cream);
      white-space: nowrap;
      padding-right: 2px;
    }
    #count b {
      font-style: normal;
      font-family: 'Arial Black', Arial, sans-serif;
      color: #f7c948;
    }

    @media (prefers-reduced-motion: reduce) {
      .word { transition: none; }
    }
  </style>
</head>
<body>
  <h1>Ransom Note</h1>
  <div id="wall" aria-hidden="true"></div>
  <div id="hint">sweep across the words — cut what you like</div>
  <div id="pill">
    <span id="count">letters ransomed: <b>0</b></span>
    <button id="scramble">Scramble all</button>
    <button id="peel" class="punch">Peel it off</button>
  </div>

  <script>
    const INK = '#201a17', CREAM = '#fff8ef';

    const FONTS = [
      "'Arial Black', sans-serif",
      "Impact, Haettenschweiler, sans-serif",
      "'Comic Sans MS', 'Comic Sans', cursive",
      "'Courier New', monospace",
      "Georgia, serif",
      "'Times New Roman', serif",
      "'Trebuchet MS', sans-serif",
      "Verdana, Geneva, sans-serif",
      "'Palatino Linotype', 'Book Antiqua', Palatino, serif",
      "Garamond, 'Hoefler Text', serif",
      "'Lucida Console', Monaco, monospace",
      "Tahoma, Geneva, sans-serif",
      "'Brush Script MT', cursive",
      "Copperplate, 'Copperplate Gothic Light', fantasy",
      "Papyrus, fantasy",
      "'Gill Sans', 'Gill Sans MT', Calibri, sans-serif"
    ];

    // palette chips: fill + a readable ink/cream text on top
    const CHIPS = [
      { bg: '#f0563e', fg: CREAM },  // coral
      { bg: '#5aa0db', fg: INK   },  // sky
      { bg: '#b7ce3c', fg: INK   },  // lime
      { bg: '#a98fd0', fg: INK   },  // purple
      { bg: '#f47b28', fg: INK   },  // orange
      { bg: '#ff7fa5', fg: INK   },  // pink
      { bg: '#2fb0a3', fg: CREAM },  // teal
      { bg: '#f7c948', fg: INK   },  // gold
      { bg: CREAM,     fg: INK   },  // clean cut-out
      { bg: '#e9e2d3',  fg: INK  }   // aged paper
    ];

    const PASSAGE =
      "You have found the wall of words. Every letter here was set in plain type and left " +
      "to dry, and nothing on this page is glued down yet. Run your hand across the sentences " +
      "and each word you touch will be cut loose, refitted in a stranger's font, and pinned " +
      "back to the paper in a color it did not choose. This is how a ransom note is made: not " +
      "written, but assembled, one borrowed letter at a time, until the message belongs to no " +
      "one at all. Take your time. There is no wrong way to deface a paragraph. Some words come " +
      "back crooked. Some come back loud. A rare few, the ones that knew too much, come back " +
      "blacked out entirely, and we will not discuss what they said. When you are finished the " +
      "note will not read any differently than it does now. The words are the same words. Only " +
      "the hands have changed. Peel it all off and start again, or leave it ransomed for the " +
      "next person to find. The management accepts no responsibility for whatever the letters " +
      "spell once you are done. Sweep on. The paper is patient, the glue is dry, and you may " +
      "begin absolutely anywhere you please. ";

    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const rand = (a) => a[(Math.random() * a.length) | 0];

    // build the wall: enough repetitions to overflow any screen, clipped
    const wall = document.getElementById('wall');
    const tokens = PASSAGE.trim().split(/\s+/);
    let html = '';
    for (let r = 0; r < 6; r++) {
      for (const t of tokens) html += '<span class="word">' + t + '</span> ';
    }
    wall.innerHTML = html;

    const countEl = document.querySelector('#count b');
    let cutTotal = 0;

    function cut(el) {
      const fresh = !el.classList.contains('cut');
      if (fresh) { cutTotal++; countEl.textContent = cutTotal; }

      el.classList.remove('redacted');

      // ~5%: a word that knew too much gets blacked out
      if (Math.random() < 0.05) {
        el.style.fontFamily = rand(FONTS);
        el.style.setProperty('--r', ((Math.random() * 10 - 5).toFixed(1)) + 'deg');
        el.classList.add('cut', 'redacted');
      } else {
        const chip = rand(CHIPS);
        el.style.fontFamily = rand(FONTS);
        el.style.background = chip.bg;
        el.style.color = chip.fg;
        el.style.setProperty('--r', ((Math.random() * 14 - 7).toFixed(1)) + 'deg');
        el.classList.add('cut');
      }

      if (!reduce) {
        el.animate(
          [{ transform: 'rotate(var(--r)) scale(0.55)' },
           { transform: 'rotate(var(--r)) scale(1.18)' },
           { transform: 'rotate(var(--r)) scale(1)' }],
          { duration: 260, easing: 'cubic-bezier(.34,1.56,.64,1)' }
        );
      }
    }

    // paint-on-move: works for mouse hover and touch drag alike
    let last = null;
    function paint(e) {
      const pts = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      if (!pts.length) pts.push(e);
      for (const p of pts) {
        const el = document.elementFromPoint(p.clientX, p.clientY);
        if (el && el.classList && el.classList.contains('word') && el !== last) {
          cut(el);
          last = el;
        }
      }
      dim();
    }

    wall.addEventListener('pointermove', paint, { passive: true });
    wall.addEventListener('pointerdown', (e) => { last = null; paint(e); });

    // controls
    const pill = document.getElementById('pill');
    document.getElementById('peel').addEventListener('click', () => {
      wall.querySelectorAll('.word.cut').forEach((el) => {
        el.className = 'word';
        el.removeAttribute('style');
      });
      cutTotal = 0; countEl.textContent = 0; last = null;
    });
    document.getElementById('scramble').addEventListener('click', () => {
      wall.querySelectorAll('.word').forEach((el) => cut(el));
    });

    // hint + pill dimming
    const hint = document.getElementById('hint');
    let hid = false;
    function hideHint() { if (hid) return; hid = true; hint.style.opacity = '0'; }
    let dimT;
    function dim() {
      hideHint();
      pill.classList.add('dim');
      clearTimeout(dimT);
      dimT = setTimeout(() => pill.classList.remove('dim'), 900);
    }
    setTimeout(hideHint, 10000);
    pill.addEventListener('pointerdown', (e) => e.stopPropagation());
  </script>
</body>
</html>
