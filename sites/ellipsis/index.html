<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Ellipsis</title>
<meta name="description" content="The whole page is a dot. Click it and another one shows up. That's all this is.">

<style>
  :root{
    --ink:#201a17;
    --paper:#f2ede2;
    --gold:#f7c948;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--paper);
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
    touch-action:manipulation;
  }
  #stage{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    padding:8vw;
  }
  #dots{
    max-width:80vw;
    text-align:center;
    font-family:Georgia, 'Times New Roman', serif;
    font-size:clamp(28px, 6vw, 64px);
    line-height:1.5;
    color:var(--ink);
    letter-spacing:0.02em;
  }
  #dots span{
    display:inline-block;
    animation:dotIn .3s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes dotIn{
    0%{ transform:scale(0); opacity:0; }
    60%{ transform:scale(1.4); opacity:1; }
    100%{ transform:scale(1); }
  }
  .gold{ color:var(--gold); }
  .caption{
    position:fixed;
    left:50%; bottom:20px;
    transform:translateX(-50%);
    font-family:Georgia, 'Times New Roman', serif;
    font-style:italic;
    font-size:14px;
    color:var(--ink);
    background:rgba(255,248,239,.65);
    padding:5px 12px;
    border-radius:9px;
    opacity:.2;
    transition:opacity .35s ease;
    pointer-events:none;
    text-align:center;
    white-space:nowrap;
  }
  #stage:hover .caption{ opacity:.85; }
  @media (max-width:520px){
    .caption{ font-size:11.5px; padding:4px 9px; white-space:normal; max-width:90vw; }
  }
</style>
</head>
<body>

<div id="stage">
  <div id="dots"></div>
  <div class="caption" id="caption">0 dots. still waiting.</div>
</div>

<script>
(function(){
  "use strict";

  const stage = document.getElementById('stage');
  const dotsEl = document.getElementById('dots');
  const caption = document.getElementById('caption');

  const MAX_VISIBLE = 240;
  const rendered = [];

  let total = 0;
  try{
    total = parseInt(localStorage.getItem('ellipsis_total') || '0', 10) || 0;
  }catch(e){}

  function save(){
    try{ localStorage.setItem('ellipsis_total', String(total)); }catch(e){}
  }

  function paintCaption(){
    caption.textContent = total + (total === 1 ? ' dot. still waiting.' : ' dots. still waiting.');
  }

  function addDot(){
    total++;
    save();
    paintCaption();

    const span = document.createElement('span');
    const gold = Math.random() < 0.03;
    span.textContent = gold ? '•' : '.';
    if(gold) span.className = 'gold';
    dotsEl.appendChild(span);
    rendered.push(span);

    if(rendered.length > MAX_VISIBLE){
      const stale = rendered.shift();
      stale.remove();
    }
  }

  // repaint whatever was already collected, without counting the reload as a click
  paintCaption();
  const seedCount = Math.min(total, MAX_VISIBLE);
  for(let i=0; i<seedCount; i++){
    const span = document.createElement('span');
    span.textContent = '.';
    span.style.animation = 'none';
    dotsEl.appendChild(span);
    rendered.push(span);
  }
  if(total === 0) addDot();

  stage.addEventListener('pointerdown', addDot);
})();
</script>

</body>
</html>
