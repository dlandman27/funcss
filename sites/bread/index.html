<!DOCTYPE html>
<html lang="en">
<head>
  <script defer src="https://randomsitesontheweb.com/globals/global.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bread</title>
    <meta name="description" content="A random photo of bread. That's it. Click for another.">
    <!-- rsotw:og:start -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://randomsitesontheweb.com/bread/">
    <meta property="og:title" content="Bread">
    <meta property="og:description" content="A random photo of bread. That's it. Click for another.">
    <meta property="og:image" content="https://randomsitesontheweb.com/og/bread.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Bread">
    <meta name="twitter:description" content="A random photo of bread. That's it. Click for another.">
    <meta name="twitter:image" content="https://randomsitesontheweb.com/og/bread.png">
    <!-- rsotw:og:end -->
  <style>
    :root {
      --ink: #201a17;
      --paper: #f2ede2;
      --cream: #fff8ef;
      --coral: #f0563e;
      --gold: #f7c948;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--paper);
      touch-action: manipulation;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      font-family: Georgia, 'Times New Roman', serif;
    }

    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: radial-gradient(circle, rgba(32, 26, 23, 0.08) 1.5px, transparent 1.5px);
      background-size: 26px 26px;
    }

    #glow {
      position: absolute;
      width: min(80vmin, 620px);
      height: min(80vmin, 620px);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 248, 239, 0.9) 0%, rgba(255, 248, 239, 0) 68%);
      pointer-events: none;
      transition: background 0.4s ease;
    }

    #glow.secret {
      background: radial-gradient(circle, rgba(247, 201, 72, 0.55) 0%, rgba(247, 201, 72, 0) 70%);
    }

    #card {
      position: relative;
      background: var(--cream);
      border: 3px solid var(--ink);
      border-radius: 10px;
      box-shadow: 7px 7px 0 var(--ink);
      padding: 14px 14px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      transform: rotate(-2deg);
      width: min(72vmin, 460px);
    }

    #frame {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border: 2px solid var(--ink);
      border-radius: 4px;
      overflow: hidden;
      background:
        repeating-linear-gradient(45deg, var(--paper) 0 10px, var(--cream) 10px 20px);
    }

    #photo {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
    }

    #photo.loaded {
      opacity: 1;
      animation: thunk 0.35s ease-out;
    }

    #spinner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-size: 13px;
      color: rgba(32, 26, 23, 0.5);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    #spinner.show {
      opacity: 1;
    }

    #card.pop {
      animation: pop-in 420ms cubic-bezier(.2, .9, .25, 1.3);
    }

    @keyframes pop-in {
      0% { transform: rotate(-2deg) scale(0.2); opacity: 0; }
      60% { transform: rotate(-2deg) scale(1.12); opacity: 1; }
      100% { transform: rotate(-2deg) scale(1); }
    }

    @keyframes thunk {
      0% { transform: scale(0.9); }
      60% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    #stage.shake {
      animation: shake-it 260ms ease;
    }

    @keyframes shake-it {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-4px, 3px); }
      40% { transform: translate(4px, -3px); }
      60% { transform: translate(-3px, -2px); }
      80% { transform: translate(3px, 2px); }
    }

    #caption {
      text-align: center;
      max-width: 100%;
    }

    #caption .name {
      font-style: italic;
      font-size: clamp(15px, 3.4vmin, 20px);
      color: var(--ink);
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 90vw;
    }

    #caption .note {
      display: inline-block;
      font-style: italic;
      font-size: clamp(11px, 2.4vmin, 13px);
      color: rgba(32, 26, 23, 0.55);
      margin-top: 2px;
      text-decoration: none;
      border-bottom: 1px dotted rgba(32, 26, 23, 0.4);
    }

    #caption .note:hover {
      color: var(--ink);
    }

    #tag {
      position: absolute;
      top: -12px;
      right: -12px;
      background: var(--coral);
      color: var(--cream);
      border: 2px solid var(--ink);
      border-radius: 999px;
      box-shadow: 3px 3px 0 var(--ink);
      font-family: 'Arial Black', Arial, sans-serif;
      font-size: clamp(10px, 2vmin, 12px);
      padding: 4px 10px;
      transform: rotate(8deg);
      white-space: nowrap;
    }

    #tag.gold {
      background: var(--gold);
    }

    #hint {
      position: absolute;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%);
      font-style: italic;
      font-size: 13px;
      color: rgba(32, 26, 23, 0.5);
      transition: opacity 1s ease;
      pointer-events: none;
      white-space: nowrap;
    }

    #hint.hidden {
      opacity: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      #card.pop { animation: none; }
      #stage.shake { animation: none; }
      #photo.loaded { animation: none; }
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="glow"></div>
    <div id="card">
      <div id="tag">No. 001</div>
      <div id="frame">
        <img id="photo" alt="" referrerpolicy="no-referrer" />
        <div id="spinner">fetching bread&hellip;</div>
      </div>
      <div id="caption">
        <span class="name" id="caption-name">Bread</span>
        <a class="note" id="caption-note" target="_blank" rel="noopener noreferrer">loading&hellip;</a>
      </div>
    </div>
    <div id="hint">click for another loaf</div>
  </div>

  <script>
    const API = 'https://api.openverse.org/v1/images/';
    const TERMS = [
      'bread', 'sourdough bread', 'baguette', 'bagel', 'pretzel',
      'naan bread', 'rye bread', 'ciabatta', 'brioche', 'pita bread',
      'dinner rolls', 'garlic bread', 'loaf of bread', 'sliced bread',
    ];
    const NOTES = [
      'untouched', 'slightly stale', 'still warm', 'dusted with flour',
      'faintly buttery', 'missing a bite', 'cooling on the sill',
      'origin unknown', 'kept under cloth', 'a little lopsided',
      'freshly scored', 'best guess: Tuesday', 'an exceptional specimen',
    ];

    const canvasEl = document.getElementById('photo');
    const spinner = document.getElementById('spinner');
    const card = document.getElementById('card');
    const stage = document.getElementById('stage');
    const glow = document.getElementById('glow');
    const tag = document.getElementById('tag');
    const captionName = document.getElementById('caption-name');
    const captionNote = document.getElementById('caption-note');
    const hint = document.getElementById('hint');

    function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }

    let queue = [];
    let fetching = null;
    let requestToken = 0;

    async function fetchBatch() {
      const term = pick(TERMS);
      const page = 1 + ((Math.random() * 8) | 0);
      const url = API + '?q=' + encodeURIComponent(term) +
        '&page=' + page + '&page_size=20&mature=false';
      const res = await fetch(url);
      if (!res.ok) throw new Error('bad response ' + res.status);
      const data = await res.json();
      const results = (data.results || []).filter((r) => r.thumbnail || r.url);
      if (!results.length) throw new Error('no results');
      for (let i = results.length - 1; i > 0; i--) {
        const j = (Math.random() * (i + 1)) | 0;
        [results[i], results[j]] = [results[j], results[i]];
      }
      return results;
    }

    async function ensureQueue() {
      if (queue.length) return;
      if (!fetching) {
        fetching = fetchBatch().finally(() => { fetching = null; });
      }
      const batch = await fetching;
      queue.push(...batch);
    }

    let count = 0;
    try {
      count = parseInt(localStorage.getItem('bread-count') || '0', 10) || 0;
    } catch (e) {}

    function saveCount() {
      try { localStorage.setItem('bread-count', String(count)); } catch (e) {}
    }

    function renderItem(item, isSecret) {
      count++;
      saveCount();

      const title = (item.title || 'Untitled loaf').replace(/\.[a-z0-9]{2,4}$/i, '');
      captionName.textContent = title.length > 46 ? title.slice(0, 44) + '…' : title;
      captionNote.textContent = 'photo by ' + (item.creator || 'unknown') +
        (item.license ? ' · ' + item.license.toUpperCase() : '');
      captionNote.href = item.foreign_landing_url || item.url || '#';

      tag.textContent = isSecret ? '★ RARE FIND' : 'No. ' + String(count).padStart(3, '0');
      tag.classList.toggle('gold', isSecret);
      glow.classList.toggle('secret', isSecret);
      captionNote.textContent += isSecret ? ' — an exceptional specimen' : ' — ' + pick(NOTES);

      card.classList.remove('pop');
      void card.offsetWidth;
      card.classList.add('pop');

      if (isSecret) {
        stage.classList.remove('shake');
        void stage.offsetWidth;
        stage.classList.add('shake');
      }
    }

    async function show() {
      const myToken = ++requestToken;
      canvasEl.classList.remove('loaded');
      spinner.classList.add('show');

      let attempts = 0;
      while (attempts < 5) {
        attempts++;
        try {
          await ensureQueue();
        } catch (e) {
          if (myToken !== requestToken) return;
          spinner.textContent = 'the bread is unavailable — the internet ate it.';
          return;
        }
        if (myToken !== requestToken) return;

        const item = queue.shift();
        const src = item.thumbnail || item.url;
        const loaded = await new Promise((resolve) => {
          const probe = new Image();
          probe.referrerPolicy = 'no-referrer';
          probe.onload = () => resolve(true);
          probe.onerror = () => resolve(false);
          probe.src = src;
        });

        if (myToken !== requestToken) return;
        if (!loaded) continue;

        canvasEl.src = src;
        canvasEl.alt = item.title || 'A photo of bread';
        canvasEl.classList.add('loaded');
        spinner.classList.remove('show');
        spinner.textContent = 'fetching bread…';

        const isSecret = Math.random() < 0.04;
        renderItem(item, isSecret);
        return;
      }
      spinner.textContent = 'the bread keeps slipping away — try again.';
    }

    let hinted = false;
    function dismissHint() {
      if (hinted) return;
      hinted = true;
      hint.classList.add('hidden');
    }

    document.addEventListener('click', (e) => {
      if (e.target === captionNote) return;
      show();
      dismissHint();
    });
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        show();
        dismissHint();
      }
    });
    setTimeout(dismissHint, 8000);

    show();
  </script>
</body>
</html>
