<!DOCTYPE html>
<html lang="en">
<head>
  <script defer src="https://randomsitesontheweb.com/globals/global.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grass</title>
  <meta name="description" content="A dense field of thin blades that lean away from your cursor like wind pushing through them, then spring back with a little overshoot.">
    <!-- rsotw:og:start -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://randomsitesontheweb.com/grass/">
    <meta property="og:title" content="Grass">
    <meta property="og:description" content="A dense field of thin blades that lean away from your cursor like wind pushing through them, then spring back with a little overshoot.">
    <meta property="og:image" content="https://randomsitesontheweb.com/og/grass.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Grass">
    <meta name="twitter:description" content="A dense field of thin blades that lean away from your cursor like wind pushing through them, then spring back with a little overshoot.">
    <meta name="twitter:image" content="https://randomsitesontheweb.com/og/grass.png">
    <!-- rsotw:og:end -->
  <style>
    :root {
      --ink: #201a17;
      --paper: #f2ede2;
    }
    * , *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      background: #dce9c8;
    }
    #stage { position: fixed; inset: 0; display: block; }

    .hint {
      position: fixed;
      bottom: 6%;
      left: 50%;
      transform: translateX(-50%);
      font-family: Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-size: 14px;
      color: rgba(32, 26, 23, 0.45);
      pointer-events: none;
      opacity: 1;
      transition: opacity 1.4s ease;
      text-align: center;
    }
    .hint.hidden { opacity: 0; }

    @media (max-width: 480px) {
      .hint { font-size: 12px; bottom: 5%; }
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div class="hint" id="hint">drag your hand through the field</div>

  <script>
  (function () {
    'use strict';

    var canvas = document.getElementById('stage');
    var ctx = canvas.getContext('2d');
    var hint = document.getElementById('hint');

    var INK = '#201a17';
    var BLADE_COLORS = ['#7fae3a', '#96c14a', '#5f9e6a', '#4f8f52', '#8bbf4e'];

    var K = 0.02;      // spring stiffness
    var DAMPING = 0.088; // < critical -> overshoot on release
    var PUSH_RADIUS = 150;
    var PUSH_RADIUS_SQ = PUSH_RADIUS * PUSH_RADIUS;
    var WIND_SPEED = 0.0013;

    var width = 0, height = 0, dpr = 1;
    var blades = [];
    var colorGroups = [];
    var pointer = { x: -9999, y: -9999, active: false };

    function debounce(fn, ms) {
      var t;
      return function () {
        clearTimeout(t);
        var args = arguments;
        t = setTimeout(function () { fn.apply(null, args); }, ms);
      };
    }

    function mulberry32(seed) {
      return function () {
        seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
        var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function buildField() {
      var rand = mulberry32(20260810);
      var spacing = Math.max(11, Math.min(17, Math.min(width, height) / 60));
      var cols = Math.ceil(width / spacing) + 1;
      var rows = Math.ceil(height / spacing) + 1;

      blades = [];
      colorGroups = [];
      for (var g = 0; g < BLADE_COLORS.length; g++) colorGroups.push([]);

      for (var r = 0; r < rows; r++) {
        for (var c = 0; c < cols; c++) {
          var jx = (rand() - 0.5) * spacing * 0.85;
          var jy = (rand() - 0.5) * spacing * 0.85;
          var x = c * spacing + jx;
          var y = r * spacing + jy;
          var h = spacing * (1.5 + rand() * 1.4);
          var restLean = (rand() - 0.5) * h * 0.12;
          var colorIdx = (rand() * BLADE_COLORS.length) | 0;
          var blade = {
            x: x,
            y: y,
            h: h,
            colorIdx: colorIdx,
            restX: restLean,
            windPhase: rand() * Math.PI * 2,
            windAmp: h * (0.05 + rand() * 0.05),
            ox: restLean, oy: -h,
            vx: 0, vy: 0
          };
          blades.push(blade);
          colorGroups[colorIdx].push(blade);
        }
      }
    }

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      buildField();
      draw();
    }

    function step(now) {
      var windT = now * WIND_SPEED;

      for (var i = 0; i < blades.length; i++) {
        var b = blades[i];

        var sway = Math.sin(windT + b.windPhase) * b.windAmp;
        var targetX = b.restX + sway, targetY = -b.h;

        if (pointer.active) {
          var dx = b.x - pointer.x, dy = b.y - pointer.y;
          var distSq = dx * dx + dy * dy;
          if (distSq < PUSH_RADIUS_SQ && distSq > 0.0001) {
            var dist = Math.sqrt(distSq);
            var n = 1 - dist / PUSH_RADIUS;
            var falloff = n * n;
            var nx = dx / dist, ny = dy / dist;
            var pushX = nx * b.h * 1.1;
            var pushY = -b.h * 0.35 + ny * b.h * 0.55;
            targetX = targetX + (pushX - targetX) * falloff;
            targetY = targetY + (pushY - targetY) * falloff;
          }
        }

        var ax = (targetX - b.ox) * K - b.vx * DAMPING;
        var ay = (targetY - b.oy) * K - b.vy * DAMPING;
        b.vx += ax;
        b.vy += ay;
        b.ox += b.vx;
        b.oy += b.vy;
      }
    }

    function strokeGroup(list, color, width) {
      ctx.beginPath();
      for (var i = 0; i < list.length; i++) {
        var b = list[i];
        var tipX = b.x + b.ox, tipY = b.y + b.oy;
        var midX = b.x + b.ox * 0.55, midY = b.y + b.oy * 0.55;
        ctx.moveTo(b.x, b.y);
        ctx.quadraticCurveTo(midX, midY, tipX, tipY);
      }
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.stroke();
    }

    function draw() {
      ctx.fillStyle = '#dce9c8';
      ctx.fillRect(0, 0, width, height);

      ctx.lineCap = 'round';

      ctx.globalAlpha = 0.55;
      strokeGroup(blades, INK, 2.6);

      ctx.globalAlpha = 0.95;
      for (var g = 0; g < BLADE_COLORS.length; g++) {
        strokeGroup(colorGroups[g], BLADE_COLORS[g], 1.5);
      }
      ctx.globalAlpha = 1;
    }

    function frame(now) {
      step(now);
      draw();
      requestAnimationFrame(frame);
    }

    function handlePointer(x, y) {
      pointer.x = x;
      pointer.y = y;
      pointer.active = true;
      hint.classList.add('hidden');
    }

    canvas.addEventListener('pointermove', function (e) {
      handlePointer(e.clientX, e.clientY);
    });
    canvas.addEventListener('pointerdown', function (e) {
      handlePointer(e.clientX, e.clientY);
    });
    canvas.addEventListener('pointerleave', function () {
      pointer.active = false;
    });
    canvas.addEventListener('pointerup', function () {
      pointer.active = false;
    });

    setTimeout(function () { hint.classList.add('hidden'); }, 6000);

    window.addEventListener('resize', debounce(resize, 150));
    resize();
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
