<!DOCTYPE html>
<html lang="en">
<head>
    <script defer src="https://randomsitesontheweb.com/globals/global.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doors</title>
    <meta name="description" content="Red door or blue door. Pick right and the next round begins. Pick wrong and it opens on you.">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 50 50'><rect x='4' y='6' width='18' height='40' rx='2' fill='%23f0563e' stroke='%23201a17' stroke-width='3'/><rect x='28' y='6' width='18' height='40' rx='2' fill='%235aa0db' stroke='%23201a17' stroke-width='3'/><circle cx='18' cy='27' r='2' fill='%23201a17'/><circle cx='34' cy='27' r='2' fill='%23201a17'/></svg>">
    <style>
        :root {
            --ink: #201a17;
            --paper: #f2ede2;
            --cream: #fff8ef;
            --coral: #f0563e;
            --sky: #5aa0db;
            --gold: #f7c948;
            --lime: #b7ce3c;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            background: #140f0d;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
            font-family: Georgia, 'Times New Roman', serif;
            color: var(--cream);
        }
        canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; }

        .stamp {
            position: fixed;
            top: 40%;
            left: 50%;
            font-family: 'Arial Black', Arial, sans-serif;
            font-weight: 900;
            font-size: clamp(32px, 10vw, 64px);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 8px 26px;
            border: 4px solid;
            border-radius: 12px;
            background: rgba(255, 248, 239, 0.92);
            transform: translate(-50%, -50%) rotate(3deg) scale(2.4);
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
            z-index: 6;
        }
        .stamp.gold { color: #a9780a; border-color: #a9780a; box-shadow: inset 0 0 0 3px var(--cream), inset 0 0 0 6px #a9780a; }
        .stamp.red { color: var(--coral); border-color: var(--coral); box-shadow: inset 0 0 0 3px var(--cream), inset 0 0 0 6px var(--coral); }
        .stamp.show {
            opacity: 1;
            transform: translate(-50%, -50%) rotate(-8deg) scale(1);
            transition: transform 0.3s cubic-bezier(0.2, 1.6, 0.4, 1), opacity 0.15s ease;
        }
        .stamp.fade {
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .subline {
            position: fixed;
            top: 54%;
            left: 50%;
            transform: translateX(-50%);
            font-style: italic;
            font-size: clamp(14px, 3.5vw, 17px);
            color: rgba(255, 248, 239, 0.85);
            pointer-events: none;
            z-index: 6;
            opacity: 0;
            transition: opacity 0.3s ease;
            text-align: center;
            width: 90vw;
            text-shadow: 0 2px 6px rgba(0,0,0,0.6);
        }
        .subline.show { opacity: 1; }

        .tally {
            position: fixed;
            left: 14px;
            bottom: 10px;
            font-style: italic;
            font-size: 13px;
            color: rgba(255, 248, 239, 0.45);
            pointer-events: none;
            z-index: 6;
        }
        .hint {
            position: fixed;
            bottom: 26px;
            left: 50%;
            transform: translateX(-50%);
            font-style: italic;
            font-size: 15px;
            color: rgba(255, 248, 239, 0.55);
            pointer-events: none;
            transition: opacity 1.2s ease;
            z-index: 6;
            text-align: center;
            width: 90vw;
        }
        .hint.gone { opacity: 0; }

        @keyframes shake {
            0% { transform: translate(0, 0); }
            20% { transform: translate(5px, 3px); }
            40% { transform: translate(-6px, 2px); }
            60% { transform: translate(4px, -3px); }
            80% { transform: translate(-3px, 2px); }
            100% { transform: translate(0, 0); }
        }
        body.shake canvas { animation: shake 0.3s linear; }

        .overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(10, 6, 5, 0.72);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            z-index: 10;
        }
        .overlay.show { opacity: 1; pointer-events: auto; }
        .card {
            background: var(--cream);
            color: var(--ink);
            border: 3px solid var(--ink);
            border-radius: 14px;
            box-shadow: 6px 6px 0 var(--ink);
            padding: 34px 40px;
            text-align: center;
            transform: rotate(-2deg) scale(0.85);
            transition: transform 0.4s cubic-bezier(0.2, 1.6, 0.4, 1);
            max-width: 86vw;
        }
        .overlay.show .card { transform: rotate(-2deg) scale(1); }
        .card h1 {
            font-family: 'Arial Black', Arial, sans-serif;
            font-weight: 900;
            font-size: clamp(24px, 6vw, 38px);
            letter-spacing: 0.04em;
            margin: 0 0 10px;
            color: var(--coral);
            -webkit-text-stroke: 1.5px var(--ink);
            paint-order: stroke fill;
        }
        .card p {
            margin: 0 0 6px;
            font-style: italic;
            font-size: clamp(14px, 3.2vw, 17px);
        }
        .card .best { opacity: 0.65; margin-bottom: 22px; }
        .card button {
            font-family: 'Arial Black', Arial, sans-serif;
            font-weight: 900;
            font-size: 16px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            background: var(--gold);
            color: var(--ink);
            border: 2px solid var(--ink);
            border-radius: 999px;
            padding: 12px 30px;
            cursor: pointer;
            box-shadow: 3px 3px 0 var(--ink);
            transform: rotate(1deg);
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }
        .card button:hover { transform: translate(-2px, -2px) rotate(1deg); box-shadow: 5px 5px 0 var(--ink); }
        .card button:active { transform: translate(2px, 2px) rotate(1deg); box-shadow: 1px 1px 0 var(--ink); }

        @media (prefers-reduced-motion: reduce) {
            .stamp, .stamp.show, .stamp.fade { transition: opacity 0.2s ease; transform: translate(-50%, -50%) rotate(-8deg) scale(1); }
            body.shake canvas { animation: none; }
            .hint, .overlay, .card { transition: none; }
        }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <div class="stamp" id="stamp"></div>
    <div class="subline" id="subline"></div>
    <div class="tally" id="tally"></div>
    <div class="hint" id="hint">pick a door</div>

    <div class="overlay" id="overlay">
        <div class="card">
            <h1>Eliminated</h1>
            <p id="overRound">you lost at round 1</p>
            <p class="best" id="overBest"></p>
            <button id="restartBtn">Try Again</button>
        </div>
    </div>

    <script>
    (() => {
        const INK = '#201a17';
        const CREAM = '#fff8ef';
        const CORAL = '#f0563e';
        const SKY = '#5aa0db';
        const GOLD = '#f7c948';
        const LIME = '#b7ce3c';

        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const stampEl = document.getElementById('stamp');
        const sublineEl = document.getElementById('subline');
        const tallyEl = document.getElementById('tally');
        const hintEl = document.getElementById('hint');
        const overlayEl = document.getElementById('overlay');
        const overRoundEl = document.getElementById('overRound');
        const overBestEl = document.getElementById('overBest');
        const restartBtn = document.getElementById('restartBtn');
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

        function loadNum(k) { try { return parseFloat(localStorage.getItem(k)) || 0; } catch (e) { return 0; } }
        function saveNum(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) {} }
        let best = loadNum('doors-best');

        // ---- canvas ----
        let W = 0, H = 0;
        function resize() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            W = window.innerWidth; H = window.innerHeight;
            canvas.width = Math.round(W * dpr);
            canvas.height = Math.round(H * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        // ---- state ----
        let round = 1;
        let leftColor = 'red', rightColor = 'blue', correctColor = 'red';
        let mode = 'ready'; // ready | opening | gameover
        let openSide = null; // 'left' | 'right'
        let openT = 0;       // 0..1 door swing progress
        let win = false;
        let flashT = 0;      // 0..1 reveal flash intensity
        let bulbPhase = 0;
        let particles = [];
        let crackSeed = 0;

        function newRound(freshRound) {
            leftColor = Math.random() < 0.5 ? 'red' : 'blue';
            rightColor = leftColor === 'red' ? 'blue' : 'red';
            correctColor = Math.random() < 0.5 ? 'red' : 'blue';
            openSide = null; openT = 0; flashT = 0; particles = [];
            mode = 'ready';
            if (freshRound) round = 1;
        }

        function updateTally() {
            let s = 'round: ' + round;
            if (best > 0) s += ' · best streak: ' + best;
            tallyEl.textContent = s;
        }

        function shake() {
            if (reducedMotion.matches) return;
            document.body.classList.remove('shake');
            void document.body.offsetWidth;
            document.body.classList.add('shake');
        }

        let stampTimer = 0;
        function showStamp(text, cls, sub, holdMs) {
            clearTimeout(stampTimer);
            stampEl.textContent = text;
            stampEl.className = 'stamp ' + cls;
            void stampEl.offsetWidth;
            stampEl.classList.add('show');
            sublineEl.textContent = sub;
            sublineEl.classList.add('show');
            stampTimer = setTimeout(() => {
                stampEl.classList.add('fade');
                sublineEl.classList.remove('show');
            }, holdMs);
        }

        // ---- layout ----
        function doorGeom() {
            const dh = Math.min(H * 0.56, 440);
            const dw = Math.min(W * 0.28, dh * 0.52);
            const gap = Math.max(28, W * 0.05);
            const dy = H * 0.5 - dh * 0.42;
            const lx = W / 2 - gap / 2 - dw;
            const rx = W / 2 + gap / 2;
            return { dw, dh, dy, lx, rx };
        }

        // ---- drawing helpers ----
        function stickerRect(x, y, w, h, r, color) {
            ctx.save(); ctx.translate(3, 3);
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
            ctx.fillStyle = INK; ctx.fill(); ctx.restore();
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
            ctx.fillStyle = color; ctx.fill();
            ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
        }

        function drawStage() {
            const g = ctx.createLinearGradient(0, 0, 0, H);
            g.addColorStop(0, '#1c1310');
            g.addColorStop(1, '#0c0808');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, W, H);

            // spotlight
            const cx = W / 2, cy = H * 0.42;
            const rad = Math.max(W, H) * 0.55;
            const sp = ctx.createRadialGradient(cx, cy, rad * 0.05, cx, cy, rad);
            sp.addColorStop(0, 'rgba(255, 230, 180, 0.16)');
            sp.addColorStop(1, 'rgba(255, 230, 180, 0)');
            ctx.fillStyle = sp;
            ctx.fillRect(0, 0, W, H);

            // curtain folds on the far edges
            const foldW = Math.min(W * 0.16, 140);
            for (let side = 0; side < 2; side++) {
                const baseX = side === 0 ? 0 : W - foldW;
                for (let i = 0; i < 6; i++) {
                    const fx = baseX + (side === 0 ? i : 5 - i) * (foldW / 6);
                    const grad = ctx.createLinearGradient(fx, 0, fx + foldW / 6, 0);
                    grad.addColorStop(0, 'rgba(140,30,30,0.35)');
                    grad.addColorStop(0.5, 'rgba(90,14,14,0.5)');
                    grad.addColorStop(1, 'rgba(140,30,30,0.35)');
                    ctx.fillStyle = grad;
                    ctx.fillRect(fx, 0, foldW / 6 + 1, H);
                }
            }
        }

        function drawMarquee() {
            const barY = Math.max(26, H * 0.06);
            const n = Math.floor(W / 34);
            bulbPhase += 0.06;
            for (let i = 0; i < n; i++) {
                const x = (i + 0.5) * (W / n);
                const lit = ((i + Math.floor(bulbPhase)) % 3) === 0;
                ctx.beginPath();
                ctx.arc(x, barY, 5, 0, Math.PI * 2);
                ctx.fillStyle = lit ? GOLD : 'rgba(247,201,72,0.18)';
                ctx.fill();
                ctx.lineWidth = 1.5;
                ctx.strokeStyle = INK;
                ctx.stroke();
                if (lit) {
                    ctx.beginPath();
                    ctx.arc(x, barY, 9, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(247,201,72,0.5)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            }

            // round chip
            const label = 'ROUND ' + round;
            ctx.font = "900 " + Math.max(16, Math.min(W * 0.045, 26)) + "px 'Arial Black', Arial, sans-serif";
            const tw = ctx.measureText(label).width;
            const chipW = tw + 46, chipH = 46;
            const chipY = barY + 20;
            stickerRect(W / 2 - chipW / 2, chipY, chipW, chipH, 999, GOLD);
            ctx.save();
            ctx.translate(W / 2, chipY + chipH / 2 + 1);
            ctx.rotate(-0.02);
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.lineWidth = 3;
            ctx.strokeStyle = INK;
            ctx.strokeText(label, 0, 0);
            ctx.fillStyle = INK;
            ctx.fillText(label, 0, 0);
            ctx.restore();
        }

        function doorColorHex(c) { return c === 'red' ? CORAL : SKY; }

        function drawFrame(x, y, w, h) {
            const pad = Math.max(10, w * 0.09);
            stickerRect(x - pad, y - pad, w + pad * 2, h + pad * 1.15, 10, '#3a2a22');
        }

        function drawDoorPanel(x, y, w, h, color, side) {
            stickerRect(x, y, w, h, 8, color);
            // paneling detail
            ctx.strokeStyle = 'rgba(32,26,23,0.4)';
            ctx.lineWidth = 2;
            const px = x + w * 0.14, pw = w * 0.72;
            [0.1, 0.55].forEach(fy => {
                const py = y + h * fy, ph = h * 0.32;
                if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(px, py, pw, ph, 5); ctx.stroke(); }
            });
            // gold emblem — each door gets its own mark, not a matched pair
            ctx.save();
            ctx.translate(x + w / 2, y + h * 0.5);
            ctx.rotate(-0.08);
            if (side === 'left') {
                star(ctx, 0, 0, w * 0.11, w * 0.045, 5);
            } else {
                diamond(ctx, 0, 0, w * 0.1, w * 0.15);
            }
            ctx.fillStyle = GOLD;
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = INK;
            ctx.stroke();
            ctx.restore();
            // knob
            const kx = x + w * 0.86, ky = y + h * 0.55;
            ctx.beginPath();
            ctx.arc(kx + 1.5, ky + 1.5, w * 0.045, 0, Math.PI * 2);
            ctx.fillStyle = INK; ctx.fill();
            ctx.beginPath();
            ctx.arc(kx, ky, w * 0.045, 0, Math.PI * 2);
            ctx.fillStyle = GOLD; ctx.fill();
            ctx.lineWidth = 2; ctx.strokeStyle = INK; ctx.stroke();
        }

        function star(c, cx, cy, rOuter, rInner, points) {
            c.beginPath();
            for (let i = 0; i < points * 2; i++) {
                const r = i % 2 === 0 ? rOuter : rInner;
                const a = (Math.PI / points) * i - Math.PI / 2;
                const px = cx + Math.cos(a) * r, py = cy + Math.sin(a) * r;
                if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
            }
            c.closePath();
        }

        function diamond(c, cx, cy, rw, rh) {
            c.beginPath();
            c.moveTo(cx, cy - rh);
            c.lineTo(cx + rw, cy);
            c.lineTo(cx, cy + rh);
            c.lineTo(cx - rw, cy);
            c.closePath();
        }

        function drawReveal(x, y, w, h) {
            ctx.save();
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(x, y, w, h, 8); else ctx.rect(x, y, w, h);
            ctx.clip();
            if (win) {
                const g = ctx.createRadialGradient(x + w / 2, y + h / 2, 2, x + w / 2, y + h / 2, w);
                g.addColorStop(0, 'rgba(255,244,200,' + (0.55 + flashT * 0.4) + ')');
                g.addColorStop(0.5, 'rgba(247,201,72,0.85)');
                g.addColorStop(1, '#c99a12');
                ctx.fillStyle = g;
                ctx.fillRect(x, y, w, h);
                ctx.strokeStyle = 'rgba(255,255,255,0.55)';
                ctx.lineWidth = 3;
                const rays = 10;
                for (let i = 0; i < rays; i++) {
                    const a = (i / rays) * Math.PI * 2 + bulbPhase * 0.4;
                    ctx.beginPath();
                    ctx.moveTo(x + w / 2, y + h / 2);
                    ctx.lineTo(x + w / 2 + Math.cos(a) * w, y + h / 2 + Math.sin(a) * w);
                    ctx.stroke();
                }
            } else {
                ctx.fillStyle = '#120404';
                ctx.fillRect(x, y, w, h);
                const g = ctx.createRadialGradient(x + w / 2, y + h * 0.35, 1, x + w / 2, y + h * 0.35, w * 0.9);
                g.addColorStop(0, 'rgba(220,40,30,' + (0.65 + flashT * 0.3) + ')');
                g.addColorStop(1, 'rgba(30,4,4,0)');
                ctx.fillStyle = g;
                ctx.fillRect(x, y, w, h);
                // jagged crack
                ctx.strokeStyle = 'rgba(255,120,90,0.8)';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                let cx = x + w * 0.5, cy = y;
                ctx.moveTo(cx, cy);
                let seed = crackSeed;
                function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
                while (cy < y + h) {
                    cx += (rnd() - 0.5) * w * 0.35;
                    cy += h * 0.12;
                    ctx.lineTo(cx, cy);
                }
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawDoor(side, x, y, w, h) {
            const isOpening = mode === 'opening' && openSide === side;
            const color = doorColorHex(side === 'left' ? leftColor : rightColor);
            drawFrame(x, y, w, h);
            drawReveal(x, y, w, h);
            if (isOpening) {
                const angle = openT * (Math.PI / 2) * 1.08;
                const scaleX = Math.cos(angle);
                const hingeX = side === 'left' ? x : x + w;
                ctx.save();
                ctx.translate(hingeX, 0);
                ctx.scale(scaleX, 1);
                ctx.translate(-hingeX, 0);
                drawDoorPanel(x, y, w, h, color, side);
                ctx.restore();
            } else if (mode !== 'gameover' || (openSide !== side)) {
                drawDoorPanel(x, y, w, h, color, side);
            }
        }

        function spawnParticles(x, y) {
            const n = 26;
            for (let i = 0; i < n; i++) {
                const a = Math.random() * Math.PI * 2;
                const sp = 120 + Math.random() * 220;
                particles.push({
                    x, y,
                    vx: Math.cos(a) * sp,
                    vy: Math.sin(a) * sp - 80,
                    r: 4 + Math.random() * 5,
                    color: [GOLD, LIME, CORAL, SKY][Math.floor(Math.random() * 4)],
                    life: 1
                });
            }
        }

        function drawParticles(dt) {
            particles.forEach(p => {
                p.vy += 480 * dt;
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= dt * 0.7;
            });
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.translate(1.5, 1.5);
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = INK; ctx.fill();
                ctx.restore();
                ctx.save();
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = p.color; ctx.fill();
                ctx.lineWidth = 1.5; ctx.strokeStyle = INK; ctx.stroke();
                ctx.restore();
            });
        }

        function render(dt) {
            drawStage();
            drawMarquee();
            const { dw, dh, dy, lx, rx } = doorGeom();
            drawDoor('left', lx, dy, dw, dh);
            drawDoor('right', rx, dy, dw, dh);
            if (particles.length) drawParticles(dt || 0);
        }

        // ---- animation loop (sleeps when idle) ----
        let rafId = 0, lastT = 0;
        function frame(now) {
            const dt = Math.min(0.05, (now - lastT) / 1000);
            lastT = now;
            let active = false;
            if (mode === 'opening') {
                openT = Math.min(1, openT + dt * 2.1);
                flashT = Math.min(1, flashT + dt * 2.4);
                active = true;
            }
            if (particles.length) active = true;
            render(dt);
            if (active) rafId = requestAnimationFrame(frame);
            else rafId = 0;
        }
        function wake() {
            if (!rafId) { lastT = performance.now(); rafId = requestAnimationFrame(frame); }
        }
        // idle shimmer: low-frequency tick so the marquee still chases at rest,
        // without holding a full 60fps loop open when nothing else is animating.
        setInterval(() => { if (mode === 'ready' && !rafId) render(0); }, 220);

        // ---- input ----
        function pick(side) {
            if (mode !== 'ready') return;
            hintEl.classList.add('gone');
            openSide = side;
            openT = 0; flashT = 0;
            mode = 'opening';
            const chosen = side === 'left' ? leftColor : rightColor;
            win = chosen === correctColor;
            crackSeed = Math.floor(Math.random() * 100000);
            const { dw, dh, dy, lx, rx } = doorGeom();
            const cx = (side === 'left' ? lx : rx) + dw / 2;
            const cy = dy + dh / 2;
            wake();
            setTimeout(() => {
                if (win) {
                    spawnParticles(cx, cy);
                    showStamp('Advance', 'gold', 'round ' + round + ' survived', 1300);
                    round++;
                    updateTally();
                    setTimeout(() => { newRound(false); render(0); }, 1500);
                } else {
                    shake();
                    showStamp('Eliminated', 'red', 'out at round ' + round, 1400);
                    if (round - 1 > best) { best = round - 1; saveNum('doors-best', best); }
                    setTimeout(() => {
                        mode = 'gameover';
                        overRoundEl.textContent = 'you lost at round ' + round;
                        overBestEl.textContent = best > 0 ? 'best streak: ' + best : '';
                        overlayEl.classList.add('show');
                        updateTally();
                    }, 1500);
                }
            }, 620);
        }

        function hitDoor(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const x = clientX - rect.left, y = clientY - rect.top;
            const { dw, dh, dy, lx, rx } = doorGeom();
            if (x >= lx && x <= lx + dw && y >= dy && y <= dy + dh) return 'left';
            if (x >= rx && x <= rx + dw && y >= dy && y <= dy + dh) return 'right';
            return null;
        }

        window.addEventListener('pointerdown', e => {
            if (overlayEl.classList.contains('show')) return;
            const side = hitDoor(e.clientX, e.clientY);
            if (side) pick(side);
        });
        window.addEventListener('contextmenu', e => e.preventDefault());

        restartBtn.addEventListener('click', () => {
            overlayEl.classList.remove('show');
            stampEl.classList.remove('show');
            stampEl.classList.add('fade');
            newRound(true);
            updateTally();
            render(0);
        });

        let resizeTimer = 0;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => { resize(); render(0); }, 150);
        });

        setTimeout(() => hintEl.classList.add('gone'), 10000);

        // ---- go ----
        resize();
        newRound(true);
        updateTally();
        render(0);
    })();
    </script>
</body>
</html>
