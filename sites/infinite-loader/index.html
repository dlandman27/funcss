<html lang="en">
<head>

  <title>Infinite Loader</title>
  <meta name="description" content="A loading bar headed for 100%. It will not arrive. Click to hurry it — that has been noted.">

  <style>
    :root {
      --ink: #201a17;
      --paper: #f2ede2;
      --cream: #fff8ef;
      --coral: #f0563e;
      --sky: #5aa0db;
      --gold: #f7c948;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 38%, var(--cream) 0%, var(--paper) 75%);
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: Georgia, 'Times New Roman', serif;
      color: var(--ink);
    }
    .wrap {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-family: 'Arial Black', Arial, sans-serif;
      font-weight: 900;
      font-size: clamp(26px, 6vw, 44px);
      letter-spacing: 2px;
      text-transform: uppercase;
      transform: rotate(-2deg);
      color: var(--cream);
      -webkit-text-stroke: 2px var(--ink);
      text-shadow: 4px 4px 0 var(--ink);
    }

    .pct {
      font-family: 'Arial Black', Arial, sans-serif;
      font-weight: 900;
      font-size: clamp(40px, 10vw, 84px);
      color: var(--coral);
      -webkit-text-stroke: 2px var(--ink);
      text-shadow: 5px 5px 0 var(--ink);
      transform: rotate(1.5deg);
      line-height: 1;
      min-height: 1em;
    }
    .bar {
      width: min(560px, 88vw);
      height: 44px;
      background: var(--cream);
      border: 3px solid var(--ink);
      border-radius: 999px;
      box-shadow: 6px 6px 0 var(--ink);
      overflow: hidden;
      position: relative;
      transform: rotate(-0.6deg);
    }
    .bar.pop { animation: pop 0.22s ease; }
    @keyframes pop {
      0% { transform: rotate(-0.6deg) scale(1, 1); }
      40% { transform: rotate(-0.6deg) scale(1.03, 0.88); }
      100% { transform: rotate(-0.6deg) scale(1, 1); }
    }
    .fill {
      height: 100%;
      width: 0%;
      background: var(--coral);
      background-image: repeating-linear-gradient(
        -45deg,
        rgba(255, 248, 239, 0.35) 0 14px,
        transparent 14px 28px
      );
      background-size: 40px 40px;
      border-right: 3px solid var(--ink);
      border-radius: 999px 0 0 999px;
      animation: stripes 1.1s linear infinite;
    }
    @keyframes stripes {
      from { background-position: 0 0; }
      to { background-position: 40px 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .fill { animation: none; }
      .bar.pop { animation: none; }
    }

    .status {
      font-style: italic;
      font-size: clamp(14px, 2.6vw, 17px);
      color: rgba(32, 26, 23, 0.72);
      min-height: 1.4em;
    }

    .plaques {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .plaque {
      background: var(--cream);
      border: 2px solid var(--ink);
      border-radius: 12px;
      box-shadow: 3px 3px 0 var(--ink);
      padding: 8px 14px;
      min-width: 128px;
    }
    .plaque:nth-child(1) { transform: rotate(-1.5deg); }
    .plaque:nth-child(2) { transform: rotate(1deg); background: var(--gold); }
    .plaque:nth-child(3) { transform: rotate(-0.8deg); }
    .plaque .label {
      font-family: 'Arial Black', Arial, sans-serif;
      font-weight: 900;
      font-size: 9px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .plaque .value {
      font-style: italic;
      font-size: 15px;
      margin-top: 2px;
    }

    .fine {
      position: fixed;
      bottom: 16px;
      left: 0;
      right: 0;
      text-align: center;
      font-style: italic;
      font-size: 12px;
      color: rgba(32, 26, 23, 0.4);
      pointer-events: none;
    }

    @media (max-width: 480px) {
      .wrap { gap: 16px; }
      .bar { height: 36px; }
      .plaque { min-width: 104px; padding: 6px 10px; }
      .plaque .value { font-size: 13px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Loading</h1>
    <div class="pct" id="pct">0%</div>
    <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
    <div class="status" id="status">loading assets&hellip;</div>
    <div class="plaques">
      <div class="plaque">
        <div class="label">Elapsed</div>
        <div class="value" id="elapsed">0:00</div>
      </div>
      <div class="plaque">
        <div class="label">Remaining</div>
        <div class="value" id="eta">a few seconds</div>
      </div>
      <div class="plaque">
        <div class="label">Attempts to hurry</div>
        <div class="value" id="clicks">0</div>
      </div>
    </div>
  </div>
  <div class="fine">progress is asymptotic. refunds unavailable.</div>

  <script>
  (function () {
    'use strict';

    var pctEl = document.getElementById('pct');
    var barEl = document.getElementById('bar');
    var fillEl = document.getElementById('fill');
    var statusEl = document.getElementById('status');
    var elapsedEl = document.getElementById('elapsed');
    var etaEl = document.getElementById('eta');
    var clicksEl = document.getElementById('clicks');

    // the classic fake ramp: quick, with the traditional stalls at 23% and 67%
    var RAMP = [[0, 0], [1.2, 23], [2.8, 23], [4, 67], [5.5, 67], [8, 90]];
    var RAMP_END = 8;

    var STATUS_TIERS = [
      [0,      ['loading assets…', 'allocating memory…', 'warming up…']],
      [10,     ['finalizing…', 'verifying the final percent…', 'almost there…']],
      [30,     ['compressing the remaining distance…', 'the last percent is heavier than it looks…', 're-estimating the estimate…']],
      [90,     ['consulting the progress committee…', 'measuring the distance to 100…', 'halfway through the second half of the last percent…']],
      [300,    ['Zeno has been notified.', 'do not close this window. or do. it won’t help.', 'your patience has been logged.']],
      [1800,   ['still going. respect.', 'the bar appreciates your company.', 'progress is a state of mind.']],
      [86400,  ['day two. the percent holds.', 'we’ve grown attached to this percent.', '100 was never the point.']]
    ];

    var ETAS = [
      'about 5 seconds', 'less than a minute', 'any second now', 'recalculating…',
      'soon', 'shortly', 'imminent', 'basically done'
    ];

    var state = { start: Date.now(), hurry: 0, clicks: 0 };
    var secretUntil = 0;

    function load() {
      try {
        var raw = localStorage.getItem('infinite-loader');
        if (!raw) return;
        var s = JSON.parse(raw);
        if (typeof s.start === 'number' && s.start > 0 && s.start <= Date.now()) state.start = s.start;
        if (typeof s.hurry === 'number' && s.hurry >= 0) state.hurry = s.hurry;
        if (typeof s.clicks === 'number' && s.clicks >= 0) state.clicks = s.clicks;
      } catch (e) { /* ignore */ }
    }

    function save() {
      try { localStorage.setItem('infinite-loader', JSON.stringify(state)); } catch (e) { /* ignore */ }
    }

    // virtual seconds of loading: real time since first-ever visit, plus hurrying
    function tNow() {
      return (Date.now() - state.start) / 1000 + state.hurry;
    }

    function progress(t) {
      if (t <= RAMP_END) {
        for (var i = 1; i < RAMP.length; i++) {
          if (t <= RAMP[i][0]) {
            var a = RAMP[i - 1], b = RAMP[i];
            var u = (t - a[0]) / (b[0] - a[0]);
            return a[1] + (b[1] - a[1]) * u;
          }
        }
        return 90;
      }
      // remaining 10% decays forever; the pot never boils
      var remaining = 10 / Math.pow(1 + (t - RAMP_END) / 15, 0.85);
      return 100 - remaining;
    }

    function formatPct(p) {
      var remaining = 100 - p;
      var digits = 0;
      if (remaining < 10) digits = 1;
      if (remaining < 1) digits = Math.min(7, Math.floor(-Math.log(remaining) / Math.LN10) + 2);
      var str = p.toFixed(digits);
      // never let rounding claim victory
      if (parseFloat(str) >= 100) str = '99.' + new Array(Math.max(digits, 1) + 1).join('9');
      return str + '%';
    }

    function formatElapsed(sec) {
      sec = Math.max(0, Math.floor(sec));
      var d = Math.floor(sec / 86400);
      var h = Math.floor((sec % 86400) / 3600);
      var m = Math.floor((sec % 3600) / 60);
      var s = sec % 60;
      var mm = (m < 10 && (h || d) ? '0' : '') + m;
      var ss = (s < 10 ? '0' : '') + s;
      if (d) return d + 'd ' + h + ':' + mm + ':' + ss;
      if (h) return h + ':' + mm + ':' + ss;
      return m + ':' + ss;
    }

    function currentStatus(t, realElapsed) {
      if (Date.now() < secretUntil) return 'clicking has been escalated to management.';
      var tier = STATUS_TIERS[0][1];
      for (var i = 0; i < STATUS_TIERS.length; i++) {
        if (realElapsed >= STATUS_TIERS[i][0]) tier = STATUS_TIERS[i][1];
      }
      return tier[Math.floor(realElapsed / 6) % tier.length];
    }

    function render() {
      var t = tNow();
      var realElapsed = (Date.now() - state.start) / 1000;
      var p = progress(t);

      var text = formatPct(p);
      pctEl.textContent = text;
      fillEl.style.width = p + '%';
      statusEl.textContent = currentStatus(t, realElapsed);
      elapsedEl.textContent = formatElapsed(realElapsed);
      etaEl.textContent = ETAS[Math.floor(realElapsed / 7) % ETAS.length];
      clicksEl.textContent = state.clicks;
      document.title = text + ' — Infinite Loader';
    }

    document.addEventListener('pointerdown', function () {
      state.clicks++;
      state.hurry += 2; // two whole extra seconds of progress. generous.
      barEl.classList.remove('pop');
      void barEl.offsetWidth;
      barEl.classList.add('pop');
      if (Math.random() < 0.025) secretUntil = Date.now() + 3000;
      save();
      render();
    });

    load();
    save();
    render();
    setInterval(render, 100);
  })();
  </script>
</body>
</html>
