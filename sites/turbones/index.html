<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e0e1e2">
  <title>Turbo NES Controller</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="controller" aria-label="NES controller">
    <img class="artwork" src="./assets/controller.png" alt="" draggable="false">
    <div class="dpad" aria-label="Directional pad">
      <button class="direction up" data-input="up" aria-label="Up (arrow up)"></button>
      <button class="direction down" data-input="down" aria-label="Down (arrow down)"></button>
      <button class="direction left" data-input="left" aria-label="Left (arrow left)"></button>
      <button class="direction right" data-input="right" aria-label="Right (arrow right)"></button>
    </div>
    <button class="action b" data-input="b" aria-label="B (Z)"></button>
    <button class="action a" data-input="a" aria-label="A (X)"></button>
    <button class="action turbo" data-input="turbo" aria-label="Turbo A and B (Space)"></button>
    <button class="pill select" data-input="select" aria-label="Select (Shift)"></button>
    <button class="pill start" data-input="start" aria-label="Start (Enter)"></button>
    <button class="menu" data-input="menu" aria-label="Open controller menu (Escape)" aria-haspopup="dialog"></button>
  </main>
  <dialog aria-labelledby="menu-title">
    <form method="dialog">
      <h1 id="menu-title">Controller</h1>
      <p>Connect your simulator to <code>nesinput</code> events.</p>
      <dl><dt>D-pad</dt><dd>Arrow keys</dd><dt>B / A</dt><dd>Z / X</dd><dt>Select / Start</dt><dd>Shift / Enter</dd><dt>Turbo A + B</dt><dd>Hold Space</dd><dt>Menu</dt><dd>Escape</dd></dl>
      <output id="input-status" aria-live="polite">Ready</output>
      <button class="close">Resume</button>
    </form>
  </dialog>
  <script type="module" src="./controller.js"></script>
</body>
</html>
