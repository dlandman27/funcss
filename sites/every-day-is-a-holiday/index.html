      [12,7,[[`Letter Writing Day`,`A lost art, revived for twenty-four hours.`]]],
      [12,8,[[`Pretend to Be a Time Traveler Day`,`Talk about the future like it already happened.`]]],
      [12,9,[[`Christmas Card Day`,`The one piece of mail that is not a bill.`]]],
      [12,10,[[`Human Rights Day`,`A holiday that should not be optional.`]]],
      [12,12,[[`Gingerbread House Day`,`Edible architecture, structurally questionable.`]]],
      [12,16,[[`Chocolate Covered Anything Day`,`A very permissive holiday.`]]],
      [12,17,[[`Wright Brothers Day`,`Twelve seconds that changed everything.`]]],
      [12,21,[[`Look on the Bright Side Day`,`The shortest day, spun optimistically.`]]],
      [12,22,[[`Date Nut Bread Day`,`A loaf nobody asked for and everyone finishes.`]]],
      [12,23,[[`Festivus`,`For the rest of us.`]]],
      [12,24,[[`Eggnog Day`,`A drink that is mostly a dare.`]]],
      [12,26,[[`Thank You Note Day`,`The bill comes due for all that gift-giving.`]]],
      [12,28,[[`Card Playing Day`,`Fifty-two ways to end a friendship.`]]],
      [12,31,[[`Make Up Your Mind Day`,`One day left to decide on the resolution.`]]],
    ];

    function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }

    const nav = document.getElementById('month-nav');
    const calendar = document.getElementById('calendar');
    const todayBtn = document.getElementById('today-btn');

    const now = new Date();
    const todayMonth = now.getMonth() + 1;
    const todayDay = now.getDate();
    let todayCardEl = null;

    for (let m = 1; m <= 12; m++) {
      const pillBtn = document.createElement('button');
      pillBtn.className = 'month-pill';
      pillBtn.type = 'button';
      pillBtn.textContent = MONTH_ABBR[m - 1];
      pillBtn.addEventListener('click', () => {
        const target = document.getElementById('month-' + m);
        if (target) target.scrollIntoView({ behavior: 'smooth' });
      });
      nav.appendChild(pillBtn);
    }

    let colorIndex = 0;
    let currentMonth = null;
    let sectionEl = null;

    DATA.forEach(([m, d, holidays]) => {
      if (m !== currentMonth) {
        currentMonth = m;
        sectionEl = document.createElement('section');
        sectionEl.className = 'month-section';

        const banner = document.createElement('div');
        banner.className = 'month-banner';
        banner.id = 'month-' + m;
        banner.style.background = 'var(--' + PALETTE[colorIndex % PALETTE.length] + ')';
        colorIndex++;
        banner.textContent = MONTHS[m - 1];
        sectionEl.appendChild(banner);

        calendar.appendChild(sectionEl);
      }

      const isToday = m === todayMonth && d === todayDay;

      const card = document.createElement('div');
      card.className = 'day-card' + (isToday ? ' is-today' : '');

      if (isToday) {
        const tag = document.createElement('div');
        tag.className = 'today-tag';
        tag.textContent = 'TODAY';
        card.appendChild(tag);
        todayCardEl = card;
      }

      const dateEl = document.createElement('div');
      dateEl.className = 'day-date';
      dateEl.style.background = 'var(--' + PALETTE[(colorIndex - 1) % PALETTE.length] + ')';
      dateEl.innerHTML = '<span class="num">' + d + '</span><span class="mon">' + MONTH_ABBR[m - 1] + '</span>';
      card.appendChild(dateEl);

      const body = document.createElement('div');
      body.className = 'day-body';
      holidays.forEach(([name, note]) => {
        const entry = document.createElement('div');
        entry.className = 'holiday-entry';
        const nameEl = document.createElement('div');
        nameEl.className = 'holiday-name';
        nameEl.textContent = name;
        const noteEl = document.createElement('div');
        noteEl.className = 'holiday-note';
        noteEl.textContent = note;
        entry.appendChild(nameEl);
        entry.appendChild(noteEl);
        body.appendChild(entry);
      });
      card.appendChild(body);

      sectionEl.appendChild(card);
    });

    function jumpToToday() {
      if (todayCardEl) {
        todayCardEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    todayBtn.addEventListener('click', jumpToToday);

    if (todayCardEl) {
      setTimeout(jumpToToday, 400);
    }
  </script>
</body>
</html>
