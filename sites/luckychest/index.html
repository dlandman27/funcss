<!DOCTYPE html>
<html lang="en">
<head>
  <script defer src="https://randomsitesontheweb.com/globals/global.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucky Chest</title>
  <meta name="description" content="Tap the chest. Sometimes it upgrades. Paperclips, a good stick, the other sock — collect them all in your binder.">
    <!-- rsotw:og:start -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://randomsitesontheweb.com/luckychest/">
    <meta property="og:title" content="Lucky Chest">
    <meta property="og:description" content="Tap the chest. Sometimes it upgrades. Paperclips, a good stick, the other sock — collect them all in your binder.">
    <meta property="og:image" content="https://randomsitesontheweb.com/og/luckychest.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Lucky Chest">
    <meta name="twitter:description" content="Tap the chest. Sometimes it upgrades. Paperclips, a good stick, the other sock — collect them all in your binder.">
    <meta name="twitter:image" content="https://randomsitesontheweb.com/og/luckychest.png">
    <!-- rsotw:og:end -->
  <style>
    :root {
      --ink: #201a17;
      --paper: #f2ede2;
      --cream: #fff8ef;
      --coral: #f0563e;
      --sky: #5aa0db;
      --lime: #b7ce3c;
      --purple: #a98fd0;
      --orange: #f47b28;
      --pink: #ff7fa5;
      --teal: #2fb0a3;
      --gold: #f7c948;
      --gray: #a89f93;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, 'Times New Roman', serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    /* ---------- tier-tinted world ---------- */
    .bgwash {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: var(--paper);
      transition: background .8s ease;
    }
    .bgwash.t2 { background: #d9e9f6; }
    .bgwash.t3 { background: #e8dff4; }
    .bgwash.t4 { background: #fbeec2; }
    .bgwash.t5 {
      background: linear-gradient(115deg, #f8d9d2, #fbe7c9, #fdf3c4, #e3edc7, #cfeae6, #d6e6f5, #e6def3, #fadbe6, #f8d9d2);
      background-size: 400% 400%;
      animation: bgshift 7s linear infinite;
    }
    @keyframes bgshift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .flash {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(circle at 50% 55%, var(--flash-c, var(--gold)) 0%, transparent 55%);
    }

    .app {
      position: relative;
      z-index: 2;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 14px;
    }

    header {
      display: flex;
      justify-content: flex-end;
      position: relative;
      z-index: 9;
    }
    .chip {
      font-family: 'Arial Black', Arial, sans-serif;
      font-weight: 900;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .4px;
      color: var(--ink);
      background: var(--cream);
      border: 3px solid var(--ink);
      border-radius: 999px;
      padding: 8px 14px;
      box-shadow: 3px 3px 0 var(--ink);
      cursor: pointer;
      transition: transform .12s, box-shadow .12s;
      transform: rotate(1.5deg);
    }
    .chip:hover { transform: translate(-2px,-2px) rotate(1.5deg); box-shadow: 5px 5px 0 var(--ink); }
    .chip:active { transform: translate(2px,2px) rotate(1.5deg); box-shadow: 1px 1px 0 var(--ink); }

    /* ---------- stage ---------- */
    .stage {
      flex: 1;
      min-height: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .stars { display: flex; gap: 9px; height: 40px; justify-content: center; }
    .star { width: 36px; height: 36px; }
    .star polygon { fill: var(--gold); stroke: var(--ink); stroke-width: 5; stroke-linejoin: round; }
    .stars.t5 .star { animation: rainbowstar 1.4s linear infinite; }
    @keyframes rainbowstar { to { filter: hue-rotate(360deg); } }

    .chest-zone { position: relative; width: min(80vw, 440px); }
    .glow {
      position: absolute;
      inset: -30%;
      border-radius: 50%;
      opacity: 0;
      transition: opacity .5s, background .5s;
      pointer-events: none;
    }
    .glow.t2 { opacity: .6; background: radial-gradient(circle, var(--sky) 0%, transparent 62%); }
    .glow.t3 { opacity: .65; background: radial-gradient(circle, var(--purple) 0%, transparent 62%); }
    .glow.t4 { opacity: .75; background: radial-gradient(circle, var(--gold) 0%, transparent 62%); }
    .glow.t5 {
      opacity: .85;
      background: conic-gradient(#f0563e, #f47b28, #f7c948, #b7ce3c, #2fb0a3, #5aa0db, #a98fd0, #ff7fa5, #f0563e);
      filter: blur(26px);
      animation: spin 3.2s linear infinite;
    }
    @keyframes spin { to { rotate: 360deg; } }

    .chest-wrap { position: relative; cursor: pointer; }
    .chest-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
    #lid {
      transform-origin: 18px 96px;
      transition: transform .5s cubic-bezier(.34,1.56,.64,1);
    }
    .chest-wrap.open #lid { transform: rotate(-78deg) translate(-8px, -12px); }
    #beam, #mouthGlow { opacity: 0; transition: opacity .45s; }
    .chest-wrap.open #beam { opacity: .5; }
    .chest-wrap.open #mouthGlow { opacity: .9; }
    .crack { opacity: 0; transition: opacity .2s; }
    .crack.show { opacity: .85; }

    /* golden variant: the 1% chest */
    .chest-wrap.golden .wood { fill: var(--gold); }
    .chest-wrap.golden .wood-dark { fill: #e0ae2f; }
    .chest-wrap.golden .metal { fill: var(--cream); }

    /* sparkles rising from an open chest */
    .sparkle {
      position: absolute;
      width: 10px; height: 10px;
      pointer-events: none;
      opacity: 0;
    }
    .chest-wrap.open .sparkle { animation: rise 1.6s ease-out infinite; }
    .sparkle svg { display: block; width: 100%; height: 100%; }
    .sparkle:nth-child(1) { left: 30%; top: 30%; animation-delay: 0s; }
    .sparkle:nth-child(2) { left: 52%; top: 24%; animation-delay: .4s; }
    .sparkle:nth-child(3) { left: 68%; top: 32%; animation-delay: .8s; }
    .sparkle:nth-child(4) { left: 42%; top: 20%; animation-delay: 1.1s; }
    @keyframes rise {
      0% { opacity: 0; transform: translateY(6px) scale(.4) rotate(0); }
      25% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-56px) scale(1.15) rotate(140deg); }
    }

    .pips { display: flex; gap: 7px; justify-content: center; }
    .pip {
      width: 14px; height: 14px;
      border-radius: 50%;
      border: 2px solid var(--ink);
      background: rgba(32,26,23,.08);
      box-shadow: 2px 2px 0 var(--ink);
      transition: background .2s;
    }
    .pip.full { background: var(--gold); }
    .pip.bonus { background: var(--pink); }

    .hint {
      font-style: italic;
      font-size: 13px;
      opacity: .7;
      transition: opacity 1s;
    }
    .hint.off { opacity: 0; }

    /* little deadpan verdicts on dud taps */
    .dud {
      position: absolute;
      font-style: italic;
      font-size: 14px;
      color: var(--ink);
      opacity: 0;
      pointer-events: none;
      z-index: 5;
      white-space: nowrap;
    }

    /* ---------- burst text ---------- */
    .burst {
      position: absolute;
      top: 9%;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Arial Black', Arial, sans-serif;
      font-weight: 900;
      font-size: clamp(30px, 8vw, 58px);
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--gold);
      -webkit-text-stroke: 2.5px var(--ink);
      paint-order: stroke fill;
      pointer-events: none;
      opacity: 0;
      z-index: 8;
      white-space: nowrap;
    }

    /* ---------- reveal: dim, rays, focus card, rack ---------- */
    .dim {
      position: absolute;
      inset: -16px;
      background: rgba(32, 26, 23, .55);
      border-radius: 10px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .45s;
      z-index: 5;
    }
    .dim.on { opacity: 1; pointer-events: auto; }
    .revcount {
      position: absolute;
      top: 5%;
      width: 100%;
      text-align: center;
      font-style: italic;
      font-size: 14px;
      color: var(--cream);
      opacity: .85;
      pointer-events: none;
      z-index: 7;
    }
    .focus {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 7;
    }
    .focus .card { width: clamp(180px, 48vw, 265px); }
    .rays {
      position: absolute;
      width: min(92vw, 580px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: repeating-conic-gradient(var(--ray-c, #f7c948) 0deg 11deg, transparent 11deg 26deg);
      -webkit-mask-image: radial-gradient(circle, black 0%, transparent 68%);
      mask-image: radial-gradient(circle, black 0%, transparent 68%);
      animation: spin 16s linear infinite;
      opacity: 0;
    }
    .card-row {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 9%;
      display: flex;
      justify-content: center;
      gap: clamp(6px, 1.4vw, 12px);
      flex-wrap: wrap;
      padding: 0 14px;
      pointer-events: none;
      z-index: 6;
    }
    .card-row .card { width: clamp(70px, 11vw, 106px); }
    .card {
      aspect-ratio: 5 / 7;
      perspective: 1000px;
      pointer-events: auto;
      cursor: pointer;
    }
    .cf {
      position: relative;
      width: 100%; height: 100%;
      transform-style: preserve-3d;
      transition: transform .55s cubic-bezier(.3, 1.4, .5, 1);
    }
    .card.slow .cf { transition-duration: 1.05s; }
    .card.flipped .cf { transform: rotateY(180deg); }
    .face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border: 3px solid var(--ink);
      border-radius: 14px;
      box-shadow: 5px 5px 0 var(--ink);
      overflow: hidden;
    }
    .face.back {
      background: repeating-linear-gradient(45deg, var(--coral) 0 14px, #d94833 14px 28px);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .face.back .emblem {
      width: 58%;
      background: var(--cream);
      border: 3px solid var(--ink);
      border-radius: 50%;
      box-shadow: 3px 3px 0 var(--ink);
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .face.back .emblem svg { width: 68%; display: block; }
    .face.front {
      transform: rotateY(180deg);
      background: var(--cream);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .face.front .banner {
      width: 100%;
      padding: 5px 4px 4px;
      border-bottom: 3px solid var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .face.front .banner .rname {
      font-family: 'Arial Black', Arial, sans-serif;
      font-weight: 900;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .7px;
    }
    .ministars { display: flex; gap: 2px; justify-content: center; }
    .ministars svg { width: 11px; height: 11px; }
    .face.front .icon-wrap {
      margin-top: 10px;
      width: 56%;
      aspect-ratio: 1;
      background: var(--paper);
      border: 2.5px solid var(--ink);
      border-radius: 50%;
      box-shadow: 3px 3px 0 var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .face.front .icon-wrap svg { width: 74%; display: block; }
    .face.front .iname {
      font-family: 'Arial Black', Arial, sans-serif;
      font-weight: 900;
      font-size: clamp(10px, 1.8vw, 13.5px);
      text-transform: uppercase;
      line-height: 1.15;
      padding: 8px 6px 2px;
      flex: 1;
      display: flex;
      align-items: center;
    }
    .face.front .qtypill {
      font-family: 'Arial Black', Arial, sans-serif;
      font-weight: 900;
      font-size: 10px;
      background: var(--paper);
      border: 2px solid var(--ink);
      border-radius: 999px;
      padding: 2px 10px;
      margin-bottom: 9px;
      box-shadow: 2px 2px 0 var(--ink);
    }
    /* shine sweep on reveal */
    .face.front::after {
      content: '';
      position: absolute;
      inset: -20%;
      background: linear-gradient(105deg, transparent 42%, rgba(255,255,255,.85) 50%, transparent 58%);
      transform: translateX(-130%);
      pointer-events: none;
    }
    .card.shined .face.front::after { animation: sweep .8s ease-out .25s; }
    @keyframes sweep { to { transform: translateX(130%); } }

    .r-common { background: var(--gray); color: var(--cream); }
    .r-uncommon { background: var(--lime); }
    .r-rare { background: var(--sky); }
    .r-epic { background: var(--purple); }
    .r-legendary { background: var(--gold); }
    .card.epic .face.front { background: #f6effd; }
    .card.legend .face.front { background: #fdf6dd; }
    .card.legend { animation: legendfloat 2.2s ease-in-out infinite alternate; }
    @keyframes legendfloat { from { transform: translateY(0); } to { transform: translateY(-7px); } }
    .card.legend .face.front { box-shadow: 5px 5px 0 var(--ink); }
    .card.legend.flipped .cf { filter: drop-shadow(0 0 18px var(--gold)); }

    .takeall {
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%) rotate(-1.5deg) scale(0);
      font-family: 'Arial Black', Arial, sans-serif;
      font-weight: 900;
      font-size: 17px;
      text-transform: uppercase;
      letter-spacing: .6px;
      background: var(--gold);
      color: var(--ink);
      border: 3px solid var(--ink);
      border-radius: 999px;
      padding: 13px 30px;
      box-shadow: 4px 4px 0 var(--ink);
      cursor: pointer;
      z-index: 7;
    }
    .takeall:hover { box-shadow: 6px 6px 0 var(--ink); }

    /* ---------- binder ---------- */
    .binder {
      position: fixed;
      inset: 0;
      background: rgba(32,26,23,.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 18px;
    }
    .binder.on { display: flex; }
    .binder-card {
      background: var(--cream);
      border: 3px solid var(--ink);
      border-radius: 16px;
      box-shadow: 7px 7px 0 var(--ink);
      max-width: 640px;
      width: 100%;
      max-height: 86dvh;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }
    .binder-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
    .binder-title {
      font-family: 'Arial Black', Arial, sans-serif;
      font-weight: 900;
      font-size: 17px;
      text-transform: uppercase;
    }
    .binder-sub { font-style: italic; font-size: 12px; opacity: .7; }
    .binder-grid {
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
      gap: 10px;
      padding: 4px;
    }
    .slot {
      border: 2px solid var(--ink);
      border-radius: 10px;
      box-shadow: 3px 3px 0 var(--ink);
      background: var(--paper);
      padding: 8px 4px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      position: relative;
      min-height: 104px;
    }
    .slot .icon { width: 44px; height: 44px; }
    .slot .icon svg { display: block; width: 100%; height: 100%; }
    .slot .sname {
      font-family: 'Arial Black', Arial, sans-serif;
      font-weight: 900;
      font-size: 8.5px;
      text-transform: uppercase;
      text-align: center;
      line-height: 1.2;
    }
    .slot .rtag {
      font-family: 'Arial Black', Arial, sans-serif;
      font-weight: 900;
      font-size: 8px;
      text-transform: uppercase;
      padding: 1px 7px;
      border: 2px solid var(--ink);
      border-radius: 999px;
    }
    .slot .count {
      position: absolute;
      top: -8px;
      right: -8px;
      background: var(--gold);
      border: 2px solid var(--ink);
      border-radius: 999px;
      box-shadow: 2px 2px 0 var(--ink);
      font-family: 'Arial Black', Arial, sans-serif;
      font-weight: 900;
      font-size: 10px;
      padding: 1px 7px;
    }
    .slot.locked .icon { filter: grayscale(1) contrast(0) opacity(.35); }
    .slot.locked .sname { opacity: .35; }
    .slot .mystery {
      position: absolute;
      top: 26px;
      font-family: 'Arial Black', Arial, sans-serif;
      font-weight: 900;
      font-size: 26px;
      opacity: .3;
    }

    .ledger {
      font-style: italic;
      font-size: 11px;
      opacity: .6;
      text-align: center;
      padding: 4px 0 2px;
    }
    #confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 15;
    }

    @media (prefers-reduced-motion: reduce) {
      .cf, #lid { transition-duration: .01s; }
      .bgwash.t5, .glow.t5, .stars.t5 .star.lit, .card.legend, .sparkle { animation: none; }
    }
  </style>
</head>
<body>
  <div class="bgwash" id="bgwash"></div>
  <div class="flash" id="flash"></div>

  <div class="app" id="app">
    <header>
      <button class="chip" id="binderBtn">Binder</button>
    </header>

    <div class="stage" id="stage">
      <div class="burst" id="burst"></div>

      <div class="stars" id="stars"></div>

      <div class="chest-zone">
        <div class="glow" id="glow"></div>
        <div class="chest-wrap" id="chest">
          <svg viewBox="0 0 240 205">
            <!-- beam of holy loot light -->
            <path id="beam" d="M66 96 L98 -42 L142 -42 L174 96 Z" fill="#f7c948"/>
            <!-- feet -->
            <rect x="30" y="182" width="26" height="14" rx="4" class="metal" fill="#f7c948" stroke="#201a17" stroke-width="3.5"/>
            <rect x="184" y="182" width="26" height="14" rx="4" class="metal" fill="#f7c948" stroke="#201a17" stroke-width="3.5"/>
            <!-- body -->
            <g id="bodyG">
              <rect x="22" y="96" width="196" height="92" rx="10" class="wood" fill="#f47b28" stroke="#201a17" stroke-width="4.5"/>
              <!-- planks -->
              <line x1="26" y1="126" x2="214" y2="126" stroke="#201a17" stroke-width="2.5" opacity=".22"/>
              <line x1="26" y1="156" x2="214" y2="156" stroke="#201a17" stroke-width="2.5" opacity=".22"/>
              <path d="M46 110 q10 4 20 0 M150 140 q12 5 24 0 M60 170 q10 4 20 0" fill="none" stroke="#201a17" stroke-width="2" opacity=".18"/>
              <!-- straps -->
              <rect x="48" y="94" width="20" height="96" class="metal" fill="#f7c948" stroke="#201a17" stroke-width="3.5"/>
              <rect x="172" y="94" width="20" height="96" class="metal" fill="#f7c948" stroke="#201a17" stroke-width="3.5"/>
              <circle cx="58" cy="110" r="2.6" fill="#201a17"/>
              <circle cx="58" cy="172" r="2.6" fill="#201a17"/>
              <circle cx="182" cy="110" r="2.6" fill="#201a17"/>
              <circle cx="182" cy="172" r="2.6" fill="#201a17"/>
              <!-- corner brackets -->
              <path d="M22 116 v-10 a10 10 0 0 1 10 -10 h10 v10 h-8 a2 2 0 0 0 -2 2 v8 Z" class="metal" fill="#f7c948" stroke="#201a17" stroke-width="3"/>
              <path d="M218 116 v-10 a10 10 0 0 0 -10 -10 h-10 v10 h8 a2 2 0 0 1 2 2 v8 Z" class="metal" fill="#f7c948" stroke="#201a17" stroke-width="3"/>
              <path d="M22 168 v10 a10 10 0 0 0 10 10 h10 v-10 h-8 a2 2 0 0 1 -2 -2 v-8 Z" class="metal" fill="#f7c948" stroke="#201a17" stroke-width="3"/>
              <path d="M218 168 v10 a10 10 0 0 1 -10 10 h-10 v-10 h8 a2 2 0 0 0 2 -2 v-8 Z" class="metal" fill="#f7c948" stroke="#201a17" stroke-width="3"/>
              <!-- cracks -->
              <path class="crack" id="crack1" d="M84 100 L94 122 L82 138" fill="none" stroke="#201a17" stroke-width="3.5" stroke-linecap="round"/>
              <path class="crack" id="crack2" d="M156 102 L146 126 L160 146 L150 164" fill="none" stroke="#201a17" stroke-width="3.5" stroke-linecap="round"/>
              <path class="crack" id="crack3" d="M112 118 L124 136 L110 154 L122 172" fill="none" stroke="#201a17" stroke-width="3.5" stroke-linecap="round"/>
              <!-- lock plate on the body -->
              <rect x="102" y="96" width="36" height="34" rx="7" class="metal" fill="#f7c948" stroke="#201a17" stroke-width="4"/>
              <circle cx="120" cy="108" r="5" fill="#201a17"/>
              <path d="M120 108 L115 122 L125 122 Z" fill="#201a17"/>
            </g>
            <ellipse id="mouthGlow" cx="120" cy="96" rx="92" ry="14" fill="#f7c948"/>
            <!-- lid -->
            <g id="lid">
              <path d="M22 96 Q22 34 120 34 Q218 34 218 96 Z" class="wood-dark" fill="#f0563e" stroke="#201a17" stroke-width="4.5"/>
              <path d="M40 82 Q40 52 120 48 M200 82 Q200 52 120 48" fill="none" stroke="#201a17" stroke-width="2.5" opacity=".2"/>
              <!-- lid straps -->

    let binderData = {}, opened = 0, bestId = null;
    try {
      binderData = JSON.parse(localStorage.getItem('lc-binder') || '{}');
      opened = parseInt(localStorage.getItem('lc-opened') || '0', 10) || 0;
      bestId = localStorage.getItem('lc-best') || null;
    } catch (e) {}
    function persist() {
      try {
        localStorage.setItem('lc-binder', JSON.stringify(binderData));
        localStorage.setItem('lc-opened', String(opened));
        if (bestId) localStorage.setItem('lc-best', bestId);
      } catch (e) {}
    }
    function renderLedger() {
      const best = bestId && byId[bestId] ? ` · best pull: ${byId[bestId].name.toUpperCase()}` : '';
      $('#ledger').textContent = opened > 0 ? `chests opened: ${opened.toLocaleString()}${best}` : '';
    }
    renderLedger();

    // ---------- chest state ----------
    const UP_ODDS = { 1: 0.35, 2: 0.25, 3: 0.12, 4: 0.04 };
    const TIER_COLOR = { 1: '#a89f93', 2: '#5aa0db', 3: '#a98fd0', 4: '#f7c948', 5: '#f7c948' };
    const UPGRADE_WORDS = { 2: 'UPGRADED!', 3: 'OOH, PURPLE!', 4: 'SO SHINY!', 5: '5 STARS!!' };
    let tier = 1;
    let tapsLeft = 3;
    let bonusUsed = false;
    let phase = 'idle';
    let lastTap = 0;
    let firstEver = true;
    const chest = $('#chest');

    // chests don't all start equal — no telling from the outside
    const START_TIERS = [[1, .72], [2, .18], [3, .07], [4, .02]];
    function rollStartTier() {
      let r = Math.random() * .99;
      for (const [t, w] of START_TIERS) {
        r -= w;
        if (r <= 0) return t;
      }
      return 4;
    }
    function spawnChest() {
      bonusUsed = false;
      phase = 'idle';
      chest.classList.remove('open', 'golden');
      // the 1% chest arrives already golden. it does not explain itself.
      if (Math.random() < 0.01) {
        tier = 5;
        tapsLeft = 1;
        chest.classList.add('golden');
      } else {
        tier = rollStartTier();
        tapsLeft = Math.random() < 0.25 ? 4 : 3;
      }
      $$('.crack').forEach(c => c.classList.remove('show'));
      renderTier(false);
      renderPips();
      animate(chest,
        { y: [-innerHeight * 0.7, 0], rotate: [-8, 0] },
        { type: 'spring', stiffness: 300, damping: 16, duration: dur(.7) });
      if (tier === 5) setTimeout(() => burst('LUCKY!!', 'var(--gold)'), 550);
    }
    function renderTier(pop) {
      // only earned stars exist — new ones pop in, the ceiling stays a mystery
      const row = $('#stars');
      while (row.children.length > tier) row.lastChild.remove();
      while (row.children.length < tier) {
        const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        s.setAttribute('class', 'star');
        s.setAttribute('viewBox', '0 0 40 40');
        s.innerHTML = '<polygon points="20,3 25,15 38,16 28,25 31,38 20,31 9,38 12,25 2,16 15,15"/>';
        row.appendChild(s);
        if (pop && !reduceMotion) animate(s, { scale: [0.2, 1.6, 1], rotate: [-40, 10, 0] }, SPRING);
      }
      row.classList.toggle('t5', tier === 5);
      $('#glow').className = 'glow' + (tier >= 2 ? ` t${tier}` : '');
      $('#bgwash').className = 'bgwash' + (tier >= 2 ? ` t${tier}` : '');
      $('#beam').setAttribute('fill', TIER_COLOR[tier]);
      $('#mouthGlow').setAttribute('fill', TIER_COLOR[tier]);
    }
    function renderPips() {
      const row = $('#pips');
      row.innerHTML = '';
      for (let i = 0; i < tapsLeft; i++) {
        const p = document.createElement('div');
        p.className = 'pip full';
        row.appendChild(p);
      }
    }

    // ---------- tapping ----------
    const DUDS = ['nothing.', 'hm.', 'nope.', 'still wood.', 'a rattle, maybe.', 'it resists.'];
    chest.addEventListener('pointerdown', (e) => {
      if (phase !== 'idle') return;
      const now = performance.now();
      if (now - lastTap < 240) return;
      lastTap = now;
      if (firstEver) { firstEver = false; $('#hint').classList.add('off'); }

      animate(chest, { scaleX: [1, 1.1, 1], scaleY: [1, .82, 1] }, { duration: dur(.24) });

      let upgraded = false;
      if (tier < 5 && Math.random() < UP_ODDS[tier]) {
        upgraded = true;
        tier++;
        renderTier(true);
        burst(UPGRADE_WORDS[tier], TIER_COLOR[tier]);
        flash(TIER_COLOR[tier]);
        shake();
        animate(chest, { scale: [1, 1.2, 1], rotate: [0, -4, 4, 0] }, { type: 'spring', stiffness: 500, damping: 11, duration: dur(.6) });
        confettiBurst(tier >= 4 ? 110 : 50, tier === 5 ? 'rainbow' : TIER_COLOR[tier]);
      }

      tapsLeft--;
      if (tapsLeft === 0 && !bonusUsed && tier < 5 && Math.random() < 0.15) {
        bonusUsed = true;
        tapsLeft = 1;
        renderPips();
        const p = $('#pips').lastChild;
        if (p) {
          p.classList.add('bonus');
          animate(p, { scale: [0, 1.6, 1] }, SPRING);
        }
        burst('BONUS TAP!', 'var(--pink)');
        return;
      }
      renderPips();

      if (!upgraded && tapsLeft > 0) dud(e);

      const cracks = $$('.crack');
      const shown = cracks.filter(c => c.classList.contains('show')).length;
      if (shown < cracks.length) cracks[shown].classList.add('show');

      if (tapsLeft <= 0) openChest();
    });

    function dud(e) {
      const d = document.createElement('div');
      d.className = 'dud';
      d.textContent = DUDS[Math.floor(Math.random() * DUDS.length)];
      const stage = $('#stage').getBoundingClientRect();
      d.style.left = (e.clientX - stage.left + 14) + 'px';
      d.style.top = (e.clientY - stage.top - 10) + 'px';
      $('#stage').appendChild(d);
      animate(d, { opacity: [0, .75, 0], y: [0, -44] }, { duration: dur(1.1), ease: 'easeOut' })
        .finished.then(() => d.remove());
    }
    function shake() {
      if (reduceMotion) return;
      animate($('#app'),
        { x: [0, -8, 7, -5, 4, 0], y: [0, 4, -5, 3, -2, 0] },
        { duration: .3 });
    }
    function flash(color) {
      if (reduceMotion) return;
      const f = $('#flash');
      f.style.setProperty('--flash-c', color);
      animate(f, { opacity: [0, .55, 0] }, { duration: .55 });
    }
    function burst(text, color) {
      const b = $('#burst');
      b.textContent = text;
      b.style.color = color;
      animate(b,
        { opacity: [0, 1, 1, 0], scale: [.2, 1.3, 1, 1.05], rotate: [-9, 3, -2, 0] },
        { duration: dur(1.1), ease: 'easeOut', times: [0, .18, .75, 1] });
    }

    // ---------- loot ----------
    const TIER_CARDS = { 1: 2, 2: 3, 3: 3, 4: 4, 5: 5 };
    const TIER_WEIGHTS = {
      1: { common: 80, uncommon: 20 },
      2: { common: 55, uncommon: 35, rare: 10 },
      3: { common: 30, uncommon: 40, rare: 25, epic: 5 },
      4: { uncommon: 30, rare: 40, epic: 25, legendary: 5 },
      5: { rare: 35, epic: 40, legendary: 25 },
    };
    function weightedRarity(weights) {
      const total = Object.values(weights).reduce((a, b) => a + b, 0);
      let r = Math.random() * total;
      for (const [k, w] of Object.entries(weights)) {
        r -= w;
        if (r <= 0) return k;
      }
      return Object.keys(weights)[0];
    }
    function genLoot() {
      const n = TIER_CARDS[tier];
      const weights = TIER_WEIGHTS[tier];
      const loot = [];
      for (let i = 0; i < n; i++) {
        const rar = weightedRarity(weights);
        const opts = pool(rar);
        const item = opts[Math.floor(Math.random() * opts.length)];
        const qty = item.qty[0] + Math.floor(Math.random() * (item.qty[1] - item.qty[0] + 1));
        loot.push({ item, qty });
      }
      const maxRank = Math.max(...loot.map(l => RARITY[l.item.rarity].rank));
      if (tier === 5 && maxRank < 4) {
        const opts = pool('legendary');
        loot[loot.length - 1] = { item: opts[Math.floor(Math.random() * opts.length)], qty: 1 };
      } else if (tier === 4 && maxRank < 3) {
        const opts = pool('epic');
        loot[loot.length - 1] = { item: opts[Math.floor(Math.random() * opts.length)], qty: 1 };
      }
      loot.sort((a, b) => RARITY[a.item.rarity].rank - RARITY[b.item.rarity].rank);
      return loot;
    }

    // ---------- opening sequence ----------
    let currentLoot = [];
    function openChest() {
      phase = 'opening';
      setTimeout(() => {
        chest.classList.add('open');
        shake();
        flash(TIER_COLOR[tier]);
        if (tier === 5) confettiBurst(180, 'rainbow');
        else if (tier === 4) confettiBurst(120, TIER_COLOR[4]);
        else confettiBurst(40, TIER_COLOR[tier]);
        currentLoot = genLoot();
        setTimeout(dealCards, 460);
      }, 220);
    }
    function cardHtml(l) {
      const rar = RARITY[l.item.rarity];
      return `
        <div class="cf">
          <div class="face back"><div class="emblem">${chestEmblem}</div></div>
          <div class="face front">
            <div class="banner ${rar.cls}">
              <span class="rname">${rar.label}</span>
              ${miniStars(rar.rank + 1)}
            </div>
            <div class="icon-wrap">${l.item.icon}</div>
            <div class="iname">${l.item.name}</div>
            <div class="qtypill">${l.qty > 1 ? '×' + l.qty : '· 1 ·'}</div>
          </div>
        </div>`;
    }

    // a skippable pause — tapping anywhere hurries the ceremony along
    let skipResolve = null;
    function wait(ms) {
      return new Promise(res => {
        const done = () => { clearTimeout(t); skipResolve = null; res(); };
        const t = setTimeout(done, ms);
        skipResolve = done;
      });
    }
    const hurry = () => { if (skipResolve) skipResolve(); };
    $('#dim').addEventListener('pointerdown', hurry);

    async function dealCards() {
      $('#cardRow').innerHTML = '';
      $('#dim').classList.add('on');
      const chestRect = chest.getBoundingClientRect();
      for (let i = 0; i < currentLoot.length; i++) {
        await revealOne(currentLoot[i], i, chestRect);
      }
      $('#revCount').textContent = '';
      $('#dim').classList.remove('on');
      phase = 'done';
      const btn = $('#takeAll');
      btn.style.transform = 'translateX(-50%) rotate(-1.5deg)';
      animate(btn, { scale: [0, 1.15, 1] }, SPRING);
    }

    async function revealOne(l, i, chestRect) {
      const rar = RARITY[l.item.rarity];
      $('#revCount').textContent = `card ${i + 1} of ${currentLoot.length}`;
      const focus = $('#focus');
      focus.innerHTML = `<div class="rays" style="--ray-c:${rar.color}"></div>`;
      const rays = focus.querySelector('.rays');
      const card = document.createElement('div');
      card.className = 'card';
      if (rar.rank === 4) card.classList.add('legend', 'slow');
      if (rar.rank === 3) card.classList.add('epic');
      card.innerHTML = cardHtml(l);
      card.addEventListener('pointerdown', hurry);
      focus.appendChild(card);
      // spring out of the chest's mouth into the spotlight
      const r = card.getBoundingClientRect();
      const fromX = chestRect.left + chestRect.width / 2 - r.left - r.width / 2;
      const fromY = chestRect.top + chestRect.height * 0.35 - r.top - r.height / 2;
      animate(card,
        { x: [fromX, 0], y: [fromY, 0], scale: [.1, 1], rotate: [(Math.random() - .5) * 40, 0] },
        { type: 'spring', stiffness: 240, damping: 20, duration: dur(.65) });
      animate(rays, { opacity: [0, 1] }, { duration: dur(.5), delay: dur(.2) });
      await wait(600);
      // suspense scales with what's hiding
      if (rar.rank === 4) {
        animate(card, { rotate: [0, -5, 5, -6, 6, -3, 3, 0] }, { duration: dur(1) });
        await wait(1050);
      } else if (rar.rank === 3) {
        await wait(420);
      } else {
        await wait(200);
      }
      // the flip
      card.classList.add('flipped', 'shined');
      if (!reduceMotion) animate(card, { scale: [1, 1.14, 1] }, { duration: .45, delay: .2 });
      if (rar.rank === 4) { shake(); flash('#f7c948'); confettiBurst(150, '#f7c948'); }
      else if (rar.rank === 3) { flash('#a98fd0'); confettiBurst(70, '#a98fd0'); }
      await wait(rar.rank >= 3 ? 1250 : 850);
      // retire to the rack
      animate(rays, { opacity: 0 }, { duration: dur(.3) });
      const slot = document.createElement('div');
      slot.className = 'card flipped' + (rar.rank === 4 ? ' legend' : rar.rank === 3 ? ' epic' : '');
      slot.innerHTML = cardHtml(l);
      slot.style.opacity = '0';
      $('#cardRow').appendChild(slot);
      const sr = slot.getBoundingClientRect();
      const cr = card.getBoundingClientRect();
      await animate(card, {
        x: sr.left + sr.width / 2 - cr.left - cr.width / 2,
        y: sr.top + sr.height / 2 - cr.top - cr.height / 2,
        scale: sr.width / cr.width,
      }, { duration: dur(.38), ease: [.45, 0, .3, 1] }).finished;
      slot.style.opacity = '1';
      focus.innerHTML = '';
    }

    $('#takeAll').addEventListener('click', () => {
      if (phase !== 'done') return;
      phase = 'claiming';
      animate($('#takeAll'), { scale: 0 }, { duration: dur(.2) });
      let bestRank = bestId && byId[bestId] ? RARITY[byId[bestId].rarity].rank : -1;
      currentLoot.forEach(l => {
        binderData[l.item.id] = (binderData[l.item.id] || 0) + l.qty;
        if (RARITY[l.item.rarity].rank > bestRank) {
          bestRank = RARITY[l.item.rarity].rank;
          bestId = l.item.id;
        }
      });
      opened++;
      persist();
      renderLedger();
      const target = $('#binderBtn').getBoundingClientRect();
      $$('#cardRow .card').forEach((card, i) => {
        const r = card.getBoundingClientRect();
        animate(card, {
          x: target.left + target.width / 2 - r.left - r.width / 2,
          y: target.top + target.height / 2 - r.top - r.height / 2,
          scale: .08,
          rotate: 25,
          opacity: 0,
        }, { duration: dur(.5), delay: dur(i * .05), ease: [.55, -0.2, .8, .6] });
      });
      animate($('#binderBtn'), { scale: [1, 1.25, 1], rotate: [1.5, -3, 1.5] }, { duration: dur(.5), delay: dur(.4) });
      setTimeout(() => {
        $('#cardRow').innerHTML = '';
        spawnChest();
      }, 650);
    });

    // ---------- binder ----------
    function renderBinder() {
      const grid = $('#binderGrid');
      grid.innerHTML = '';
      const order = [...ITEMS].sort((a, b) => RARITY[b.rarity].rank - RARITY[a.rarity].rank);
      let got = 0;
      order.forEach(item => {
        const count = binderData[item.id] || 0;
        if (count > 0) got++;
        const slot = document.createElement('div');
        slot.className = 'slot' + (count > 0 ? '' : ' locked');
        slot.innerHTML = `
          <div class="icon">${item.icon}</div>
          ${count === 0 ? '<div class="mystery">?</div>' : ''}
          <div class="sname">${count > 0 ? item.name : '???'}</div>
          <span class="rtag ${RARITY[item.rarity].cls}">${RARITY[item.rarity].label}</span>
          ${count > 0 ? `<div class="count">×${count}</div>` : ''}`;
        grid.appendChild(slot);
      });
      $('#binderSub').textContent = `${got} of ${ITEMS.length} collected · duplicates are a lifestyle`;
    }
    $('#binderBtn').addEventListener('click', () => {
      renderBinder();
      $('#binder').classList.add('on');
      animate($('#binderCard'), { scale: [.6, 1.04, 1] }, SPRING);
    });
    $('#binderClose').addEventListener('click', () => $('#binder').classList.remove('on'));
    $('#binder').addEventListener('click', (e) => {
      if (e.target === $('#binder')) $('#binder').classList.remove('on');
    });
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') $('#binder').classList.remove('on');
    });

    // ---------- confetti (sleeps when idle) ----------
    const cvs = $('#confetti');
    const cctx = cvs.getContext('2d');
    let parts = [];
    let rafOn = false;
    const RAINBOW = ['#f0563e', '#f47b28', '#f7c948', '#b7ce3c', '#2fb0a3', '#5aa0db', '#a98fd0', '#ff7fa5'];
    function sizeConfetti() {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      cvs.width = innerWidth * dpr;
      cvs.height = innerHeight * dpr;
      cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    let rsz = null;
    window.addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(sizeConfetti, 150); });
    sizeConfetti();
    function starPath(ctx, r) {
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const rad = i % 2 === 0 ? r : r * .45;
        const a = (i / 10) * Math.PI * 2 - Math.PI / 2;
        ctx[i === 0 ? 'moveTo' : 'lineTo'](Math.cos(a) * rad, Math.sin(a) * rad);
      }
      ctx.closePath();
    }
    function confettiBurst(n, color) {
      if (reduceMotion) return;
      const zone = $('.chest-zone').getBoundingClientRect();
      const cx = zone.left + zone.width / 2, cy = zone.top + zone.height / 2;
      for (let i = 0; i < n && parts.length < 500; i++) {
        const a = Math.random() * Math.PI * 2;
        const v = 3.5 + Math.random() * 8;
        parts.push({
          kind: Math.random() < .22 ? 'star' : 'rect',
          x: cx, y: cy,
          vx: Math.cos(a) * v, vy: Math.sin(a) * v - 4.5,
          w: 5 + Math.random() * 7, h: 3 + Math.random() * 4,
          r: 4 + Math.random() * 4,
          rot: Math.random() * Math.PI, vr: (Math.random() - .5) * .32,
          life: 60 + Math.random() * 55,
          color: color === 'rainbow' ? RAINBOW[i % RAINBOW.length] : color,
        });
      }
      if (!rafOn) { rafOn = true; requestAnimationFrame(tick); }
    }
    function tick() {
      cctx.clearRect(0, 0, innerWidth, innerHeight);
      parts = parts.filter(p => p.life > 0 && p.y < innerHeight + 20);
      for (const p of parts) {
        p.vy += 0.22;
        p.x += p.vx; p.y += p.vy;
        p.rot += p.vr;
        p.life--;
        cctx.save();
        cctx.translate(p.x, p.y);
        cctx.rotate(p.rot);
        cctx.globalAlpha = Math.min(1, p.life / 30);
        cctx.fillStyle = p.color;
        cctx.lineWidth = 1.2;
        cctx.strokeStyle = '#201a17';
        if (p.kind === 'star') {
          starPath(cctx, p.r);
          cctx.fill();
          cctx.stroke();
        } else {
          cctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          cctx.strokeRect(-p.w / 2, -p.h / 2, p.w, p.h);
        }
        cctx.restore();
      }
      if (parts.length) requestAnimationFrame(tick);
      else { rafOn = false; cctx.clearRect(0, 0, innerWidth, innerHeight); }
    }

    // ---------- go ----------
    spawnChest();
  </script>
</body>
</html>
