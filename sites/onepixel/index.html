<style>
  :root{
    --wall:#141210;
    --paper:#f2ede2;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--wall);
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
  }
  #stage{
    position:fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:28px;
  }
  #glow{
    position:absolute;
    width:min(60vh,60vw);
    height:min(60vh,60vw);
    border-radius:50%;
    filter:blur(60px);
    opacity:.35;
    pointer-events:none;
    transition:background .6s ease;
  }
  #pixel{
    position:relative;
    width:clamp(12px, 2.4vmin, 28px);
    height:clamp(12px, 2.4vmin, 28px);
    transition:transform .35s cubic-bezier(.34,1.56,.64,1), background .6s ease;
    cursor:zoom-in;
  }
  #pixel:hover{
    transform:scale(2.6);
  }
  .plaque{
    position:relative;
    text-align:center;
    font-family:Georgia, 'Times New Roman', serif;
    font-style:italic;
    color:var(--paper);
  }
  .plaque .line1{
    font-size:14px;
    opacity:.6;
  }
  .plaque .hex{
    font-family:'Courier New', Courier, monospace;
    font-style:normal;
    font-size:12px;
    opacity:.4;
    letter-spacing:0.06em;
    margin-top:4px;
  }
  @media (max-width:520px){
    .plaque .line1{ font-size:12px; }
    .plaque .hex{ font-size:10.5px; }
  }
</style>
</head>
<body>

<div id="stage">
  <div id="glow"></div>
  <div id="pixel"></div>
  <div class="plaque">
    <div class="line1">the smallest painting on the web. new color tomorrow.</div>
    <div class="hex" id="hex">#000000</div>
  </div>
</div>

<script>
(function(){
  "use strict";

  const pixel = document.getElementById('pixel');
  const glow = document.getElementById('glow');
  const hexEl = document.getElementById('hex');

  // deterministic per calendar day: same visitor, same day, same color everywhere
  function hashStr(str){
    let h = 2166136261;
    for(let i=0; i<str.length; i++){
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }
  function mulberry32(seed){
    return function(){
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const today = new Date();
  const dayKey = today.getFullYear() + '-' + (today.getMonth()+1) + '-' + today.getDate();
  const rand = mulberry32(hashStr(dayKey));

  const hue = Math.floor(rand() * 360);
  const sat = 55 + Math.floor(rand() * 40);
  const light = 42 + Math.floor(rand() * 24);

  function hslToHex(h, s, l){
    s /= 100; l /= 100;
    const k = n => (n + h/30) % 12;
    const a = s * Math.min(l, 1-l);
    const f = n => l - a*Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n),1)));
    const toHex = v => Math.round(255*v).toString(16).padStart(2,'0');
    return '#' + toHex(f(0)) + toHex(f(8)) + toHex(f(4));
  }

  const hex = hslToHex(hue, sat, light);
  pixel.style.background = hex;
  glow.style.background = hex;
  hexEl.textContent = hex;
})();
</script>

</body>
