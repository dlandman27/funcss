<!DOCTYPE html>
<html lang="en">
<head>
  <script defer src="https://randomsitesontheweb.com/globals/global.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>String Art</title>
  <meta name="description" content="Sweep your cursor around the ring of pins and thread stretches between them, leaving a permanent, ever-growing pattern behind.">
    <!-- rsotw:og:start -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://randomsitesontheweb.com/stringart/">
    <meta property="og:title" content="String Art">
    <meta property="og:description" content="Sweep your cursor around the ring of pins and thread stretches between them, leaving a permanent, ever-growing pattern behind.">
    <meta property="og:image" content="https://randomsitesontheweb.com/og/stringart.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="String Art">
    <meta name="twitter:description" content="Sweep your cursor around the ring of pins and thread stretches between them, leaving a permanent, ever-growing pattern behind.">
    <meta name="twitter:image" content="https://randomsitesontheweb.com/og/stringart.png">
    <!-- rsotw:og:end -->
  <style>
    :root {
      --ink: #201a17;
      --paper: #f2ede2;
      --coral: #f0563e;
    }
    * , *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      background: #efe8db;
    }
    #stage { position: fixed; inset: 0; display: block; }

    .hint {
      position: fixed;
      bottom: 6%;
      left: 50%;
      transform: translateX(-50%);
      font-family: Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-size: 14px;
      color: rgba(32, 26, 23, 0.4);
      pointer-events: none;
      opacity: 1;
      transition: opacity 1.4s ease;
      text-align: center;
    }
    .hint.hidden { opacity: 0; }

    .save-btn {
      position: fixed;
      top: 18px;
      right: 18px;
      padding: 8px 18px;
      font-family: Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-size: 13px;
      color: var(--ink);
      background: var(--paper);
      border: 1.5px solid rgba(32, 26, 23, 0.35);
      border-radius: 999px;
      cursor: pointer;
      opacity: 0.55;
      transition: opacity 0.3s ease, transform 0.2s ease;
    }
    .save-btn:hover { opacity: 1; transform: translateY(-1px); }
    .save-btn:active { transform: translateY(0); }

    @media (max-width: 480px) {
      .hint { font-size: 12px; bottom: 5%; }
      .save-btn { top: 12px; right: 12px; padding: 7px 14px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div class="hint" id="hint">trace near the pins to catch the thread</div>
  <button class="save-btn" id="saveBtn" aria-label="Download your string art as a PNG">keep it</button>

  <script>
  (function () {
    'use strict';

    var canvas = document.getElementById('stage');
    var ctx = canvas.getContext('2d');
    var hint = document.getElementById('hint');

    var INK = '#201a17';
    var CORAL = '#f0563e';
    var PIN_FILL = '#fff8ef';

    var width = 0, height = 0, dpr = 1;
    var pins = [];
    var captureR = 28;
    var lastPin = -1;
    var chords = [];
    var chordSet = {};

    var pointer = { x: -9999, y: -9999, active: false };

    function debounce(fn, ms) {
      var t;
      return function () {
        clearTimeout(t);
        var args = arguments;
        t = setTimeout(function () { fn.apply(null, args); }, ms);
      };
    }

    function backgroundGradient() {
      var g = ctx.createRadialGradient(
        width / 2, height * 0.1, 0,
        width / 2, height * 0.1, Math.max(width, height) * 0.9
      );
      g.addColorStop(0, '#fbf7ee');
      g.addColorStop(0.7, '#efe8db');
      g.addColorStop(1, '#e6ddce');
      return g;
    }

    function buildPins() {
      var cx = width / 2, cy = height / 2;
      var rx = width * 0.42, ry = height * 0.42;
      var avgR = (rx + ry) / 2;
      var circumference = 2 * Math.PI * avgR;
      var spacing = 30;
      var count = Math.max(36, Math.min(120, Math.round(circumference / spacing)));

      pins = [];
      for (var i = 0; i < count; i++) {
        var a = (i / count) * Math.PI * 2 - Math.PI / 2;
        pins.push({ x: cx + rx * Math.cos(a), y: cy + ry * Math.sin(a) });
      }
      captureR = Math.max(22, (circumference / count) * 0.6);
      lastPin = -1;
      chords = [];
      chordSet = {};
    }

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      buildPins();
      render();
    }

    function addChord(a, b) {
      if (a === b || a < 0 || b < 0) return;
      var key = a < b ? a + '_' + b : b + '_' + a;
      if (chordSet[key]) return;
      chordSet[key] = true;
      chords.push([a, b]);
    }

    function nearestPin(x, y) {
      var best = -1, bestDist = Infinity;
      for (var i = 0; i < pins.length; i++) {
        var dx = pins[i].x - x, dy = pins[i].y - y;
        var d = dx * dx + dy * dy;
        if (d < bestDist) { bestDist = d; best = i; }
      }
      return { index: best, dist: Math.sqrt(bestDist) };
    }

    function drawPin(p) {
      ctx.beginPath();
      ctx.arc(p.x + 1, p.y + 1.5, 3.4, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(32, 26, 23, 0.28)';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(p.x, p.y, 3.4, 0, Math.PI * 2);
      ctx.fillStyle = PIN_FILL;
      ctx.fill();
      ctx.lineWidth = 1.4;
      ctx.strokeStyle = INK;
      ctx.stroke();
    }

    function render() {
      ctx.fillStyle = backgroundGradient();
      ctx.fillRect(0, 0, width, height);

      ctx.lineCap = 'round';
      ctx.strokeStyle = CORAL;
      ctx.globalAlpha = 0.55;
      ctx.lineWidth = 1.3;
      for (var i = 0; i < chords.length; i++) {
        var a = pins[chords[i][0]], b = pins[chords[i][1]];
        if (!a || !b) continue;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;

      for (var p = 0; p < pins.length; p++) drawPin(pins[p]);

      if (lastPin >= 0 && pointer.active) {
        ctx.beginPath();
        ctx.setLineDash([4, 5]);
        ctx.strokeStyle = 'rgba(240, 86, 62, 0.5)';
        ctx.lineWidth = 1.2;
        ctx.moveTo(pins[lastPin].x, pins[lastPin].y);
        ctx.lineTo(pointer.x, pointer.y);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    function handlePointer(x, y) {
      pointer.x = x;
      pointer.y = y;
      pointer.active = true;
      hint.classList.add('hidden');

      var found = nearestPin(x, y);
      if (found.dist < captureR && found.index !== lastPin) {
        if (lastPin >= 0) addChord(lastPin, found.index);
        lastPin = found.index;
      }
      render();
    }

    canvas.addEventListener('pointermove', function (e) {
      handlePointer(e.clientX, e.clientY);
    });
    canvas.addEventListener('pointerdown', function (e) {
      handlePointer(e.clientX, e.clientY);
    });
    canvas.addEventListener('pointerleave', function () {
      pointer.active = false;
      render();
    });
    canvas.addEventListener('pointerup', function () {
      pointer.active = false;
      render();
    });

    setTimeout(function () { hint.classList.add('hidden'); }, 6000);

    document.getElementById('saveBtn').addEventListener('click', function () {
      pointer.active = false;
      render();
      var a = document.createElement('a');
      a.download = 'string-art.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
    });

    window.addEventListener('resize', debounce(resize, 150));
    resize();
  })();
  </script>
</body>
</html>
