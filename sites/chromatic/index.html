<!DOCTYPE html>
<html lang="en">
<head>
  <script defer src="https://randomsitesontheweb.com/globals/global.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chromatic</title>
  <meta name="description" content="Drag to paint. Red, green, and blue each chase your cursor at their own speed, splitting into a glitchy fringe and re-fusing to white when you hold still.">

    <meta property="og:title" content="Chromatic">
    <meta property="og:description" content="Drag to paint. Red, green, and blue each chase your cursor at their own speed, splitting into a glitchy fringe and re-fusing to white when you hold still.">

  <style>
    * , *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0f;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #stage {
      position: fixed;
      inset: 0;
      display: block;
      cursor: crosshair;
    }

    .hint {
      position: fixed;
      top: 6%;
      left: 50%;
      transform: translateX(-50%);
      font-family: Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.5);
      pointer-events: none;
      opacity: 1;
      transition: opacity 1.4s ease;
      text-align: center;
      white-space: nowrap;
    }
    .hint.hidden { opacity: 0; }

    .pill {
      position: fixed;
      bottom: 5%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 10, 15, 0.7);
      backdrop-filter: blur(8px);
      color: rgba(255, 255, 255, 0.75);
      font-family: Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-size: 13px;
      padding: 8px 18px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      cursor: pointer;
      opacity: 0.12;
      transition: opacity 0.6s ease;
    }
    .pill:hover, .pill:focus-visible { opacity: 1; }

    @media (prefers-reduced-motion: reduce) {
      .hint, .pill { transition: none; }
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <p class="hint" id="hint">drag to pull it apart</p>
  <button class="pill" id="clearBtn" type="button">clear</button>

  <script>
    (function () {
      var canvas = document.getElementById('stage');
      var ctx = canvas.getContext('2d');
      var hint = document.getElementById('hint');
      var clearBtn = document.getElementById('clearBtn');

      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var W = 0, H = 0;
      var BG = '#0a0a0f';

      var target = { x: 0, y: 0 };
      var followers = {
        r: { x: 0, y: 0, lerp: 0.34, color: '255,40,40' },
        g: { x: 0, y: 0, lerp: 0.17, color: '40,255,90' },
        b: { x: 0, y: 0, lerp: 0.075, color: '60,120,255' }
      };

      var isDown = false;
      var rafId = null;
      var hintHidden = false;
      var activePointerId = null;

      function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

      function fillBackground() {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 1;
        ctx.fillStyle = BG;
        ctx.fillRect(0, 0, W, H);
      }

      function resize() {
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        fillBackground();
      }

      function dismissHint() {
        if (hintHidden) return;
        hintHidden = true;
        hint.classList.add('hidden');
      }

      function snapFollowers(x, y) {
        followers.r.x = followers.g.x = followers.b.x = x;
        followers.r.y = followers.g.y = followers.b.y = y;
      }

      function strokeChannel(f, alpha, width) {
        var prevX = f.x, prevY = f.y;
        f.x += (target.x - f.x) * f.lerp;
        f.y += (target.y - f.y) * f.lerp;
        ctx.beginPath();
        ctx.moveTo(prevX, prevY);
        ctx.lineTo(f.x, f.y);
        ctx.lineWidth = width;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = 'rgba(' + f.color + ',' + alpha + ')';
        ctx.stroke();
      }

      function step() {
        var dx = target.x - followers.g.x, dy = target.y - followers.g.y;
        var speed = Math.sqrt(dx * dx + dy * dy);
        var alpha = clamp(0.55 + speed * 0.01, 0.55, 0.95);
        var width = clamp(9 + speed * 0.08, 9, 20);

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.globalCompositeOperation = 'lighter';
        strokeChannel(followers.r, alpha, width);
        strokeChannel(followers.g, alpha, width);
        strokeChannel(followers.b, alpha, width);
      }

      function loop() {
        step();
        if (isDown) {
          rafId = requestAnimationFrame(loop);
        } else {
          rafId = null;
        }
      }
      function wake() {
        if (rafId === null) rafId = requestAnimationFrame(loop);
      }

      function pointerPos(e) {
        return { x: e.clientX, y: e.clientY };
      }

      canvas.addEventListener('pointerdown', function (e) {
        if (activePointerId !== null) return;
        activePointerId = e.pointerId;
        canvas.setPointerCapture(e.pointerId);
        var p = pointerPos(e);
        target.x = p.x; target.y = p.y;
        snapFollowers(p.x, p.y);
        isDown = true;
        dismissHint();
        wake();
      });

      canvas.addEventListener('pointermove', function (e) {
        if (e.pointerId !== activePointerId) return;
        var p = pointerPos(e);
        target.x = p.x; target.y = p.y;
      });

      function release(e) {
        if (e.pointerId !== activePointerId) return;
        activePointerId = null;
        isDown = false;
      }
      canvas.addEventListener('pointerup', release);
      canvas.addEventListener('pointercancel', release);

      clearBtn.addEventListener('click', function () {
        fillBackground();
      });

      var resizeTimer = null;
      window.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(resize, 200);
      });

      resize();
      setTimeout(dismissHint, 9000);
    })();
  </script>
</body>
</html>
