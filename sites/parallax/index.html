<!DOCTYPE html>
<html lang="en">
<head>
  <script defer src="https://randomsitesontheweb.com/globals/global.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parallax</title>
  <meta name="description" content="A field of sticker shapes stacked in depth. Move your cursor, tilt your phone, and watch the near ones race past the far ones.">
    <!-- rsotw:og:start -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://randomsitesontheweb.com/parallax/">
    <meta property="og:title" content="Parallax">
    <meta property="og:description" content="A field of sticker shapes stacked in depth. Move your cursor, tilt your phone, and watch the near ones race past the far ones.">
    <meta property="og:image" content="https://randomsitesontheweb.com/og/parallax.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Parallax">
    <meta name="twitter:description" content="A field of sticker shapes stacked in depth. Move your cursor, tilt your phone, and watch the near ones race past the far ones.">
    <meta name="twitter:image" content="https://randomsitesontheweb.com/og/parallax.png">
    <!-- rsotw:og:end -->
  <style>
    :root {
      --ink: #201a17;
      --paper: #f2ede2;
      --cream: #fff8ef;
      --coral: #f0563e;
      --sky: #5aa0db;
      --lime: #b7ce3c;
      --purple: #a98fd0;
      --orange: #f47b28;
      --pink: #ff7fa5;
      --teal: #2fb0a3;
      --gold: #f7c948;
    }
    * , *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--paper);
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #stage {
      position: fixed;
      inset: 0;
      display: block;
    }
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 45%, rgba(32,26,23,0) 45%, rgba(32,26,23,0.14) 100%);
    }
    .hint {
      position: fixed;
      bottom: 6%;
      left: 50%;
      transform: translateX(-50%);
      font-family: Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-size: 14px;
      color: rgba(32, 26, 23, 0.55);
      pointer-events: none;
      opacity: 1;
      transition: opacity 1.4s ease;
      text-align: center;
      white-space: nowrap;
    }
    .hint.hidden { opacity: 0; }

    .tilt-pill {
      position: fixed;
      bottom: 6%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(32, 26, 23, 0.85);
      color: var(--cream);
      font-family: Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-size: 14px;
      padding: 10px 20px;
      border-radius: 999px;
      border: 2px solid var(--ink);
      box-shadow: 3px 3px 0 rgba(32,26,23,0.4);
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }
    .tilt-pill.visible { opacity: 1; pointer-events: auto; }
    .tilt-pill:active { transform: translateX(-50%) translateY(2px); }

    @media (prefers-reduced-motion: reduce) {
      .hint, .tilt-pill { transition: none; }
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div class="vignette"></div>
  <p class="hint" id="hint">closer things hurry. farther things dawdle.</p>
  <button class="tilt-pill" id="tiltPill">tilt to look around</button>

  <script>
    (function () {
      var canvas = document.getElementById('stage');
      var ctx = canvas.getContext('2d');
      var hint = document.getElementById('hint');
      var tiltPill = document.getElementById('tiltPill');

      var INK = '#201a17';
      var PALETTE = ['#f0563e', '#5aa0db', '#b7ce3c', '#a98fd0', '#f47b28', '#ff7fa5', '#2fb0a3', '#f7c948'];
      var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var W = 0, H = 0;
      var maxShift = 70;
      var margin = 0;
      var shapes = [];
      var titleShape = null;

      var target = { x: 0, y: 0 };
      var current = { x: 0, y: 0 };
      var rafId = null;
      var hintTimer = null;
      var hintHidden = false;

      function rand(min, max) { return min + Math.random() * (max - min); }
      function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }
      function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

      var SHAPE_TYPES = ['circle', 'ring', 'triangle', 'star', 'blob', 'bolt', 'diamond'];

      function makeShape(worldW, worldH, m) {
        var depth = Math.pow(Math.random(), 0.85);
        var isMobile = window.innerWidth < 600;
        var base = rand(16, 44) * (isMobile ? 0.8 : 1);
        var size = base * (0.45 + depth * 1.35);
        var type = pick(SHAPE_TYPES);
        var shape = {
          type: type,
          x: rand(-m, worldW + m),
          y: rand(-m, worldH + m),
          depth: depth,
          size: size,
          color: pick(PALETTE),
          rot: rand(0, Math.PI * 2),
          shadowOff: 1.5 + depth * 3.5,
          strokeW: 1.4 + depth * 1.1,
          alpha: 0.5 + depth * 0.5,
          blur: depth < 0.32 ? (0.32 - depth) * 6 : 0
        };
        if (type === 'blob') {
          var n = 8, pts = [];
          for (var i = 0; i < n; i++) pts.push(rand(0.7, 1.15));
          shape.blobPts = pts;
        }
        return shape;
      }

      function generateScene() {
        W = window.innerWidth;
        H = window.innerHeight;
        maxShift = W < 600 ? 46 : 70;
        margin = maxShift + 60;
        var worldW = W, worldH = H;
        var count = clamp(Math.floor((W * H) / 9000), 40, 110);
        shapes = [];
        for (var i = 0; i < count; i++) {
          shapes.push(makeShape(worldW, worldH, margin));
        }

        var fontSize = clamp(W * 0.15, 44, 140);
        titleShape = {
          type: 'text',
          text: 'PARALLAX',
          x: W / 2,
          y: H * 0.34,
          depth: 0.62,
          size: fontSize,
          color: '#f0563e',
          shadowOff: 5,
          strokeW: fontSize * 0.045
        };
        shapes.push(titleShape);
        shapes.sort(function (a, b) { return a.depth - b.depth; });
      }

      function resizeCanvas() {
        canvas.width = Math.round(window.innerWidth * dpr);
        canvas.height = Math.round(window.innerHeight * dpr);
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function pathFor(s) {
        var r = s.size / 2;
        ctx.beginPath();
        switch (s.type) {
          case 'circle':
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            break;
          case 'ring':
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.moveTo(r * 0.5, 0);
            ctx.arc(0, 0, r * 0.5, 0, Math.PI * 2, true);
            break;
          case 'square':
            ctx.rect(-r, -r, r * 2, r * 2);
            break;
          case 'diamond':
            ctx.moveTo(0, -r); ctx.lineTo(r, 0); ctx.lineTo(0, r); ctx.lineTo(-r, 0); ctx.closePath();
            break;
          case 'triangle':
            for (var i = 0; i < 3; i++) {
              var a = -Math.PI / 2 + i * (Math.PI * 2 / 3);
              var px = Math.cos(a) * r, py = Math.sin(a) * r;
              if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.closePath();
            break;
          case 'star':
            for (var j = 0; j < 10; j++) {
              var a2 = -Math.PI / 2 + j * (Math.PI / 5);
              var rr = j % 2 === 0 ? r : r * 0.45;
              var px2 = Math.cos(a2) * rr, py2 = Math.sin(a2) * rr;
              if (j === 0) ctx.moveTo(px2, py2); else ctx.lineTo(px2, py2);
            }
            ctx.closePath();
            break;
          case 'bolt':
            var pts = [[0.15, -0.5], [-0.05, -0.05], [0.2, -0.05], [-0.15, 0.5], [0.05, 0.05], [-0.2, 0.05]];
            for (var k = 0; k < pts.length; k++) {
              var px3 = pts[k][0] * s.size, py3 = pts[k][1] * s.size;
              if (k === 0) ctx.moveTo(px3, py3); else ctx.lineTo(px3, py3);
            }
            ctx.closePath();
            break;
          case 'blob':
            var n = s.blobPts.length;
            for (var m = 0; m <= n; m++) {
              var a3 = (m / n) * Math.PI * 2;
              var rad = r * s.blobPts[m % n];
              var px4 = Math.cos(a3) * rad, py4 = Math.sin(a3) * rad;
              if (m === 0) ctx.moveTo(px4, py4); else ctx.lineTo(px4, py4);
            }
            ctx.closePath();
            break;
        }
      }

      function drawShape(s) {
        var screenX = s.x + current.x * maxShift * s.depth;
        var screenY = s.y + current.y * maxShift * s.depth;

        ctx.save();
        ctx.translate(screenX, screenY);
        ctx.globalAlpha = s.alpha;
        ctx.filter = s.blur > 0 ? 'blur(' + s.blur.toFixed(2) + 'px)' : 'none';
        ctx.rotate(s.rot);

        ctx.save();
        ctx.translate(s.shadowOff, s.shadowOff);
        pathFor(s);
        ctx.fillStyle = INK;
        ctx.fill();
        ctx.restore();

        pathFor(s);
        ctx.fillStyle = s.color;
        ctx.fill();
        ctx.lineWidth = s.strokeW;
        ctx.lineJoin = 'round';
        ctx.strokeStyle = INK;
        ctx.stroke();

        ctx.restore();
      }

      function drawTitle(s) {
        var screenX = s.x + current.x * maxShift * s.depth;
        var screenY = s.y + current.y * maxShift * s.depth;
        ctx.save();
        ctx.translate(screenX, screenY);
        ctx.font = "900 " + s.size + "px 'Arial Black', Arial, sans-serif";
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        ctx.save();
        ctx.translate(s.shadowOff, s.shadowOff);
        ctx.fillStyle = INK;
        ctx.fillText(s.text, 0, 0);
        ctx.restore();

        ctx.lineWidth = s.strokeW;
        ctx.lineJoin = 'round';
        ctx.strokeStyle = INK;
        ctx.strokeText(s.text, 0, 0);
        ctx.fillStyle = s.color;
        ctx.fillText(s.text, 0, 0);
        ctx.restore();
      }

      function render() {
        ctx.clearRect(0, 0, W, H);
        for (var i = 0; i < shapes.length; i++) {
          var s = shapes[i];
          if (s.type === 'text') drawTitle(s); else drawShape(s);
        }
      }

      var LERP = reduceMotion ? 1 : 0.09;
      function loop() {
        var dx = target.x - current.x, dy = target.y - current.y;
        current.x += dx * LERP;
        current.y += dy * LERP;
        render();
        if (Math.abs(target.x - current.x) > 0.0008 || Math.abs(target.y - current.y) > 0.0008) {
          rafId = requestAnimationFrame(loop);
        } else {
          current.x = target.x;
          current.y = target.y;
          render();
          rafId = null;
        }
      }
      function wake() {
        if (rafId === null) rafId = requestAnimationFrame(loop);
      }

      function dismissHint() {
        if (hintHidden) return;
        hintHidden = true;
        hint.classList.add('hidden');
      }

      function setTargetFromPointer(clientX, clientY) {
        target.x = clamp((clientX / window.innerWidth - 0.5) * 2, -1, 1);
        target.y = clamp((clientY / window.innerHeight - 0.5) * 2, -1, 1);
        wake();
      }

      window.addEventListener('pointermove', function (e) {
        setTargetFromPointer(e.clientX, e.clientY);
        dismissHint();
      }, { passive: true });

      window.addEventListener('pointerdown', dismissHint, { passive: true });

      var tiltBase = null;
      function onOrientation(e) {
        if (e.gamma === null || e.beta === null) return;
        if (tiltBase === null) tiltBase = { gamma: e.gamma, beta: e.beta };
        var dx = (e.gamma - tiltBase.gamma) / 26;
        var dy = (e.beta - tiltBase.beta) / 26;
        target.x = clamp(dx, -1, 1);
        target.y = clamp(dy, -1, 1);
        wake();
        dismissHint();
      }

      function enableTilt() {
        window.addEventListener('deviceorientation', onOrientation, true);
        tiltPill.classList.remove('visible');
      }

      var needsPermission = typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function';
      var isTouch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;

      if (needsPermission && isTouch) {
        tiltPill.classList.add('visible');
        tiltPill.addEventListener('click', function () {
          DeviceOrientationEvent.requestPermission().then(function (state) {
            if (state === 'granted') enableTilt();
            tiltPill.classList.remove('visible');
          }).catch(function () {
            tiltPill.classList.remove('visible');
          });
        });
      } else if (isTouch && 'DeviceOrientationEvent' in window) {
        enableTilt();
      }

      var resizeTimer = null;
      window.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () {
          resizeCanvas();
          generateScene();
          render();
        }, 200);
      });

      resizeCanvas();
      generateScene();
      render();
      wake();

      hintTimer = setTimeout(dismissHint, 9000);
    })();
  </script>
</body>
</html>
