<style>
  :root{ --ink:#201a17; --paper:#f2ede2; --cream:#fff8ef;
         --coral:#f0563e; --sky:#5aa0db; --lime:#b7ce3c; --purple:#a98fd0;
         --orange:#f47b28; --pink:#ff7fa5; --teal:#2fb0a3; --gold:#f7c948; }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; height:100%; overflow:hidden;
    background:radial-gradient(130% 100% at 50% 0%, #fbf7ee 0%, #efe8db 70%, #e6ddce 100%);
    font-family:'Arial Black','Arial',sans-serif; color:var(--ink);
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
    touch-action:none;
  }
  #stage{ position:relative; width:100%; height:100%; }
  #plate{ position:absolute; inset:0; width:100%; height:100%; display:block; }

  .hud{
    position:fixed; top:16px; left:16px; display:flex; flex-direction:column; gap:8px; z-index:3;
  }
  .chip{
    background:var(--cream); border:3px solid var(--ink); border-radius:999px;
    box-shadow:3px 3px 0 var(--ink); padding:6px 14px; font-size:clamp(11px,2.4vw,13px);
    transform:rotate(-2deg); white-space:nowrap;
  }
  .chip:nth-child(2){ transform:rotate(1.5deg); }

  .ghostbadge{
    position:fixed; top:16px; right:16px; z-index:3;
    background:var(--gold); border:3px solid var(--ink); border-radius:12px;
    box-shadow:4px 4px 0 var(--ink); padding:8px 14px; font-size:clamp(11px,2.6vw,13px);
    transform:rotate(3deg); opacity:0; transition:opacity .6s ease; pointer-events:none;
  }
  .ghostbadge.show{ opacity:1; }

  .hint{
    position:fixed; bottom:19%; left:0; right:0; text-align:center;
    font-family:Georgia,'Times New Roman',serif; font-style:italic; font-size:clamp(12px,2.6vw,14px);
    opacity:.55; transition:opacity 2s ease; pointer-events:none; padding:0 12px; z-index:2;
  }
  .hint.gone{ opacity:0; }

  #controls{
    position:fixed; left:50%; bottom:max(18px, env(safe-area-inset-bottom)); transform:translateX(-50%);
    display:flex; align-items:center; gap:14px; z-index:3;
    background:rgba(32,26,23,0.72); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border-radius:999px; padding:10px 18px; transition:opacity 1.2s ease;
  }
  #controls.faded{ opacity:.12; }
  #controls:hover{ opacity:1; }

  .modegroup{ display:flex; align-items:center; gap:4px; }
  .modelabel{ color:var(--cream); font-size:11px; opacity:.8; margin-right:2px; }
  .stepbtn{
    width:26px; height:26px; border-radius:50%; border:2px solid var(--ink); background:var(--sky);
    color:var(--ink); font-size:15px; font-weight:900; cursor:pointer; line-height:1;
    box-shadow:2px 2px 0 var(--ink); transition:transform .08s ease, box-shadow .08s ease;
  }
  .stepbtn:active{ transform:translate(1px,1px); box-shadow:1px 1px 0 var(--ink); }
  .modeval{ color:var(--cream); font-size:16px; width:20px; text-align:center; }

  .actionbtn{
    font-family:'Arial Black',sans-serif; font-weight:900; text-transform:uppercase; letter-spacing:.03em;
    font-size:clamp(11px,2.6vw,13px); color:var(--ink); background:var(--gold);
    border:2px solid var(--ink); border-radius:999px; box-shadow:3px 3px 0 var(--ink);
    padding:8px 16px; cursor:pointer; transition:transform .08s ease, box-shadow .08s ease;
  }
  .actionbtn:hover{ transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--ink); }
  .actionbtn:active{ transform:translate(1px,1px); box-shadow:1px 1px 0 var(--ink); }
  .actionbtn.alt{ background:var(--purple); }

  @media (max-width: 520px){
    #controls{ gap:8px; padding:8px 12px; flex-wrap:wrap; justify-content:center; max-width:94vw; }
    .actionbtn{ padding:7px 12px; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="plate"></canvas>

  <div class="hud">
    <div class="chip">MODE (<span id="nVal">3</span>, <span id="mVal">5</span>) &mdash; <span id="freqVal">0</span> Hz</div>
    <div class="chip">PLATE STRUCK: <span id="strikeVal">0</span></div>
  </div>

  <div class="ghostbadge" id="ghostBadge">GHOST FREQUENCY DETECTED</div>

  <div class="hint" id="hint">drag your finger across the plate to sprinkle sand &mdash; strike it to let physics decide</div>

  <div id="controls">
    <div class="modegroup">
      <span class="modelabel">N</span>
      <button class="stepbtn" id="nMinus">-</button>
      <span class="modeval" id="nDisplay">3</span>
      <button class="stepbtn" id="nPlus">+</button>
    </div>
    <div class="modegroup">
      <span class="modelabel">M</span>
      <button class="stepbtn" id="mMinus">-</button>
      <span class="modeval" id="mDisplay">5</span>
      <button class="stepbtn" id="mPlus">+</button>
    </div>
    <button class="actionbtn" id="strikeBtn">Strike</button>
    <button class="actionbtn alt" id="randomBtn">Random</button>
  </div>
</div>

<script>
(function(){
  'use strict';

  var INK = '#201a17';
  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  var stage = document.getElementById('stage');
  var canvas = document.getElementById('plate');
  var ctx = canvas.getContext('2d');
  var hint = document.getElementById('hint');
  var controls = document.getElementById('controls');
  var nDisplay = document.getElementById('nDisplay');
  var mDisplay = document.getElementById('mDisplay');
  var nVal = document.getElementById('nVal');
  var mVal = document.getElementById('mVal');
  var freqVal = document.getElementById('freqVal');
  var strikeVal = document.getElementById('strikeVal');
  var ghostBadge = document.getElementById('ghostBadge');

  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0, cx = 0, cy = 0, R = 0;

  var n = 3, m = 5;
  try {
    var savedN = parseInt(localStorage.getItem('cymatics_n'), 10);
    var savedM = parseInt(localStorage.getItem('cymatics_m'), 10);
    if (savedN >= 1 && savedN <= 9) n = savedN;
    if (savedM >= 1 && savedM <= 9) m = savedM;
  } catch (e) {}

  var strikeCount = 0;
  try { strikeCount = parseInt(localStorage.getItem('cymatics_strikes'), 10) || 0; } catch (e) {}
  strikeVal.textContent = strikeCount;

  var isGhostMode = false;
  var ghostBadgeTimer = null;

  var MAX_GRAINS = 800;
  var grains = [];

  function Zfield(x, y) {
    if (isGhostMode) {
      var r = Math.sqrt(x * x + y * y);
      var theta = Math.atan2(y, x);
      return Math.sin(6 * theta + r * 13);
    }
    return Math.cos(n * Math.PI * x) * Math.cos(m * Math.PI * y) -
           Math.cos(m * Math.PI * x) * Math.cos(n * Math.PI * y);
  }

  function makeGrain(x, y) {
    return { x: x, y: y };
  }

  function scatterAll() {
    grains = [];
    for (var i = 0; i < MAX_GRAINS; i++) {
      var a = Math.random() * Math.PI * 2;
      var rad = Math.sqrt(Math.random());
      grains.push(makeGrain(Math.cos(a) * rad, Math.sin(a) * rad));
    }
  }
  scatterAll();

  function resize() {
    W = stage.clientWidth;
    H = stage.clientHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = W / 2;
    cy = H / 2;
    R = Math.max(60, Math.min(W, H) * 0.42);
    drawScene();
  }
  var resizeTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 120);
  });

  function updateFreqLabel() {
    var f = Math.round(50 * Math.sqrt(n * n + m * m));
    freqVal.textContent = f;
    nVal.textContent = n;
    mVal.textContent = m;
    nDisplay.textContent = n;
    mDisplay.textContent = m;
  }
  updateFreqLabel();

  function drawScene() {
    ctx.clearRect(0, 0, W, H);

    ctx.save();
    ctx.translate(cx + 3, cy + 4);
    ctx.beginPath();
    ctx.arc(0, 0, R, 0, Math.PI * 2);
    ctx.fillStyle = INK;
    ctx.fill();
    ctx.restore();

    var grad = ctx.createRadialGradient(cx - R * 0.3, cy - R * 0.35, R * 0.1, cx, cy, R);
    grad.addColorStop(0, '#dfe6ea');
    grad.addColorStop(0.6, '#b9c4cc');
    grad.addColorStop(1, '#8d99a3');
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = INK;
    ctx.stroke();

    ctx.fillStyle = 'rgba(242,237,226,0.92)';
    for (var i = 0; i < grains.length; i++) {
      var g = grains[i];
      var px = cx + g.x * R;
      var py = cy + g.y * R;
      ctx.beginPath();
      ctx.arc(px, py, 1.3, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  var strikeTime = 0;
  var settleQuietFrames = 0;
  var rafId = null;
  var lastT = 0;

  function wake() {
    if (!rafId) {
      lastT = performance.now();
      settleQuietFrames = 0;
      rafId = requestAnimationFrame(loop);
    }
  }

  function loop(now) {
    var dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;

    var tSinceStrike = (now - strikeTime) / 1000;
    var jitterAmp = reduced ? 0 : 0.55 * Math.exp(-tSinceStrike / 1.4);
    var eps = 0.015;
    var settleSpeed = 1.1;
    var totalMove = 0;

    for (var i = 0; i < grains.length; i++) {
      var g = grains[i];
      var z0 = Zfield(g.x, g.y);
      var zx = Zfield(g.x + eps, g.y);
      var zy = Zfield(g.x, g.y + eps);
      var sign = z0 >= 0 ? 1 : -1;
      var dzdx = sign * (zx - z0) / eps;
      var dzdy = sign * (zy - z0) / eps;
      var norm = Math.sqrt(dzdx * dzdx + dzdy * dzdy) + 1e-6;
      var step = settleSpeed * Math.min(1, Math.abs(z0)) * dt;
      var mx = -(dzdx / norm) * step;
      var my = -(dzdy / norm) * step;

      if (jitterAmp > 0) {
        mx += (Math.random() - 0.5) * jitterAmp * dt;
        my += (Math.random() - 0.5) * jitterAmp * dt;
      }

      g.x += mx;
      g.y += my;

      var r = Math.sqrt(g.x * g.x + g.y * g.y);
      if (r > 1) {
        g.x = (g.x / r) * 1;
        g.y = (g.y / r) * 1;
      }

      totalMove += Math.abs(mx) + Math.abs(my);
    }

    drawScene();

    if (totalMove < 0.02) {
      settleQuietFrames++;
    } else {
      settleQuietFrames = 0;
    }

    if (settleQuietFrames > 40 || reduced) {
      rafId = null;
      return;
    }
    rafId = requestAnimationFrame(loop);
  }

  function strike(surprise) {
    scatterAll();
    strikeTime = performance.now();
    strikeCount++;
    strikeVal.textContent = strikeCount;
    try { localStorage.setItem('cymatics_strikes', String(strikeCount)); } catch (e) {}

    isGhostMode = typeof surprise === 'boolean' ? surprise : Math.random() < 0.04;
    if (isGhostMode) {
      clearTimeout(ghostBadgeTimer);
      ghostBadge.classList.add('show');
      ghostBadgeTimer = setTimeout(function(){ ghostBadge.classList.remove('show'); }, 3200);
    } else {
      ghostBadge.classList.remove('show');
    }

    hint.classList.add('gone');
    fadeControlsLater();
    if (reduced) { settleInstant(); } else { wake(); }
  }

  function settleInstant() {
    for (var pass = 0; pass < 60; pass++) {
      for (var i = 0; i < grains.length; i++) {
        var g = grains[i];
        var eps = 0.015;
        var z0 = Zfield(g.x, g.y);
        var zx = Zfield(g.x + eps, g.y);
        var zy = Zfield(g.x, g.y + eps);
        var sign = z0 >= 0 ? 1 : -1;
        var dzdx = sign * (zx - z0) / eps;
        var dzdy = sign * (zy - z0) / eps;
        var norm = Math.sqrt(dzdx * dzdx + dzdy * dzdy) + 1e-6;
        var step = 0.03 * Math.min(1, Math.abs(z0));
        g.x -= (dzdx / norm) * step;
        g.y -= (dzdy / norm) * step;
        var r = Math.sqrt(g.x * g.x + g.y * g.y);
        if (r > 1) { g.x = g.x / r; g.y = g.y / r; }
      }
    }
    drawScene();
  }

  var fadeTimer = null;
  function fadeControlsLater() {
    clearTimeout(fadeTimer);
    controls.classList.remove('faded');
    fadeTimer = setTimeout(function(){ controls.classList.add('faded'); }, 5000);
  }

  function changeMode(which, delta) {
    if (which === 'n') { n = Math.max(1, Math.min(9, n + delta)); try { localStorage.setItem('cymatics_n', String(n)); } catch (e) {} }
    else { m = Math.max(1, Math.min(9, m + delta)); try { localStorage.setItem('cymatics_m', String(m)); } catch (e) {} }
    isGhostMode = false;
    ghostBadge.classList.remove('show');
    updateFreqLabel();
    strikeTime = performance.now();
    if (reduced) { settleInstant(); } else { wake(); }
  }

  document.getElementById('nMinus').addEventListener('click', function(){ changeMode('n', -1); });
  document.getElementById('nPlus').addEventListener('click', function(){ changeMode('n', 1); });
  document.getElementById('mMinus').addEventListener('click', function(){ changeMode('m', -1); });
  document.getElementById('mPlus').addEventListener('click', function(){ changeMode('m', 1); });
  document.getElementById('strikeBtn').addEventListener('click', function(){ strike(); });
  document.getElementById('randomBtn').addEventListener('click', function(){
    var newN, newM;
    do { newN = 1 + ((Math.random() * 9) | 0); newM = 1 + ((Math.random() * 9) | 0); }
    while (newN === n && newM === m);
    n = newN; m = newM;
    try { localStorage.setItem('cymatics_n', String(n)); localStorage.setItem('cymatics_m', String(m)); } catch (e) {}
    updateFreqLabel();
    strike();
  });

  var dragging = false;
  function sprinkleAt(clientX, clientY) {
    var rect = stage.getBoundingClientRect();
    var px = clientX - rect.left, py = clientY - rect.top;
    var x = (px - cx) / R, y = (py - cy) / R;
    if (x * x + y * y > 1) return;
    if (grains.length < MAX_GRAINS) {
      grains.push(makeGrain(x, y));
    } else {
      grains[(Math.random() * grains.length) | 0] = makeGrain(x, y);
    }
    hint.classList.add('gone');
    fadeControlsLater();
    strikeTime = performance.now() - 900;
    if (reduced) { drawScene(); } else { wake(); }
  }

  canvas.addEventListener('pointerdown', function(e){
    if (e.target !== canvas) return;
    dragging = true;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    sprinkleAt(e.clientX, e.clientY);
  });
  canvas.addEventListener('pointermove', function(e){
    if (!dragging) return;
    var events = (e.getCoalescedEvents && e.getCoalescedEvents()) || [e];
    for (var i = 0; i < events.length; i++) sprinkleAt(events[i].clientX, events[i].clientY);
  });
  canvas.addEventListener('pointerup', function(){ dragging = false; });
  canvas.addEventListener('pointercancel', function(){ dragging = false; });

  document.addEventListener('visibilitychange', function(){
    if (document.hidden && rafId) {
      cancelAnimationFrame(rafId);
      rafId = null;
    }
  });

  resize();
  strike(false);
})();
</script>
</body>
</html>
