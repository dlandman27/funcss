<!DOCTYPE html>
<html lang="en">
<head>
<script defer src="https://randomsitesontheweb.com/globals/global.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copter</title>
<meta name="description" content="Hold to fly, release to fall. Thread your little helicopter through a narrowing cave for as long as you can. That's the whole game. One button.">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://randomsitesontheweb.com/copter/">
    <meta property="og:title" content="Copter">
    <meta property="og:description" content="Hold to fly, release to fall. Thread your little helicopter through a narrowing cave for as long as you can. One button, endlessly hard.">
    <meta property="og:image" content="https://randomsitesontheweb.com/og/copter.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <meta name="twitter:description" content="Hold to fly, release to fall. Thread your little helicopter through a narrowing cave for as long as you can. One button, endlessly hard.">

<style>
  :root{ --ink:#201a17; --cream:#fff8ef; }
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#f2ede2;
    font-family:'Arial Black','Arial',sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer;}
  #hint{
    position:fixed;left:50%;bottom:20px;transform:translateX(-50%);
    font-family:Georgia,'Times New Roman',serif;font-style:italic;
    font-size:clamp(12px,3.4vw,15px);color:#6f665c;
    background:rgba(255,248,239,.72);border:1px solid rgba(32,26,23,.18);
    padding:5px 14px;border-radius:999px;pointer-events:none;
    transition:opacity 1.2s ease;white-space:nowrap;z-index:5;
  }
  #hint.gone{opacity:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">hold to fly. release to fall. that's the whole thing.</div>
<script>
(function(){
  'use strict';
  var INK='#201a17', CREAM='#fff8ef', ROCK='#6b5545', ROCK_HI='#7d6553';
  var RED='#f0563e', GOLD='#f7c948';

  var canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
  var W=0,H=0,dpr=1, copterX=0;

  function resize(){
    W=window.innerWidth; H=window.innerHeight;
    dpr=Math.min(window.devicePixelRatio||1,2);
    canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    copterX=W*0.30;
  }
  var rzT; window.addEventListener('resize',function(){clearTimeout(rzT);rzT=setTimeout(resize,120);});

  // ---- world -------------------------------------------------------------
  var STATE='ready';        // ready | playing | dead
  var scroll=0, cy=0, vy=0, rotor=0, holding=false, t0=0;
  var blocks=[], nextBlock=0, puffs=[], debris=[], bursts=[];
  var best=0; try{ best=parseInt(localStorage.getItem('copter_best')||'0',10)||0; }catch(_){}
  var shake=0;

  var GRAV=1500, THRUST=2600, MAXV=1400;

  function diff(){ return Math.min(1, scroll/9000); }
  function speed(){ return 240*(1+1.1*diff()); }

  function caveAt(x){
    var mid = H*0.5 + Math.sin(x*0.0035)*H*0.16 + Math.sin(x*0.011+2.0)*H*0.07;
    var half = H*(0.34 - 0.20*diff());
    var ceil = mid-half, floor = mid+half;
    if(ceil<18) ceil=18; if(floor>H-18) floor=H-18;
    return {ceil:ceil, floor:floor};
  }

  function reset(){
    STATE='ready'; scroll=0; vy=0; cy=H*0.5; rotor=0;
    blocks.length=0; puffs.length=0; debris.length=0; bursts.length=0;
    nextBlock=1600;
  }

  function start(){ STATE='playing'; t0=performance.now(); vy=-200; }

  function die(){
    if(STATE!=='dead'){
      STATE='dead'; shake=1;
      var m=meters();
      if(m>best){ best=m; try{localStorage.setItem('copter_best',String(best));}catch(_){ } }
      // debris + a comic crash word
      for(var i=0;i<16;i++) debris.push({x:copterX,y:cy,vx:(Math.random()-0.5)*520,vy:-Math.random()*420-40,
        r:3+Math.random()*5,rot:Math.random()*6,vr:(Math.random()-0.5)*14,col:i%3?RED:GOLD,t:0,life:1.2});
      bursts.push({x:copterX,y:cy,t:0,life:0.9,word:'CRUNCH',col:RED,rot:(Math.random()-0.5)*0.4});
    }
  }

  function meters(){ return Math.floor(scroll/40); }

  // ---- input -------------------------------------------------------------
  function down(){
    hideHint();
    if(STATE==='ready') start();
    else if(STATE==='dead'){ reset(); start(); }
    holding=true;
  }
  function up(){ holding=false; }
  canvas.addEventListener('pointerdown',function(e){ down(); e.preventDefault(); });
  window.addEventListener('pointerup',up);
  window.addEventListener('pointercancel',up);
  window.addEventListener('keydown',function(e){ if(e.code==='Space'||e.code==='ArrowUp'){ if(!e.repeat) down(); e.preventDefault(); } });
  window.addEventListener('keyup',function(e){ if(e.code==='Space'||e.code==='ArrowUp') up(); });

  // ---- update ------------------------------------------------------------
  function update(dt){
    rotor += dt*(holding?60:34);
    if(STATE==='ready'){ cy = H*0.5 + Math.sin(performance.now()*0.003)*10; return; }
    if(STATE==='dead'){ // fall out of the sky
      vy += GRAV*dt; cy += vy*dt; updateFx(dt); if(shake>0) shake=Math.max(0,shake-dt*3); return;
    }
    // playing
    vy += (holding? -THRUST : GRAV)*dt;
    if(vy>MAXV)vy=MAXV; else if(vy<-MAXV)vy=-MAXV;
    cy += vy*dt;
    scroll += speed()*dt;

    // thrust puffs
    if(holding && Math.random()<0.7) puffs.push({x:copterX-6,y:cy+10,vx:-60-Math.random()*60,vy:40+Math.random()*40,r:4+Math.random()*4,t:0,life:0.5});

    // spawn blocks in the gap
    while(nextBlock < scroll + W + 60){
      var cave=caveAt(nextBlock);
      var pad=34, lo=cave.ceil+pad, hi=cave.floor-pad;
      if(hi>lo){ var s=26+Math.random()*24; blocks.push({x:nextBlock,y:lo+Math.random()*(hi-lo),w:s,h:s}); }
      nextBlock += 300 + Math.random()*260;
    }
    for(var i=blocks.length-1;i>=0;i--){ if(blocks[i].x-scroll < -90) blocks.splice(i,1); }

    // collision
    var r=13, cave=caveAt(scroll+copterX);
    if(cy-r<cave.ceil || cy+r>cave.floor){ cy=Math.max(cave.ceil+r,Math.min(cave.floor-r,cy)); die(); }
    for(i=0;i<blocks.length;i++){
      var b=blocks[i], bx=b.x-scroll;
      if(copterX+r>bx-b.w/2 && copterX-r<bx+b.w/2 && cy+r>b.y-b.h/2 && cy-r<b.y+b.h/2){ die(); break; }
    }
    updateFx(dt);
    if(shake>0) shake=Math.max(0,shake-dt*3);
  }

  function updateFx(dt){
    for(var i=puffs.length-1;i>=0;i--){ var p=puffs[i]; p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.r+=dt*10; if(p.t>=p.life)puffs.splice(i,1); }
    for(i=debris.length-1;i>=0;i--){ var d=debris[i]; d.t+=dt; d.vy+=1400*dt; d.x+=d.vx*dt; d.y+=d.vy*dt; d.rot+=d.vr*dt; if(d.t>=d.life||d.y>H+40)debris.splice(i,1); }
    for(i=bursts.length-1;i>=0;i--){ bursts[i].t+=dt; if(bursts[i].t>=bursts[i].life)bursts.splice(i,1); }
  }

  // ---- draw --------------------------------------------------------------
  function drawCave(){
    var STEP=8, cs=[], fs=[], xs=[], sx, wx;
    for(sx=0;sx<=W+STEP;sx+=STEP){ wx=scroll+sx; var c=caveAt(wx); xs.push(sx); cs.push(c.ceil); fs.push(c.floor); }
    // ceiling rock
    ctx.beginPath(); ctx.moveTo(0,0);
    for(var i=0;i<xs.length;i++) ctx.lineTo(xs[i],cs[i]);
    ctx.lineTo(W,0); ctx.closePath();
    ctx.fillStyle=ROCK; ctx.fill();
    // floor rock
    ctx.beginPath(); ctx.moveTo(0,H);
    for(i=0;i<xs.length;i++) ctx.lineTo(xs[i],fs[i]);
    ctx.lineTo(W,H); ctx.closePath();
    ctx.fillStyle=ROCK; ctx.fill();
    // bold ink edges (sticker outline)
    ctx.lineWidth=4; ctx.strokeStyle=INK; ctx.lineJoin='round';
    ctx.beginPath(); for(i=0;i<xs.length;i++) i?ctx.lineTo(xs[i],cs[i]):ctx.moveTo(xs[i],cs[i]); ctx.stroke();
    ctx.beginPath(); for(i=0;i<xs.length;i++) i?ctx.lineTo(xs[i],fs[i]):ctx.moveTo(xs[i],fs[i]); ctx.stroke();
    // hard shadow just inside the gap
    ctx.lineWidth=6; ctx.strokeStyle='rgba(32,26,23,0.14)';
    ctx.beginPath(); for(i=0;i<xs.length;i++){ var y=cs[i]+5; i?ctx.lineTo(xs[i],y):ctx.moveTo(xs[i],y); } ctx.stroke();
    ctx.beginPath(); for(i=0;i<xs.length;i++){ var y2=fs[i]-5; i?ctx.lineTo(xs[i],y2):ctx.moveTo(xs[i],y2); } ctx.stroke();
  }

  function drawBlocks(){
    for(var i=0;i<blocks.length;i++){
      var b=blocks[i], bx=b.x-scroll, x=bx-b.w/2, y=b.y-b.h/2;
      ctx.fillStyle='rgba(32,26,23,0.18)'; ctx.fillRect(x+3,y+3,b.w,b.h);   // hard shadow
      ctx.fillStyle='#3b322c'; ctx.fillRect(x,y,b.w,b.h);
      ctx.fillStyle=ROCK_HI; ctx.fillRect(x+3,y+3,b.w-9,b.h-9);
      ctx.lineWidth=3; ctx.strokeStyle=INK; ctx.strokeRect(x,y,b.w,b.h);
    }
  }

  function drawPuffs(){
    for(var i=0;i<puffs.length;i++){ var p=puffs[i], a=1-p.t/p.life;
      ctx.globalAlpha=a*0.55; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle='#c9c1b4'; ctx.fill(); ctx.lineWidth=1.5; ctx.strokeStyle='rgba(32,26,23,0.4)'; ctx.stroke();
    }
    ctx.globalAlpha=1;
  }

  function drawCopter(){
    if(STATE==='dead' && cy>H+40) return;
    var tilt = Math.max(-0.4, Math.min(0.4, vy/1400));
    ctx.save(); ctx.translate(copterX,cy); ctx.rotate(tilt);
    // hard shadow
    ctx.save(); ctx.translate(3,3);
    ctx.fillStyle=INK; ctx.beginPath(); ctx.ellipse(0,0,20,13,0,0,Math.PI*2); ctx.fill(); ctx.restore();
    // tail
    ctx.lineWidth=3; ctx.strokeStyle=INK;
    ctx.beginPath(); ctx.moveTo(-12,0); ctx.lineTo(-34,-6); ctx.stroke();
    ctx.fillStyle=RED; ctx.beginPath(); ctx.moveTo(-30,-3); ctx.lineTo(-40,-12); ctx.lineTo(-34,-2); ctx.closePath(); ctx.fill(); ctx.stroke();
    // body
    ctx.beginPath(); ctx.ellipse(0,0,20,13,0,0,Math.PI*2);
    ctx.fillStyle=RED; ctx.fill(); ctx.stroke();
    // cockpit window
    ctx.beginPath(); ctx.arc(7,-1,7,0,Math.PI*2); ctx.fillStyle=CREAM; ctx.fill(); ctx.stroke();
    // skid
    ctx.beginPath(); ctx.moveTo(-12,13); ctx.lineTo(12,13); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-6,9); ctx.lineTo(-8,13); ctx.moveTo(6,9); ctx.lineTo(8,13); ctx.stroke();
    // mast + spinning rotor
    ctx.beginPath(); ctx.moveTo(0,-13); ctx.lineTo(0,-19); ctx.stroke();
    var rw=22*Math.abs(Math.cos(rotor))+6;
    ctx.beginPath(); ctx.ellipse(0,-20,rw,3.2,0,0,Math.PI*2); ctx.fillStyle=INK; ctx.fill();
    ctx.restore();
  }

  function drawBursts(){
    for(var i=0;i<bursts.length;i++){ var b=bursts[i], k=b.t/b.life;
      var sc = k<0.3 ? (0.2+1.3*(k/0.3)) : 1;
      ctx.save(); ctx.globalAlpha=k>0.7?(1-(k-0.7)/0.3):1;
      ctx.translate(b.x,b.y); ctx.rotate(b.rot); ctx.scale(sc,sc);
      ctx.font='900 46px "Arial Black",sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.lineJoin='round'; ctx.lineWidth=8; ctx.strokeStyle=INK; ctx.strokeText(b.word,0,0);
      ctx.fillStyle=b.col; ctx.fillText(b.word,0,0); ctx.restore();
    }
  }
  function drawDebris(){
    for(var i=0;i<debris.length;i++){ var d=debris[i];
      ctx.save(); ctx.translate(d.x,d.y); ctx.rotate(d.rot);
      ctx.fillStyle=d.col; ctx.fillRect(-d.r,-d.r,d.r*2,d.r*2);
      ctx.lineWidth=1.5; ctx.strokeStyle=INK; ctx.strokeRect(-d.r,-d.r,d.r*2,d.r*2); ctx.restore();
    }
  }

  // loud sticker text helper
  function loud(text,x,y,size,col,rot){
    ctx.save(); ctx.translate(x,y); if(rot)ctx.rotate(rot);
    ctx.font='900 '+size+'px "Arial Black",sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.lineJoin='round'; ctx.lineWidth=size*0.16; ctx.strokeStyle=INK; ctx.strokeText(text,0,0);
    ctx.fillStyle=col; ctx.fillText(text,0,0); ctx.restore();
  }
  function quiet(text,x,y,size,col){
    ctx.save(); ctx.font='italic '+size+'px Georgia, serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle=col||'#6f665c'; ctx.fillText(text,x,y); ctx.restore();
  }

  function drawHUD(){
    if(STATE==='playing'){
      loud(meters()+'m', W*0.5, 40, 30, GOLD, 0);
    } else if(STATE==='ready'){
      loud('COPTER', W*0.5, H*0.34, Math.min(72,W*0.16), RED, -0.04);
      quiet('hold anywhere to fly', W*0.5, H*0.34+52, 17);
      if(best>0) quiet('best: '+best+'m', W*0.5, H*0.34+78, 15, '#8a8078');
    } else if(STATE==='dead'){
      loud(meters()+'m', W*0.5, H*0.40, Math.min(64,W*0.15), GOLD, -0.03);
      quiet(meters()>=best?'a new record.':'best: '+best+'m', W*0.5, H*0.40+46, 16, meters()>=best?'#7cb342':'#8a8078');
      quiet('tap to fly again', W*0.5, H*0.40+74, 16);
    }
  }

  // ---- loop --------------------------------------------------------------
  var last=0;
  function frame(now){
    var dt=Math.min(0.05,(now-last)/1000); last=now||0;
    update(dt);
    var sx = shake>0 ? (Math.random()-0.5)*shake*14 : 0;
    var sy = shake>0 ? (Math.random()-0.5)*shake*14 : 0;
    ctx.setTransform(dpr,0,0,dpr, sx*dpr, sy*dpr);
    ctx.clearRect(-20,-20,W+40,H+40);
    drawCave();
    drawBlocks();
    drawPuffs();
    drawCopter();
    drawDebris();
    drawHUD();
    drawBursts();
    requestAnimationFrame(frame);
  }

  // ---- hint --------------------------------------------------------------
  var hint=document.getElementById('hint'), hintGone=false;
  function hideHint(){ if(hintGone)return; hintGone=true; hint.classList.add('gone'); setTimeout(function(){if(hint.parentNode)hint.remove();},1300); }
  setTimeout(function(){ if(!hintGone) hideHint(); },9000);

  resize(); reset();
  last=performance.now();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
