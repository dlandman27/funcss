<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero Variants</title>
<style>
  /* Side-by-side compare: each variant is a real 1440×900 page, scaled down */
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px 60px; background: #2a2320; color: #fefaf0; font-family: system-ui, sans-serif; }
  h1 { margin: 0 0 4px; font-size: 1.3rem; }
  p { margin: 0 0 20px; opacity: .7; font-size: .9rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 620px), 1fr)); gap: 22px; }
  figure { margin: 0; }
  .frame { position: relative; aspect-ratio: 16 / 10; overflow: hidden; border-radius: 10px; border: 2px solid #fefaf0; background: #f5ecd6; }
  .frame iframe { position: absolute; top: 0; left: 0; width: 1440px; height: 900px; border: 0; transform-origin: 0 0; }
  figcaption { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; font-size: .9rem; }
  figcaption b { font-size: 1rem; }
  figcaption a { color: #f7c948; }
</style></head>
<body>
<h1>Hero variants: the button is the star</h1>
<p>Each one is a live page at laptop size, so hover and press the buttons. Open one full screen with the link.</p>
<div class="grid">
  <figure><div class="frame"><iframe src="a.html" title="A"></iframe></div><figcaption><span><b>A · Arcade button</b> a big round red PUSH ME, quiet static headline</span><a href="a.html" target="_blank">open</a></figcaption></figure>
  <figure><div class="frame"><iframe src="b.html" title="B"></iframe></div><figcaption><span><b>B · Button is the headline</b> no headline at all, the button is the biggest text</span><a href="b.html" target="_blank">open</a></figcaption></figure>
  <figure><div class="frame"><iframe src="c.html" title="C"></iframe></div><figcaption><span><b>C · Push it</b> big button with a scribbled "go on, push it" and a wiggle</span><a href="c.html" target="_blank">open</a></figcaption></figure>
  <figure><div class="frame"><iframe src="d.html" title="D"></iframe></div><figcaption><span><b>D · Keycap</b> a giant keyboard key that presses down (spacebar works too)</span><a href="d.html" target="_blank">open</a></figcaption></figure>
  <figure><div class="frame"><iframe src="e.html" title="E"></iframe></div><figcaption><span><b>E · Spotlight</b> glowing pill with pulse rings, everything else whispers</span><a href="e.html" target="_blank">open</a></figcaption></figure>
</div>
<script>
  const fit = () => document.querySelectorAll('.frame').forEach(f => {
    f.querySelector('iframe').style.transform = `scale(${f.clientWidth / 1440})`;
  });
  addEventListener('resize', fit); fit();
</script>
</body></html>
