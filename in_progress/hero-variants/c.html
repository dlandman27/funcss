<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="_base.css"><title>C · Push it</title><style>
.logo { width: min(260px, 52vw); margin-bottom: 20px; }
h1 { font: 700 clamp(1.7rem, 3.4vw, 2.6rem)/1.1 var(--display); margin: 0 0 40px; }
.wrap { position: relative; margin-bottom: 36px; }
.btn { font: 700 clamp(1.8rem, 4vw, 3rem)/1 var(--display); text-transform: uppercase; background: var(--orange); border: 4px solid var(--ink); border-radius: 18px;
  padding: .5em 1.2em; box-shadow: 9px 9px 0 var(--ink); cursor: pointer; color: var(--ink); animation: nudge 3.2s ease-in-out infinite; }
.btn:active { translate: 7px 7px; box-shadow: 2px 2px 0 var(--ink); }
@keyframes nudge { 0%, 82%, 100% { rotate: 0; } 86% { rotate: -3deg; } 90% { rotate: 3deg; } 94% { rotate: -2deg; } }
.note { position: absolute; left: calc(100% + 30px); top: -4px; width: 170px; text-align: left; font: 700 1.25rem/1.15 'Fredoka', cursive; rotate: 6deg; color: var(--coral); }
.note svg { display: block; width: 110px; margin: 6px 0 0 -30px; }
