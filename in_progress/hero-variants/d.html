<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="_base.css"><title>D · Keycap</title><style>
.logo { width: min(240px, 50vw); margin-bottom: 18px; }
h1 { font: 700 clamp(1.5rem, 2.8vw, 2.1rem)/1.1 var(--display); margin: 0 0 36px; }
.key { position: relative; width: clamp(240px, 30vw, 360px); height: clamp(150px, 17vw, 200px); border: 0; padding: 0; background: none; cursor: pointer; margin-bottom: 36px; }
.key .side { position: absolute; inset: 14px 0 0; border-radius: 26px; background: #d8c9a6; border: 4px solid var(--ink); }
.key .top { position: absolute; inset: 0 0 18px; border-radius: 26px; background: var(--card); border: 4px solid var(--ink); display: grid; place-items: center; align-content: center; gap: 6px;
  transition: transform .07s; }
.key .top b { font: 700 clamp(2rem, 3.6vw, 2.8rem)/1 var(--display); text-transform: uppercase; }
.key .top small { font: 700 .75rem var(--mono); letter-spacing: .14em; opacity: .55; }
.key:hover .top { transform: translateY(3px); }
.key:active .top { transform: translateY(14px); }
.key::before { content: ''; position: absolute; inset: -18px; border-radius: 40px; background: var(--orange); border: 4px solid var(--ink); z-index: -1; box-shadow: 8px 8px 0 var(--ink); }
.chips { margin-bottom: 12px; }
</style></head><body><section class="hero">
<img class="logo" src="/logo.webp" alt="">
<h1>Small websites. Endless distractions.</h1>
<button class="key"><span class="side"></span><span class="top"><b>Surprise me</b><small>or press space</small></span></button>
<div class="chips"><button class="chip on">Anything</button><button class="chip">Fun &amp; Interactive</button><button class="chip">Games</button><button class="chip">Art</button><button class="chip">Entertainment</button><button class="chip">Tools</button></div>
</section><script>const k=document.querySelector(".key .top");addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault();k.style.transform="translateY(14px)"}});addEventListener("keyup",e=>{if(e.code==="Space")k.style.transform=""});</script><div class="made">Made by Dylan Landman</div><div class="scroll">Browse all sites ↓</div></body></html>
