<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="_base.css"><title>B · Button is the headline</title><style>
.logo { width: min(220px, 46vw); margin-bottom: 40px; }
.mega { font: 700 clamp(2.4rem, 6.4vw, 5.2rem)/1 var(--display); text-transform: uppercase; letter-spacing: .01em; color: var(--ink);
  background: var(--orange); border: 5px solid var(--ink); border-radius: 26px; padding: .42em .9em .48em; box-shadow: 12px 12px 0 var(--ink);
