<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="_base.css"><title>E · Spotlight</title><style>
body { background-color: #efe3c6; }
.hero::before { content: ''; position: absolute; left: 50%; top: 54%; width: 900px; height: 900px; translate: -50% -50%; border-radius: 50%;
  background: radial-gradient(circle, rgba(247,201,72,.55), rgba(247,201,72,0) 60%); pointer-events: none; }
.logo { width: min(200px, 44vw); margin-bottom: 14px; position: relative; }
h1 { font: 600 1.15rem var(--body); margin: 0 0 44px; opacity: .7; position: relative; }
.btn { position: relative; font: 700 clamp(2rem, 4.6vw, 3.6rem)/1 var(--display); text-transform: uppercase; color: var(--ink); background: var(--orange); border: 5px solid var(--ink);
  border-radius: 999px; padding: .55em 1.4em; box-shadow: 10px 10px 0 var(--ink); cursor: pointer; margin-bottom: 44px; animation: bob 2.4s ease-in-out infinite; }
.btn::before, .btn::after { content: ''; position: absolute; inset: -5px; border-radius: inherit; border: 4px solid var(--orange); animation: ring 2.4s ease-out infinite; }
.btn::after { animation-delay: 1.2s; }
@keyframes ring { from { opacity: .8; transform: scale(1); } to { opacity: 0; transform: scale(1.35, 1.7); } }
@keyframes bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -6px; } }
.btn:active { translate: 7px 7px; box-shadow: 3px 3px 0 var(--ink); animation: none; }
.chips { position: relative; }
</style></head><body><section class="hero">
<img class="logo" src="/logo.webp" alt="">
<h1>Small websites. Endless distractions.</h1>
<button class="btn">Surprise me</button>
<div class="chips quiet"><button class="chip on">Anything</button><button class="chip">Fun &amp; Interactive</button><button class="chip">Games</button><button class="chip">Art</button><button class="chip">Entertainment</button><button class="chip">Tools</button></div>
</section><div class="made">Made by Dylan Landman</div><div class="scroll">Browse all sites ↓</div></body></html>
