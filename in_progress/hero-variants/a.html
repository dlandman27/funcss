<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="_base.css"><title>A · Arcade button</title><style>
.logo { width: min(240px, 50vw); margin-bottom: 18px; }
h1 { font: 700 clamp(1.6rem, 3vw, 2.2rem)/1.1 var(--display); margin: 0 0 34px; }
.arcade { position: relative; width: clamp(220px, 26vw, 300px); aspect-ratio: 1; border: 0; padding: 0; background: none; cursor: pointer; margin-bottom: 34px; }
.arcade .base { position: absolute; inset: 22% 3% 6%; border-radius: 50%; background: #2a2320; border: 4px solid var(--ink); }
.arcade .cap { position: absolute; inset: 4% 8% 16%; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ff8a73, var(--coral) 55%, #c63b25); border: 4px solid var(--ink);
  display: grid; place-items: center; font: 700 clamp(1.5rem, 2.6vw, 2.1rem)/1 var(--display); color: #fff; -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; text-shadow: 3px 3px 0 var(--ink);
  transition: transform .08s; box-shadow: inset 0 -10px 0 rgba(0,0,0,.18); }
.arcade:hover .cap { transform: translateY(4px); }
.arcade:active .cap { transform: translateY(16%); }
.arcade::after { content: ''; position: absolute; inset: -14%; border-radius: 50%; border: 3px dashed rgba(240,86,62,.45); animation: spin 18s linear infinite; }
@keyframes spin { to { rotate: 360deg; } }
.chips { margin-bottom: 14px; }
</style></head><body><section class="hero">
<img class="logo" src="/logo.webp" alt="">
<h1>Small websites. Endless distractions.</h1>
<button class="arcade"><span class="base"></span><span class="cap">PUSH<br>ME</span></button>
<div class="chips quiet"><button class="chip on">Anything</button><button class="chip">Fun &amp; Interactive</button><button class="chip">Games</button><button class="chip">Art</button><button class="chip">Entertainment</button><button class="chip">Tools</button></div>
<span class="online"><i></i>18 online</span>
</section><div class="made">Made by Dylan Landman</div><div class="scroll">Browse all sites ↓</div></body></html>
