<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Tic tac toe">
  <!-- hash grid -->
  <g stroke="#201a17" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="37.3" y1="12" x2="37.3" y2="88"/>
    <line x1="62.7" y1="12" x2="62.7" y2="88"/>
    <line x1="12" y1="37.3" x2="88" y2="37.3"/>
    <line x1="12" y1="62.7" x2="88" y2="62.7"/>
  </g>
  <!-- the losing side, on the other diagonal -->
  <circle cx="24.65" cy="24.65" r="7" fill="none" stroke="#201a17" stroke-width="9"/>
  <circle cx="24.65" cy="24.65" r="7" fill="none" stroke="#5aa0db" stroke-width="5"/>
  <circle cx="75.35" cy="75.35" r="7" fill="none" stroke="#201a17" stroke-width="9"/>
  <circle cx="75.35" cy="75.35" r="7" fill="none" stroke="#5aa0db" stroke-width="5"/>
  <!-- winning diagonal: three X, double-stroked so coral sits inside ink -->
  <g stroke-linecap="round" fill="none">
    <g stroke="#201a17" stroke-width="10">
      <line x1="18.15" y1="68.85" x2="31.15" y2="81.85"/><line x1="31.15" y1="68.85" x2="18.15" y2="81.85"/>
      <line x1="43.5" y1="43.5" x2="56.5" y2="56.5"/><line x1="56.5" y1="43.5" x2="43.5" y2="56.5"/>
      <line x1="68.85" y1="18.15" x2="81.85" y2="31.15"/><line x1="81.85" y1="18.15" x2="68.85" y2="31.15"/>
    </g>
    <g stroke="#f0563e" stroke-width="6">
      <line x1="18.15" y1="68.85" x2="31.15" y2="81.85"/><line x1="31.15" y1="68.85" x2="18.15" y2="81.85"/>
      <line x1="43.5" y1="43.5" x2="56.5" y2="56.5"/><line x1="56.5" y1="43.5" x2="43.5" y2="56.5"/>
      <line x1="68.85" y1="18.15" x2="81.85" y2="31.15"/><line x1="81.85" y1="18.15" x2="68.85" y2="31.15"/>
    </g>
  </g>
  <!-- strike, bottom-left to top-right, drawn last so it sits over the row -->
  <g stroke-linecap="round" fill="none">
    <line x1="14" y1="86" x2="86" y2="14" stroke="#201a17" stroke-width="9"/>
    <line x1="14" y1="86" x2="86" y2="14" stroke="#f7c948" stroke-width="6"/>
  </g>
</svg>
