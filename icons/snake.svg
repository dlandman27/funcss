<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Snake">
  <!-- pellet -->
  <rect x="17.15" y="17.15" width="15" height="15" rx="4" fill="#f0563e" stroke="#201a17" stroke-width="5"/>
  <!-- body: one path, stroked twice — ink casing then lime -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24.65,75.35 H75.35 V50" stroke="#201a17" stroke-width="22"/>
    <path d="M24.65,75.35 H75.35 V50" stroke="#b7ce3c" stroke-width="18"/>
  </g>
  <!-- segment divisions -->
  <g stroke="#201a17" stroke-width="4" stroke-linecap="butt">
    <line x1="41.5" y1="66.35" x2="41.5" y2="84.35"/>
    <line x1="58.5" y1="66.35" x2="58.5" y2="84.35"/>
    <line x1="66.35" y1="61" x2="84.35" y2="61"/>
  </g>
  <!-- eyes on the head -->
  <circle cx="71" cy="46.5" r="2.8" fill="#201a17"/>
  <circle cx="79.7" cy="46.5" r="2.8" fill="#201a17"/>
</svg>
