<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Toy box">
  <!-- toys behind, cropped by the box front so they read as sitting inside -->
  <circle cx="34" cy="32" r="12" fill="#f0563e" stroke="#201a17" stroke-width="5"/>
  <rect x="56" y="20" width="24" height="24" rx="3" fill="#5aa0db" stroke="#201a17" stroke-width="5"/>
  <!-- the box -->
  <rect x="16" y="42" width="68" height="42" rx="6" fill="#f7c948" stroke="#201a17" stroke-width="5"/>
  <!-- lid seam -->
  <line x1="16" y1="56" x2="84" y2="56" stroke="#201a17" stroke-width="5"/>
  <!-- clasp -->
  <rect x="44" y="50" width="12" height="14" rx="2" fill="#201a17"/>
</svg>
