<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Grass: a dense field of thin blades, leaning in the wind ── */
  .b-grass { background: linear-gradient(#eef4e2, #dce9c8 70%); color: #2f5a2a; font-family: Georgia, 'Times New Roman', serif; place-items: start center; }
  .b-grass canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .b-grass .word { position: relative; margin-top: 3.6cqi; font-size: 12cqi; line-height: 1; letter-spacing: .14em; margin-right: -.14em; }
</style></head>
<body><div class="b b-grass">
  <canvas id="c" width="800" height="300"></canvas>
  <div class="word">Grass</div>
</div>
<script>
const c = document.getElementById('c'), g = c.getContext('2d');
const COLS = ['#96c14a', '#8bbf4e', '#7fae3a', '#5f9e6a', '#4f8f52'];
let seed = 3; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const blades = [];
for (let i = 0; i < 900; i++) {
  const x = rnd() * 820 - 10, h = 70 + rnd() * 95 + (Math.abs(x - 400) > 170 ? 25 : 0);
  blades.push({ x, h, lean: (rnd() - .5) * .35, w: 1.6 + rnd() * 1.6, col: COLS[(rnd() * COLS.length) | 0], ph: rnd() * 6.28 });
}
blades.sort((a, b) => b.h - a.h);
function draw(t) {
  g.clearRect(0, 0, 800, 300);
  for (const b of blades) {
    const gust = LIVE ? Math.sin(t / 900 - b.x / 140) * .28 + Math.sin(t / 370 + b.ph) * .04 : 0;
    const bend = b.lean + gust, tipX = b.x + bend * b.h, tipY = 300 - b.h * (1 - Math.abs(bend) * .25);
    g.beginPath(); g.moveTo(b.x - b.w, 302);
    g.quadraticCurveTo(b.x + bend * b.h * .3, 300 - b.h * .55, tipX, tipY);
    g.quadraticCurveTo(b.x + bend * b.h * .3 + b.w * .6, 300 - b.h * .55, b.x + b.w, 302);
    g.fillStyle = b.col; g.fill();
  }
  if (LIVE) requestAnimationFrame(draw);
}
draw(0);
</script></body></html>
