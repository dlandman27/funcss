<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Race Your Ghost: typed text vs. a ghost lane ───────────── */
  .b-ghost { background: #f2ede2; font-family: Georgia, 'Times New Roman', serif; color: #201a17; place-items: center start; }
  .b-ghost .inner { position: relative; padding-left: 6cqi; width: 100%; }
  .b-ghost .line { font-size: 10.5cqi; letter-spacing: -.1cqi; white-space: nowrap; }
  .b-ghost .line .typed { color: #201a17; }
  .b-ghost .line .left { color: rgba(32,26,23,.25); }
  .b-ghost .caret { display: inline-block; width: .6cqi; height: 9cqi; background: #2fb0a3; vertical-align: -1.2cqi; margin: 0 .3cqi;
    animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .b-ghost .lanes { margin-top: 3.5cqi; width: 76cqi; display: grid; gap: 1.6cqi; font-family: 'Arial Black', Arial, sans-serif; font-size: 2.4cqi; }
  .b-ghost .lane { display: grid; grid-template-columns: 12cqi 1fr; align-items: center; }
  .b-ghost .bar { height: 2.6cqi; border-radius: 2cqi; background: rgba(32,26,23,.1); overflow: hidden; }
  .b-ghost .bar i { display: block; height: 100%; border-radius: 2cqi; }
  .b-ghost .you i { width: 52%; background: #f47b28; }
  .b-ghost .gh i { width: 58%; background: #a98fd0; opacity: .75; animation: haunt 3.5s linear infinite; transform-origin: left; }
  .b-ghost .gh .lbl { color: #a98fd0; }
  @keyframes haunt { from { width: 58%; } to { width: 100%; } }
</style></head>
<body><div class="b b-ghost"><div class="inner">
  <div class="line"><span class="typed">Race Your </span><span class="caret"></span><span class="left">Ghost</span></div>
  <div class="lanes">
    <div class="lane you"><span class="lbl">YOU</span><div class="bar"><i></i></div></div>
    <div class="lane gh"><span class="lbl">GHOST</span><div class="bar"><i></i></div></div>
  </div>
</div></div></body></html>
