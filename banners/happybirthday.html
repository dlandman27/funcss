<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Happy Birthday!: a confetti drop for somebody's link ──── */
  .b-hb { background: radial-gradient(ellipse at 50% 40%, #3b1f5c, #1f0f33 75%); font-family: 'Pacifico', cursive; color: #fff8ef; }
  .b-hb .c { position: absolute; top: 0; width: 1.2cqi; height: 2cqi; border-radius: .2cqi; animation: drop 3.2s linear infinite; }
  @keyframes drop { from { transform: translateY(var(--y)) rotate(var(--r)); } to { transform: translateY(calc(var(--y) + 40cqi)) rotate(calc(var(--r) + 540deg)); } }
  .b-hb .word { position: relative; font-size: 10.5cqi; line-height: 1.3; padding-bottom: 1cqi; color: #f7c948;
    text-shadow: .5cqi .5cqi 0 #f0563e; transform: rotate(-3deg); }
  .b-hb .word span { color: #ff7fa5; text-shadow: .5cqi .5cqi 0 #a98fd0; }
</style></head>
<body><div class="b b-hb">
  <span id="conf"></span>
  <div class="word">Happy <span>Birthday!</span></div>
</div>
<script>
const host = document.getElementById('conf'), COL = ['#f7c948', '#b7ce3c', '#f0563e', '#ff7fa5', '#f47b28', '#a98fd0', '#5aa0db', '#2fb0a3'];
let seed = 9; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
for (let i = 0; i < 70; i++) {
  const e = document.createElement('i'); e.className = 'c';
  const y = rnd() * 40 - 40;    // confetti spread across the sky; wraps by 40cqi
  e.style.cssText = `left:${rnd() * 100}cqi;background:${COL[i % COL.length]};--y:${y}cqi;--r:${(rnd() * 360) | 0}deg;animation-delay:${-rnd() * 3.2}s;` +
    (i % 3 === 0 ? 'width:1.4cqi;height:1.4cqi;border-radius:50%;' : '');
  host.appendChild(e);
}
</script></body></html>
