<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Library of Everything: an endless wall of binary, green monospace on black ── */
  .b-lib { background: #000; color: #0f0; font-family: monospace; }
  .b-lib .bits { position: absolute; inset: -2cqi 0 0 0; font-size: 2.2cqi; line-height: 1.6; word-break: break-all; color: #0a0; opacity: .55; letter-spacing: .2cqi; animation: roll 8s linear infinite; }
  @keyframes roll { to { transform: translateY(-3.52cqi); } }
  .b-lib .box { position: relative; background: #000; border: 1px solid #0f0; padding: 2.6cqi 5cqi; text-align: center; box-shadow: 0 0 0 2cqi #000; }
  .b-lib .word { font-size: 8.4cqi; font-weight: bold; line-height: 1; text-shadow: 0 0 1.6cqi rgba(0, 255, 0, .45); }
  .b-lib .sub { margin-top: 1.4cqi; font-size: 2.4cqi; font-style: italic; color: #0a0; }
</style></head>
<body><div class="b b-lib">
  <div class="bits" id="bits"></div>
  <div class="box"><div class="word">Library of Everything</div><div class="sub">every number. every book. in order.</div></div>
</div>
<script>
let s = 17; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
let t = ''; for (let i = 0; i < 2600; i++) t += r() < .5 ? '0' : '1';
const b = document.getElementById('bits'); b.textContent = t;
if (LIVE) setInterval(() => { t = t.slice(60) + Array.from({ length: 60 }, () => Math.random() < .5 ? '0' : '1').join(''); b.textContent = t; }, 400);
</script></body></html>
