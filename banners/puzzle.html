<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── The Restoration: a gallery painting in sliding pieces ── */
  .b-rest { background: radial-gradient(circle at 30% 32%, #4a3d33 0%, #2a221e 55%, #1d1712 100%); font-family: Georgia, 'Times New Roman', serif; color: #fff8ef; place-items: center end; }
  .b-rest .frame { position: absolute; left: 7cqi; top: 50%; transform: translateY(-50%); padding: 1.6cqi; background: linear-gradient(135deg, #e6c36a, #a87b2c 50%, #d9b25a);
    box-shadow: inset 0 0 0 .5cqi #6e4e17, 0 2cqi 4cqi rgba(0,0,0,.55); }
  .b-rest .board { position: relative; width: 28.5cqi; height: 28.5cqi; background: #15100d; }
  .b-rest .t { position: absolute; width: 9.3cqi; height: 9.3cqi; background-size: 28.5cqi 28.5cqi; background-image:
      radial-gradient(circle at 70% 30%, #fff1b8 0 7%, transparent 8%),
      radial-gradient(ellipse 80% 40% at 30% 92%, #2f5a3a 0 60%, transparent 61%),
      radial-gradient(ellipse 90% 45% at 85% 96%, #3d6b45 0 60%, transparent 61%),
      linear-gradient(180deg, #f2b46a 0%, #e5785a 45%, #7b5aa6 100%); }
  .b-rest .slide { animation: slide 4s ease-in-out infinite; }
  @keyframes slide { 0%, 30% { transform: none; } 45%, 80% { transform: translateX(9.6cqi); } 95%, 100% { transform: none; } }
  .b-rest .word { position: relative; padding-right: 7cqi; text-align: right; font-size: 10cqi; line-height: 1; }
  .b-rest .word small { display: block; margin-top: 2.2cqi; font-size: 2.8cqi; letter-spacing: .32em; text-transform: uppercase; color: #f7c948; }
</style></head>
<body><div class="b b-rest">
  <div class="frame"><div class="board" id="board"></div></div>
  <div class="word">The<br>Restoration<small>in pieces</small></div>
</div>
<script>
const board = document.getElementById('board'), S = 9.6;
// scrambled tiles: [correct index] at each slot; slot 4 is the gap
const order = [0, 2, 1, 3, -1, 5, 7, 6, 8];
order.forEach((n, slot) => {
  if (n < 0) return;
  const t = document.createElement('div'); t.className = 't' + (slot === 3 ? ' slide' : '');
  t.style.left = (slot % 3) * S + 'cqi'; t.style.top = Math.floor(slot / 3) * S + 'cqi';
  t.style.backgroundPosition = `-${(n % 3) * 9.5}cqi -${Math.floor(n / 3) * 9.5}cqi`;
  board.appendChild(t);
});
</script></body></html>
