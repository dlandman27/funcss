<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Wreck Room: a framed problem, a bat, and the crack it left ── */
  .b-wreck { background: #2a2421; color: #fff8ef; font-family: 'Arial Black', 'Segoe UI', sans-serif; place-items: center start;
    background-image: radial-gradient(ellipse at 70% 40%, rgba(255,240,220,.08), transparent 60%); }
  .b-wreck .tape { position: absolute; left: 0; right: 0; bottom: 0; height: 4.4cqi;
    background: repeating-linear-gradient(-45deg, #f7c948 0 3cqi, #201a17 3cqi 6cqi); }
  .b-wreck .word { position: relative; margin-left: 6cqi; font-size: 11.5cqi; line-height: .92; text-transform: uppercase; letter-spacing: -.2cqi; }
  .b-wreck .word span { color: #f0563e; }
  .b-wreck .word small { display: block; margin-top: 2cqi; font: italic 3cqi Georgia, serif; text-transform: none; letter-spacing: 0; color: rgba(255,248,239,.6); }
  .b-wreck .frame { position: absolute; right: 12cqi; top: 7cqi; width: 26cqi; height: 21cqi; background: #fff8ef; border: 1.2cqi solid #c98d4e;
    box-shadow: 0 1cqi 2cqi rgba(0,0,0,.5); transform: rotate(4deg); }
  .b-wreck .frame svg { width: 100%; height: 100%; display: block; }
  .b-wreck .bat { position: absolute; right: 2cqi; top: 1cqi; width: 26cqi; transform-origin: 90% 90%; animation: swing 1.8s cubic-bezier(.6,0,.4,1) infinite; }
  @keyframes swing { 0%, 30% { transform: rotate(0); } 50% { transform: rotate(-28deg); } 58% { transform: rotate(-22deg); } 100% { transform: rotate(0); } }
</style></head>
<body><div class="b b-wreck">
  <div class="tape"></div>
  <div class="frame"><svg viewBox="0 0 100 80">
    <rect width="100" height="80" fill="#f2ede2"/>
    <text x="50" y="47" text-anchor="middle" font-family="Georgia" font-style="italic" font-size="13" fill="#201a17">my problem</text>
    <path d="M38 34 L46 42 L40 54 L48 66 M46 42 L60 38 L70 22 M60 38 L74 50 L88 48 M46 42 L30 46 L14 40 M40 54 L28 70" stroke="#201a17" stroke-width="1.6" fill="none" stroke-linejoin="round"/>
  </svg></div>
  <svg class="bat" viewBox="0 0 200 200"><g transform="rotate(-38 100 100)">
    <path d="M20 92 Q20 84 34 84 L120 88 Q170 88 186 94 Q194 100 186 106 Q170 112 120 112 L34 116 Q20 116 20 108 Z" fill="#c98d4e" stroke="#201a17" stroke-width="4"/>
    <rect x="12" y="86" width="10" height="28" rx="4" fill="#201a17"/>
    <path d="M30 90 L80 92" stroke="#201a17" stroke-width="10" opacity=".6"/>
  </g></svg>
  <div class="word">Wreck<br><span>Room</span><small>this is your problem. swing at it.</small></div>
</div></body></html>
