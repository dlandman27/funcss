<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── The Quietest Site on the Web: 0.000 dB, a flat line ───── */
  .b-quiet { background: #0b0c0e; font-family: Georgia, 'Times New Roman', serif; text-align: center; }
  .b-quiet .word { position: relative; font-style: italic; font-size: 7.6cqi; line-height: 1.12; color: #d5d0c3; }
  .b-quiet .line { position: relative; width: 44cqi; height: 4cqi; margin: 2.6cqi auto 1.4cqi; }
  .b-quiet .line::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: #453f38; }
  .b-quiet .blip { position: absolute; left: 50%; top: 50%; width: .25cqi; height: 1.6cqi; margin: -.8cqi 0 0 -.12cqi; background: #8d887c; opacity: 0; animation: blip 6s infinite; }
  @keyframes blip { 0%, 70%, 76%, 100% { opacity: 0; } 72% { opacity: .8; } }
  .b-quiet .label { font-size: 2.4cqi; letter-spacing: .32em; text-transform: uppercase; color: #6b675e; }
</style></head>
<body><div class="b b-quiet">
  <div>
    <div class="word">The Quietest Site<br>on the Web</div>
    <div class="line"><i class="blip"></i></div>
    <div class="label">0.000 dB and holding</div>
  </div>
</div></body></html>
