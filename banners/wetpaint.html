<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Wet Paint: the enamel sign, already smeared ────────────── */
  .b-wet { background: radial-gradient(ellipse at 50% 50%, #ece8e0, #ddd7cb 90%); font-family: 'Arial Black', 'Segoe UI', sans-serif; }
  .b-wet .sign { position: relative; width: 62cqi; padding: 3cqi 0 2.6cqi; background: #f6f3ea; border-radius: 1.2cqi; text-align: center;
    box-shadow: 0 1.2cqi 3cqi rgba(60,45,30,.3); transform: rotate(-1.3deg); }
  .b-wet .sign::before { content: ''; position: absolute; inset: 1.6cqi 2cqi; border: 1.1cqi solid #b3271e; border-radius: .8cqi; }
  .b-wet .t { position: relative; font-size: 11cqi; line-height: 1; font-weight: 900;
    background: linear-gradient(#d63a2a, #b3271e 50%, #8e1c15); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .b-wet .s { position: relative; margin-top: 1.4cqi; font-size: 2.8cqi; color: #5a4a3c; letter-spacing: .1cqi; }
  .b-wet .screw { position: absolute; width: 1.4cqi; height: 1.4cqi; border-radius: 50%; background: #9a948a; }
  .b-wet svg.smear { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .b-wet .drip { transform-origin: 701px 196px; animation: drip 3.5s ease-in infinite; }
  @keyframes drip { 0% { transform: scaleY(1); } 85% { transform: scaleY(1.9); opacity: 1; } 100% { transform: scaleY(1.9); opacity: 0; } }
</style></head>
<body><div class="b b-wet">
  <div class="sign">
    <i class="screw" style="left:.8cqi;top:.8cqi"></i><i class="screw" style="right:.8cqi;top:.8cqi"></i>
    <i class="screw" style="left:.8cqi;bottom:.8cqi"></i><i class="screw" style="right:.8cqi;bottom:.8cqi"></i>
    <div class="t">WET PAINT</div>
    <div class="s">DO NOT TOUCH</div>
  </div>
  <!-- a fingertip dragged red paint off the sign and onto the wall -->
  <svg class="smear" viewBox="0 0 800 300">
    <path d="M640 168 C690 180 720 210 770 250" stroke="#b3271e" stroke-width="16" stroke-linecap="round" fill="none" opacity=".85"/>
    <path d="M652 172 C695 186 722 214 760 248" stroke="#8e1c15" stroke-width="3" stroke-linecap="round" fill="none" opacity=".5"/>
    <path class="drip" d="M700 196 L702 232" stroke="#b3271e" stroke-width="5" stroke-linecap="round" opacity=".8"/>
  </svg>
</div></body></html>
