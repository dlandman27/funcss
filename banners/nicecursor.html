<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@800&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Nice Cursor: a giant arrow shoving the title off-line ─── */
  .b-nc { background: #e4e9f0; font-family: 'Inter', system-ui, sans-serif; color: #15171c; place-items: center start; }
  .b-nc::before { content: ''; position: absolute; inset: 0; background-image: radial-gradient(rgba(21,23,28,.12) 1px, transparent 1.2px); background-size: 3cqi 3cqi; }
  .b-nc .word { position: relative; margin-left: 6cqi; font-size: 11cqi; font-weight: 800; letter-spacing: -.5cqi; line-height: 1; white-space: nowrap; }
  .b-nc .word span { display: inline-block; }
  .b-nc .word .s1 { transform: translate(.6cqi, -.6cqi) rotate(4deg); }
  .b-nc .word .s2 { transform: translate(1.8cqi, -1.6cqi) rotate(9deg); animation: shove 2.6s ease-in-out infinite; }
  .b-nc .word .s3 { transform: translate(3.4cqi, 1.4cqi) rotate(-8deg); animation: shove 2.6s ease-in-out infinite .08s; }
  .b-nc .word .s4 { transform: translate(5cqi, -2.4cqi) rotate(16deg); animation: shove 2.6s ease-in-out infinite .16s; }
  @keyframes shove { 0%, 60%, 100% { translate: 0 0; } 70% { translate: 1.6cqi -.4cqi; } }
  .b-nc .cur { position: absolute; right: 4cqi; top: 50%; width: 20cqi; margin-top: -16cqi; animation: push 2.6s ease-in-out infinite; filter: drop-shadow(.8cqi 1cqi 0 rgba(21,23,28,.18)); }
  @keyframes push { 0%, 50%, 100% { transform: rotate(-8deg); } 66% { transform: translateX(-3cqi) rotate(-8deg); } }
</style></head>
<body><div class="b b-nc">
  <div class="word"><span style="margin-right:3cqi">Nice</span><span class="s1">C</span><span class="s2">u</span><span class="s3">r</span><span class="s4">sor</span></div>
  <svg class="cur" viewBox="0 0 22 33"><path d="M2 2 L2 26 L8 20.5 L12.2 30 L16.4 28.2 L12.3 18.8 L20 18.8 Z" fill="#fff" stroke="#15171c" stroke-width="1.7" stroke-linejoin="round"/></svg>
</div></body></html>
