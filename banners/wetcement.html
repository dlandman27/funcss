<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Wet Cement: letters scratched into a fresh sidewalk slab ── */
  .b-cem { background: #c9cbbd; font-family: Georgia, serif; color: #201a17; }
  .b-cem canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .b-cem .joint { position: absolute; top: 0; bottom: 0; width: .8cqi; background: #a9ab9c; box-shadow: inset .2cqi 0 .2cqi rgba(0,0,0,.25), .2cqi 0 0 rgba(255,255,255,.35); }
  .b-cem .word { position: relative; font-size: 15cqi; font-style: italic; line-height: 1; letter-spacing: .2cqi;
    color: #8b8e7f; text-shadow: -.3cqi -.35cqi .1cqi rgba(30,30,22,.7), .3cqi .35cqi .1cqi rgba(255,255,250,.8); transform: rotate(-3deg); }
  .b-cem .permit { position: absolute; right: 4cqi; bottom: 4cqi; padding: 1cqi 1.6cqi; background: #f7c948; border: .35cqi solid #201a17;
    font: 900 1.9cqi/1.3 'Arial Black', Arial, sans-serif; text-align: center; transform: rotate(3deg); }
  .b-cem .leaf { position: absolute; left: 9cqi; bottom: 6cqi; width: 9cqi; animation: drift 4s ease-in-out infinite; }
  @keyframes drift { 50% { transform: translate(1cqi, -.6cqi) rotate(12deg); } }
  .b-cem .bar { position: absolute; left: 30cqi; right: 38cqi; bottom: 5cqi; height: 1cqi; background: rgba(32,26,23,.15); border-radius: 1cqi; overflow: hidden; }
  .b-cem .bar i { display: block; height: 100%; width: 30%; background: #f0563e; animation: set 6s linear infinite; }
  @keyframes set { to { width: 100%; } }
</style></head>
<body><div class="b b-cem">
  <canvas id="grit" width="400" height="150"></canvas>
  <div class="joint" style="left:33%"></div><div class="joint" style="left:66%"></div>
  <div class="permit">PUBLIC WORKS DEPT.<br>UNAUTHORIZED ART<br>ENCOURAGED.</div>
  <svg class="leaf" viewBox="0 0 60 40"><path d="M4 22 Q22 -4 56 8 Q42 36 4 22 Z" fill="#ad8041"/><path d="M4 22 Q30 16 56 8" stroke="#7c5a2c" stroke-width="2" fill="none"/></svg>
  <div class="word">Wet Cement</div>
  <div class="bar"><i></i></div>
</div>
<script>
const c = document.getElementById('grit'), g = c.getContext('2d'), img = g.createImageData(400, 150);
for (let i = 0; i < img.data.length; i += 4) { const v = 185 + Math.random() * 40; img.data[i] = v + 3; img.data[i + 1] = v + 4; img.data[i + 2] = v - 8; img.data[i + 3] = 255; }
g.putImageData(img, 0, 0);
for (let i = 0; i < 260; i++) { g.fillStyle = Math.random() < .5 ? 'rgba(90,90,75,.35)' : 'rgba(255,255,245,.4)'; g.fillRect(Math.random() * 400, Math.random() * 150, 1, 1); }
</script></body></html>
