<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Limelight&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Clap-o-Meter: velvet curtain, brass applause gauge ────── */
  .b-clap { background: #5e0f14; font-family: 'Limelight', serif; color: #f7d98a; grid-template-columns: 1fr 1fr; padding: 0 5cqi; gap: 2cqi; }
  .b-clap::before { content: ''; position: absolute; inset: 0;
    background: repeating-linear-gradient(90deg, rgba(0,0,0,.34) 0 1.2cqi, rgba(255,90,90,.08) 3.5cqi, rgba(0,0,0,.34) 6cqi); }
  .b-clap::after { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 6cqi;
    background: radial-gradient(ellipse 4cqi 6cqi at 4cqi 0, #8a1a20 60%, transparent 62%) 0 0 / 8cqi 6cqi repeat-x; }
  .b-clap .word { position: relative; z-index: 1; font-size: 11.5cqi; line-height: .95; text-shadow: 0 .5cqi 0 #2a0507, 0 0 4cqi rgba(247,201,72,.35); }
  .b-clap svg { position: relative; z-index: 1; width: 40cqi; justify-self: center; overflow: visible; }
  .b-clap .needle { transform-origin: 100px 100px; transform: rotate(-58deg); animation: clap 1.6s cubic-bezier(.3,1.6,.5,1) infinite; }
  @keyframes clap { 0% { transform: rotate(-58deg); } 30% { transform: rotate(48deg); } 45% { transform: rotate(30deg); } 60% { transform: rotate(56deg); } 100% { transform: rotate(-58deg); } }
</style></head>
<body><div class="b b-clap">
  <div class="word">Clap-o-<br>Meter</div>
  <svg viewBox="0 0 200 120">
    <path d="M10 100 A90 90 0 0 1 190 100 Z" fill="#fbf1d6" stroke="#c99a2e" stroke-width="6"/>
    <path d="M30 100 A70 70 0 0 1 64 40" fill="none" stroke="#7a9a5a" stroke-width="12"/>
    <path d="M64 40 A70 70 0 0 1 136 40" fill="none" stroke="#e8b33a" stroke-width="12"/>
    <path d="M136 40 A70 70 0 0 1 170 100" fill="none" stroke="#d4382c" stroke-width="12"/>
    <g stroke="#3a1a10" stroke-width="2">
      <line x1="100" y1="22" x2="100" y2="32"/><line x1="45" y1="45" x2="52" y2="52"/><line x1="155" y1="45" x2="148" y2="52"/>
      <line x1="22" y1="100" x2="32" y2="100"/><line x1="178" y1="100" x2="168" y2="100"/>
    </g>
    <line class="needle" x1="100" y1="100" x2="100" y2="26" stroke="#2a0507" stroke-width="4" stroke-linecap="round"/>
    <circle cx="100" cy="100" r="9" fill="#c99a2e" stroke="#2a0507" stroke-width="3"/>
  </svg>
</div></body></html>
