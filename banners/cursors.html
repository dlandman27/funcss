<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── The Cursor Petting Zoo: park sign over cursor pens ────── */
  .b-zoo { background: linear-gradient(#cfe8a6 0 62%, #a9d07a 62%); font-family: 'Alfa Slab One', serif; place-items: start center; }
  .b-zoo .fence { position: absolute; left: 0; right: 0; top: 52%; height: 14cqi;
    background: linear-gradient(transparent 2.4cqi, #8a5a32 2.4cqi 3.6cqi, transparent 3.6cqi 8.6cqi, #8a5a32 8.6cqi 9.8cqi, transparent 9.8cqi),
      repeating-linear-gradient(90deg, transparent 0 7cqi, #a06a3c 7cqi 8.4cqi); }
  .b-zoo .sign { position: relative; margin-top: 4.6cqi; background: #5b3a21; color: #f6e7c4; border: .6cqi solid #3b2412;
    padding: 1.4cqi 3.6cqi 1.8cqi; border-radius: 1.2cqi; box-shadow: 0 .8cqi 0 #3b2412; text-align: center; }
  .b-zoo .sign small { display: block; font-size: 2.8cqi; letter-spacing: .5cqi; color: #e9c77a; }
  .b-zoo .sign div { font-size: 7.2cqi; line-height: 1; }
  .b-zoo .post { position: absolute; top: 20cqi; width: 1.8cqi; height: 20cqi; background: #3b2412; }
  .b-zoo svg.c { position: absolute; width: 5.2cqi; filter: drop-shadow(.3cqi .4cqi 0 rgba(0,0,0,.25)); animation: graze 2.6s ease-in-out infinite; }
  @keyframes graze { 0%, 100% { transform: translate(0, 0) rotate(0); } 25% { transform: translate(1.2cqi, -.6cqi) rotate(8deg); } 60% { transform: translate(-.8cqi, .3cqi) rotate(-6deg); } }
</style></head>
<body><div class="b b-zoo">
  <div class="fence"></div>
  <div class="post" style="left:30%"></div><div class="post" style="left:68%"></div>
  <div class="sign"><small>&#x2605; welcome to &#x2605;</small><div>The Cursor Petting Zoo</div></div>
  <svg class="c" style="left:8%;top:68%" viewBox="0 0 20 28"><path d="M2 2v21l5-5 4 9 3-1-4-9h7z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg>
  <svg class="c" style="left:24%;top:76%;animation-delay:-.8s" viewBox="0 0 24 28"><path d="M8 13V4a2 2 0 0 1 4 0v8-2a2 2 0 0 1 4 0v3-1a2 2 0 0 1 4 0v7c0 5-3 8-7 8h-2c-3 0-5-2-7-5l-3-5a2 2 0 0 1 3-2l4 3z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg>
  <svg class="c" style="left:47%;top:70%;width:3cqi;animation-delay:-1.5s" viewBox="0 0 10 28"><path d="M2 2h6M5 2v24M2 26h6" fill="none" stroke="#111" stroke-width="2"/></svg>
  <svg class="c" style="left:64%;top:75%;animation-delay:-.3s" viewBox="0 0 28 28"><path d="M14 1v26M1 14h26M14 1l-4 4h8zM14 27l-4-4h8zM1 14l4-4v8zM27 14l-4-4v8z" fill="#111" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg>
  <svg class="c" style="left:84%;top:68%;animation-delay:-2s" viewBox="0 0 28 28"><circle cx="14" cy="14" r="11" fill="none" stroke="#111" stroke-width="3.5" stroke-dasharray="40 30"/></svg>
</div></body></html>
