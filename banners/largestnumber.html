<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Largest Number Game: plain sans-serif, an input overflowing with nines, green button ── */
  .b-big { background: #f0f0f0; color: #333; font-family: sans-serif; }
  .b-big .wrap { text-align: center; }
  .b-big .word { font-size: 8.4cqi; font-weight: bold; color: #222; letter-spacing: -.2cqi; line-height: 1; }
  .b-big .row { display: flex; align-items: center; justify-content: center; gap: 2cqi; margin-top: 3.6cqi; }
  .b-big .in { width: 56cqi; height: 7.6cqi; border: .3cqi solid #ddd; border-radius: .7cqi; background: #fff; overflow: hidden; display: flex; align-items: center; justify-content: flex-end; padding: 0 1.6cqi; }
  .b-big .in span { font-size: 4.2cqi; white-space: nowrap; color: #111; font-variant-numeric: tabular-nums; }
  .b-big .in span::after { content: ''; display: inline-block; width: .3cqi; height: 4.6cqi; background: #111; vertical-align: -.8cqi; margin-left: .3cqi; animation: car 1s steps(1) infinite; }
  @keyframes car { 50% { opacity: 0; } }
  .b-big .btn { background: #4CAF50; color: #fff; font-size: 3.4cqi; padding: 1.8cqi 3cqi; border-radius: .7cqi; }
  .b-big .hint { margin-top: 2.4cqi; font-size: 2.6cqi; color: #888; }
</style></head>
<body><div class="b b-big">
  <div class="wrap">
    <div class="word">Largest Number Game</div>
    <div class="row"><div class="in"><span id="n">99999999999999999999999999999999</span></div><div class="btn">Submit</div></div>
    <div class="hint">try to enter the largest number possible</div>
  </div>
</div>
<script>
const n = document.getElementById('n');
if (LIVE) setInterval(() => { n.textContent += '9'; if (n.textContent.length > 200) n.textContent = '9'.repeat(32); }, 160);
</script></body></html>
