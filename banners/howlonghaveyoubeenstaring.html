<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@300;400&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── How Long Have You Been Staring?: quiet paper, Instrument Serif + a DM Mono timer ── */
  .b-stare { background: #f5f2eb; color: #1a1814; grid-template-columns: 1fr auto; padding: 0 6cqi; gap: 4cqi; }
  .b-stare .q { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 8.6cqi; line-height: .98; letter-spacing: -.1cqi; }
  .b-stare .t { text-align: right; font-family: 'DM Mono', monospace; }
  .b-stare .num { font-weight: 300; font-size: 15cqi; letter-spacing: -.8cqi; line-height: 1; font-variant-numeric: tabular-nums; }
  .b-stare .unit { font-size: 1.9cqi; letter-spacing: .7cqi; color: #9a9488; margin-top: 1.6cqi; text-transform: uppercase; }
  .b-stare .dot { position: absolute; bottom: 4cqi; left: 50%; width: .8cqi; height: .8cqi; border-radius: 50%; background: #ccc8be; animation: bl 3s ease-in-out infinite; }
  @keyframes bl { 50% { opacity: .15; } }
</style></head>
<body><div class="b b-stare">
  <div class="q">How Long<br>Have You Been<br>Staring?</div>
  <div class="t"><div class="num" id="n">0:47</div><div class="unit">seconds. still here.</div></div>
  <div class="dot"></div>
</div>
<script>
let sec = 47; const n = document.getElementById('n');
if (LIVE) setInterval(() => { sec++; n.textContent = Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }, 1000);
</script></body></html>
