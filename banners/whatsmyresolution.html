<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── What's My Resolution?: subpixels + a live dimension readout ── */
  .b-res { background-color: #0b0c10; color: #fff8ef; font-family: 'Arial Black', 'Segoe UI', sans-serif;
    background-image: linear-gradient(90deg, rgba(255,60,60,.13) 0 .55cqi, rgba(60,255,90,.11) .55cqi 1.1cqi, rgba(70,120,255,.15) 1.1cqi 1.65cqi, transparent 1.65cqi),
      linear-gradient(rgba(0,0,0,.9) 0 .3cqi, transparent .3cqi);
    background-size: 2cqi 2cqi; }
  .b-res .stack { position: relative; text-align: center; }
  .b-res .word { font-size: 8.6cqi; line-height: 1.02; letter-spacing: -.1cqi; }
  .b-res .dim { display: flex; align-items: center; gap: 2cqi; margin: 2.6cqi auto 0; width: 80cqi; color: #f7c948; }
  .b-res .dim i { flex: 1; height: .3cqi; background: #f7c948; position: relative; }
  .b-res .dim i::before { content: ''; position: absolute; top: -1.2cqi; width: 0; height: 0; border: 1.35cqi solid transparent; }
  .b-res .dim i:first-child::before { left: -1.6cqi; border-right: 2cqi solid #f7c948; border-left: 0; }
  .b-res .dim i:last-child::before { right: -1.6cqi; border-left: 2cqi solid #f7c948; border-right: 0; }
  .b-res .dim i::after { content: ''; position: absolute; top: -2cqi; width: .3cqi; height: 4.3cqi; background: #f7c948; }
  .b-res .dim i:first-child::after { left: -1.8cqi; } .b-res .dim i:last-child::after { right: -1.8cqi; }
  .b-res .dim b { font: italic 400 4.6cqi/1 Georgia, 'Times New Roman', serif; white-space: nowrap; min-width: 24cqi; }
</style></head>
<body><div class="b b-res">
  <div class="stack">
    <div class="word">What's My<br>Resolution?</div>
    <div class="dim"><i></i><b id="px">800 × 300</b><i></i></div>
  </div>
</div>
<script>
const sizes = ['800 × 300', '1920 × 1080', '390 × 844', '2560 × 1440', '1366 × 768'];
let k = 0;
if (LIVE) setInterval(() => { k = (k + 1) % sizes.length; document.getElementById('px').textContent = sizes[k]; }, 900);
</script></body></html>
