<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Cormorant+Garamond:wght@500&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Museum of Bad Art: gilt frame, a dreadful painting, IM Fell placard ── */
  .b-moba { background: radial-gradient(ellipse at 30% 0%, #fbf7ef, #f5f0e8 55%, #e8e0d0); font-family: 'IM Fell English', Georgia, serif; color: #1a1612;
    grid-template-columns: auto 1fr; gap: 6cqi; padding: 0 6cqi 0 8cqi; }
  .b-moba::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 4cqi; background: #3a322a; border-top: .5cqi solid #8b6914; }
  .b-moba .frame { position: relative; padding: 2cqi; background: linear-gradient(135deg, #2a1f14, #4a3728 40%, #2a1f14);
    box-shadow: 0 1.6cqi 2.4cqi rgba(26,22,18,.35), inset 0 0 0 .6cqi #8b6914; margin-top: -3cqi; transform: rotate(-1.5deg); }
  .b-moba .mat { padding: 1.8cqi; background: #e8e0d0; }
  .b-moba svg { display: block; width: 24cqi; height: 18cqi; }
  .b-moba .blob { animation: wob 2.8s ease-in-out infinite; transform-origin: 50% 50%; transform-box: fill-box; }
  .b-moba .blob.b2 { animation-delay: -1s; } .b-moba .blob.b3 { animation-delay: -1.8s; }
  @keyframes wob { 50% { transform: rotate(8deg) scale(1.08, .94); } }
  .b-moba .placard { margin-top: -3cqi; }
  .b-moba h1 { margin: 0; font-weight: 400; font-size: 9cqi; line-height: .98; }
  .b-moba h1 i { color: #7a3b1e; }
  .b-moba .rule { width: 12cqi; height: .3cqi; background: #8b6914; margin: 2.2cqi 0 1.6cqi; }
  .b-moba .desc { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 3cqi; font-style: italic; color: #3a322a; }
</style></head>
<body><div class="b b-moba">
  <div class="frame"><div class="mat">
    <svg viewBox="0 0 240 180">
      <rect width="240" height="180" fill="#ffe082"/>
      <path class="blob" d="M30 40 C 70 10, 120 70, 90 110 S 10 120, 30 40z" fill="#ff7043"/>
      <path class="blob b2" d="M140 30 C 200 20, 230 90, 190 120 S 120 90, 140 30z" fill="#4fc3f7"/>
      <circle class="blob b3" cx="150" cy="140" r="26" fill="#9c6ade"/>
      <path d="M10 160 Q 60 120 110 158 T 230 140" stroke="#2e7d32" stroke-width="9" fill="none" stroke-linecap="round"/>
      <path d="M60 60 l40 50 M100 40 l-30 70" stroke="#1a1612" stroke-width="4"/>
      <circle cx="200" cy="60" r="7" fill="#ffee58" stroke="#1a1612" stroke-width="3"/>
    </svg>
  </div></div>
  <div class="placard">
    <h1>Museum<br>of <i>Bad Art</i></h1>
    <div class="rule"></div>
    <div class="desc">“Untitled No. 4,117” — oil on regret</div>
  </div>
</div></body></html>
