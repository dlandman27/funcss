<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Sumo Cars: dohyo from above, two cars shoving ─────────── */
  .b-sumo { background: #c9a06a; font-family: 'Dela Gothic One', 'Arial Black', sans-serif; color: #201a17; }
  .b-sumo::before { content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 50%, #e8cf98 0 31cqi, transparent 31.2cqi); }
  .b-sumo .ring { position: absolute; left: 50%; top: 50%; width: 56cqi; height: 56cqi; margin: -28cqi; border-radius: 50%;
    border: 1.6cqi solid #f2e6c8; box-shadow: 0 0 0 .5cqi #a77a44, inset 0 0 0 .5cqi #a77a44; }
  .b-sumo .lines { position: absolute; left: 50%; top: 50%; width: 10cqi; height: 3cqi; margin: -1.5cqi 0 0 -5cqi;
    border-left: .8cqi solid #fff8ef; border-right: .8cqi solid #fff8ef; opacity: .9; }
  .b-sumo h1 { position: relative; margin: 0; font-weight: 400; font-size: 10cqi; line-height: 1; letter-spacing: .4cqi; white-space: nowrap;
    color: #201a17; text-shadow: .5cqi .5cqi 0 #fff8ef; transform: translateY(-4cqi); }
  .b-sumo .cars { position: absolute; left: 50%; top: 72%; animation: shove 1.6s ease-in-out infinite; }
  @keyframes shove { 0%, 100% { transform: translateX(-2cqi); } 50% { transform: translateX(2.5cqi); } }
  .b-sumo .car { position: absolute; top: -3.8cqi; width: 13cqi; height: 7.6cqi; border-radius: 1.4cqi; border: .5cqi solid #201a17; }
  .b-sumo .car::after { content: ''; position: absolute; top: .9cqi; bottom: .9cqi; width: 3.4cqi; border-radius: .6cqi; background: rgba(32,26,23,.55); }
  .b-sumo .car.l { right: 0; background: #f0563e; } .b-sumo .car.l::after { right: 2cqi; }
  .b-sumo .car.r { left: 0; background: #5aa0db; } .b-sumo .car.r::after { left: 2cqi; }
  .b-sumo .dust { position: absolute; left: -1cqi; top: -5cqi; width: 2cqi; height: 10cqi; background: radial-gradient(#fff8ef 30%, transparent 70%); opacity: .7; }
</style></head>
<body><div class="b b-sumo">
  <div class="ring"></div>
  <div class="lines"></div>
  <h1>SUMO CARS</h1>
  <div class="cars"><div class="car l"></div><div class="car r"></div><div class="dust"></div></div>
</div></body></html>
