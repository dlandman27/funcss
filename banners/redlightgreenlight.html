<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Red Light, Green Light: freeze when the light turns ───── */
  .b-rlgl { background: linear-gradient(180deg, #f6f1e7 0 72%, #e6dcc6 72%); font-family: 'Bungee', sans-serif; place-items: center end; }
  .b-rlgl .finish { position: absolute; right: 0; left: 0; top: 72%; height: 1.4cqi; background: repeating-linear-gradient(90deg, #201a17 0 1.4cqi, #fff8ef 1.4cqi 2.8cqi); opacity: .85; }
  .b-rlgl .light { position: absolute; left: 7cqi; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 2cqi; padding: 2.4cqi; background: #201a17; border-radius: 6cqi; box-shadow: 1cqi 1cqi 0 rgba(32,26,23,.25); }
  .b-rlgl .light i { display: block; width: 12cqi; height: 12cqi; border-radius: 50%; }
  .b-rlgl .red { background: #f0563e; box-shadow: 0 0 3cqi #f0563e; animation: red 4s steps(1) infinite; }
  .b-rlgl .green { background: #1d3b37; animation: green 4s steps(1) infinite; }
  @keyframes red { 50% { background: #4a1e17; box-shadow: none; } }
  @keyframes green { 50% { background: #2fd08a; box-shadow: 0 0 3cqi #2fd08a; } }
  .b-rlgl .word { position: relative; padding-right: 6cqi; text-align: right; font-size: 8.6cqi; line-height: 1.05; }
  .b-rlgl .word .r { color: #e2402a; } .b-rlgl .word .g { color: #1e8a80; }
</style></head>
<body><div class="b b-rlgl">
  <div class="finish"></div>
  <div class="light"><i class="red"></i><i class="green"></i></div>
  <div class="word"><span class="r">Red Light,</span><br><span class="g">Green Light</span></div>
</div></body></html>
