<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Welcome Back: a manila time card, freshly stamped ──────── */
  .b-wb { background: #efdcae; color: #201a17; font-family: 'Courier New', Courier, monospace;
    background-image: repeating-linear-gradient(transparent 0 5.4cqi, rgba(90,160,219,.45) 5.4cqi 5.55cqi);
    background-position: 0 1.4cqi; }
  .b-wb::before { content: ''; position: absolute; top: 0; bottom: 0; left: 13cqi; width: .25cqi; background: rgba(240,86,62,.6); }
  .b-wb .ledger { position: absolute; left: 16cqi; top: 4.2cqi; font-size: 2.4cqi; line-height: 5.55cqi; color: rgba(32,26,23,.55); white-space: pre; }
  .b-wb .hdr { position: absolute; left: 3cqi; top: 3.4cqi; font: 900 2.2cqi/1.2 'Arial Black', Arial, sans-serif; letter-spacing: .2cqi; color: rgba(32,26,23,.6); writing-mode: vertical-rl; transform: rotate(180deg); height: 30cqi; text-align: center; }
  .b-wb .punches { position: absolute; right: 4cqi; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; gap: 1.8cqi; }
  .b-wb .punches i { width: 3cqi; height: 3cqi; border-radius: 50%; border: .3cqi solid #201a17; }
  .b-wb .punches i.hit { background: #201a17; box-shadow: inset 0 0 0 .4cqi #efdcae; }
  .b-wb .stamp { position: relative; margin-left: 24cqi; white-space: nowrap; transform: rotate(-6deg); padding: 1.4cqi 3.6cqi; border: .9cqi solid rgba(240,86,62,.88);
    border-radius: 1.6cqi; color: rgba(240,86,62,.88); font: 900 6.6cqi/1 'Arial Black', Arial, sans-serif; text-transform: uppercase;
    letter-spacing: .2cqi; mix-blend-mode: multiply; animation: thunk 2.8s ease-in infinite;
    -webkit-mask-image: radial-gradient(circle at 20% 30%, transparent 0 .4cqi, #000 .5cqi), repeating-linear-gradient(78deg, #000 0 2.2cqi, rgba(0,0,0,.72) 2.2cqi 2.5cqi);
    -webkit-mask-composite: source-in; mask-composite: intersect; }
  .b-wb .stamp small { display: block; text-align: center; font: italic 700 2.8cqi/1.4 Georgia, serif; text-transform: none; letter-spacing: 0; }
  @keyframes thunk { 0%, 70% { transform: rotate(-6deg) scale(1); } 80% { transform: rotate(-6deg) scale(1.18); opacity: .6; } 88% { transform: rotate(-6deg) scale(.97); opacity: 1; } 100% { transform: rotate(-6deg) scale(1); } }
</style></head>
<body><div class="b b-wb">
  <div class="ledger">MON  09:14
TUE  14:02
THU  22:47
SUN  08:20</div>
  <div class="stamp">Welcome Back<small>gone 3 days, 11 hours</small></div>
</div></body></html>
