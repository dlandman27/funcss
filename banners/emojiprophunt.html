<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Prop Hunt: a WANTED poster pinned over a field of decoys ── */
  .b-prop { background: #fff8ef; color: #201a17; font-family: 'Arial Black', Arial, sans-serif; }
  .b-prop svg.field { position: absolute; inset: 0; width: 100%; height: 100%; }
  .b-prop .poster { position: relative; background: #fff8ef; border: .35cqi solid #201a17; border-radius: 1.2cqi;
    box-shadow: .8cqi .8cqi 0 #201a17; transform: rotate(-2deg); padding: 1.6cqi 4.5cqi 2.2cqi; text-align: center; }
  .b-prop .wanted { font-size: 2.6cqi; letter-spacing: .9cqi; border-bottom: .3cqi solid #201a17; padding-bottom: .8cqi; margin-bottom: 1.2cqi; }
  .b-prop .word { font-size: 9.5cqi; line-height: 1; letter-spacing: -.02em; }
  .b-prop .target { transform-origin: center; transform-box: fill-box; animation: wob 1.6s ease-in-out infinite; }
  @keyframes wob { 0%, 70%, 100% { transform: rotate(0); } 78% { transform: rotate(-12deg); } 86% { transform: rotate(10deg); } 94% { transform: rotate(-5deg); } }
</style></head>
<body><div class="b b-prop">
  <svg class="field" viewBox="0 0 800 300" id="field"></svg>
  <div class="poster"><div class="wanted">WANTED</div><div class="word">Prop Hunt</div></div>
</div>
<script>
const NS = 'http://www.w3.org/2000/svg', field = document.getElementById('field');
const SH = {
  star: 'M0,-1 L.24,-.33 .95,-.31 .38,.12 .59,.81 0,.4 -.59,.81 -.38,.12 -.95,-.31 -.24,-.33Z',
  heart: 'M0,.85 C-.9,.2 -1,-.35 -.6,-.68 -.3,-.92 0,-.7 0,-.45 0,-.7 .3,-.92 .6,-.68 1,-.35 .9,.2 0,.85Z',
  fish: 'M-.8,0 C-.4,-.55 .3,-.55 .55,0 L.95,-.4 .95,.4 .55,0 C.3,.55 -.4,.55 -.8,0Z',
  drop: 'M0,-.95 C.45,-.3 .7,.1 .7,.35 .7,.75 .35,.95 0,.95 -.35,.95 -.7,.75 -.7,.35 -.7,.1 -.45,-.3 0,-.95Z',
  bolt: 'M.15,-1 L-.55,.12 -.05,.12 -.2,1 .55,-.18 .05,-.18Z',
};
const COLORS = ['#f7c948', '#b7ce3c', '#f0563e', '#ff7fa5', '#f47b28', '#a98fd0', '#5aa0db', '#2fb0a3'];
const names = Object.keys(SH);
const spots = [[60,60],[150,215],[95,140],[700,70],[640,230],[745,165],[30,250],[225,55],[575,40],[560,265],[255,255],[690,280],[770,40],[22,125],[180,120],[625,145]];
spots.forEach(([x, y], i) => {
  const n = names[i % names.length], s = 22 + (i * 7) % 12, r = (i * 37) % 60 - 30, c = COLORS[i % COLORS.length];
  const g = document.createElementNS(NS, 'g');
  g.setAttribute('transform', `translate(${x} ${y}) rotate(${r}) scale(${s})`);
  g.innerHTML = `<path d="${SH[n]}" transform="translate(.1 .1)" fill="#201a17"/><path d="${SH[n]}" fill="${c}" stroke="#201a17" stroke-width="${2.6 / s}" stroke-linejoin="round"/>`;
  if (i === 4) { const w = document.createElementNS(NS, 'g'); w.setAttribute('class', 'target'); w.appendChild(g); field.appendChild(w); }
  else field.appendChild(g);
});
</script></body></html>
