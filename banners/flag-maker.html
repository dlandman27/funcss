<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Flag Maker: a flag on a pole that keeps getting remixed ── */
  .b-flag { background: #e9f1f8; color: #1b2a3a; font-family: 'Bebas Neue', Impact, sans-serif; place-items: center start; }
  .b-flag .word { position: relative; padding-left: 7cqi; font-size: 15cqi; line-height: .86; letter-spacing: .01em; }
  .b-flag .word small { display: block; font-family: Arial, sans-serif; font-size: 2.3cqi; letter-spacing: .1em; color: #5d7286; margin-top: 2cqi; line-height: 1; }
  .b-flag svg { position: absolute; right: 5cqi; top: 5cqi; width: 48cqi; height: 29.5cqi; }
  .b-flag .s1 { animation: s1 4.5s steps(1) infinite; } .b-flag .s2 { animation: s2 4.5s steps(1) infinite; }
  .b-flag .s3 { animation: s3 4.5s steps(1) infinite; } .b-flag .cn { animation: cn 4.5s steps(1) infinite; }
  @keyframes s1 { 0% { fill: #CE1126; } 33% { fill: #008751; } 66% { fill: #F77F00; } }
  @keyframes s2 { 0% { fill: #FFFFFF; } 33% { fill: #FFFFFF; } 66% { fill: #FFFFFF; } }
  @keyframes s3 { 0% { fill: #CE1126; } 33% { fill: #008751; } 66% { fill: #009E60; } }
  @keyframes cn { 0% { fill: #002868; } 33% { fill: #FCD116; } 66% { fill: #ED2939; } }
</style></head>
<body><div class="b b-flag">
  <div class="word">Flag<br>Maker<small>STRIPES · CANTON · STARS</small></div>
  <svg viewBox="0 0 400 248">
    <defs>
      <clipPath id="wave"><path d="M20 20 C90 4 150 36 230 20 S350 4 392 18 L392 186 C340 172 300 204 230 190 S90 172 20 188 Z"/></clipPath>
      <linearGradient id="shade" x1="0" x2="1">
        <stop offset="0" stop-color="#000" stop-opacity=".0"/><stop offset=".22" stop-color="#fff" stop-opacity=".18"/>
        <stop offset=".45" stop-color="#000" stop-opacity=".12"/><stop offset=".7" stop-color="#fff" stop-opacity=".15"/>
        <stop offset="1" stop-color="#000" stop-opacity=".12"/></linearGradient>
    </defs>
    <rect x="10" y="6" width="7" height="242" rx="3" fill="#7b6a58"/><circle cx="13.5" cy="7" r="7" fill="#d9a400"/>
    <g clip-path="url(#wave)">
      <rect class="s1" x="20" y="0" width="380" height="72" fill="#CE1126"/>
      <rect class="s2" x="20" y="72" width="380" height="60" fill="#FFFFFF"/>
      <rect class="s3" x="20" y="132" width="380" height="80" fill="#CE1126"/>
      <rect class="cn" x="20" y="0" width="150" height="120" fill="#002868"/>
      <g fill="#fff" id="stars"></g>
      <rect x="20" y="0" width="380" height="212" fill="url(#shade)"/>
    </g>
  </svg>
</div>
<script>
const st = document.getElementById('stars'), P = 'M0,-1 L.24,-.33 .95,-.31 .38,.12 .59,.81 0,.4 -.59,.81 -.38,.12 -.95,-.31 -.24,-.33Z';
for (let r = 0; r < 3; r++) for (let c = 0; c < 4; c++)
  st.insertAdjacentHTML('beforeend', `<path d="${P}" transform="translate(${50 + c * 30 + (r % 2) * 15} ${40 + r * 26}) scale(8)"/>`);
</script></body></html>
