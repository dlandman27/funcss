<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Hello: one word, and every other way to say it ────────── */
  .b-hi { background: #5aa0db; color: #fff8ef; font-family: 'DM Serif Display', Georgia, serif; }
  .b-hi .word { position: relative; font-size: 17cqi; line-height: 1; margin-top: -4cqi; }
  .b-hi .strip { position: absolute; left: 0; right: 0; bottom: 5cqi; overflow: hidden; white-space: nowrap; font-size: 3.6cqi; color: rgba(255,248,239,.7);
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent); }
  .b-hi .strip div { display: inline-block; animation: slide 14s linear infinite; }
  .b-hi .strip span { margin: 0 2cqi; }
  @keyframes slide { from { transform: translateX(-2%); } to { transform: translateX(-52%); } }
</style></head>
<body><div class="b b-hi">
  <div class="word">Hello</div>
  <div class="strip"><div id="s"></div></div>
</div>
<script>
const W = ['Hola', 'Bonjour', 'Ciao', 'Olá', 'Hallo', 'Привет', 'Merhaba', '你好', 'こんにちは', 'Jambo', 'Hej', 'Sawubona', 'Aloha'];
document.getElementById('s').innerHTML = [...W, ...W].map(w => `<span>${w}</span>`).join('·');
</script></body></html>
