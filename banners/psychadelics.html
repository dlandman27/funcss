<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Psychedelic Waves: a live reaction-diffusion culture ──── */
  .b-psy { background: #201a17; font-family: Georgia, 'Times New Roman', serif; }
  .b-psy canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .b-psy .word { position: relative; padding: 1.8cqi 5.5cqi 2.4cqi; border-radius: 999px; background: rgba(32, 26, 23, .86); border: .3cqi solid #201a17; box-shadow: .5cqi .5cqi 0 #201a17;
    color: #fff8ef; font-style: italic; font-size: 8.4cqi; white-space: nowrap; }
</style></head>
<body><div class="b b-psy">
  <canvas id="c" width="160" height="60"></canvas>
  <div class="word">Psychedelic Waves</div>
</div>
<script>
const W = 160, H = 60, c = document.getElementById('c'), g = c.getContext('2d'), img = g.createImageData(W, H);
const STOPS = [[0, 0x20, 0x1a, 0x17], [.3, 0xa9, 0x8f, 0xd0], [.5, 0x5a, 0xa0, 0xdb], [.65, 0xf0, 0x56, 0x3e], [.78, 0xf4, 0x7b, 0x28], [.9, 0xf7, 0xc9, 0x48], [1, 0xff, 0xf8, 0xef]];
const LUT = [];
for (let i = 0; i < 256; i++) { const t = i / 255; let s = 0; while (s < STOPS.length - 2 && t > STOPS[s + 1][0]) s++;
  const a = STOPS[s], b = STOPS[s + 1], u = (t - a[0]) / (b[0] - a[0]); LUT.push([a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u, a[3] + (b[3] - a[3]) * u]); }
let A = new Float32Array(W * H).fill(1), B = new Float32Array(W * H), A2 = new Float32Array(W * H), B2 = new Float32Array(W * H);
for (let s = 0; s < 70; s++) { const x0 = Math.random() * W | 0, y0 = Math.random() * H | 0;
  for (let y = -2; y <= 2; y++) for (let x = -2; x <= 2; x++) B[((y0 + y + H) % H) * W + (x0 + x + W) % W] = 1; }
const f = .03, k = .057;
function step() {
  for (let y = 0; y < H; y++) { const yu = ((y + H - 1) % H) * W, yd = ((y + 1) % H) * W, yc = y * W;
    for (let x = 0; x < W; x++) { const xl = (x + W - 1) % W, xr = (x + 1) % W, i = yc + x;
      const la = .2 * (A[yc + xl] + A[yc + xr] + A[yu + x] + A[yd + x]) + .05 * (A[yu + xl] + A[yu + xr] + A[yd + xl] + A[yd + xr]) - A[i];
      const lb = .2 * (B[yc + xl] + B[yc + xr] + B[yu + x] + B[yd + x]) + .05 * (B[yu + xl] + B[yu + xr] + B[yd + xl] + B[yd + xr]) - B[i];
      const abb = A[i] * B[i] * B[i];
      A2[i] = Math.min(1, Math.max(0, A[i] + la - abb + f * (1 - A[i])));
      B2[i] = Math.min(1, Math.max(0, B[i] + .5 * lb + abb - (k + f) * B[i])); } }
  [A, A2] = [A2, A]; [B, B2] = [B2, B];
}
function paint() {
  for (let i = 0; i < W * H; i++) { const t = Math.min(255, Math.max(0, (B[i] * 3) * 255 | 0)), p = LUT[t];
    img.data[i * 4] = p[0]; img.data[i * 4 + 1] = p[1]; img.data[i * 4 + 2] = p[2]; img.data[i * 4 + 3] = 255; }
  g.putImageData(img, 0, 0);
}
for (let i = 0; i < 1800; i++) step();
paint();
if (LIVE) (function loop() { for (let i = 0; i < 6; i++) step(); paint(); requestAnimationFrame(loop); })();
</script></body></html>
