<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Pull the Cord: one bulb, one cord, a dark room ────────── */
  .b-cord { background: #191512; font-family: Georgia, 'Times New Roman', serif; place-items: center end; }
  .b-cord .glow { position: absolute; left: 25cqi; top: 20cqi; width: 90cqi; height: 90cqi; margin: -45cqi; border-radius: 50%;
    background: radial-gradient(circle, rgba(247, 201, 72, .34), rgba(247, 201, 72, .08) 35%, transparent 62%); animation: lights 4s infinite; }
  .b-cord .wire { position: absolute; left: 25cqi; top: 0; width: .35cqi; height: 11cqi; margin-left: -.17cqi; background: #3a332c; }
  .b-cord .socket { position: absolute; left: 25cqi; top: 10cqi; width: 4.4cqi; height: 4.2cqi; margin-left: -2.2cqi; background: #3a332c; border-radius: .6cqi .6cqi .2cqi .2cqi; }
  .b-cord .bulb { position: absolute; left: 25cqi; top: 13.6cqi; width: 11cqi; height: 13cqi; margin-left: -5.5cqi; border-radius: 50% 50% 46% 46% / 58% 58% 42% 42%;
    background: radial-gradient(circle at 45% 40%, #fffbe8, #ffe48a 45%, #f7c948); box-shadow: 0 0 4cqi 1cqi rgba(247, 201, 72, .6); animation: bulb 4s infinite; }
  .b-cord .cord { position: absolute; left: 28.2cqi; top: 13cqi; width: .3cqi; height: 18cqi; background: #efe7d8; transform-origin: top; animation: tug 4s infinite; }
  .b-cord .cord::after { content: ''; position: absolute; left: 50%; bottom: -3cqi; width: 1.8cqi; height: 3.2cqi; margin-left: -.9cqi; border-radius: 1cqi; background: #f47b28; }
  @keyframes tug { 0%, 60%, 100% { transform: scaleY(1); } 66% { transform: scaleY(1.25); } 72% { transform: scaleY(1); } }
  @keyframes lights { 0%, 64%, 100% { opacity: 1; } 66%, 90% { opacity: 0; } }
  @keyframes bulb { 0%, 64%, 100% { filter: none; } 66%, 90% { filter: brightness(.25) saturate(.2); box-shadow: none; } }
  .b-cord .word { position: relative; padding-right: 8cqi; text-align: right; font-size: 11cqi; line-height: 1; color: #fff8ef; text-shadow: 0 0 3cqi rgba(247, 201, 72, .25); }
  .b-cord .word small { display: block; margin-top: 2cqi; font-family: 'Arial Black', Arial, sans-serif; font-size: 2.6cqi; letter-spacing: .3em; color: #f7c948; }
</style></head>
<body><div class="b b-cord">
  <div class="glow"></div>
  <div class="wire"></div><div class="socket"></div><div class="bulb"></div><div class="cord"></div>
  <div class="word">Pull<br>the Cord<small>LIGHTS OUT, EVERYWHERE</small></div>
</div></body></html>
