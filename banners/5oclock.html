<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── 5 O'Clock Somewhere: pub-dark wood, a gold beer mug, the site's stroked gold h1 ── */
  .b-five { background: linear-gradient(180deg, #3a2417 0%, #241610 60%, #170e0a 100%);
    font-family: Georgia, serif; color: #fff8ef; grid-template-columns: 30cqi 1fr; padding: 0 6cqi 0 7cqi; }
  .b-five::before { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 13cqi;
    background: linear-gradient(180deg, #5a3a22, #3a2417); border-top: .5cqi solid #170e0a; }
  .b-five .mugwrap { position: relative; width: 24cqi; height: 30cqi; margin-top: 2cqi;
    animation: sway 4s ease-in-out infinite; transform-origin: 50% 100%; }
  @keyframes sway { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
  .b-five .mug { position: absolute; bottom: 0; left: 0; width: 16cqi; height: 22cqi;
    background: linear-gradient(180deg, #f9d976 0%, #f7c948 40%, #e8a92a 100%);
    border: .6cqi solid #201a17; border-radius: 1.4cqi 1.4cqi 2cqi 2cqi;
    box-shadow: 1cqi 1cqi 0 rgba(0,0,0,.4); overflow: hidden; }
  .b-five .mug .shine { position: absolute; top: 2cqi; left: 1.8cqi; width: 2.4cqi; height: 15cqi;
    border-radius: 2cqi; background: rgba(255,255,255,.35); }
  .b-five .bub { position: absolute; bottom: 1cqi; width: 1.4cqi; height: 1.4cqi; border-radius: 50%;
    border: .25cqi solid rgba(32,26,23,.35); background: rgba(255,255,255,.3);
    animation: rise 2.6s linear infinite; }
  @keyframes rise { to { transform: translateY(-17cqi); opacity: 0; } }
  .b-five .handle { position: absolute; bottom: 5cqi; left: 15.4cqi; width: 7cqi; height: 11cqi;
    border: 1.3cqi solid #e8a92a; border-left: none; border-radius: 0 3.4cqi 3.4cqi 0; filter: drop-shadow(.3cqi 0 0 #201a17) drop-shadow(0 .3cqi 0 #201a17) drop-shadow(0 -.3cqi 0 #201a17); }
  .b-five .foam { position: absolute; bottom: 20.4cqi; left: -1cqi; display: flex; }
  .b-five .foam i { width: 5cqi; height: 5cqi; margin-right: -1.2cqi; border-radius: 50%;
    background: #fff8ef; border: .5cqi solid #201a17; }
  .b-five .foam i:nth-child(2) { transform: translateY(-1.2cqi); }
  .b-five .foam i:nth-child(4) { transform: translateY(-.6cqi); }
  .b-five .title { position: relative; justify-self: start; margin-top: -3cqi; }
  .b-five h1 { margin: 0; font-family: 'Arial Black', 'Segoe UI', sans-serif; font-weight: 900;
    font-size: 8.6cqi; line-height: 1.02; color: #f7c948; transform: rotate(-1.5deg);
    -webkit-text-stroke: .35cqi #201a17; paint-order: stroke fill; text-shadow: .8cqi .8cqi 0 #120a06; }
  .b-five .tag { margin-top: 2.4cqi; font-size: 3.2cqi; font-style: italic; color: #e9d6b8; }
  .b-five .tag b { font-style: normal; color: #f7c948; font-weight: 400; }
</style></head>
<body><div class="b b-five">
  <div class="mugwrap">
    <div class="handle"></div>
    <div class="mug"><span class="shine"></span><span id="bubs"></span></div>
    <div class="foam"><i></i><i></i><i></i><i></i></div>
  </div>
  <div class="title">
    <h1>5 O'Clock<br>Somewhere</h1>
    <div class="tag">it is <b>17:00</b> right now in Reykjavík</div>
  </div>
</div>
<script>
const bubs = document.getElementById('bubs');
[[3,0],[6.5,-1.1],[10,-.4],[12.5,-1.9],[8,-2.2]].forEach(([x, d]) => { const i = document.createElement('i'); i.className = 'bub';
  i.style.left = x + 'cqi'; i.style.animationDelay = d + 's'; bubs.appendChild(i); });
</script></body></html>
