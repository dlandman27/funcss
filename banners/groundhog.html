<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@96,800&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Groundhog: the same drawing, rebuilt round after round ── */
  .b-hog { background: #fbf7ee; color: #201a17; font-family: 'Bricolage Grotesque', sans-serif; place-items: center end; }
  .b-hog svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .b-hog path { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 11; }
  .b-hog .new { stroke-dasharray: 900; stroke-dashoffset: 0; animation: redraw 3.6s ease-in-out infinite; }
  @keyframes redraw { 0%, 15% { stroke-dashoffset: 0; } 20% { stroke-dashoffset: 900; } 75%, 100% { stroke-dashoffset: 0; } }
  .b-hog .word { position: relative; padding-right: 6cqi; text-align: right; font-size: 10.8cqi; font-weight: 800; line-height: 1; letter-spacing: -.03em; }
  .b-hog .word small { display: flex; justify-content: flex-end; align-items: center; gap: 1.2cqi; margin-top: 1.4cqi; font-size: 2.6cqi;
    font-weight: 800; letter-spacing: .08em; color: #6f665c; }
  .b-hog .word small i { width: 3cqi; height: 3cqi; border-radius: 50%; background: #2fb0a3; box-shadow: 0 0 0 .3cqi #201a17; }
</style></head>
<body><div class="b b-hog">
  <svg viewBox="0 0 800 300"><g transform="translate(14 30) scale(.78)">
    <path stroke="#f0563e" d="M60 220 C90 120 170 90 230 140 S330 240 380 170"/>
    <path stroke="#5aa0db" d="M40 80 C110 40 170 60 160 110 S90 170 140 220 S260 270 300 240"/>
    <path stroke="#f7c948" d="M120 40 L140 260"/>
    <path stroke="#a98fd0" d="M220 60 C260 30 330 60 300 100 S230 130 260 160"/>
    <path stroke="#b7ce3c" d="M30 150 Q120 170 200 150 T360 120"/>
    <path stroke="#ff7fa5" d="M80 270 C140 230 200 250 230 210"/>
    <path class="new" stroke="#2fb0a3" d="M50 120 C80 60 200 20 250 50 S220 200 330 220 S400 120 420 60"/>
  </g></svg>
  <div class="word">Groundhog<small>ROUND 7 · ADD <i></i></small></div>
</div></body></html>
