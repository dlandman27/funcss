<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── The Magic Number 4: plain white, Courier, yellow highlight ── */
  .b-m4 { background: #fff; font-family: "Courier New", monospace; color: #000; place-items: center start; }
  .b-m4 .inner { margin-left: 6cqi; }
  .b-m4 .chain { font-size: 3.6cqi; color: #555; margin-bottom: 3cqi; letter-spacing: .1cqi; }
  .b-m4 .chain b { font-weight: 700; color: #000; padding: 0 .4cqi; animation: hi 4s steps(1) infinite; }
  .b-m4 .chain b:nth-of-type(2) { animation-delay: -3s; } .b-m4 .chain b:nth-of-type(3) { animation-delay: -2s; } .b-m4 .chain b:nth-of-type(4) { animation-delay: -1s; }
  @keyframes hi { 0%, 74% { background: transparent; } 75% { background: #ffff00; } }
  .b-m4 .chain b.four { background: #ffff00; animation: none; }
  .b-m4 .word { font-size: 7.6cqi; font-weight: 700; line-height: 1.05; letter-spacing: -.2cqi; }
  .b-m4 .big4 { position: absolute; right: 6cqi; top: 50%; transform: translateY(-50%); width: 26cqi; height: 26cqi;
    background: #ffff00; display: grid; place-items: center; font-size: 24cqi; font-weight: 700; line-height: 1; border: .5cqi solid #000; }
  .b-m4 .big4 i { font-style: normal; animation: pop 4s ease-in-out infinite; display: block; }
  @keyframes pop { 0%, 80%, 100% { transform: none; } 88% { transform: scale(1.12) rotate(-4deg); } }
</style></head>
<body><div class="b b-m4">
  <div class="inner">
    <div class="chain">seven → <b>five</b> → <b>four</b> → <b class="four">4</b></div>
    <div class="word">The Magic<br>Number 4</div>
  </div>
  <div class="big4"><i>4</i></div>
</div></body></html>
