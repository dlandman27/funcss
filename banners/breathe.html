<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Breathe: calm teal circle, Georgia ────────────────────── */
  .b-breathe { background: #f2ede2; font-family: Georgia, serif; color: #201a17; }
  .b-breathe .orb { position: absolute; width: 46cqi; height: 46cqi; border-radius: 50%;
    background: radial-gradient(circle, rgba(47, 176, 163, .35), rgba(47, 176, 163, .08) 70%);
    animation: breathe 6s ease-in-out infinite;
     }
  @keyframes breathe { 50% { transform: scale(1.25); } }
  .b-breathe .word { position: relative; font-size: 11cqi; letter-spacing: 2.6cqi; font-weight: 400; }
  .b-breathe .word small { display: block; text-align: center; font-size: 3.4cqi; letter-spacing: 1cqi; color: #2fb0a3; margin-top: 1cqi; }

</style></head>
<body><div class="b b-breathe">
      <div class="orb"></div>
      <div class="word">Breathe<small>in · hold · out</small></div>
</div></body></html>
