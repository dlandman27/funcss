<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Visit Counter: a mechanical odometer that only ever says 1 ── */
  .b-visit { background: radial-gradient(ellipse at 50% 30%, #3a3f48, #1d2128 70%); font-family: Georgia, 'Times New Roman', serif; color: #f2ede2; }
  .b-visit .stack { position: relative; text-align: center; }
  .b-visit .word { font-size: 10cqi; line-height: 1; letter-spacing: .3cqi; }
  .b-visit .odo { display: inline-flex; gap: .7cqi; margin-top: 3.4cqi; padding: 1.2cqi; background: #0d0f12; border-radius: .8cqi;
    box-shadow: inset 0 .4cqi 1cqi #000, 0 0 0 .5cqi #8a8f98, 0 0 0 .8cqi #4b5059; }
  .b-visit .d { position: relative; width: 6.2cqi; height: 9cqi; overflow: hidden; border-radius: .4cqi;
    background: linear-gradient(#bbb 0%, #fff 30%, #fff 70%, #bbb 100%);
    font-family: 'Arial Black', Arial, sans-serif; font-size: 7cqi; color: #201a17; }
  .b-visit .d span { display: block; height: 9cqi; line-height: 9cqi; }
  .b-visit .d.last { background: linear-gradient(#c43d2b 0%, #f0563e 30%, #f0563e 70%, #c43d2b 100%); color: #fff8ef; }
  .b-visit .d.last .roll { animation: roll 2.6s cubic-bezier(.6,0,.3,1) infinite; }
  @keyframes roll { 0%, 45% { transform: translateY(0); } 70%, 100% { transform: translateY(-9cqi); } }
  .b-visit .d::after { content: ''; position: absolute; inset: 0; background: linear-gradient(rgba(0,0,0,.35), transparent 30%, transparent 70%, rgba(0,0,0,.35)); }
  .b-visit .cap { margin-top: 2.6cqi; font-size: 2.8cqi; font-style: italic; color: #f7c948; }
</style></head>
<body><div class="b b-visit">
  <div class="stack">
    <div class="word">Visit Counter</div>
    <div class="odo">
      <div class="d"><span>0</span></div><div class="d"><span>0</span></div><div class="d"><span>0</span></div>
      <div class="d"><span>0</span></div><div class="d"><span>0</span></div>
      <div class="d last"><div class="roll"><span>1</span><span>2</span></div></div>
    </div>
    <div class="cap">unique visitors: 1 · that visitor: you</div>
  </div>
</div></body></html>
