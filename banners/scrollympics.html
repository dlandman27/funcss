<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:ital,wght@1,700&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Scrollympics: your scrolling, run on a track ──────────── */
  .b-run { background: #c4512f; font-family: 'Archivo Black', sans-serif; color: #fff; }
  .b-run .lanes { position: absolute; inset: 0; background: repeating-linear-gradient(180deg, transparent 0 56px, rgba(255,255,255,.85) 56px 59px);
    background-position: 0 20px; }
  .b-run .marks { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 196px, rgba(255,255,255,.35) 196px 200px);
    animation: run 1.2s linear infinite; }
  @keyframes run { to { background-position: -200px 0; } }
  .b-run .word { position: relative; text-align: center; transform: skewX(-10deg); }
  .b-run .word .t { display: inline-block; background: #c4512f; padding: 0 3cqi; font-size: 12cqi; line-height: 1.1; text-shadow: .6cqi .6cqi 0 #7a2a14; }
  .b-run .word small { display: block; margin-top: 1.4cqi; font-family: 'Archivo', sans-serif; font-style: italic; font-weight: 700; font-size: 3.6cqi; letter-spacing: .04em; }
  .b-run .word small span { background: #c4512f; padding: 0 1.6cqi; }
</style></head>
<body><div class="b b-run">
  <div class="lanes"></div><div class="marks"></div>
  <div class="word"><span class="t">Scrollympics</span><small><span>42.195 km of thumb</span></small></div>
</div></body></html>
