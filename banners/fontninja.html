<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Font Ninja: words fly, one gets sliced clean in half ──── */
  .b-ninja { background: #141110; color: #fff8ef; font-family: 'Anton', Impact, sans-serif; }
  .b-ninja .fly { position: absolute; color: rgba(255,248,239,.16); white-space: nowrap; }
  .b-ninja .cut { position: relative; font-size: 14cqi; line-height: 1; letter-spacing: .01em; }
  .b-ninja .cut span { display: block; }
  .b-ninja .cut .top { position: absolute; inset: 0; clip-path: polygon(0 0, 100% 0, 100% 34%, 0 66%); transform: translate(-.5cqi, -.35cqi); }
  .b-ninja .cut .bot { clip-path: polygon(0 66%, 100% 34%, 100% 100%, 0 100%); transform: translate(.5cqi, .35cqi); }
  .b-ninja .cut .bot em { font-style: normal; color: #f0563e; }
  .b-ninja .cut .top em { font-style: normal; color: #f0563e; }
  .b-ninja .blade { position: absolute; left: 50%; top: 50%; width: 120cqi; height: .35cqi; margin-left: -60cqi;
    background: linear-gradient(90deg, transparent, #fff 45%, #fff 55%, transparent); transform: rotate(-11deg) translateX(-110cqi); opacity: .9;
    animation: swipe 2.4s cubic-bezier(.6,0,.2,1) infinite; }
  @keyframes swipe { 0%, 55% { transform: rotate(-11deg) translateX(-110cqi); } 75%, 100% { transform: rotate(-11deg) translateX(110cqi); } }
  .b-ninja .tag { position: absolute; right: 4cqi; top: 3.5cqi; font-family: 'Arial Black', Arial, sans-serif; font-size: 2cqi; letter-spacing: .2em;
    color: #141110; background: #f7c948; padding: .6cqi 1.2cqi; transform: rotate(3deg); }
</style></head>
<body><div class="b b-ninja">
  <span class="fly" style="left:5cqi;top:5cqi;font:italic 4cqi Georgia,serif;transform:rotate(-12deg)">ligature</span>
  <span class="fly" style="left:12cqi;bottom:4cqi;font:4.5cqi 'Courier New',monospace;transform:rotate(8deg)">kerning</span>
  <span class="fly" style="right:8cqi;bottom:5cqi;font:5cqi 'Comic Sans MS',cursive;transform:rotate(-6deg)">whoosh</span>
  <span class="fly" style="left:40cqi;top:3cqi;font:3.6cqi Verdana,sans-serif;transform:rotate(5deg)">x-height</span>
  <span class="fly" style="right:30cqi;bottom:2.5cqi;font:italic 3.4cqi 'Times New Roman',serif">serif</span>
  <div class="cut"><span class="bot">Font <em>Ninja</em></span><span class="top">Font <em>Ninja</em></span></div>
  <div class="blade"></div>
  <div class="tag">SLICE: ANTON</div>
</div></body></html>
