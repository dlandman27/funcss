<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Oddly Specific Horoscopes: night sky, Georgia italic, a constellation ── */
  .b-horo { background: radial-gradient(ellipse at 70% 30%, #1d1b38, #0c0d1a 65%); font-family: Georgia, 'Times New Roman', serif; color: #e8e2f8; place-items: center start; }
  .b-horo .star { position: absolute; width: .45cqi; height: .45cqi; border-radius: 50%; background: #cfc8e8; animation: tw 4s ease-in-out infinite; }
  @keyframes tw { 50% { opacity: .2; } }
  .b-horo svg { position: absolute; right: 4cqi; top: 50%; transform: translateY(-50%); width: 34cqi; height: 30cqi; overflow: visible; }
  .b-horo svg line { stroke: rgba(207, 200, 232, .35); stroke-width: 1.4; stroke-dasharray: 3 4; }
  .b-horo svg circle { fill: #f3eeff; filter: drop-shadow(0 0 4px #b8a8ff); }
  .b-horo svg .pin { fill: #f7c948; filter: drop-shadow(0 0 6px #f7c948); animation: pin 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pin { 50% { transform: scale(1.6); } }
  .b-horo .txt { position: relative; padding-left: 6cqi; }
  .b-horo .label { font-size: 2.6cqi; letter-spacing: .9cqi; text-transform: uppercase; color: #8c84ad; margin-bottom: 1.6cqi; }
  .b-horo .word { font-size: 9.4cqi; font-style: italic; line-height: 1.02; text-shadow: 0 0 3cqi rgba(184, 168, 255, .35); }
</style></head>
<body><div class="b b-horo">
  <span id="sky"></span>
  <svg viewBox="0 0 272 240">
    <line x1="20" y1="170" x2="78" y2="118"/><line x1="78" y1="118" x2="140" y2="134"/>
    <line x1="140" y1="134" x2="196" y2="60"/><line x1="196" y1="60" x2="250" y2="92"/>
    <line x1="140" y1="134" x2="170" y2="206"/>
    <circle cx="20" cy="170" r="3"/><circle cx="78" cy="118" r="4"/><circle cx="140" cy="134" r="3.5"/>
    <circle cx="196" cy="60" r="4.5"/><circle cx="250" cy="92" r="3"/>
    <circle class="pin" cx="170" cy="206" r="5"/>
  </svg>
  <div class="txt">
    <div class="label">the stars have reviewed your file</div>
    <div class="word">Oddly Specific<br>Horoscopes</div>
  </div>
</div>
<script>
let s = 7; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
const sky = document.getElementById('sky');
for (let i = 0; i < 70; i++) { const st = document.createElement('i'); st.className = 'star';
  st.style.left = r() * 100 + '%'; st.style.top = r() * 100 + '%'; st.style.opacity = .25 + r() * .6;
  st.style.animationDelay = (-r() * 4) + 's'; if (r() < .2) st.style.transform = 'scale(1.8)'; sky.appendChild(st); }
</script></body></html>
