<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── What to do: dark gradient, glowing title, six-slice wheel ── */
  .b-wtd { background: linear-gradient(135deg, #1a1a1a, #2d2d2d); color: #fff; font-family: 'Segoe UI', Arial, sans-serif; place-items: center start; }
  .b-wtd .word { position: relative; margin-left: 6cqi; font-size: 9.6cqi; font-weight: 700; line-height: 1; letter-spacing: -.2cqi;
    text-shadow: 0 0 1.4cqi rgba(255,255,255,.3); }
  .b-wtd .word small { display: block; margin-top: 2cqi; font-size: 3cqi; font-weight: 400; color: rgba(255,255,255,.6); letter-spacing: .1cqi; }
  .b-wtd .wheel { position: absolute; right: -14cqi; top: 50%; width: 52cqi; height: 52cqi; margin-top: -26cqi;
    filter: drop-shadow(0 0 2cqi rgba(0,0,0,.6)); animation: spin 5s cubic-bezier(.17,.67,.12,.99) infinite; }
  @keyframes spin { to { transform: rotate(720deg); } }
  .b-wtd .pin { position: absolute; right: 36cqi; top: 50%; margin-top: -2cqi; width: 0; height: 0;
    border-top: 2cqi solid transparent; border-bottom: 2cqi solid transparent; border-left: 4cqi solid #ff3333; filter: drop-shadow(0 0 .6cqi rgba(0,0,0,.6)); }
</style></head>
<body><div class="b b-wtd">
  <svg class="wheel" viewBox="-100 -100 200 200">
    <g stroke="#1a1a1a" stroke-width="1.5">
      <path d="M0 0 L100 0 A100 100 0 0 1 50 86.6 Z" fill="#FF6B6B"/>
      <path d="M0 0 L50 86.6 A100 100 0 0 1 -50 86.6 Z" fill="#4ECDC4"/>
      <path d="M0 0 L-50 86.6 A100 100 0 0 1 -100 0 Z" fill="#D4A017"/>
      <path d="M0 0 L-100 0 A100 100 0 0 1 -50 -86.6 Z" fill="#45B7D1"/>
      <path d="M0 0 L-50 -86.6 A100 100 0 0 1 50 -86.6 Z" fill="#96CEB4"/>
      <path d="M0 0 L50 -86.6 A100 100 0 0 1 100 0 Z" fill="#FFEEAD"/>
    </g>
    <circle r="10" fill="#2d2d2d" stroke="#fff" stroke-width="2"/>
  </svg>
  <div class="pin"></div>
  <div class="word">What to do<small>spin for today's priority</small></div>
</div></body></html>
