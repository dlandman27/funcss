<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Who Said It?: quote card + answers dressed like their sources ── */
  .b-who { background: #f4efe6; color: #1f1b18; font-family: Georgia, 'Times New Roman', serif; grid-template-columns: 47cqi 1fr; gap: 3cqi; padding: 0 4cqi 0 5cqi; }
  .b-who .word { position: relative; font: 900 9cqi/.95 'Arial Black', 'Arial Bold', Arial, sans-serif; letter-spacing: -.2cqi; }
  .b-who .word span { color: #d2483a; }
  .b-who .word small { display: block; margin-top: 2.2cqi; font: italic 400 3cqi/1.3 Georgia, serif; color: #7a7168; letter-spacing: 0; }
  .b-who .side { position: relative; width: 100%; }
  .b-who .quote { position: relative; background: #fffdf8; border: 1px solid #e2d9cb; border-radius: 2cqi; padding: 3.4cqi 3cqi 2.6cqi 4cqi;
    box-shadow: 0 1.2cqi 3cqi rgba(60,40,20,.08); font-size: 3.6cqi; line-height: 1.25; }
  .b-who .quote::before { content: '\201C'; position: absolute; top: -1.4cqi; left: 1.4cqi; font: 700 10cqi/1 Georgia, serif; color: #e2d9cb; }
  .b-who .quote p { position: relative; margin: 0; }
  .b-who .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 1.4cqi; margin-top: 1.8cqi; }
  .b-who .c { border-radius: 1.4cqi; padding: 1.4cqi; text-align: center; font-size: 2.4cqi; box-shadow: 0 .3cqi 0 rgba(0,0,0,.12); }
  .b-who .c1 { background: #ffd9e2; font-family: 'Comic Sans MS', 'Chalkboard SE', cursive; }
  .b-who .c2 { background: #0a66c2; color: #fff; font-family: -apple-system, 'Segoe UI', Arial, sans-serif; font-weight: 700;
    animation: pick 3s ease-in-out infinite; }
  @keyframes pick { 0%, 50% { outline: 0 solid transparent; transform: none; } 60%, 90% { outline: .5cqi solid #2f9e5b; outline-offset: .3cqi; transform: translateY(-.4cqi); } }
</style></head>
<body><div class="b b-who">
  <div class="word">Who Said It<span>?</span><small>a fortune cookie, or a thought leader</small></div>
  <div class="side">
    <div class="quote"><p>Your biggest failure is waiting for you to agree with it.</p></div>
    <div class="choices"><div class="c c1">cat calendar</div><div class="c c2">LinkedIn post</div></div>
  </div>
</div></body></html>
