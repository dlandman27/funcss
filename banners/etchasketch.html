<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Etch A Sketch: red tablet, silver screen, one unbroken line ── */
  .b-etch { background: #d8322a; }
  .b-etch .screen { position: absolute; left: 13cqi; right: 13cqi; top: 4cqi; bottom: 4cqi; border-radius: 2cqi;
    background: linear-gradient(100deg, #d6d9db 0%, #c3c7ca 45%, #aeb2b5 100%);
    box-shadow: inset 0 0 0 .5cqi rgba(32,26,23,.15), inset .8cqi .8cqi 1.6cqi rgba(0,0,0,.18); overflow: hidden; }
  .b-etch svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .b-etch .knob { position: absolute; bottom: 3cqi; width: 8cqi; height: 8cqi; border-radius: 50%;
    background: radial-gradient(circle at 38% 34%, #fffdf8, #e7e0d2 60%, #c9c0ae);
    box-shadow: .3cqi .5cqi 0 rgba(0,0,0,.3); }
  .b-etch .knob::after { content: ''; position: absolute; inset: 1cqi; border-radius: 50%;
    background: repeating-conic-gradient(rgba(32,26,23,0) 0deg 7deg, rgba(32,26,23,.18) 7deg 10deg); }
  .b-etch .knob.l { left: 2.5cqi; } .b-etch .knob.r { right: 2.5cqi; }
  .b-etch .knob.r::after { animation: turn 4.8s linear infinite; }
  @keyframes turn { to { transform: rotate(360deg); } }
  .b-etch .pen { stroke-dasharray: 600; stroke-dashoffset: 0; animation: draw 4.8s linear infinite; }
  @keyframes draw { 0% { stroke-dashoffset: 0; } 50% { stroke-dashoffset: 600; } 100% { stroke-dashoffset: 0; } }
</style></head>
<body><div class="b b-etch">
  <div class="screen">
    <svg viewBox="0 0 592 236">
      <text x="296" y="132" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="64"
        fill="none" stroke="#2a2e32" stroke-width="3.2" stroke-linejoin="round" letter-spacing="0">Etch A Sketch</text>
      <polyline points="22,212 22,180 40,180 40,196 70,196" fill="none" stroke="#2a2e32" stroke-width="2.4"/>
      <polyline class="pen" points="70,196 70,212 140,212 140,188 210,188 210,212 300,212 300,192 380,192 380,212 470,212 470,186 520,186" fill="none" stroke="#2a2e32" stroke-width="2.4"/>
    </svg>
  </div>
  <div class="knob l"></div><div class="knob r"></div>
</div></body></html>
