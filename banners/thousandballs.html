<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── 2,500 Balls: a ball pit, plain mono counter ───────────── */
  .b-balls { background: radial-gradient(120% 100% at 50% 0%, #faf8f4 0%, #f2eee6 100%);
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; color: #2b2723; place-items: start center; }
  .b-balls canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .b-balls h1 { position: relative; margin: 5.5cqi 0 0; font-weight: 700; font-size: 11cqi; letter-spacing: -.4cqi; line-height: 1; }
</style></head>
<body><div class="b b-balls">
  <canvas id="c" width="800" height="300"></canvas>
  <h1>2,500 Balls</h1>
</div>
<script>
const c = document.getElementById('c'), g = c.getContext('2d');
const PAL = ['#ef476f', '#f78c6b', '#ffd166', '#06d6a0', '#118ab2'];
let s = 3; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
const R = 9, balls = [];
for (let row = 0; row < 11; row++) {
  const y = 300 - R - row * R * 1.72;
  for (let x = R + (row % 2) * R; x < 800; x += R * 2) {
    const top = 210 - Math.sin(x / 800 * Math.PI) * 30 + Math.sin(x / 47) * 6;
    if (y < top) continue;
    balls.push({ x: x + (rnd() - .5) * 3, y: y + (rnd() - .5) * 2, c: PAL[(rnd() * 5) | 0], p: rnd() * 6.28 });
  }
}
function draw(t) {
  g.clearRect(0, 0, 800, 300);
  for (const b of balls) {
    const dy = LIVE ? Math.sin(t * 3 + b.p + b.x / 60) * Math.max(0, (300 - b.y) / 60) : 0;
    g.fillStyle = b.c; g.beginPath(); g.arc(b.x, b.y - Math.abs(dy) * 2.2, R - .6, 0, Math.PI * 2); g.fill();
    g.fillStyle = 'rgba(255,255,255,.45)'; g.beginPath(); g.arc(b.x - 3, b.y - Math.abs(dy) * 2.2 - 3, 2.6, 0, Math.PI * 2); g.fill();
  }
}
let t = 0;
(function loop() { draw(t); t += .016; if (LIVE) requestAnimationFrame(loop); })();
</script></body></html>
