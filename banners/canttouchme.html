<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Can't Touch Me: a classic grey OS button on a teal desktop, the pointer never lands ── */
  .b-ctm { background: #008080; font-family: Tahoma, Verdana, 'Segoe UI', sans-serif; color: #000; }
  .b-ctm .dlg { position: relative; background: #c0c0c0; padding: .5cqi; animation: dodge 2.4s ease-in-out infinite;
    box-shadow: inset -.3cqi -.3cqi 0 #000, inset .3cqi .3cqi 0 #fff, inset -.6cqi -.6cqi 0 #808080, inset .6cqi .6cqi 0 #dfdfdf; }
  @keyframes dodge { 0%, 35%, 100% { transform: translate(0, 0); } 45%, 80% { transform: translate(14cqi, 4cqi); } }
  .b-ctm .bar { background: linear-gradient(90deg, #000080, #1084d0); color: #fff; font-weight: 700; font-size: 2.4cqi; padding: .6cqi 1cqi; display: flex; justify-content: space-between; align-items: center; }
  .b-ctm .bar i { width: 2.6cqi; height: 2.2cqi; background: #c0c0c0; font: 700 1.8cqi/2.2cqi Tahoma, sans-serif; color: #000; text-align: center; font-style: normal;
    box-shadow: inset -.2cqi -.2cqi 0 #000, inset .2cqi .2cqi 0 #fff; }
  .b-ctm .body { padding: 3.4cqi 5cqi 3.8cqi; display: grid; place-items: center; }
  .b-ctm .btn { padding: 1.6cqi 4.4cqi 2cqi; font-size: 8cqi; font-weight: 700; letter-spacing: -.1cqi; background: #c0c0c0; position: relative;
    box-shadow: inset -.45cqi -.45cqi 0 #000, inset .45cqi .45cqi 0 #fff, inset -.9cqi -.9cqi 0 #808080, inset .9cqi .9cqi 0 #dfdfdf; }
  .b-ctm .btn::after { content: ''; position: absolute; inset: 1.6cqi; border: .25cqi dotted #000; }
  .b-ctm svg { position: absolute; width: 5cqi; left: 50%; top: 50%; margin: 4cqi 0 0 24cqi; animation: chase 2.4s ease-in-out infinite; }
  @keyframes chase { 0%, 100% { transform: translate(4cqi, 8cqi); } 30% { transform: translate(-6cqi, -1cqi); } 55% { transform: translate(-5cqi, 0); } 80% { transform: translate(6cqi, 6cqi); } }
</style></head>
<body><div class="b b-ctm">
  <div class="dlg"><div class="bar"><span>button.exe</span><i>×</i></div><div class="body"><div class="btn">Can't Touch Me</div></div></div>
  <svg viewBox="0 0 12 19"><path d="M1 1 V16 L4.5 12.6 L7 18 L9.2 17 L6.8 11.8 H11.5z" fill="#fff" stroke="#000" stroke-width="1.1" stroke-linejoin="round"/></svg>
</div></body></html>
