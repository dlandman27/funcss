<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── The Group Trip: the group chat that keeps adding demands ── */
  .b-gt { background: #eef3f4; color: #1d2a2e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; place-items: center start; }
  .b-gt .word { position: relative; padding-left: 6cqi; font-size: 9cqi; font-weight: 800; letter-spacing: -.035em; line-height: .98; }
  .b-gt .word span { color: #0f8b8d; }
  .b-gt .chat { position: absolute; right: 6cqi; top: 50%; transform: translateY(-50%); width: 42cqi; display: grid; gap: 1.8cqi; font-size: 3.6cqi; line-height: 1.3; }
  .b-gt .msg { display: grid; gap: .3cqi; justify-items: start; }
  .b-gt .who { font-size: 2.3cqi; color: #6b7c80; padding-left: 1.4cqi; }
  .b-gt .bubble { background: #fff; border-radius: 2cqi; padding: 1cqi 1.6cqi; position: relative; box-shadow: 0 .2cqi 0 #dbe4e6; }
  .b-gt .bubble.rule::after { content: ''; display: inline-block; width: 1.3cqi; height: 1.3cqi; border-radius: 50%; background: #c8463b; margin-left: 1cqi; vertical-align: -.1cqi; }
  .b-gt .you { justify-items: end; }
  .b-gt .you .bubble { background: #2f7cf6; color: #fff; }
  .b-gt .typing { display: inline-flex; gap: .6cqi; padding: 1.3cqi 1.8cqi; }
  .b-gt .typing i { width: 1.4cqi; height: 1.4cqi; border-radius: 50%; background: #9aa9ad; animation: bob 1.2s ease-in-out infinite; }
  .b-gt .typing i:nth-child(2) { animation-delay: .15s; } .b-gt .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes bob { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-.8cqi); } }
</style></head>
<body><div class="b b-gt">
  <div class="word">The Group<br><span>Trip</span></div>
  <div class="chat">
    <div class="msg"><div class="who">Sam</div><div class="bubble rule">I’m not flying. Not after last time.</div></div>
    <div class="msg"><div class="who">Dev</div><div class="bubble typing"><i></i><i></i><i></i></div></div>
  </div>
</div></body></html>
