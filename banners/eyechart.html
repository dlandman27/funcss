<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@700&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Eye Chart: Snellen rows shrinking into nosiness ───────── */
  .b-eye { background: #fbfbf8; color: #111; font-family: 'Roboto Slab', Georgia, serif; font-weight: 700; }
  .b-eye .chart { display: grid; justify-items: center; gap: 1.4cqi; }
  .b-eye .row { position: relative; line-height: 1; letter-spacing: .5em; margin-right: -.5em; white-space: nowrap; }
  .b-eye .r1 { font-size: 10.5cqi; letter-spacing: .32em; margin-right: -.32em; }
  .b-eye .r2 { font-size: 4.6cqi; }
  .b-eye .r3 { font-size: 2.7cqi; }
  .b-eye .r4 { font-size: 1.5cqi; letter-spacing: .3em; }
  .b-eye .r5 { font-size: 1cqi; letter-spacing: .3em; }
  .b-eye .acu { position: absolute; font-family: Arial, sans-serif; font-weight: 400; font-size: 1.6cqi; letter-spacing: 0; color: #999; }
  .b-eye .side { position: absolute; top: 0; bottom: 0; display: grid; align-content: center; gap: 1cqi; font-family: Arial, sans-serif;
    font-weight: 400; font-size: 1.7cqi; color: #9a9a95; }
  .b-eye .side.l { left: 6cqi; } .b-eye .side.r { right: 6cqi; text-align: right; }
  .b-eye .bar { position: absolute; left: 5cqi; right: 5cqi; height: .35cqi; }
  .b-eye .red { width: 64cqi; height: .35cqi; background: #d6382f; margin: .2cqi 0; }
  .b-eye .squint { animation: focus 3s ease-in-out infinite; }
  @keyframes focus { 0%, 100% { filter: blur(0); } 50% { filter: blur(.35cqi); } }
</style></head>
<body><div class="b b-eye">
  <div class="chart">
    <div class="row r1">EYE CHART</div>
    <div class="red"></div>
    <div class="row r2">F P T O Z</div>
    <div class="row r3">L P E D C</div>
    <div class="row r4 squint">YOUR EYES ARE FINE THIS IS CURIOSITY NOW</div>
    <div class="row r5 squint">YOU LEANED IN DIDNT YOU</div>
  </div>
</div></body></html>
