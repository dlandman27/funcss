<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Ink Drop: pigment blooming in still water on paper, Georgia italic ── */
  .b-ink { background: #f4f1ea; font-family: Georgia, 'Times New Roman', serif; color: #2b2620; place-items: center start; }
  .b-ink .bloom { position: absolute; border-radius: 50%; filter: blur(1.6cqi); mix-blend-mode: multiply; animation: bloom 7s ease-in-out infinite; }
  @keyframes bloom { 50% { transform: scale(1.18) rotate(14deg); } }
  .b-ink svg { position: absolute; right: 0; top: 0; width: 60cqi; height: 37.5cqi; }
  .b-ink .word { position: relative; padding-left: 7cqi; font-size: 12cqi; font-style: italic; line-height: 1; letter-spacing: -.2cqi; }
  .b-ink .word small { display: block; font-size: 2.8cqi; color: rgba(70, 60, 45, .6); letter-spacing: .2cqi; margin-top: 1.6cqi; }
  .b-ink .drop { position: absolute; left: 74cqi; top: -3cqi; width: 1.8cqi; height: 2.6cqi; background: #26346f; border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%; animation: fall 3.5s ease-in infinite; }
  @keyframes fall { 0% { transform: translateY(0); opacity: 1; } 30% { transform: translateY(16cqi); opacity: 1; } 34%, 100% { transform: translateY(17cqi) scale(2.6, .3); opacity: 0; } }
</style></head>
<body><div class="b b-ink">
  <svg viewBox="0 0 480 300">
    <defs>
      <filter id="curl" x="-30%" y="-30%" width="160%" height="160%"><feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="3" seed="4"/><feDisplacementMap in="SourceGraphic" scale="70"/><feGaussianBlur stdDeviation="3"/></filter>
      <radialGradient id="a"><stop offset="0" stop-color="#26346f" stop-opacity=".9"/><stop offset=".6" stop-color="#26346f" stop-opacity=".35"/><stop offset="1" stop-color="#26346f" stop-opacity="0"/></radialGradient>
      <radialGradient id="b"><stop offset="0" stop-color="#a41f34" stop-opacity=".85"/><stop offset=".6" stop-color="#a41f34" stop-opacity=".3"/><stop offset="1" stop-color="#a41f34" stop-opacity="0"/></radialGradient>
      <radialGradient id="t"><stop offset="0" stop-color="#0f6b66" stop-opacity=".8"/><stop offset=".6" stop-color="#0f6b66" stop-opacity=".3"/><stop offset="1" stop-color="#0f6b66" stop-opacity="0"/></radialGradient>
    </defs>
    <g filter="url(#curl)" style="mix-blend-mode:multiply">
      <circle class="bl" cx="300" cy="155" r="105" fill="url(#a)"/>
      <circle class="bl" cx="200" cy="215" r="75" fill="url(#b)" style="mix-blend-mode:multiply"/>
      <circle class="bl" cx="395" cy="85" r="62" fill="url(#t)" style="mix-blend-mode:multiply"/>
      <circle cx="300" cy="155" r="38" fill="none" stroke="#26346f" stroke-opacity=".45" stroke-width="6"/>
    </g>
  </svg>
  <div class="drop"></div>
  <div class="word">Ink Drop<small>click to drop ink · drag to pour</small></div>
</div>
<style>.b-ink .bl { transform-box: fill-box; transform-origin: center; animation: bloom 7s ease-in-out infinite; } .b-ink .bl:nth-child(2) { animation-delay: -2s; } .b-ink .bl:nth-child(3) { animation-delay: -4s; }</style>
</body></html>
