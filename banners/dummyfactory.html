<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── The Dummy Factory: spotlit plaque, a reroll of parts ──── */
  .b-dum { background: #191c23; font-family: Georgia, 'Times New Roman', serif; color: #e3dcc9; }
  .b-dum::before { content: ''; position: absolute; inset: 0;
    background: radial-gradient(ellipse 60% 75% at 50% 38%, rgba(255,240,210,.11), transparent 65%), radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55)); }
  .b-dum .plaque { position: relative; text-align: center; }
  .b-dum .fac { font-size: 2.6cqi; letter-spacing: 1.4cqi; text-transform: uppercase; color: #8d887b; }
  .b-dum .word { font-size: 9.4cqi; line-height: 1.1; margin-top: .6cqi; }
  .b-dum .name { margin-top: 2cqi; display: inline-block; font-style: italic; font-size: 3.6cqi; color: #c9bfa4; padding: .8cqi 3cqi; border-top: 1px solid rgba(227,220,201,.2); border-bottom: 1px solid rgba(227,220,201,.2); }
  .b-dum .shadow { position: absolute; bottom: 7cqi; width: 36cqi; height: 2.6cqi; border-radius: 50%; background: radial-gradient(ellipse, rgba(0,0,0,.6), transparent 70%); }
</style></head>
<body><div class="b b-dum">
  <div class="shadow"></div>
  <div class="plaque">
    <div class="word">The Dummy Factory</div>
    <div class="name" id="name">a bear-headed helicopter in clown shoes</div>
  </div>
</div>
<script>
const heads = ['bear', 'cactus', 'pumpkin', 'robot', 'owl', 'tomato', 'moai', 'frog'];
const bodies = ['helicopter', 'teapot', 'cello', 'tuxedo', 'snowman', 'rocket', 'sofa'];
const feet = ['clown shoes', 'roller skates', 'flippers', 'high heels', 'hiking boots', 'socks'];
const pick = a => a[Math.random() * a.length | 0];
const name = document.getElementById('name');
if (LIVE) setInterval(() => {
  const h = pick(heads); name.textContent = `a${/^[aeiou]/.test(h) ? 'n' : ''} ${h}-headed ${pick(bodies)} in ${pick(feet)}`;
}, 1300);
</script></body></html>
