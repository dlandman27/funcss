<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Unmotivational Quotes: blue gradient, glowing Comic Sans, glass card ── */
  .b-unmo { background: linear-gradient(45deg, #1a1a1a, #2c3e50 30%, #2980b9 65%, #3498db); font-family: Georgia, serif; color: #fff; }
  .b-unmo .stack { position: relative; text-align: center; }
  .b-unmo .title { font-family: 'Comic Sans MS', 'Comic Sans', 'Chalkboard SE', cursive; font-weight: 700; font-size: 7.4cqi;
    letter-spacing: -.2cqi; line-height: 1; transform: rotate(-2deg);
    text-shadow: 0 0 1.2cqi rgba(255,255,255,.5), 0 0 2.5cqi rgba(255,255,255,.3);
    animation: float 4s ease-in-out infinite; }
  @keyframes float { 50% { transform: rotate(-1deg) translateY(-1.4cqi); } }
  .b-unmo .card { margin: 4cqi auto 0; display: inline-block; padding: 2.2cqi 4.5cqi; border-radius: 2.5cqi;
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); box-shadow: 0 0 2.5cqi rgba(0,0,0,.3);
    font-style: italic; font-size: 3.6cqi; color: rgba(255,255,255,.92); }
</style></head>
<body><div class="b b-unmo">
  <div class="stack">
    <div class="title">Unmotivational Quotes</div>
    <div class="card">“Shoot for the moon. You will miss.”</div>
  </div>
</div></body></html>
