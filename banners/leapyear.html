<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Leap Year Test: a bureau form on ruled paper, typed, with a rubber stamp coming down ── */
  .b-leap { background: #fbf6e9; color: #201a17; font-family: 'Special Elite', 'Courier New', monospace; place-items: center start;
    background-image: repeating-linear-gradient(transparent 0 calc(5cqi - 1px), rgba(90, 160, 219, .28) calc(5cqi - 1px) 5cqi); }
  .b-leap::before { content: ''; position: absolute; left: 4.4cqi; top: 0; bottom: 0; width: 2px; background: rgba(240, 86, 62, .45); }
  .b-leap .form { position: relative; padding-left: 9cqi; }
  .b-leap .dept { font-size: 2.3cqi; letter-spacing: .3cqi; color: #6d625a; text-transform: uppercase; }
  .b-leap .word { font-size: 8.4cqi; line-height: 1.05; margin: .6cqi 0 1.2cqi; }
  .b-leap .line { font-size: 2.8cqi; }
  .b-leap .line u { text-decoration: none; border-bottom: 2px solid #201a17; padding: 0 1.6cqi; font-size: 3.6cqi; }
  .b-leap .stamp { position: absolute; right: 5cqi; top: 52%; margin-top: 0; font-family: 'Arial Black', Arial, sans-serif; font-size: 4cqi; line-height: 1.1;
    text-transform: uppercase; text-align: center; color: #c0392b; border: .8cqi double #c0392b; border-radius: 1.6cqi; padding: 1.6cqi 2.4cqi; transform: rotate(-9deg); opacity: .88;
    animation: thump 2.6s cubic-bezier(.5, 0, .5, 1) infinite; mix-blend-mode: multiply; }
  .b-leap .stamp small { display: block; font-size: 1.8cqi; letter-spacing: .3cqi; }
  @keyframes thump { 0%, 60% { transform: rotate(-9deg); opacity: .88; } 72% { transform: rotate(-12deg) scale(1.5) translateY(-4cqi); opacity: 0; } 86% { transform: rotate(-9deg) scale(.96); opacity: 1; } 100% { transform: rotate(-9deg); opacity: .88; } }
</style></head>
<body><div class="b b-leap">
  <div class="form">
    <div class="dept">leap certification bureau · form LY-366</div>
    <div class="word">Leap Year Test</div>
    <div class="line">year under review: <u>2028</u></div>
  </div>
  <div class="stamp">Certified<br>Leap<small>366 days</small></div>
</div></body></html>
