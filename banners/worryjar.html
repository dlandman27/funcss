<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Worry Jar: a glass jar of folded notes, one more sinking in ── */
  .b-jar { background: radial-gradient(ellipse at 72% 60%, #3a3f55, #23263a 70%); font-family: Georgia, 'Times New Roman', serif; color: #f2ede2;
    place-items: center start; }
  .b-jar .word { position: relative; margin-left: 7cqi; font-size: 12cqi; line-height: 1; }
  .b-jar .word small { display: block; margin-top: 2cqi; font-size: 3cqi; font-style: italic; color: rgba(242,237,226,.6); }
  .b-jar svg { position: absolute; right: 9cqi; top: 4cqi; height: 32cqi; overflow: visible; }
  .b-jar .note { animation: sink 4s ease-in infinite; }
  @keyframes sink { 0% { transform: translate(0, 0) rotate(0); } 70%, 100% { transform: translate(4px, 104px) rotate(24deg); opacity: .9; } }
</style></head>
<body><div class="b b-jar">
  <div class="word">Worry Jar<small>let it go. the jar keeps it.</small></div>
  <svg viewBox="0 0 200 256">
    <!-- the jar -->
    <rect x="52" y="8" width="96" height="22" rx="5" fill="#8a7a64"/>
    <rect x="52" y="8" width="96" height="6" rx="3" fill="#a8977c"/>
    <path d="M58 30 L58 44 Q22 58 22 104 L22 222 Q22 250 50 250 L150 250 Q178 250 178 222 L178 104 Q178 58 142 44 L142 30 Z" fill="rgba(200,220,235,.12)" stroke="rgba(230,240,250,.55)" stroke-width="3"/>
    <!-- settled worries -->
    <g stroke="rgba(32,26,23,.25)" stroke-width="1">
      <rect x="36" y="214" width="34" height="22" rx="2" fill="#f2ede2" transform="rotate(-8 53 225)"/>
      <rect x="70" y="220" width="36" height="20" rx="2" fill="#f7c948" transform="rotate(6 88 230)"/>
      <rect x="108" y="212" width="34" height="24" rx="2" fill="#e8dccb" transform="rotate(-4 125 224)"/>
      <rect x="140" y="218" width="28" height="20" rx="2" fill="#a9c7c2" transform="rotate(10 154 228)"/>
      <rect x="52" y="196" width="32" height="20" rx="2" fill="#e9b7a6" transform="rotate(12 68 206)"/>
      <rect x="92" y="194" width="36" height="22" rx="2" fill="#f2ede2" transform="rotate(-14 110 205)"/>
      <rect x="128" y="192" width="30" height="20" rx="2" fill="#f7c948" transform="rotate(4 143 202)"/>
    </g>
    <!-- the newest one, on its way down -->
    <rect class="note" x="86" y="60" width="32" height="22" rx="2" fill="#fff8ef" stroke="rgba(32,26,23,.25)"/>
    <path d="M40 80 Q34 140 40 210" stroke="rgba(255,255,255,.35)" stroke-width="6" stroke-linecap="round" fill="none"/>
  </svg>
</div></body></html>
