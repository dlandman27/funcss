<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Dead Weight: a heavy cursor sags toward a magnet ──────── */
  .b-dw { background: #dfe6ee; font-family: 'Anton', Impact, sans-serif; color: #1c2230; place-items: center start; }
  .b-dw .word { position: relative; margin-left: 7cqi; font-size: 15cqi; line-height: .9; text-transform: uppercase; letter-spacing: .2cqi; }
  .b-dw .word span { display: inline-block; transform-origin: 0 0; }
  .b-dw .word .sag { transform: translateY(2cqi) rotate(4deg); }
  .b-dw .scene { position: absolute; right: 6cqi; top: 0; width: 40cqi; height: 100%; }
  .b-dw .path { position: absolute; inset: 0; }
  .b-dw .magnet { position: absolute; right: 2cqi; bottom: 4cqi; width: 12cqi; transform: rotate(-30deg); }
  .b-dw .cur { position: absolute; left: 8cqi; top: 15cqi; width: 7cqi; transform-origin: 1cqi 0; filter: drop-shadow(.6cqi 1.4cqi .4cqi rgba(28,34,48,.28));
    animation: sag 2.4s cubic-bezier(.45,0,.25,1) infinite; }
  @keyframes sag { 0%, 100% { transform: translate(0, 0) rotate(-8deg); } 50% { transform: translate(9cqi, 6cqi) rotate(14deg); } }
</style></head>
<body><div class="b b-dw">
  <div class="word"><span>Dead</span><br><span class="sag">Weight</span></div>
  <div class="scene">
    <svg class="path" viewBox="0 0 320 300"><path d="M20 30 C 60 40, 90 100, 110 130" fill="none" stroke="#1c2230" stroke-opacity=".25" stroke-width="3" stroke-dasharray="4 10" stroke-linecap="round"/></svg>
    <svg class="cur" viewBox="0 0 20 28"><path d="M2 2v21l5-5 4 9 3-1-4-9h7z" fill="#1c2230" stroke="#1c2230" stroke-width="1.6" stroke-linejoin="round"/></svg>
    <svg class="magnet" viewBox="0 0 60 60"><path d="M8 4h14v26a8 8 0 0 0 16 0V4h14v26a22 22 0 0 1-44 0z" fill="#e0402f" stroke="#1c2230" stroke-width="3" stroke-linejoin="round"/><path d="M8 4h14v10H8zM38 4h14v10H38z" fill="#e9edf2" stroke="#1c2230" stroke-width="3"/></svg>
  </div>
</div></body></html>
