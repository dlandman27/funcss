<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Country Marble Race: neon track, flag marbles ─────────── */
  .b-mr { background: linear-gradient(135deg, #000 0%, #111 100%); font-family: 'Press Start 2P', monospace; }
  .b-mr .track { position: absolute; left: -2%; right: -2%; height: 9cqi; bottom: 4cqi; transform: rotate(-3deg);
    border-top: .5cqi solid #00ffff; border-bottom: .5cqi solid #ff00ff;
    box-shadow: 0 -.6cqi 2.4cqi rgba(0,255,255,.5), 0 .6cqi 2.4cqi rgba(255,0,255,.5); }
  .b-mr .grid { position: absolute; inset: 0; opacity: .14;
    background-image: linear-gradient(#00ffff 1px, transparent 1px), linear-gradient(90deg, #00ffff 1px, transparent 1px); background-size: 5cqi 5cqi; }
  .b-mr .word { position: relative; text-align: center; font-size: 6.6cqi; line-height: 1.5; color: #fff; margin-top: -8cqi;
    text-shadow: 0 0 1.2cqi rgba(0,255,255,.6), 0 0 2.4cqi rgba(0,255,255,.35), 0 .6cqi 0 #006699; }
  .b-mr .word span { color: #fff; }
  .b-mr .lane { position: absolute; left: 0; right: 0; bottom: 6.6cqi; height: 5.4cqi; transform: rotate(-3deg); }
  .b-mr .m { position: absolute; top: 0; width: 5.4cqi; height: 5.4cqi; border-radius: 50%; overflow: hidden;
    box-shadow: inset -.8cqi -.8cqi 1.2cqi rgba(0,0,0,.45), 0 0 1.6cqi rgba(255,255,255,.3); animation: roll 5s linear infinite; }
  .b-mr .m::after { content: ''; position: absolute; left: 18%; top: 14%; width: 30%; height: 26%; border-radius: 50%; background: rgba(255,255,255,.7); }
  @keyframes roll { to { transform: translateX(20cqi); } }
</style></head>
<body><div class="b b-mr">
  <div class="grid"></div>
  <div class="track"></div>
  <div class="word">COUNTRY<br>MARBLE RACE</div>
  <div class="lane">
    <i class="m" style="left:16%;background:linear-gradient(90deg,#0055a4 33%,#fff 33% 66%,#ef4135 66%)"></i>
    <i class="m" style="left:31%;background:linear-gradient(#000 33%,#dd0000 33% 66%,#ffce00 66%)"></i>
    <i class="m" style="left:41%;background:linear-gradient(90deg,#009246 33%,#fff 33% 66%,#ce2b37 66%)"></i>
    <i class="m" style="left:58%;background:radial-gradient(circle at 50% 50%,#bc002d 30%,#fff 31%)"></i>
    <i class="m" style="left:69%;background:linear-gradient(#ae1c28 33%,#fff 33% 66%,#21468b 66%)"></i>
    <i class="m" style="left:84%;background:linear-gradient(#009c3b,#009c3b);box-shadow:inset 0 0 0 1.2cqi #009c3b, inset 0 0 0 2cqi #ffdf00"></i>
  </div>
</div></body></html>
