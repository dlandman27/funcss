<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Character Counter: the bureau's manila folder, typewritten, stamped with the count ── */
  .b-cc { background: #cdbb93; font-family: 'Special Elite', 'Courier New', monospace; color: #2a2118; }
  .b-cc .folder { position: absolute; left: 5cqi; right: 5cqi; top: 7cqi; bottom: -2cqi; background: #f1dfa9; border-radius: 1cqi 1cqi 0 0;
    box-shadow: 0 -.4cqi 0 rgba(0,0,0,.06), 0 1cqi 2cqi rgba(60,40,10,.25); }
  .b-cc .folder::before { content: 'FORM CC-17'; position: absolute; top: -4.4cqi; left: 5cqi; height: 5cqi; padding: 1.1cqi 3cqi 0;
    background: #f1dfa9; border-radius: 1cqi 1cqi 0 0; font-size: 2cqi; letter-spacing: .2cqi; color: #6a5638; }
  .b-cc .doc { position: relative; margin-top: 4cqi; width: 76cqi; }
  .b-cc h1 { margin: 0; font-weight: 400; font-size: 9.6cqi; line-height: 1; letter-spacing: -.1cqi; }
  .b-cc h1 .cur { display: inline-block; width: .5cqi; height: 8cqi; background: #2a2118; vertical-align: -.6cqi; margin-left: .4cqi; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .b-cc .ruler { margin-top: 1.6cqi; display: flex; gap: 0; font-size: 2.2cqi; color: #8a7350; border-top: .25cqi solid #8a7350; width: 66cqi; padding-top: .6cqi; letter-spacing: 1.85cqi; }
  .b-cc .stamp { position: absolute; right: 0; top: -1cqi; transform: rotate(9deg); border: .55cqi solid #c2412b; color: #c2412b;
    padding: .8cqi 1.8cqi; text-align: center; font-size: 2.6cqi; line-height: 1.1; border-radius: .6cqi; mix-blend-mode: multiply; opacity: .9; }
  .b-cc .stamp b { display: block; font-size: 6cqi; font-weight: 400; }
</style></head>
<body><div class="b b-cc">
  <div class="folder"></div>
  <div class="doc">
    <h1 id="t">Character Counter<span class="cur"></span></h1>
    <div class="ruler">·····|····|····|·</div>
    <div class="stamp">COUNTED<b id="n">17</b>CHARS</div>
  </div>
</div>
<script>
const full = 'Character Counter', t = document.getElementById('t'), n = document.getElementById('n');
if (LIVE) { let i = full.length, wait = 6;
  setInterval(() => { if (wait-- > 0) return; i = i >= full.length ? 0 : i + 1; if (i === full.length) wait = 8;
    t.innerHTML = full.slice(0, i) + '<span class="cur"></span>'; n.textContent = i; }, 120); }
</script></body></html>
