<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Spirograph: gear inside a ring, tracing a rose ────────── */
  .b-spiro { background: #0c0c13; font-family: Georgia, 'Times New Roman', serif; color: #f2ede2; place-items: center end; }
  .b-spiro canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .b-spiro h1 { position: relative; margin: 0 7cqi 0 0; font-weight: 400; font-size: 10.5cqi; letter-spacing: .3cqi; line-height: 1; text-align: right; }
  .b-spiro h1 small { display: block; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 2.5cqi; letter-spacing: .8cqi;
    text-transform: uppercase; color: rgba(242, 237, 226, .45); margin-top: 1.8cqi; }
</style></head>
<body><div class="b b-spiro">
  <canvas id="c" width="800" height="300"></canvas>
  <h1>Spirograph<small>a gear inside a ring</small></h1>
</div>
<script>
const c = document.getElementById('c'), g = c.getContext('2d');
const CX = 165, CY = 150, R = 112, r = 70, d = 58;
const P = (t) => [CX + (R - r) * Math.cos(t) + d * Math.cos((R - r) / r * t), CY + (R - r) * Math.sin(t) - d * Math.sin((R - r) / r * t)];
const TMAX = Math.PI * 2 * 5;
function draw(T) {
  g.clearRect(0, 0, 800, 300);
  g.strokeStyle = 'rgba(255,255,255,.12)'; g.lineWidth = 2; g.beginPath(); g.arc(CX, CY, R, 0, Math.PI * 2); g.stroke();
  g.lineWidth = 1.8; g.beginPath();
  for (let t = 0; t <= T; t += 0.02) { const [x, y] = P(t); t ? g.lineTo(x, y) : g.moveTo(x, y); }
  const grad = g.createLinearGradient(CX - R, 0, CX + R, 0); grad.addColorStop(0, '#ff6fa8'); grad.addColorStop(.5, '#ffd479'); grad.addColorStop(1, '#6fc8ff');
  g.strokeStyle = grad; g.shadowColor = '#ff9fc6'; g.shadowBlur = 4; g.stroke(); g.shadowBlur = 0;
  // gear
  const gx = CX + (R - r) * Math.cos(T), gy = CY + (R - r) * Math.sin(T);
  g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 1.5; g.beginPath(); g.arc(gx, gy, r, 0, Math.PI * 2); g.stroke();
  const [px, py] = P(T); g.beginPath(); g.moveTo(gx, gy); g.lineTo(px, py); g.stroke();
  g.fillStyle = '#ffd479'; g.beginPath(); g.arc(px, py, 4, 0, Math.PI * 2); g.fill();
}
let T = TMAX;
(function loop() { draw(T); T += 0.03; if (T > TMAX * 1.0001) T = 0.01; if (LIVE) requestAnimationFrame(loop); })();
</script></body></html>
