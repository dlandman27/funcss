<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Infinite Tic Tac Toe: a grid that runs off every edge, five in a row ── */
  .b-ttt { background-color: #f2ede2; color: #201a17; font-family: 'Arial Black', Arial, sans-serif;
    background-image: linear-gradient(#cfc5b4 2px, transparent 2px), linear-gradient(90deg, #cfc5b4 2px, transparent 2px); background-size: 10cqi 10cqi; background-position: 4cqi 3.75cqi; }
  .b-ttt .m { position: absolute; width: 10cqi; height: 10cqi; display: grid; place-items: center; font-size: 7cqi; line-height: 1; }
  .b-ttt .x { color: #f0563e; } .b-ttt .o { color: #5aa0db; }
  .b-ttt .new { animation: pop 2.4s ease-in-out infinite; }
  @keyframes pop { 0%, 40% { transform: scale(1); } 50% { transform: scale(1.35); } 60%, 100% { transform: scale(1); } }
  .b-ttt .win { position: absolute; height: 1cqi; background: #f0563e; border-radius: 1cqi; transform-origin: left center; opacity: .85; }
  .b-ttt .plate { position: relative; background: #fff8ef; border: .5cqi solid #201a17; border-radius: 1.6cqi; padding: 2.2cqi 4.4cqi; box-shadow: .8cqi .8cqi 0 #201a17; text-align: center; }
  .b-ttt .word { font-size: 7.6cqi; letter-spacing: -.2cqi; line-height: 1; }
  .b-ttt .sub { font-family: Georgia, serif; font-style: italic; font-weight: 400; font-size: 2.8cqi; margin-top: 1cqi; color: #6d625a; }
</style></head>
<body><div class="b b-ttt">
  <span id="marks"></span>
  <div class="plate"><div class="word">Infinite Tic Tac Toe</div><div class="sub">five in a row. the board does not end.</div></div>
</div>
<script>
const M = [[0,0,'x'],[1,0,'o'],[0,1,'x'],[1,2,'o'],[0,2,'x'],[2,0,'x'],[7,0,'o'],[8,0,'x'],[9,0,'o'],[8,1,'o'],[9,1,'x'],[9,2,'x'],[8,2,'o']];
const host = document.getElementById('marks');
for (const [cx, cy, k] of M) { const e = document.createElement('div'); e.className = 'm ' + k; e.textContent = k === 'x' ? 'X' : 'O';
  e.style.left = (4 + cx * 10) + 'cqi'; e.style.top = (3.75 + cy * 10) + 'cqi'; if (cx === 9 && cy === 2) e.classList.add('new'); host.appendChild(e); }
</script></body></html>
