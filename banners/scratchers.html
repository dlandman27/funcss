<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Scratchers: a lottery ticket with silver foil ─────────── */
  .b-scr { background: #5b3fa8; background-image: radial-gradient(rgba(255,255,255,.08) 2px, transparent 2.5px); background-size: 22px 22px; font-family: 'Luckiest Guy', cursive; }
  .b-scr .ticket { position: relative; display: flex; align-items: center; gap: 3cqi; padding: 2.6cqi 3.4cqi 2.6cqi 4cqi; background: #ff7fa5; border-radius: 1.5cqi; transform: rotate(-2deg);
    box-shadow: 0 1.5cqi 0 rgba(0,0,0,.25), inset 0 0 0 .7cqi #f7c948, inset 0 0 0 1.2cqi #ff7fa5, inset 0 0 0 1.5cqi #201a17; }
  .b-scr .word { font-size: 10cqi; line-height: 1; color: #fff8ef; letter-spacing: .02em; text-shadow: .5cqi .5cqi 0 #201a17, -.2cqi -.2cqi 0 #201a17, .2cqi -.2cqi 0 #201a17, -.2cqi .2cqi 0 #201a17; padding-top: 1cqi; }
  .b-scr .spots { display: flex; gap: 1.6cqi; }
  .b-scr .spot { position: relative; width: 10cqi; height: 10cqi; border-radius: 50%; background: #fff8ef; border: .4cqi solid #201a17; display: grid; place-items: center; overflow: hidden;
    font-size: 5cqi; color: #2fb0a3; padding-top: .8cqi; }
  .b-scr .foil { position: absolute; inset: 0; background: repeating-linear-gradient(115deg, #c9ccd1 0 .5cqi, #e9ebee .5cqi 1cqi, #aeb2b8 1cqi 1.4cqi); }
  .b-scr .s2 .foil { clip-path: polygon(0 0, 100% 0, 100% 30%, 20% 75%, 0 60%); }
  .b-scr .s3 .foil { animation: scratch 3.6s ease-in-out infinite; }
  @keyframes scratch { 0%, 15% { clip-path: inset(0 0 0 0); } 60%, 90% { clip-path: inset(0 0 0 100%); } 100% { clip-path: inset(0 0 0 0); } }
</style></head>
<body><div class="b b-scr">
  <div class="ticket">
    <div class="word">Scratchers</div>
    <div class="spots">
      <div class="spot s2">$5<div class="foil"></div></div>
      <div class="spot s3">$5<div class="foil"></div></div>
    </div>
  </div>
</div></body></html>
