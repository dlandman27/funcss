<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@800&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Colorle: Wordle board where the tiles are paint mixes ─── */
  .b-cle { background: #ffffff; font-family: 'Libre Franklin', 'Helvetica Neue', Arial, sans-serif; }
  .b-cle .board { display: grid; gap: 1.6cqi; }
  .b-cle .row { display: flex; gap: 1.2cqi; justify-content: center; }
  .b-cle .row i { width: 4.2cqi; height: 4.2cqi; border: .3cqi solid #d3d6da; }
  .b-cle .row.done i { border: 0; }
  .b-cle .tiles { display: flex; gap: 1.2cqi; }
  .b-cle .tiles span { width: 11cqi; height: 11cqi; display: grid; place-items: center; color: #fff; font-size: 7.6cqi; line-height: 1;
    text-shadow: 0 .3cqi 0 rgba(0,0,0,.18); animation: flip 3.2s ease-in-out infinite; }
  .b-cle .tiles span:nth-child(2) { animation-delay: .12s; } .b-cle .tiles span:nth-child(3) { animation-delay: .24s; }
  .b-cle .tiles span:nth-child(4) { animation-delay: .36s; } .b-cle .tiles span:nth-child(5) { animation-delay: .48s; }
  .b-cle .tiles span:nth-child(6) { animation-delay: .6s; } .b-cle .tiles span:nth-child(7) { animation-delay: .72s; }
  @keyframes flip { 0%, 30%, 100% { transform: rotateX(0); } 15% { transform: rotateX(90deg); } }
</style></head>
<body><div class="b b-cle">
  <div class="board">
    <div class="row done"><i style="background:#3d7fd0"></i><i style="background:#7a6fc4"></i><i style="background:#c46fa3"></i><i style="background:#e0567a"></i><i style="background:#e8705a"></i><i style="background:#ea8a3c"></i><i style="background:#c9b458"></i></div>
    <div class="tiles">
      <span style="background:#6aaa64">C</span><span style="background:#7cae58">O</span><span style="background:#c9b458">L</span><span style="background:#e0a43a">O</span><span style="background:#e8853a">R</span><span style="background:#e0674a">L</span><span style="background:#787c7e">E</span>
    </div>
    <div class="row"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </div>
</div></body></html>
