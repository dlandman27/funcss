<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Roman Numeral Converter: chiseled into a stone slab ───── */
  .b-roman { background: radial-gradient(ellipse at 30% 20%, #e4ded2, #cfc8ba 60%, #b9b1a2); font-family: 'Cinzel', serif; color: #5b5448; text-align: center; }
  .b-roman::before { content: ''; position: absolute; inset: 3cqi; border: .35cqi solid rgba(91, 84, 72, .35); box-shadow: inset 0 0 0 .8cqi rgba(255,255,255,.12); }
  .b-roman .word { position: relative; font-weight: 800; font-size: 8.4cqi; line-height: 1.1; letter-spacing: .04em;
    text-shadow: 0 .25cqi 0 rgba(255, 255, 255, .55), 0 -.15cqi 0 rgba(0, 0, 0, .35); }
  .b-roman .num { margin-top: 2cqi; font-weight: 600; font-size: 4cqi; letter-spacing: .25em; color: #8a6d3b; text-shadow: 0 .2cqi 0 rgba(255,255,255,.5); }
  .b-roman .num b { font-weight: 600; color: #5b5448; }
</style></head>
<body><div class="b b-roman">
  <div class="word">Roman Numeral<br>Converter<div class="num"><b id="r">MMXXVI</b> · <span id="n">2026</span></div></div>
</div>
<script>
function roman(n) { const t = [[1000, 'M'], [900, 'CM'], [500, 'D'], [400, 'CD'], [100, 'C'], [90, 'XC'], [50, 'L'], [40, 'XL'], [10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']]; let s = ''; for (const [v, r] of t) while (n >= v) { s += r; n -= v; } return s; }
if (LIVE) { let n = 2026; setInterval(() => { n = n >= 2040 ? 1984 : n + 1; document.getElementById('r').textContent = roman(n); document.getElementById('n').textContent = n; }, 700); }
</script></body></html>
