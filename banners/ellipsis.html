<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── The Ellipsis: one quiet page of dots, Georgia on paper ── */
  .b-ell { background: #f2ede2; color: #201a17; font-family: Georgia, 'Times New Roman', serif; place-items: center start; }
  .b-ell .wrap { padding-left: 9cqi; }
  .b-ell .word { font-size: 10.5cqi; letter-spacing: .02em; line-height: 1; }
  .b-ell .dots { margin-top: 1cqi; font-size: 10cqi; letter-spacing: 1.8cqi; line-height: 1; height: 9cqi; }
  .b-ell .dots span { display: inline-block; }
  .b-ell .dots .gold { color: #f7c948; }
  .b-ell .dots .new { animation: dotIn 3.2s cubic-bezier(.34,1.56,.64,1) infinite; }
  @keyframes dotIn { 0%, 30% { transform: scale(1); } 40% { transform: scale(1.5); } 50%, 100% { transform: scale(1); } }
</style></head>
<body><div class="b b-ell">
  <div class="wrap">
    <div class="word">The Ellipsis</div>
    <div class="dots"><span>.</span><span>.</span><span>.</span><span>.</span><span class="gold">•</span><span>.</span><span>.</span><span class="new">.</span></div>
  </div>
</div></body></html>
