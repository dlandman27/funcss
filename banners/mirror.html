<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Mirror: four quadrants, the word four ways ────────────── */
  .b-mi { background: #0a0a0c; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 600;
    grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  .b-mi::before, .b-mi::after { content: ''; position: absolute; background: rgba(255,255,255,.1); }
  .b-mi::before { left: 50%; top: 0; bottom: 0; width: 1px; } .b-mi::after { top: 50%; left: 0; right: 0; height: 1px; }
  .b-mi .q { display: grid; place-items: center; width: 100%; height: 100%; font-size: 11cqi; line-height: 1; }
  .b-mi .n { color: #c8b8ff; } .b-mi .r { color: #ff9eb5; transform: scaleX(-1); opacity: .55; }
  .b-mi .u { color: #7adcff; transform: rotate(180deg); opacity: .55; } .b-mi .x { color: #7affb8; transform: scaleY(-1); opacity: .55; }
  .b-mi .q span::after { content: ''; display: inline-block; width: .5cqi; height: 9cqi; margin-left: .8cqi; vertical-align: -1.2cqi; background: currentColor; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style></head>
<body><div class="b b-mi">
  <div class="q n"><span>Mirror</span></div><div class="q r"><span>Mirror</span></div>
  <div class="q x"><span>Mirror</span></div><div class="q u"><span>Mirror</span></div>
</div></body></html>
