<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Picsum Photo Generator: polaroids pinned to a board ───── */
  .b-pics { background: #c99a62; background-image: radial-gradient(rgba(90, 55, 20, .25) 1px, transparent 1.5px), radial-gradient(rgba(255, 230, 190, .25) 1px, transparent 1.5px);
    background-size: 9px 9px, 13px 13px; background-position: 0 0, 4px 6px; font-family: 'Caveat', cursive; color: #2a1a0e; place-items: center start; }
  .b-pics .word { position: relative; padding-left: 6cqi; font-size: 10cqi; line-height: .9; }
  .b-pics .pol { position: absolute; top: 6cqi; width: 12.5cqi; padding: 1cqi 1cqi 3.6cqi; background: #fbfaf5; box-shadow: .6cqi 1cqi 1.6cqi rgba(40, 20, 0, .35);
    transform-origin: 50% 0; animation: sway 3.2s ease-in-out infinite; }
  .b-pics .pol .ph { height: 11cqi; }
  .b-pics .pol::before { content: ''; position: absolute; left: 50%; top: -.6cqi; width: 2.2cqi; height: 2.2cqi; margin-left: -1.1cqi; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ff9a8a, #d8322b 60%); box-shadow: .3cqi .4cqi .4cqi rgba(0,0,0,.35); z-index: 1; }
  @keyframes sway { 0%, 100% { transform: rotate(var(--r)); } 50% { transform: rotate(calc(var(--r) * -.4)); } }
  .p1 { left: 58cqi; --r: -6deg; } .p2 { left: 70.5cqi; top: 10cqi !important; --r: 4deg; animation-delay: -1s !important; } .p3 { left: 83cqi; top: 4cqi !important; --r: -3deg; animation-delay: -2s !important; }
  .p1 .ph { background: radial-gradient(circle at 70% 30%, #fff3c4 0 9%, transparent 10%), linear-gradient(180deg, #8cc6ea 0 55%, #e8d39a 55% 65%, #3a8bb8 65%); }
  .p2 .ph { background: linear-gradient(160deg, transparent 0 48%, #4d6b3a 48%), linear-gradient(20deg, #35512a 0 40%, transparent 40%), linear-gradient(180deg, #c7dce8, #f0e6d3); }
  .p3 .ph { background: radial-gradient(ellipse at 50% 120%, #2b2240 0 40%, transparent 41%), linear-gradient(180deg, #f2b46a, #e5785a 55%, #7b5aa6); }
</style></head>
<body><div class="b b-pics">
  <div class="pol p1"><div class="ph"></div></div>
  <div class="pol p2"><div class="ph"></div></div>
  <div class="pol p3"><div class="ph"></div></div>
  <div class="word">Picsum Photo<br>Generator</div>
</div></body></html>
