<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Interdimensional DVR: neon cable-guide grid, Courier New cyan glow ── */
  .b-dvr { background: #0a0a0a; color: #7af7ff; font-family: 'Courier New', monospace; text-shadow: 0 0 5px #7af7ff; place-items: stretch; padding: 3cqi; }
  .b-dvr .guide { border: 2px solid #7af7ff; box-shadow: 0 0 15px #7af7ff, inset 0 0 12px rgba(122,247,255,.2); display: grid; grid-template-rows: auto 1fr auto auto; overflow: hidden; }
  .b-dvr .bar { display: flex; justify-content: space-between; align-items: center; background: #1a1a1a; border-bottom: 1px solid #7af7ff; padding: 1cqi 2cqi; font-weight: bold; font-size: 2.4cqi; }
  .b-dvr .rec { color: #ff3c78; text-shadow: 0 0 6px #ff3c78; }
  .b-dvr .rec i { display: inline-block; width: 1.6cqi; height: 1.6cqi; border-radius: 50%; background: #ff3c78; box-shadow: 0 0 8px #ff3c78; margin-right: 1cqi; vertical-align: -.1cqi; animation: rec 1.2s steps(1) infinite; }
  @keyframes rec { 50% { opacity: .15; } }
  .b-dvr .title { display: grid; place-items: center; font-weight: bold; font-size: 7.6cqi; letter-spacing: .2cqi; text-align: center; line-height: 1; text-shadow: 0 0 6px #7af7ff, 0 0 18px rgba(122,247,255,.6); }
  .b-dvr .row { display: flex; border-top: 1px solid #7af7ff; font-size: 2.2cqi; height: 5cqi; align-items: center; white-space: nowrap; overflow: hidden; }
  .b-dvr .ch { width: 13cqi; padding: 0 1.4cqi; border-right: 1px solid #7af7ff; font-weight: bold; }
  .b-dvr .pr { flex: 1; padding: 0 1.4cqi; border-left: 1px solid #444; overflow: hidden; text-overflow: ellipsis; }
  .b-dvr .hd { background: #ff3c78; color: #0a0a0a; text-shadow: none; font-weight: bold; font-size: 1.6cqi; padding: .1cqi .6cqi; margin-left: .8cqi; }
  .b-dvr .pr.on { background: rgba(122,247,255,.15); }
  .b-dvr .scan { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,.25) 0 2px, transparent 2px 4px); pointer-events: none; }
</style></head>
<body><div class="b b-dvr">
  <div class="guide">
    <div class="bar"><span>8:00pm&nbsp;&nbsp;&nbsp;8:30pm&nbsp;&nbsp;&nbsp;9:00pm</span><span class="rec"><i></i>REC</span></div>
    <div class="title">Interdimensional DVR</div>
    <div class="row"><div class="ch">ACT-7</div><div class="pr on">Ball Fondlers<span class="hd">HD</span></div><div class="pr">Two Brothers vs Everything</div><div class="pr">Man vs Car</div></div>
    <div class="row"><div class="ch">COM-3</div><div class="pr">Gazorpazorpfield</div><div class="pr">Real Fake Doors Infomercial</div><div class="pr">Plumbus Making</div></div>
  </div>
  <div class="scan"></div>
</div></body></html>
