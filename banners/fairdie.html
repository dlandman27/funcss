<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Fair Die: one die on casino felt, stamped CERTIFIED FAIR ── */
  .b-die { background: radial-gradient(ellipse at 35% 50%, #1f7a4a, #0f4a2c 75%); color: #fff8ef; font-family: 'Playfair Display', Georgia, serif; }
  .b-die .word { position: absolute; left: 7cqi; font-size: 12.5cqi; font-weight: 900; line-height: 1; letter-spacing: -.01em; }
  .b-die .cert { position: absolute; left: 8cqi; top: 26cqi; font-family: 'Arial Black', Arial, sans-serif; font-size: 2.4cqi;
    color: #ffd9d4; border: .35cqi solid #ffd9d4; border-radius: .6cqi; padding: .5cqi 1.4cqi; transform: rotate(-4deg); letter-spacing: .15em; opacity: .9; }
  .b-die .die { position: absolute; right: 13cqi; top: 50%; width: 19cqi; height: 19cqi; margin-top: -10.5cqi;
    animation: roll 3s cubic-bezier(.3,.7,.4,1) infinite; }
  .b-die .shadow { position: absolute; right: 12cqi; top: 50%; margin-top: 8cqi; width: 21cqi; height: 3cqi; border-radius: 50%;
    background: rgba(0,0,0,.35); filter: blur(.8cqi); }
  @keyframes roll { 0%, 60% { transform: rotate(-8deg); } 70% { transform: translate(-3cqi, -4cqi) rotate(-150deg); }
    80% { transform: translate(-1cqi, 0) rotate(-300deg); } 88% { transform: translate(0, -1cqi) rotate(-350deg); } 100% { transform: rotate(-368deg); } }
</style></head>
<body><div class="b b-die">
  <div class="word">Fair Die</div>
  <div class="cert">CERTIFIED FAIR ✓</div>
  <div class="shadow"></div>
  <svg class="die" viewBox="0 0 100 100">
    <rect x="4" y="4" width="92" height="92" rx="18" fill="#c0392b"/>
    <rect x="4" y="4" width="92" height="92" rx="18" fill="none" stroke="#7d1f15" stroke-width="3"/>
    <path d="M14 10 H80 Q90 10 90 20" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="4" stroke-linecap="round"/>
    <g fill="#fff8ef"><circle cx="28" cy="28" r="8.5"/><circle cx="72" cy="28" r="8.5"/><circle cx="28" cy="50" r="8.5"/>
      <circle cx="72" cy="50" r="8.5"/><circle cx="28" cy="72" r="8.5"/><circle cx="72" cy="72" r="8.5"/></g>
  </svg>
</div></body></html>
