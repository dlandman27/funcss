<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,300&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Drips: a quiet blue pool, rings spreading from one drop ─ */
  .b-drip { background: radial-gradient(ellipse at 70% 45%, #1a6aa8, #0d4f8a 45%, #093a66); font-family: 'Fraunces', Georgia, serif; place-items: center start; }
  .b-drip .ring { position: absolute; left: 70%; top: 48%; width: 10cqi; height: 4cqi; margin: -2cqi 0 0 -5cqi; border-radius: 50%;
    border: .35cqi solid rgba(220,240,255,.6); animation: ripple 4.5s cubic-bezier(.2,.6,.4,1) infinite; }
  .b-drip .ring:nth-of-type(2) { animation-delay: -1.5s; } .b-drip .ring:nth-of-type(3) { animation-delay: -3s; }
  @keyframes ripple { 0% { transform: scale(.4); opacity: .9; } 100% { transform: scale(6); opacity: 0; } }
  .b-drip .drop { position: absolute; left: 70%; top: 47%; width: 1.4cqi; height: 1.4cqi; margin-left: -.7cqi; border-radius: 50%; background: rgba(230,245,255,.9); box-shadow: 0 0 2cqi rgba(220,240,255,.8); }
  .b-drip .word { position: relative; margin-left: 9cqi; font-style: italic; font-weight: 300; font-size: 15cqi; line-height: 1; color: rgba(225,242,255,.94); letter-spacing: .2cqi; }
</style></head>
<body><div class="b b-drip">
  <div class="ring"></div><div class="ring"></div><div class="ring"></div>
  <div class="drop"></div>
  <div class="word">Drips</div>
</div></body></html>
