<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Turbo Ball: side-view arena, car, giant ball ───────────── */
  .b-turbo { background: linear-gradient(#7db6e6, #5aa0db 70%); font-family: 'Arial Black', Arial, sans-serif; color: #201a17;
    place-items: start start; }
  .b-turbo .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 15%; background: #b7ce3c; border-top: .6cqi solid #201a17;
    background-image: repeating-linear-gradient(90deg, transparent 0 9cqi, rgba(32,26,23,.12) 9cqi 9.4cqi); }
  .b-turbo .goal { position: absolute; right: 0; bottom: 15%; width: 8cqi; height: 20cqi; border: .6cqi solid #201a17; border-right: 0;
    background: repeating-linear-gradient(45deg, rgba(255,255,255,.55) 0 .4cqi, transparent .4cqi 1.6cqi), repeating-linear-gradient(-45deg, rgba(255,255,255,.55) 0 .4cqi, transparent .4cqi 1.6cqi); }
  .b-turbo .word { position: relative; margin: 6cqi 0 0 5cqi; font-size: 12.5cqi; line-height: .9; font-style: italic; color: #fff8ef;
    -webkit-text-stroke: .5cqi #201a17; paint-order: stroke fill; text-shadow: .9cqi .9cqi 0 #201a17; transform: skewX(-8deg); }
  .b-turbo .word span { color: #f47b28; }
  .b-turbo .ball { position: absolute; left: 70cqi; bottom: 15%; width: 15cqi; height: 15cqi; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff 0 18%, #f7c948 19% 100%); border: .6cqi solid #201a17;
    animation: bounce 1.1s cubic-bezier(.3,0,.7,1) infinite alternate; }
  .b-turbo .ball::after { content: ''; position: absolute; inset: 22%; border-radius: 50%; border: .5cqi dashed #201a17; opacity: .5; }
  @keyframes bounce { from { transform: translateY(0) rotate(0); } to { transform: translateY(-14cqi) rotate(120deg); } }
  .b-turbo .car { position: absolute; left: 47cqi; bottom: 15%; width: 18cqi; height: 7cqi; animation: zoom 1.1s ease-in-out infinite alternate; }
  @keyframes zoom { to { transform: translateX(3cqi); } }
  .b-turbo .car svg { width: 100%; height: 100%; overflow: visible; }
</style></head>
<body><div class="b b-turbo">
  <div class="floor"></div>
  <div class="goal"></div>
  <div class="ball"></div>
  <div class="car"><svg viewBox="0 0 160 56">
    <path d="M-34 30 L-6 26 M-40 40 L-8 38" stroke="#fff8ef" stroke-width="5" stroke-linecap="round"/>
    <path d="M-4 33 L-26 28 L-26 42 Z" fill="#f47b28" stroke="#201a17" stroke-width="3" stroke-linejoin="round"/>
    <path d="M4 44 L4 26 Q8 20 30 18 L58 4 L104 4 Q118 8 124 20 L150 24 Q158 28 156 44 Z" fill="#f0563e" stroke="#201a17" stroke-width="4" stroke-linejoin="round"/>
    <path d="M64 10 L100 10 Q108 12 112 20 L56 20 Z" fill="#cfe6f7" stroke="#201a17" stroke-width="3"/>
    <circle cx="36" cy="44" r="11" fill="#201a17"/><circle cx="36" cy="44" r="4" fill="#fff8ef"/>
    <circle cx="126" cy="44" r="11" fill="#201a17"/><circle cx="126" cy="44" r="4" fill="#fff8ef"/>
  </svg></div>
  <div class="word">TURBO<br><span>BALL</span></div>
</div></body></html>
