<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Name a Shape: spotlit specimen + gallery plaque ───────── */
  .b-ns { background: #1b1613; font-family: 'DM Serif Display', Georgia, serif; color: #201a17; grid-template-columns: 1fr 1fr; }
  .b-ns .light { position: absolute; left: 6%; top: -10%; width: 44%; height: 120%;
    background: linear-gradient(rgba(255,240,205,.0), rgba(255,240,205,.16)); clip-path: polygon(42% 0, 58% 0, 100% 86%, 0 86%); }
  .b-ns .floor { position: absolute; left: 7%; width: 42%; bottom: 7%; height: 18%; border-radius: 50%; background: radial-gradient(ellipse, rgba(255,240,205,.35), rgba(255,240,205,0) 70%); }
  .b-ns .shape { position: relative; width: 18cqi; height: 16cqi; margin-top: 4cqi; background: #f0563e; border: .5cqi solid #201a17;
    border-radius: 62% 38% 46% 54% / 40% 58% 42% 60%; box-shadow: .6cqi .6cqi 0 #000; animation: morph 4s ease-in-out infinite; }
  @keyframes morph { 50% { border-radius: 38% 62% 30% 70% / 64% 34% 66% 36%; transform: rotate(12deg) scale(1.05); } }
  .b-ns .plaque { justify-self: start; background: #f2ede2; padding: 3cqi 4cqi; box-shadow: 0 .6cqi 2cqi rgba(0,0,0,.5); border-left: 1cqi solid #c9a24a; }
  .b-ns .plaque .no { font-size: 2.6cqi; font-style: italic; color: #8a7a62; letter-spacing: .1cqi; }
  .b-ns .plaque .word { font-size: 9cqi; line-height: 1.05; margin: .6cqi 0 .4cqi; }
  .b-ns .plaque .med { font-family: Georgia, serif; font-style: italic; font-size: 2.4cqi; color: #8a7a62; }
</style></head>
<body><div class="b b-ns">
  <div class="light"></div><div class="floor"></div>
  <div class="shape"></div>
  <div class="plaque"><div class="no">Specimen No. 1</div><div class="word">Name a Shape</div><div class="med">pigment on paper</div></div>
</div></body></html>
