<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── 89 Degree Triangle: graph paper, a drafted triangle that's almost right ── */
  .b-tri { background-color: #fbf9f3;
    background-image: linear-gradient(rgba(90, 160, 219, .16) 1px, transparent 1px),
      linear-gradient(90deg, rgba(90, 160, 219, .16) 1px, transparent 1px);
    background-size: 2.5cqi 2.5cqi; font-family: Georgia, 'Times New Roman', serif; color: #201a17;
    place-items: center end; }
  .b-tri svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .b-tri .word { position: relative; margin-right: 5cqi; text-align: right; }
  .b-tri .word b { display: block; font-family: 'Arial Black', Arial, sans-serif; font-size: 10.5cqi; line-height: .95; letter-spacing: -.3cqi; }
  .b-tri .word span { display: block; font-size: 6.4cqi; font-style: italic; line-height: 1.1; }
  .b-tri .word small { display: block; margin-top: 1.6cqi; font-size: 2.8cqi; font-style: italic; color: #f0563e; }
  .b-tri .ray { transform-origin: 227px 66px; animation: ray 3s ease-in-out infinite alternate; }
  @keyframes ray { to { transform: rotate(-4deg); } }
</style></head>
<body><div class="b b-tri">
  <svg viewBox="0 0 800 300">
    <!-- the triangle: right edge leans 1° off vertical -->
    <polygon points="40,256 230,256 226.7,66" fill="rgba(247,201,72,.4)" stroke="#201a17" stroke-width="4" stroke-linejoin="round"/>
    <!-- a true right angle, ghosted, for comparison -->
    <line x1="230" y1="256" x2="230" y2="30" stroke="#5aa0db" stroke-width="2" stroke-dasharray="4 5"/>
    <!-- the angle mark: 89, not 90 -->
    <path d="M204,256 A26,26 0 0 1 229.5,230" fill="none" stroke="#f0563e" stroke-width="3"/>
    <text x="196" y="246" font-family="Georgia" font-style="italic" font-size="20" fill="#f0563e" text-anchor="end">89°</text>
    <!-- extend the edge: it drifts away from the true vertical -->
    <line class="ray" x1="226.7" y1="66" x2="224" y2="-90" stroke="#f0563e" stroke-width="3"/>
  </svg>
  <div class="word"><b>89 Degree</b><span>Triangle</span><small>so close to right. so far from right.</small></div>
</div></body></html>
