<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── ASCII Cam: a colour ASCII "camera feed" of a face, Georgia caption box ── */
  .b-cam { background: #201a17; font-family: Georgia, 'Times New Roman', serif; color: #f2ede2; }
  .b-cam canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .b-cam .frame { position: absolute; inset: 4cqi 4cqi; pointer-events: none; }
  .b-cam .frame i { position: absolute; width: 5cqi; height: 5cqi; border: 0 solid #f2ede2; opacity: .85; }
  .b-cam .frame i:nth-child(1) { top: 0; left: 0; border-width: .45cqi 0 0 .45cqi; }
  .b-cam .frame i:nth-child(2) { top: 0; right: 0; border-width: .45cqi .45cqi 0 0; }
  .b-cam .frame i:nth-child(3) { bottom: 0; left: 0; border-width: 0 0 .45cqi .45cqi; }
  .b-cam .frame i:nth-child(4) { bottom: 0; right: 0; border-width: 0 .45cqi .45cqi 0; }
  .b-cam .rec { position: absolute; top: 6.5cqi; left: 8cqi; display: flex; align-items: center; gap: 1.2cqi;
    font: 700 2.6cqi 'Courier New', monospace; letter-spacing: .3cqi; }
  .b-cam .rec i { width: 2.2cqi; height: 2.2cqi; border-radius: 50%; background: #f0563e; animation: blink 1.2s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .b-cam .word { position: absolute; left: 8cqi; bottom: 8cqi; background: #201a17; padding: 1.4cqi 3cqi 1.8cqi;
    font-size: 10cqi; line-height: 1; border: .4cqi solid #f2ede2; }
</style></head>
<body><div class="b b-cam">
  <canvas id="c" width="800" height="300"></canvas>
  <div class="frame"><i></i><i></i><i></i><i></i></div>
  <div class="rec"><i></i>LIVE</div>
  <div class="word">ASCII Cam</div>
</div>
<script>
const c = document.getElementById('c'), g = c.getContext('2d');
const RAMP = ' .:-=+*#%@', CW = 9, CH = 14, COLS = Math.ceil(800 / CW), ROWS = Math.ceil(300 / CH);
g.font = '13px monospace'; g.textBaseline = 'top';
function draw(t) {
  g.fillStyle = '#201a17'; g.fillRect(0, 0, 800, 300);
  const hx = 560 + Math.sin(t * .7) * 8, hy = 128;
  for (let r = 0; r < ROWS; r++) for (let q = 0; q < COLS; q++) {
    const x = q * CW + 4, y = r * CH + 7;
    // head (ellipse) + shoulders, lit from the upper left
    const dx = (x - hx) / 78, dy = (y - hy) / 98;
    const head = 1 - (dx * dx + dy * dy);
    const sx = (x - hx) / 190, sy = (y - 330) / 110;
    const body = 1 - (sx * sx + sy * sy);
    let v = Math.max(head, body * .9, 0);
    if (v > 0) v = Math.min(1, .5 + v * .9 - dx * .25 - dy * .2);
    // eyes + mouth
    const e1 = Math.hypot(x - (hx - 28), y - (hy - 10)), e2 = Math.hypot(x - (hx + 28), y - (hy - 10));
    if (head > 0 && (e1 < 10 || e2 < 10)) v = .12;
    if (head > 0 && Math.abs(y - (hy + 40)) < 6 && Math.abs(x - hx) < 26) v = .2;
    // background room: faint gradient
    if (v <= 0) v = .1 + .14 * (1 - y / 300) + .05 * Math.sin(x / 60 + t);
    const ch = RAMP[Math.min(9, Math.floor(v * 10))];
    if (ch === ' ') continue;
    const hue = (x / 800) * 220 + 180 + y * .2;
    g.fillStyle = `hsl(${hue % 360} ${v > .3 ? 80 : 25}% ${v > .3 ? 45 + v * 30 : 22 + v * 40}%)`;
    g.fillText(ch, q * CW, r * CH);
  }
}
let t0 = 0; (function loop(t) { draw(t0 + (t || 0) / 1000); if (LIVE) requestAnimationFrame(loop); })();
</script></body></html>
