<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── The Last Time: hushed night, wide-tracked Georgia ─────── */
  .b-last { background: radial-gradient(ellipse at 50% 45%, #12121e 0%, #080810 70%); font-family: Georgia, 'Times New Roman', serif; }
  .b-last .wrap { text-align: center; }
  .b-last h1 { margin: 0; font-weight: 400; font-size: 9.5cqi; letter-spacing: 1.2cqi; color: #e8e8f0; }
  .b-last .sub { margin-top: 2.4cqi; font-style: italic; font-size: 3cqi; letter-spacing: .5cqi; color: #6a6a80; }
  .b-last .hint { margin-top: 4cqi; font-size: 2cqi; letter-spacing: .6cqi; text-transform: uppercase; color: #44445a;
    animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(1cqi); opacity: .5; } }
  .b-last .star { position: absolute; width: .4cqi; height: .4cqi; border-radius: 50%; background: #c8c8e0; opacity: .35; }
</style></head>
<body><div class="b b-last">
  <div class="star" style="left:12%;top:22%"></div><div class="star" style="left:83%;top:30%"></div>
  <div class="star" style="left:70%;top:78%"></div><div class="star" style="left:22%;top:74%"></div>
  <div class="wrap">
    <h1>The Last Time</h1>
    <div class="sub">some moments pass without a goodbye</div>
    <div class="hint">↓ scroll ↓</div>
  </div>
</div></body></html>
