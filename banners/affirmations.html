<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Daily Affirmations: municipal "take a number" ticket, Georgia ── */
  .b-aff { background: #f2ede2; font-family: Georgia, 'Times New Roman', serif; color: #201a17; }
  .b-aff::before { content: 'municipal office of morale · window 4'; position: absolute; top: 3.4cqi; left: 0; right: 0;
    text-align: center; font-size: 2.4cqi; letter-spacing: .5cqi; text-transform: uppercase; color: #8a8078; }
  .b-aff .ticket { position: relative; display: flex; align-items: stretch; transform: rotate(-2deg); margin-top: 5cqi;
    background: linear-gradient(180deg, #fdf3d3, #fff8ef 85%); border: .35cqi solid #201a17;
    box-shadow: 1cqi 1cqi 0 rgba(32,26,23,.18); animation: issue 3.2s ease-in-out infinite; }
  @keyframes issue { 0%, 55%, 100% { transform: rotate(-2deg) translateY(0); } 70% { transform: rotate(-2deg) translateY(-1.6cqi); } 85% { transform: rotate(-2deg) translateY(.3cqi); } }
  .b-aff .stub { width: 14cqi; display: grid; place-items: center; text-align: center;
    border-right: .4cqi dashed #201a17; padding: 2cqi; }
  .b-aff .stub small { display: block; font-size: 2cqi; letter-spacing: .4cqi; text-transform: uppercase; color: #6f665c; }
  .b-aff .stub b { display: block; font-size: 6.6cqi; font-weight: 400; color: #f0563e; font-variant-numeric: tabular-nums; }
  .b-aff .main { padding: 3cqi 5cqi 3cqi 4.5cqi; }
  .b-aff h1 { margin: 0; font-size: 7.6cqi; font-weight: 400; line-height: 1; }
  .b-aff hr { border: 0; border-top: .3cqi solid #201a17; margin: 1.8cqi 0 1.4cqi; }
  .b-aff .line { font-size: 2.5cqi; font-style: italic; color: #4a413a; }
  .b-aff .stamp { position: absolute; right: -2cqi; bottom: -2.6cqi; transform: rotate(-12deg);
    border: .4cqi solid #2fb0a3; color: #2fb0a3; border-radius: 1cqi; padding: .4cqi 1.4cqi;
    font-size: 2.4cqi; letter-spacing: .4cqi; text-transform: uppercase; background: rgba(242,237,226,.8); }
</style></head>
<body><div class="b b-aff">
  <div class="ticket">
    <div class="stub"><div><small>now serving</small><b id="num">047</b></div></div>
    <div class="main">
      <h1>Daily Affirmations</h1>
      <hr>
      <div class="line">You are doing better than the paperwork suggests.</div>
    </div>
    <div class="stamp">notarized</div>
  </div>
</div>
<script>
let n = 47; const num = document.getElementById('num');
function next() { n++; num.textContent = String(n).padStart(3, '0'); }
if (LIVE) setTimeout(() => { next(); setInterval(next, 3200); }, 2000);
</script></body></html>
