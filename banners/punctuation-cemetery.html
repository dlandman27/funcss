<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── The Punctuation Cemetery: headstones for retired marks ── */
  .b-grave { background: linear-gradient(180deg, #dfe1da 0%, #e9eae3 55%, #b9c2a6 56%, #a3ae8e 100%); font-family: 'IM Fell English', Georgia, serif; color: #2a2a28; place-items: start center; }
  .b-grave .word { position: relative; margin-top: 4.5cqi; font-family: 'IM Fell English SC', Georgia, serif; font-size: 7.4cqi; letter-spacing: .01em; white-space: nowrap; }
  .b-grave .fog { position: absolute; left: -20%; right: -20%; top: 44%; height: 16%; background: linear-gradient(90deg, transparent, rgba(246, 247, 242, .8) 30%, rgba(246, 247, 242, .5) 60%, transparent);
    filter: blur(10px); animation: drift 9s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translateX(14%); } }
  .b-grave .row { position: absolute; left: 4cqi; right: 4cqi; bottom: 4cqi; display: flex; justify-content: space-around; align-items: flex-end; }
  .b-grave .stone { width: 9.5cqi; height: 13cqi; border-radius: 4.75cqi 4.75cqi .6cqi .6cqi; background: linear-gradient(160deg, #b8bab4, #8d908a); border: .3cqi solid #6c6f69;
    display: grid; place-items: center; font-family: Georgia, 'Times New Roman', 'Apple Symbols', serif; font-size: 7.6cqi; line-height: 1; color: #4b4e49; text-shadow: 0 .2cqi 0 rgba(255,255,255,.35); box-shadow: .8cqi .6cqi 0 rgba(60, 70, 50, .25); }
  .b-grave .stone:nth-child(odd) { height: 11cqi; transform: rotate(-2deg); }
  .b-grave .stone:nth-child(3n) { transform: rotate(3deg); }
</style></head>
<body><div class="b b-grave">
  <div class="fog"></div>
  <div class="word">The Punctuation Cemetery</div>
  <div class="row">
    <div class="stone" style="font-family: Palatino, 'Palatino Linotype', serif">‽</div><div class="stone">⸮</div><div class="stone">❦</div><div class="stone">¶</div><div class="stone">☞</div><div class="stone">⁊</div><div class="stone">⁂</div>
  </div>
</div></body></html>
