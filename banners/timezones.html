<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Timezone Ticket: a boarding pass, gate B7 ─────────────── */
  .b-tz { background: #5aa0db; font-family: 'Arial Black', 'Segoe UI', sans-serif; color: #201a17; }
  .b-tz .ticket { position: relative; width: 82cqi; height: 31cqi; background: #fff8ef; border-radius: 1.6cqi; display: flex;
    box-shadow: 0 1.2cqi 0 rgba(32,26,23,.25); transform: rotate(-2deg); }
  .b-tz .main { flex: 1; padding: 3cqi 4cqi; }
  .b-tz .stub { width: 19cqi; border-left: .4cqi dashed rgba(32,26,23,.35); padding: 3.2cqi 2.6cqi; display: flex; flex-direction: column; justify-content: space-between; }
  .b-tz .ticket::before, .b-tz .ticket::after { content: ''; position: absolute; right: 18.2cqi; width: 3.6cqi; height: 3.6cqi; border-radius: 50%; background: #5aa0db; }
  .b-tz .ticket::before { top: -1.8cqi; } .b-tz .ticket::after { bottom: -1.8cqi; }
  .b-tz h1 { margin: 0; font-size: 7cqi; letter-spacing: -.2cqi; line-height: 1; }
  .b-tz .route { margin-top: 2.4cqi; display: flex; align-items: center; gap: 2cqi; font-size: 4.2cqi; line-height: 1; }
  .b-tz .route small { display: block; font-family: Georgia, serif; font-weight: 400; font-style: italic; font-size: 2.2cqi; color: #6a635c; margin-top: .6cqi; }
  .b-tz .line { flex: 1; position: relative; height: 0; border-top: .4cqi dashed #b9b2a8; }
  .b-tz .plane { position: absolute; top: -2.2cqi; left: 30%; font-size: 3.6cqi; color: #f0563e; font-family: Arial, sans-serif; animation: fly 4s ease-in-out infinite; }
  @keyframes fly { 50% { left: 62%; } }
  .b-tz .k { font-family: Georgia, serif; font-style: italic; font-size: 2.2cqi; color: #6a635c; }
  .b-tz .v { font-size: 6.4cqi; color: #f0563e; line-height: 1; }
  .b-tz .bars { height: 5cqi; background: repeating-linear-gradient(90deg, #201a17 0 .3cqi, transparent .3cqi .7cqi, #201a17 .7cqi 1.3cqi, transparent 1.3cqi 1.6cqi); }
</style></head>
<body><div class="b b-tz">
  <div class="ticket">
    <div class="main">
      <h1>Timezone Ticket</h1>
      <div class="route">
        <div>NYC<small>09:41</small></div>
        <div class="line"><span class="plane">✈</span></div>
        <div>TYO<small>22:41</small></div>
      </div>
    </div>
    <div class="stub"><div><div class="k">gate</div><div class="v">B7</div></div><div class="bars"></div></div>
  </div>
</div></body></html>
