<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Severance Dance: the MDR numbers, dancing ─────────────── */
  .b-sev { background: radial-gradient(ellipse at center, #06223a, #010b14 75%); font-family: 'Montserrat', sans-serif; color: #5cc5ef; }
  .b-sev .grid { position: absolute; inset: 1cqi 2cqi; display: grid; grid-template-columns: repeat(26, 1fr); align-items: center; justify-items: center;
    font: 700 2.6cqi 'Courier New', monospace; text-shadow: 0 0 1cqi rgba(92, 197, 239, .6); }
  .b-sev .grid i { font-style: normal; opacity: .38; animation: dance 1.4s ease-in-out infinite; animation-delay: var(--d); }
  .b-sev .grid i.hot { opacity: 1; font-size: 3.6cqi; }
  @keyframes dance { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-.8cqi) scale(1.15); } }
  .b-sev .word { position: relative; justify-self: center; width: max-content; text-align: center; padding: 2.4cqi 5cqi; background: #010b14; border: .3cqi solid #5cc5ef; box-shadow: 0 0 2.5cqi rgba(92, 197, 239, .35), inset 0 0 2cqi rgba(92, 197, 239, .15);
    font-weight: 700; font-size: 8cqi; line-height: 1.05; letter-spacing: .1em; text-transform: uppercase; text-shadow: 0 0 1.6cqi rgba(92, 197, 239, .6); }
  .b-sev .word small { display: block; margin-top: 1.4cqi; font-weight: 500; font-size: 2.4cqi; letter-spacing: .5em; text-align: center; color: #9edcf5; }
</style></head>
<body><div class="b b-sev">
  <div class="grid" id="g"></div>
  <div class="word">Severance<br>Dance<small>macrodata refinement</small></div>
</div>
<script>
const g = document.getElementById('g');
for (let r = 0; r < 10; r++) for (let c = 0; c < 26; c++) {
  const i = document.createElement('i'); i.textContent = (c * 7 + r * 13 + (c * r) % 5) % 10;
  if (Math.hypot(c - 4 - (r % 3), r - 6) < 2.4 || Math.hypot(c - 21, r - 3) < 2.1) i.className = 'hot';
  i.style.setProperty('--d', (-(c * .08 + r * .05)) + 's'); g.appendChild(i);
}
</script></body></html>
