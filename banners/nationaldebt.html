<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:wght@400;700&family=Roboto+Mono:wght@700&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Spend the National Debt: banknote paper + debt clock ──── */
  .b-nd { background: #e6eddc; font-family: 'Old Standard TT', Georgia, serif; color: #1f3a2a; }
  .b-nd .note { position: absolute; inset: 3.4cqi 4cqi; border: .5cqi solid #2c5a3c; outline: .2cqi solid #2c5a3c; outline-offset: -1.4cqi;
    background: repeating-radial-gradient(circle at 12% 50%, transparent 0 1.1cqi, rgba(44,90,60,.12) 1.1cqi 1.25cqi),
                repeating-radial-gradient(circle at 88% 50%, transparent 0 1.1cqi, rgba(44,90,60,.12) 1.1cqi 1.25cqi); }
  .b-nd .inner { position: relative; text-align: center; }
  .b-nd .word { font-size: 6.8cqi; font-weight: 700; line-height: 1; letter-spacing: .1cqi; text-transform: uppercase; }
  .b-nd .clock { display: inline-block; margin-top: 3cqi; font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 5.2cqi; letter-spacing: -.1cqi;
    background: #201a17; color: #fff8ef; padding: 1.2cqi 2.6cqi; border-radius: .6cqi; font-variant-numeric: tabular-nums; }
  .b-nd .clock em { font-style: normal; color: #f0563e; }
  .b-nd .seal { position: absolute; width: 10cqi; height: 10cqi; border-radius: 50%; border: .5cqi double #2c5a3c; display: grid; place-items: center;
    font-size: 5cqi; font-weight: 700; color: #2c5a3c; background: rgba(255,255,255,.35); }
  .b-nd .l { left: 7.5cqi; } .b-nd .r { right: 7.5cqi; }
</style></head>
<body><div class="b b-nd">
  <div class="note"></div>
  <div class="seal l">$</div><div class="seal r">$</div>
  <div class="inner">
    <div class="word">Spend the<br>National Debt</div>
    <div class="clock" id="clk">$36,218,442,906,551<em>.00</em></div>
  </div>
</div>
<script>
let v = 36218442906551; const el = document.getElementById('clk');
(function tick() {
  el.innerHTML = '$' + v.toLocaleString('en-US') + '<em>.00</em>';
  if (LIVE) { v += 5100 + Math.floor(Math.random() * 300); setTimeout(tick, 100); }
})();
</script></body></html>
