<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Tile: one geometric tile repeating to the edges ───────── */
  .b-tile { background: #fff8ef; font-family: 'DM Serif Display', Georgia, serif; color: #201a17; }
  .b-tile svg.field { position: absolute; left: -12cqi; top: -12cqi; width: 124cqi; height: 61.5cqi;
    animation: wander 9s linear infinite; }
  @keyframes wander { to { transform: translate(12cqi, 12cqi); } }
  .b-tile .plate { position: relative; background: #fff8ef; padding: 1cqi 6cqi 2cqi; border: .5cqi solid #201a17;
    box-shadow: 1.2cqi 1.2cqi 0 #201a17; }
  .b-tile h1 { margin: 0; font-weight: 400; font-size: 14cqi; line-height: 1; letter-spacing: .3cqi; }
</style></head>
<body><div class="b b-tile">
  <svg class="field" viewBox="0 0 992 492">
    <defs>
      <pattern id="p" width="96" height="96" patternUnits="userSpaceOnUse">
        <rect width="96" height="96" fill="#5aa0db"/>
        <rect x="18" y="18" width="60" height="60" fill="#f7c948"/>
        <rect x="18" y="18" width="60" height="60" fill="#f7c948" transform="rotate(45 48 48)"/>
        <circle cx="48" cy="48" r="20" fill="#f0563e"/>
        <circle cx="48" cy="48" r="8" fill="#fff8ef"/>
        <circle cx="0" cy="0" r="14" fill="#201a17"/><circle cx="96" cy="0" r="14" fill="#201a17"/>
        <circle cx="0" cy="96" r="14" fill="#201a17"/><circle cx="96" cy="96" r="14" fill="#201a17"/>
        <circle cx="0" cy="0" r="6" fill="#b7ce3c"/><circle cx="96" cy="0" r="6" fill="#b7ce3c"/>
        <circle cx="0" cy="96" r="6" fill="#b7ce3c"/><circle cx="96" cy="96" r="6" fill="#b7ce3c"/>
      </pattern>
    </defs>
    <rect width="992" height="492" fill="url(#p)"/>
  </svg>
  <div class="plate"><h1>Tile</h1></div>
</div></body></html>
