<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── One Pixel: dark gallery wall, one tiny square, a glow ─── */
  .b-op { background: #141210; font-family: Georgia, 'Times New Roman', serif; color: #f2ede2; place-items: center; }
  .b-op .glow { position: absolute; left: 50%; top: 34%; width: 40cqi; height: 40cqi; margin: -20cqi 0 0 -20cqi; border-radius: 50%;
    background: #e8553b; filter: blur(7cqi); opacity: .3; animation: hue 9s linear infinite; }
  .b-op .px { position: absolute; left: 50%; top: 34%; width: 2cqi; height: 2cqi; margin: -1cqi 0 0 -1cqi; background: #e8553b; animation: hue 9s linear infinite; }
  @keyframes hue { to { filter: hue-rotate(360deg) blur(0); } }
  .b-op .glow { animation-name: hueb; } @keyframes hueb { from { filter: blur(7cqi) hue-rotate(0); } to { filter: blur(7cqi) hue-rotate(360deg); } }
  .b-op .word { position: absolute; left: 0; right: 0; top: 56%; text-align: center; font-size: 9cqi; font-style: italic; line-height: 1; }
  .b-op .word small { display: block; margin-top: 1.8cqi; font-family: 'Courier New', monospace; font-style: normal; font-size: 2.6cqi; letter-spacing: .3cqi; opacity: .45; }
</style></head>
<body><div class="b b-op">
  <div class="glow"></div><div class="px"></div>
  <div class="word">One Pixel<small>#E8553B</small></div>
</div></body></html>
