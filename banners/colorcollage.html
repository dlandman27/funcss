<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Color Collage: a giant grid of color, one label block ─── */
  .b-coll { background: #201a17; font-family: 'Archivo Black', sans-serif; }
  .b-coll .grid { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(20, 1fr); grid-template-rows: repeat(8, 1fr); gap: 0; }
  .b-coll .grid i { transition: background-color .5s; }
  .b-coll .word { position: relative; background: #201a17; color: #fff; font-size: 9.6cqi; line-height: 1; padding: 2.4cqi 4cqi 2.8cqi; letter-spacing: -.2cqi; }
</style></head>
<body><div class="b b-coll">
  <div class="grid" id="grid"></div>
  <div class="word">Color Collage</div>
</div>
<script>
const grid = document.getElementById('grid'), cells = [];
const col = () => `hsl(${Math.random() * 360 | 0} ${55 + Math.random() * 40 | 0}% ${45 + Math.random() * 25 | 0}%)`;
for (let i = 0; i < 160; i++) { const c = document.createElement('i'); c.style.background = Math.random() < .12 ? '#201a17' : col(); grid.appendChild(c); cells.push(c); }
if (LIVE) setInterval(() => { for (let k = 0; k < 4; k++) cells[Math.random() * cells.length | 0].style.background = col(); }, 140);
</script></body></html>
