<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Unsubscribe: the newsletter footer link that runs away ─── */
  .b-unsub { background: #f3f4f6; color: #1f2933;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  .b-unsub .mail { position: relative; width: 74cqi; background: #fff; border: 1px solid #e2e5e9; border-radius: 1.2cqi;
    box-shadow: 0 .4cqi 2cqi rgba(31,41,51,.08); padding: 3.4cqi 5cqi 3cqi; }
  .b-unsub .from { display: flex; align-items: center; gap: 1.6cqi; font-size: 2.6cqi; color: #6b7280; }
  .b-unsub .from b { font-family: Georgia, serif; font-size: 3.2cqi; color: #1f2933; font-weight: 700; }
  .b-unsub .from svg { width: 3.4cqi; height: 5cqi; }
  .b-unsub .rule { height: 1px; background: #e2e5e9; margin: 2.4cqi 0 2cqi; }
  .b-unsub .foot { font-size: 2.3cqi; color: #9aa1ab; }
  .b-unsub .link { display: inline-block; margin-top: .6cqi; font-size: 10.5cqi; font-weight: 700; letter-spacing: -.3cqi; color: #2563eb;
    text-decoration: underline; text-decoration-thickness: .5cqi; text-underline-offset: 1.2cqi; animation: dodge 2.4s ease-in-out infinite; }
  @keyframes dodge { 0%, 40% { transform: translateX(0); } 55%, 80% { transform: translateX(3.5cqi) rotate(1deg); } 100% { transform: translateX(0); } }
  .b-unsub .hand { position: absolute; left: 50cqi; bottom: 2.5cqi; width: 4.4cqi; animation: chase 2.4s ease-in-out infinite; }
  @keyframes chase { 0% { transform: translate(3cqi, 2cqi); } 40% { transform: translate(0, 0); } 55%, 80% { transform: translate(-.6cqi, 0); } 100% { transform: translate(3cqi, 2cqi); } }
</style></head>
<body><div class="b b-unsub">
  <div class="mail">
    <div class="from"><svg viewBox="0 0 20 30"><ellipse cx="10" cy="8" rx="7" ry="8" fill="#c8ccd2"/><rect x="8.5" y="14" width="3" height="15" rx="1.5" fill="#c8ccd2"/></svg>
      <b>The Daily Spoon</b> · Issue #5,114</div>
    <div class="rule"></div>
    <div class="foot">1 Spoon Plaza, Ladleton · you asked for this, apparently</div>
    <div class="link">Unsubscribe</div>
    <svg class="hand" viewBox="0 0 24 30"><path d="M8 2 Q10 0 12 2 L12 13 L18 14 Q22 15 21 19 L19 27 L8 27 L3 19 Q2 16 5 16 L8 18 Z" fill="#fff" stroke="#1f2933" stroke-width="1.6" stroke-linejoin="round"/></svg>
  </div>
</div></body></html>
