<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── The Largest Triangle: one coral triangle, far too big for the card ── */
  .b-tri { background: #f2ede2; color: #fff8ef; font-family: 'Arial Black', Arial, sans-serif; place-items: start center; }
  .b-tri svg { position: absolute; left: -20%; top: 0; width: 140%; height: 230%; animation: scroll 6s ease-in-out infinite; transform-origin: 50% 0; }
  @keyframes scroll { 50% { transform: translateY(-14%); } }
  .b-tri polygon { fill: #f0563e; }
  .b-tri .word { position: relative; margin-top: 5.6cqi; text-align: center; font-size: 7.4cqi; line-height: 1; letter-spacing: -.2cqi; text-shadow: .5cqi .5cqi 0 #201a17; }
  .b-tri .word small { display: block; font-family: Georgia, serif; font-style: italic; font-weight: 400; font-size: 3cqi; letter-spacing: 0; color: #201a17; text-shadow: none; margin-top: 1.6cqi; }
  .b-tri .arrow { position: absolute; bottom: 3cqi; left: 50%; margin-left: -1.6cqi; width: 3.2cqi; height: 3.2cqi; border-right: .7cqi solid #201a17; border-bottom: .7cqi solid #201a17; transform: rotate(45deg); animation: bob 1.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(1cqi) rotate(45deg); } }
</style></head>
<body><div class="b b-tri">
  <svg viewBox="0 0 1000 1000" preserveAspectRatio="none"><polygon points="0,0 1000,0 500,1000"/></svg>
  <div class="word">The Largest Triangle<small>it has a point. keep scrolling.</small></div>
  <div class="arrow"></div>
</div></body></html>
