<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── About My Device: inspection form 27-B, rubber stamp ───── */
  .b-md { background: #e9e4d6; font-family: 'Special Elite', 'Courier New', monospace; color: #2a2620; }
  .b-md .form { position: absolute; left: 5cqi; right: 5cqi; top: 4cqi; bottom: -2cqi; background: #fbf8ef;
    box-shadow: 0 .4cqi 1.6cqi rgba(0,0,0,.18); padding: 3.4cqi 4.5cqi;
    background-image: repeating-linear-gradient(transparent 0 5.4cqi, rgba(42,90,160,.18) 5.4cqi calc(5.4cqi + 1px)); background-position: 0 18cqi; }
  .b-md .head { display: flex; justify-content: space-between; font-size: 2.4cqi; letter-spacing: .3cqi; text-transform: uppercase; color: #6b6255; border-bottom: .3cqi double #2a2620; padding-bottom: 1.2cqi; }
  .b-md .word { font-size: 9.6cqi; line-height: 1; margin-top: 3cqi; }
  .b-md .rows { margin-top: 3.2cqi; font-size: 2.8cqi; line-height: 5.4cqi; color: #4a4339; }
  .b-md .rows b { font-weight: 400; color: #2a5aa0; }
  .b-md .stamp { position: absolute; right: 6cqi; top: 24.5cqi; transform: rotate(-12deg); color: #c8302b;
    border: .7cqi solid #c8302b; border-radius: 1cqi; padding: 1.4cqi 2.6cqi; font-size: 4.6cqi; letter-spacing: .3cqi; text-transform: uppercase; opacity: .85;
    mix-blend-mode: multiply; animation: thump 3s ease-out infinite; }
  @keyframes thump { 0%, 70%, 100% { transform: rotate(-12deg); } 76% { transform: rotate(-12deg) scale(1.25); opacity: .2; } 82% { transform: rotate(-12deg) scale(.96); opacity: .9; } }
</style></head>
<body><div class="b b-md">
  <div class="form">
    <div class="head"><span>Device Inspection · Form 27-B</span><span>annual</span></div>
    <div class="word">About My Device</div>
    <div class="rows">screen ........ <b>1440 × 900, adequate</b><br>battery ....... <b>holding on</b></div>
  </div>
  <div class="stamp">Fit for Browsing</div>
</div></body></html>
