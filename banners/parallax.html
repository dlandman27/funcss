<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@800&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Parallax: three depth layers sliding at different speeds ── */
  .b-px { background: linear-gradient(#f3e9ff, #ffe9dc); font-family: 'Syne', sans-serif; color: #241a3a; }
  .b-px .layer { position: absolute; inset: 0; }
  .b-px .s { position: absolute; border-radius: 50%; }
  .b-px .far .s { width: 4cqi; height: 4cqi; background: #c9b6ec; opacity: .7; }
  .b-px .mid .s { width: 9cqi; height: 9cqi; background: #a98fd0; }
  .b-px .near .s { width: 20cqi; height: 20cqi; background: #6f4fb0; box-shadow: 1cqi 1.4cqi 3cqi rgba(36,26,58,.25); }
  .b-px .sq { border-radius: 18%; } .b-px .tri { border-radius: 0; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .b-px .far { animation: drift 6s ease-in-out infinite; } .b-px .mid { animation: drift2 6s ease-in-out infinite; } .b-px .near { animation: drift3 6s ease-in-out infinite; }
  @keyframes drift { 50% { transform: translateX(-1cqi); } } @keyframes drift2 { 50% { transform: translateX(-3.5cqi); } } @keyframes drift3 { 50% { transform: translateX(-9cqi); } }
  .b-px .word { position: relative; font-size: 12.5cqi; line-height: 1; letter-spacing: -.4cqi; text-shadow: .6cqi .6cqi 0 rgba(169,143,208,.6), 1.2cqi 1.2cqi 0 rgba(169,143,208,.3); }
</style></head>
<body><div class="b b-px">
  <div class="layer far">
    <i class="s" style="left:8%;top:18%"></i><i class="s sq" style="left:24%;top:72%"></i><i class="s" style="left:40%;top:12%"></i>
    <i class="s tri" style="left:58%;top:80%"></i><i class="s" style="left:74%;top:24%"></i><i class="s sq" style="left:90%;top:62%"></i><i class="s" style="left:50%;top:44%"></i>
  </div>
  <div class="layer mid">
    <i class="s sq" style="left:14%;top:56%"></i><i class="s" style="left:33%;top:10%"></i><i class="s tri" style="left:68%;top:6%"></i><i class="s" style="left:82%;top:70%"></i>
  </div>
  <div class="layer near">
    <i class="s" style="left:-5%;top:-22%"></i><i class="s sq" style="left:88%;top:52%;transform:rotate(14deg)"></i>
  </div>
  <div class="word">Parallax</div>
</div></body></html>
