<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── I'm Sorry :( : a soft sympathy card, Georgia, with a sincerity meter stuck at 0% ── */
  .b-sorry { background: #e9dff0; font-family: Georgia, 'Times New Roman', serif; color: #3b2f45; }
  .b-sorry .card { position: relative; width: 70cqi; height: 30cqi; background: #fffdf8; border-radius: .4cqi;
    filter: drop-shadow(0 1cqi 1.6cqi rgba(80, 50, 100, .2)); display: grid; place-items: center; transform: rotate(-1.5deg); }
  .b-sorry .card::before { content: ''; position: absolute; inset: 1.4cqi; border: 1px solid #d9c9e4; }
  .b-sorry .word { font-size: 11cqi; font-style: italic; letter-spacing: -.1cqi; position: relative; }
  .b-sorry .word .face { display: inline-block; font-style: normal; color: #9a7bb4; animation: droop 2.6s ease-in-out infinite; transform-origin: 30% 60%; }
  @keyframes droop { 50% { transform: rotate(8deg) translateY(.4cqi); } }
  .b-sorry .meter { position: absolute; bottom: 4cqi; left: 50%; transform: translateX(-50%); font-family: 'Arial Black', Arial, sans-serif; font-size: 2cqi; letter-spacing: .3cqi; text-transform: uppercase; color: #a08cb0; white-space: nowrap; }
  .b-sorry .meter b { color: #f0563e; }
</style></head>
<body><div class="b b-sorry">
  <div class="card">
    <div class="word">I'm Sorry <span class="face">:(</span></div>
    <div class="meter">sincerity: <b>0%</b></div>
  </div>
</div></body></html>
