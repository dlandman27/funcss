<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;700&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Reaction Time: wait for red to turn green ─────────────── */
  .b-react { background: #0e0e0f; color: #f0ede8; place-items: center end; }
  .b-react::after { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.7) 100%); pointer-events: none; }
  .b-react .lamp { position: absolute; left: 8cqi; top: 50%; width: 26cqi; height: 26cqi; margin-top: -13cqi; border-radius: 50%; background: #c0392b;
    box-shadow: 0 0 6cqi 1cqi rgba(255, 77, 77, .45), inset 0 -1.5cqi 3cqi rgba(0,0,0,.35); animation: go 3.2s steps(1) infinite; }
  @keyframes go { 0% { background: #c0392b; box-shadow: 0 0 6cqi 1cqi rgba(255, 77, 77, .45), inset 0 -1.5cqi 3cqi rgba(0,0,0,.35); }
    65% { background: #b8ff57; box-shadow: 0 0 7cqi 2cqi rgba(184, 255, 87, .5), inset 0 -1.5cqi 3cqi rgba(0,0,0,.2); } }
  .b-react .word { position: relative; z-index: 1; padding-right: 7cqi; text-align: right; font-family: 'Bebas Neue', sans-serif; font-size: 14.5cqi; line-height: .86; letter-spacing: .02em; }
  .b-react .word small { display: block; margin-top: 2cqi; font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 4.4cqi; letter-spacing: .04em; color: #b8ff57; }
  .b-react .word small i { font-style: normal; font-weight: 400; color: #5a5a62; }
</style></head>
<body><div class="b b-react">
  <div class="lamp"></div>
  <div class="word">Reaction<br>Time<small>214<i> ms</i></small></div>
</div></body></html>
