<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Binary Sudoku: newspaper puzzle page, a 2×2 grid of 0s and 1s ── */
  .b-bsu { background: #f6f3ea; font-family: Georgia, 'Times New Roman', serif; color: #1c1c1c;
    grid-template-columns: 1fr auto; gap: 5cqi; padding: 0 9cqi 0 7cqi; }
  .b-bsu::before { content: ''; position: absolute; left: 4cqi; right: 4cqi; top: 4cqi; height: 1.4cqi;
    border-top: .5cqi solid #1c1c1c; border-bottom: .2cqi solid #1c1c1c; }
  .b-bsu::after { content: ''; position: absolute; left: 4cqi; right: 4cqi; bottom: 4cqi; border-top: .2cqi solid #1c1c1c; }
  .b-bsu .head small { display: block; font-size: 2.5cqi; letter-spacing: .5cqi; text-transform: uppercase; margin-bottom: 1.2cqi; color: #555; }
  .b-bsu h1 { margin: 0; font: 900 10cqi/.95 'Playfair Display', Georgia, serif; letter-spacing: -.2cqi; }
  .b-bsu .head p { margin: 1.8cqi 0 0; font-size: 2.7cqi; font-style: italic; color: #444; }
  .b-bsu .grid { display: grid; grid-template-columns: repeat(2, 13cqi); grid-template-rows: repeat(2, 13cqi);
    border: .6cqi solid #1c1c1c; background: #fff; transform: rotate(2deg); }
  .b-bsu .grid span { display: grid; place-items: center; border: .2cqi solid #1c1c1c;
    font: 400 8cqi/1 'Courier New', monospace; }
  .b-bsu .grid span.given { font-weight: 700; }
  .b-bsu .grid span.pen { color: #2b5bd7; font-family: 'Comic Sans MS', 'Marker Felt', cursive; }
  .b-bsu .grid span.pen::after { content: '1'; animation: flip 2s steps(1) infinite; }
  @keyframes flip { 50% { content: '0'; } }
</style></head>
<body><div class="b b-bsu">
  <div class="head">
    <h1>Binary Sudoku</h1>
    <p>Difficulty: 2×2. You will win.</p>
  </div>
  <div class="grid"><span class="given">1</span><span class="given">0</span><span class="given">0</span><span class="pen"></span></div>
</div></body></html>
