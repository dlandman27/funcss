<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Linguistic Anomalies: a pinned specimen label for a sentence that shouldn't be ── */
  .b-ling { background-color: #f2ede2; background-image: radial-gradient(rgba(32, 26, 23, .09) 2px, transparent 2.2px); background-size: 2.75cqi 2.75cqi; color: #201a17; font-family: 'Libre Baskerville', Georgia, serif; }
  .b-ling .card { position: relative; width: 84cqi; background: #fffdf6; border: 1px solid #c9bfae; padding: 3.4cqi 5cqi 3.2cqi; box-shadow: 0 1cqi 2.4cqi rgba(32,26,23,.12); }
  .b-ling .tag { position: absolute; right: 4cqi; top: 3cqi; font-family: 'Arial Black', Arial, sans-serif; font-size: 1.8cqi; letter-spacing: .4cqi; background: #a98fd0; color: #fff8ef; padding: .6cqi 1.4cqi; transform: rotate(3deg); }
  .b-ling .word { font-size: 7.2cqi; font-weight: 700; letter-spacing: -.1cqi; line-height: 1.1; }
  .b-ling .s { margin-top: 2.4cqi; padding-top: 2.2cqi; border-top: 1px solid #c9bfae; font-style: italic; font-size: 3.4cqi; white-space: nowrap; }
  .b-ling .s span { background: linear-gradient(transparent 62%, rgba(247, 201, 72, .7) 62%); }
  .b-ling .pin { position: absolute; left: 50%; top: -1.6cqi; width: 3cqi; height: 3cqi; margin-left: -1.5cqi; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ff9b8a, #c0392b); box-shadow: .3cqi .5cqi .6cqi rgba(0,0,0,.3); }
</style></head>
<body><div class="b b-ling">
  <div class="card">
    <div class="pin"></div>
    <div class="tag">SPECIMEN</div>
    <div class="word">Linguistic Anomalies</div>
    <div class="s"><span id="s">The horse raced past the barn fell.</span></div>
  </div>
</div>
<script>
const S = ['The horse raced past the barn fell.', 'The old man the boat.', 'Time flies like an arrow; fruit flies like a banana.'];
let i = 0; const el = document.getElementById('s');
if (LIVE) setInterval(() => { i = (i + 1) % S.length; el.textContent = S[i]; }, 2400);
</script></body></html>
