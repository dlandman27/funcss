<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@700&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Translate to Legalese: dark app, cream legal sheet ────── */
  .b-legal { background: #1a1a1a; font-family: 'Libre Baskerville', serif; }
  .b-legal .sheet { position: relative; width: 80cqi; height: 31cqi; background: #fdf8f0; color: #1a1208; padding: 4cqi 6cqi;
    box-shadow: 0 1.6cqi 4cqi rgba(0,0,0,.5); }
  .b-legal .sheet::before { content: 'DRAFT'; position: absolute; right: 4cqi; top: 3cqi; font-weight: 700; font-size: 9cqi; letter-spacing: 1cqi;
    color: rgba(196, 154, 30, .1); transform: rotate(-8deg); }
  .b-legal h1 { position: relative; margin: 0; font-weight: 700; font-size: 7.6cqi; letter-spacing: -.1cqi; line-height: 1.12; }
  .b-legal .w { position: relative; margin-top: 1.8cqi; font-style: italic; font-size: 2.6cqi; color: #7a6a4a; }
  .b-legal .lines { width: 46cqi; margin-top: 2.4cqi; display: grid; gap: 1.2cqi; }
  .b-legal .lines i { display: block; height: .8cqi; background: #e6dcc6; }
  .b-legal .stamp { position: absolute; right: 5cqi; bottom: 4.5cqi; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 2.8cqi;
    letter-spacing: .4cqi; text-transform: uppercase; color: #c49a1e; background: #2a1f0a; border: .3cqi solid #8b6914; padding: 1cqi 2cqi;
    transform: rotate(-6deg); animation: thump 3s ease-in infinite; }
  @keyframes thump { 0%, 70%, 100% { transform: rotate(-6deg) scale(1); } 80% { transform: rotate(-6deg) scale(1.35); opacity: .6; } 86% { transform: rotate(-6deg) scale(.96); } }
</style></head>
<body><div class="b b-legal">
  <div class="sheet">
    <h1>Translate to<br>Legalese</h1>
    <div class="lines"><i style="width:94%"></i><i style="width:88%"></i><i style="width:56%"></i></div>
    <div class="stamp">Legally Binding*</div>
  </div>
</div></body></html>
