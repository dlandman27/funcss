<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Meme Soundboard: dark panel, glossy orange play buttons ── */
  .b-ms { background: #1a1a1a; font-family: Arial, sans-serif; color: #fff; grid-template-columns: 44fr 56fr; }
  .b-ms .pads { display: grid; grid-template-columns: repeat(3, 10.5cqi); gap: 3cqi 3cqi; justify-self: end; margin-right: 2cqi; }
  .b-ms .pad { position: relative; width: 10.5cqi; height: 10.5cqi; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ff7e5f, #ff6b4a);
    box-shadow: 0 1.6cqi 2.6cqi rgba(0,0,0,.45), inset 0 -1cqi 1.4cqi rgba(0,0,0,.2), inset 0 1cqi 1.4cqi rgba(255,255,255,.3); }
  .b-ms .pad::before { content: '▶'; position: absolute; left: 54%; top: 50%; transform: translate(-50%, -50%); font-size: 4.2cqi; color: rgba(255,255,255,.9); }
  .b-ms .pad::after { content: ''; position: absolute; left: 15%; top: 15%; width: 30%; height: 30%; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.4), transparent 70%); }
  .b-ms .pad.hot { animation: press 2.2s ease-in-out infinite; }
  .b-ms .pad.hot .ring { position: absolute; inset: 0; border-radius: 50%; border: .4cqi solid #00bfff; animation: ring 2.2s ease-out infinite; opacity: .8; transform: scale(1.18); }
  @keyframes press { 0%, 40%, 100% { transform: none; } 48% { transform: translateY(.6cqi) scale(.94); } 58% { transform: translateY(-.6cqi) scale(1.05); } }
  @keyframes ring { 0%, 45% { transform: scale(1.18); opacity: .8; } 100% { transform: scale(1.8); opacity: 0; } }
  .b-ms .word { justify-self: start; margin-left: 3cqi; font-size: 8.6cqi; font-weight: 700; line-height: 1; letter-spacing: -.2cqi; text-shadow: 0 .3cqi .6cqi rgba(0,0,0,.3); }
  .b-ms .word small { display: block; margin-top: 2.2cqi; font-size: 3cqi; font-weight: 400; color: #00bfff; letter-spacing: .3cqi; text-transform: uppercase; }
</style></head>
<body><div class="b b-ms">
  <div class="pads"><i class="pad"></i><i class="pad hot"><b class="ring"></b></i><i class="pad"></i><i class="pad"></i><i class="pad"></i><i class="pad"></i></div>
  <div class="word">Meme<br>Soundboard<small>vine boom · airhorn</small></div>
</div></body></html>
