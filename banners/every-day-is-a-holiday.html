<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Oswald:wght@600&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Every Day Is A Holiday: a tear-off desk calendar ───────── */
  .b-hol { background: #fdf1d6; color: #2a1f1a; font-family: 'Abril Fatface', Georgia, serif; }
  .b-hol .pad { position: absolute; left: 8cqi; top: 4cqi; width: 26cqi; height: 29.5cqi; }
  .b-hol .sheet { position: absolute; inset: 0; background: #fff; border-radius: .6cqi; overflow: hidden;
    box-shadow: 0 .3cqi 0 #e7dcc4, 0 .6cqi 0 #fff, 0 .9cqi 0 #e7dcc4, 0 1.2cqi 0 #fff, 0 1.5cqi 1cqi rgba(80,50,20,.25); }
  .b-hol .sheet .mo { background: #e23b3b; color: #fff; font-family: 'Oswald', sans-serif; font-weight: 600;
    text-align: center; font-size: 3.6cqi; letter-spacing: .8cqi; padding: 1cqi 0 .8cqi; }
  .b-hol .sheet .day { text-align: center; font-size: 14cqi; line-height: 1.05; }
  .b-hol .sheet .what { text-align: center; font-family: Georgia, serif; font-style: italic; font-size: 2.3cqi; color: #8a7a6c; }
  .b-hol .top { transform-origin: 50% 0; animation: tear 3.6s ease-in infinite; }
  @keyframes tear { 0%, 55% { transform: none; opacity: 1; } 80% { transform: translate(6cqi, 34cqi) rotate(28deg); opacity: 0; }
    81%, 89% { transform: none; opacity: 0; } 100% { transform: none; opacity: 1; } }
  .b-hol .rings { position: absolute; left: 8cqi; top: 3cqi; width: 26cqi; display: flex; justify-content: space-around; padding: 0 4cqi; z-index: 2; }
  .b-hol .rings i { width: 1.4cqi; height: 2.4cqi; border-radius: 1cqi; background: #6b6157; }
  .b-hol .word { position: absolute; left: 41cqi; right: 4cqi; font-size: 8.6cqi; line-height: 1.02; }
  .b-hol .word em { font-style: normal; color: #e23b3b; }
</style></head>
<body><div class="b b-hol">
  <div class="pad">
    <div class="sheet"><div class="mo">NOV</div><div class="day">16</div><div class="what">Fast Food Day</div></div>
    <div class="sheet top"><div class="mo">NOV</div><div class="day">14</div><div class="what">Pickle Day</div></div>
  </div>
  <div class="rings"><i></i><i></i><i></i></div>
  <div class="word">Every Day<br>Is A <em>Holiday</em></div>
</div></body></html>
