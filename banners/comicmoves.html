<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Comic Move Attacks: halftone, starburst, Bangers ──────── */
  .b-comic { font-family: 'Bangers', 'Arial Black', sans-serif; background-color: #ff4400;
    background-image: radial-gradient(circle at center, rgba(255,100,0,.8) 0%, rgba(200,0,0,.9) 100%),
      repeating-radial-gradient(circle at center, rgba(0,0,0,.2) 0 3px, transparent 3px 6px);
    background-size: 100% 100%, 20px 20px; }
  .b-comic .lines { position: absolute; inset: -40%;
    background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,243,214,.22) 0 2deg, transparent 2deg 9deg); }
  .b-comic .bw { position: absolute; filter: drop-shadow(1cqi 1cqi 0 #201a17); animation: bam 1s ease-in-out infinite; }
  .b-comic .burst { width: 74cqi; height: 34cqi; background: #f7c948;
    clip-path: polygon(50% 0, 56% 22%, 70% 4%, 69% 26%, 90% 12%, 80% 34%, 100% 36%, 83% 50%, 100% 66%, 79% 68%, 88% 92%, 67% 77%, 60% 100%, 50% 80%, 39% 100%, 33% 78%, 11% 92%, 20% 68%, 0 64%, 17% 50%, 0 34%, 20% 33%, 10% 10%, 31% 25%, 30% 3%, 44% 22%); }
  @keyframes bam { 50% { transform: scale(1.06) rotate(2deg); } }
  .b-comic .word { position: relative; font-size: 9.6cqi; line-height: .9; text-align: center; color: #fff3d6; letter-spacing: .3cqi;
    -webkit-text-stroke: .5cqi #201a17; paint-order: stroke fill; text-shadow: .7cqi .7cqi 0 #201a17; transform: rotate(-4deg); }
  .b-comic .word span { color: #ff4400; }
</style></head>
<body><div class="b b-comic">
  <div class="lines"></div>
  <div class="bw"><div class="burst"></div></div>
  <div class="word">Comic Move<br><span>Attacks</span></div>
</div></body></html>
