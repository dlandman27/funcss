<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Your Birthday, Your Color!: a paint chip, the hex, Arial, the page tinting ── */
  .b-bday { --c: #f4a6c1; background: color-mix(in srgb, var(--c) 28%, #f0f0f0); font-family: Arial, sans-serif; color: #333;
    grid-template-columns: auto 1fr; gap: 6cqi; padding: 0 5cqi 0 9cqi; transition: background .8s ease; }
  .b-bday .chip { width: 24cqi; background: #fff; padding: 1.4cqi 1.4cqi 0; box-shadow: 0 1cqi 2.6cqi rgba(0,0,0,.18); transform: rotate(-3deg); }
  .b-bday .swatch { height: 21cqi; background: var(--c); transition: background .8s ease; }
  .b-bday .chip p { margin: 0; padding: 1.4cqi .4cqi 1.6cqi; font: 700 3.4cqi 'Courier New', monospace; color: #222; }
  .b-bday .chip p span { display: block; font: 400 2.2cqi Arial, sans-serif; color: #888; margin-top: .4cqi; letter-spacing: .2cqi; text-transform: uppercase; }
  .b-bday h1 { margin: 0; font-size: 8.2cqi; font-weight: bold; line-height: 1.08; color: #333; }
  .b-bday .date { display: inline-block; margin-top: 2.4cqi; padding: 1cqi 2cqi; border: .3cqi solid #ddd; border-radius: 1.2cqi; background: #fff;
    font-size: 2.8cqi; color: #555; }
</style></head>
<body><div class="b b-bday" id="b">
  <div class="chip"><div class="swatch"></div><p id="hex">#F4A6C1<span id="day">March 14</span></p></div>
  <div>
    <h1>Your Birthday,<br>Your Color!</h1>
  </div>
</div>
<script>
const days = [['#F4A6C1','March 14'],['#5AA0DB','July 2'],['#B7CE3C','October 30'],['#F7C948','January 9'],['#A98FD0','May 21']];
let i = 0; const b = document.getElementById('b'), hex = document.getElementById('hex');
if (LIVE) setInterval(() => { i = (i + 1) % days.length; const [c, d] = days[i]; b.style.setProperty('--c', c); hex.innerHTML = `${c}<span>${d}</span>`; }, 1600);
</script></body></html>
