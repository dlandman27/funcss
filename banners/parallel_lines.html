<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Parallel Lines: gold rails toward a vanishing point ───── */
  .b-pl { background: #0e0d0c; font-family: Georgia, 'Times New Roman', serif; color: #f2ede2; place-items: start start; }
  .b-pl canvas { position: absolute; inset: 0; width: 800px; height: 300px; }
  .b-pl .word { position: relative; margin: 6cqi 0 0 6cqi; font-size: 9cqi; line-height: 1.05; }
  .b-pl .word small { display: block; margin-top: 1.6cqi; font-size: 3cqi; font-style: italic; opacity: .45; }
</style></head>
<body><div class="b b-pl">
  <canvas id="c" width="800" height="300"></canvas>
  <div class="word">Parallel<br>Lines<small>still parallel. i checked.</small></div>
</div>
<script>
const cv = document.getElementById('c'), g = cv.getContext('2d'), W = 800, H = 300;
const VX = 560, VY = 92, NEAR = 230; // half gap at bottom
let ph = 0;
(function loop() {
  g.fillStyle = '#0e0d0c'; g.fillRect(0, 0, W, H);
  const glow = g.createRadialGradient(VX, VY, 0, VX, VY, 140); glow.addColorStop(0, 'rgba(247,201,72,.18)'); glow.addColorStop(1, 'rgba(247,201,72,0)');
  g.fillStyle = glow; g.fillRect(0, 0, W, H);
  // ties: z from 1 (near) to far; screen depth s = 1/z
  for (let i = 0; i < 40; i++) {
    const z = 1 + ((i + ph) % 40) * 0.55, s = 1 / z, y = VY + (H + 40 - VY) * s, hw = NEAR * 1.25 * s;
    g.strokeStyle = 'rgba(242,237,226,' + (0.5 * Math.min(1, s * 2.2)) + ')'; g.lineWidth = Math.max(1, 6 * s);
    g.beginPath(); g.moveTo(VX - hw, y); g.lineTo(VX + hw, y); g.stroke();
  }
  g.strokeStyle = 'rgba(247,201,72,.9)'; g.lineWidth = 2.4;
  [-1, 1].forEach(d => { g.beginPath(); g.moveTo(VX + d * NEAR * 1.2, H + 40); g.lineTo(VX + d * 1.5, VY); g.stroke(); });
  if (LIVE) { ph = (ph + 0.02) % 40; requestAnimationFrame(loop); }
})();
</script></body></html>
