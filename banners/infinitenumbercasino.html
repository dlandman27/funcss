<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Limelight&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Infinite Number Casino: green felt, a bulb-lit marquee, the number counter ── */
  .b-casino { background: radial-gradient(ellipse at top, #1e5c3a 0%, #123a24 60%, #0b2416 100%); color: #fff8ef; font-family: Georgia, serif; }
  .b-casino .sign { position: relative; padding: 3.4cqi 6cqi 3cqi; border: .6cqi solid #f7c948; border-radius: 2cqi; background: rgba(11, 36, 22, .7); text-align: center;
    box-shadow: inset 0 0 0 1cqi rgba(11,36,22,.9), inset 0 0 0 1.3cqi rgba(247,201,72,.4); }
  .b-casino .bulb { position: absolute; width: 1.3cqi; height: 1.3cqi; border-radius: 50%; background: #fff3cf; box-shadow: 0 0 1.4cqi #f7c948; animation: chase 1.2s steps(1) infinite; }
  @keyframes chase { 50% { background: #8a6d22; box-shadow: none; } }
  .b-casino .word { font-family: 'Limelight', Georgia, serif; font-size: 7.6cqi; color: #f7c948; line-height: 1.05; text-shadow: 0 .4cqi 0 #8a6d22, 0 0 3cqi rgba(247,201,72,.35); }
  .b-casino .num { display: inline-block; margin-top: 2cqi; font-family: 'Courier New', monospace; font-weight: 700; font-size: 3.4cqi; letter-spacing: .3cqi;
    background: #fff8ef; color: #201a17; padding: .5cqi 2cqi; border-radius: .6cqi; font-variant-numeric: tabular-nums; }
  .b-casino .chip { position: absolute; width: 9cqi; height: 9cqi; border-radius: 50%; border: 1.2cqi dashed #fff8ef; background: #c0392b; box-shadow: 0 0 0 .5cqi #c0392b; }
</style></head>
<body><div class="b b-casino">
  <div class="chip" style="left:5cqi;top:5cqi;transform:rotate(12deg)"></div>
  <div class="chip" style="right:6cqi;bottom:5cqi;background:#2b5fa8;box-shadow:0 0 0 .5cqi #2b5fa8"></div>
  <div class="sign" id="sign">
    <div class="word">Infinite Number<br>Casino</div>
    <div class="num">NOW PLAYING: <span id="n">#1,048,577</span></div>
  </div>
</div>
<script>
document.fonts.ready.then(() => {
const sign = document.getElementById('sign'); const W = sign.clientWidth, H = sign.clientHeight; const gap = 30;
const pts = [];
for (let x = 20; x <= W - 20; x += gap) { pts.push([x, 0]); }
for (let y = gap; y <= H - gap; y += gap) { pts.push([W, y]); }
for (let x = W - 20; x >= 20; x -= gap) { pts.push([x, H]); }
for (let y = H - gap; y >= gap; y -= gap) { pts.push([0, y]); }
pts.forEach(([x, y], i) => { const b = document.createElement('i'); b.className = 'bulb';
  b.style.left = (x - 5) + 'px'; b.style.top = (y - 5) + 'px'; b.style.animationDelay = (i % 2 ? -.6 : 0) + 's'; sign.appendChild(b); });
});
let n = 1048577; const ne = document.getElementById('n');
if (LIVE) setInterval(() => { n++; ne.textContent = '#' + n.toLocaleString('en-US'); }, 220);
</script></body></html>
