<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── DVD Bounce: the logo, in mid-bounce ───────────────────── */
  .b-dvd { background: #000; font-family: 'Arial Black', Arial, sans-serif; }
  .b-dvd .logo { position: relative; text-align: center; color: #ff00ff; transform: skewX(-12deg); }
  .b-dvd .logo b { display: block; font-size: 17cqi; line-height: .9; letter-spacing: -1cqi; font-style: italic; }
  .b-dvd .logo .disc { display: block; margin: 1cqi auto 0; width: 34cqi; height: 5cqi; border-radius: 50%;
    background: currentColor; position: relative; }
  .b-dvd .logo .disc::after { content: 'BOUNCE'; position: absolute; inset: 0; display: grid; place-items: center;
    color: #000; font-size: 3.4cqi; letter-spacing: 1cqi; }
  .b-dvd .ghost { position: absolute; color: #00ffff; opacity: .25; font-size: 7cqi; font-style: italic; transform: skewX(-12deg); }
</style></head>
<body><div class="b b-dvd">
      <span class="ghost" style="left:6%;top:10%">DVD</span>
      <span class="ghost" style="right:8%;bottom:12%;color:#ffff00">DVD</span>
      <div class="logo"><b>DVD</b><span class="disc"></span></div>
</div></body></html>
