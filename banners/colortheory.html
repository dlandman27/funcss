<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Life Of Color Theory: today's color fills the page ────── */
  .b-ct { background: #d4708a; place-items: center end; font-family: Georgia, 'Times New Roman', serif; color: #201a17; transition: background-color 1.2s ease; }
  .b-ct .card { margin-right: 7cqi; background: rgba(255,248,239,.93); padding: 3.4cqi 4.6cqi 3cqi; box-shadow: 0 1cqi 4cqi rgba(0,0,0,.18); }
  .b-ct .word { font-size: 7.4cqi; line-height: 1.05; }
  .b-ct .day { margin-top: 1.6cqi; font-style: italic; font-size: 2.8cqi; color: rgba(32,26,23,.55); }
  .b-ct .code { display: inline-block; margin-top: 1.4cqi; font-family: 'Courier New', Courier, monospace; font-size: 3.2cqi; background: rgba(32,26,23,.06); padding: .4cqi 1.2cqi; }
</style></head>
<body><div class="b b-ct" id="b">
  <div class="card">
    <div class="word">Life Of Color Theory</div>
    <div class="code" id="hex">#D4708A</div>
    <div class="day">one color a day &middot; 16,777,216 to go</div>
  </div>
</div>
<script>
const b = document.getElementById('b'), hex = document.getElementById('hex');
const cols = ['#d4708a', '#d4708b', '#d4708c', '#d4708d', '#d4708e', '#d4708f'];
let i = 0;
if (LIVE) setInterval(() => {
  i = (i + 1) % cols.length; const c = cols[i];
  b.style.backgroundColor = c; hex.textContent = c.toUpperCase();
}, 1400);
</script></body></html>
