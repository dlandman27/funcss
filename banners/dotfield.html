<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Dot Field: dark grid of dots, a warm glow where you hover ─ */
  .b-dot { background: #0a0908; font-family: Georgia, 'Times New Roman', serif; place-items: center start; }
  .b-dot canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .b-dot .word { position: relative; margin-left: 8cqi; font-size: 11cqi; color: #fff6df; letter-spacing: .3cqi;
    text-shadow: 0 0 3cqi #0a0908, 0 0 1cqi #0a0908; }
</style></head>
<body><div class="b b-dot">
  <canvas id="f" width="800" height="300"></canvas>
  <div class="word">Dot Field</div>
</div>
<script>
const c = document.getElementById('f'), g = c.getContext('2d'), S = 20;
let t = 0;
function draw() {
  g.clearRect(0, 0, 800, 300);
  const hx = 590 + 120 * Math.cos(t), hy = 150 + 60 * Math.sin(t * 1.7);
  for (let x = S / 2; x < 800; x += S) for (let y = S / 2; y < 300; y += S) {
    const d = Math.hypot(x - hx, y - hy), k = Math.max(0, 1 - d / 150) ** 2;
    const r = 1.6 + k * 5.5;
    if (k > .02) { g.fillStyle = `rgba(247,201,72,${(k * .35).toFixed(3)})`; g.beginPath(); g.arc(x, y, r * 2.2, 0, 7); g.fill(); }
    g.fillStyle = k > .02 ? `rgb(255,${(246 - k * 40) | 0},${(223 - k * 140) | 0})` : 'rgba(255,246,223,.22)';
    g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
}
draw();
if (LIVE) (function loop() { t += .012; draw(); requestAnimationFrame(loop); })();
</script></body></html>
