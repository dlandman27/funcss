<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Hatch The Egg: one white egg and a very long countdown ── */
  .b-egg { background: #f0f8ff; color: #333; font-family: Arial, sans-serif; place-items: center start; }
  .b-egg .word { position: relative; padding-left: 7cqi; font-size: 8.4cqi; font-weight: 700; letter-spacing: -.02em; line-height: 1; }
  .b-egg .timer { margin-top: 2.6cqi; font-size: 4.4cqi; font-weight: 400; color: #555; font-variant-numeric: tabular-nums; letter-spacing: 0; }
  .b-egg .egg { position: absolute; right: 9cqi; top: 50%; width: 18cqi; height: 25cqi; margin-top: -13cqi; background: #fff;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; box-shadow: 0 1.2cqi 3.6cqi rgba(0,0,0,.1), inset -1.6cqi -1.6cqi 3cqi rgba(160,180,200,.18);
    animation: wiggle 2.4s infinite; transform-origin: 50% 85%; }
  @keyframes wiggle { 0%, 70%, 100% { transform: rotate(0); } 75% { transform: rotate(6deg); } 80% { transform: rotate(-6deg); } 85% { transform: rotate(5deg); } 90% { transform: rotate(-4deg); } }
  .b-egg .egg svg { position: absolute; left: 22%; top: 30%; width: 50%; }
</style></head>
<body><div class="b b-egg">
  <div class="word">Hatch The Egg<div class="timer" id="t">2d 23h 59m 41s</div></div>
  <div class="egg"><svg viewBox="0 0 50 30"><path d="M2 8 L12 18 L20 6 L28 20 L36 10" fill="none" stroke="#c9ced4" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg></div>
</div>
<script>
let s = 3 * 86400 - 19;
const t = document.getElementById('t');
(function tick() {
  if (!LIVE) return;
  s--; const d = (s / 86400) | 0, h = (s % 86400 / 3600) | 0, m = (s % 3600 / 60) | 0;
  t.textContent = `${d}d ${h}h ${m}m ${s % 60}s`;
  setTimeout(tick, 1000);
})();
</script></body></html>
