<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── The Commit Message: a GitHub PR, checks failing ───────── */
  .b-cm { background: #ffffff; color: #1f2328; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; place-items: center start; padding: 0 6cqi; }
  .b-cm .top { display: flex; align-items: baseline; gap: 1.6cqi; }
  .b-cm .word { font-size: 7.4cqi; font-weight: 400; letter-spacing: -.1cqi; }
  .b-cm .num { font-size: 7.4cqi; color: #59636e; font-weight: 300; }
  .b-cm .meta { display: flex; align-items: center; gap: 1.4cqi; margin-top: 1.6cqi; font-size: 2.9cqi; color: #59636e; }
  .b-cm .state { display: inline-flex; align-items: center; gap: .8cqi; background: #1f883d; color: #fff; font-weight: 600; padding: .8cqi 2cqi; border-radius: 4cqi; font-size: 2.9cqi; }
  .b-cm .branch { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background: #ddf4ff; color: #0969da; padding: .1cqi .8cqi; border-radius: .8cqi; }
  .b-cm .checks { margin-top: 3cqi; border: 1px solid #d1d9e0; border-radius: .8cqi; width: 76cqi; font-size: 3.1cqi; }
  .b-cm .check { display: flex; align-items: center; gap: 1.4cqi; padding: 1.2cqi 2cqi; border-top: 1px solid #d1d9e0; }
  .b-cm .check:first-child { border-top: 0; }
  .b-cm .check b { font-weight: 600; } .b-cm .check small { color: #59636e; }
  .b-cm .x { color: #d1242f; font-weight: 700; } .b-cm .ok { color: #1a7f37; font-weight: 700; }
  .b-cm .req { margin-left: auto; border: 1px solid #d1d9e0; border-radius: 4cqi; padding: 0 1cqi; font-size: 2.3cqi; color: #59636e; }
  .b-cm .new { animation: rule 2.4s steps(1) infinite; }
  @keyframes rule { 50% { background: #fff8c5; } }
</style></head>
<body><div class="b b-cm">
  <div>
    <div class="top"><span class="word">The Commit Message</span><span class="num">#1337</span></div>
    <div class="meta"><span class="state">&#x2387; Open</span> wants to merge 1 commit into <span class="branch">main</span></div>
    <div class="checks">
      <div class="check"><span class="ok">&#x2713;</span><b>subject-max-length</b><small>— Successful</small><span class="req">Required</span></div>
      <div class="check new"><span class="x">&#x2715;</span><b>must-be-a-haiku</b><small>— Failing</small><span class="req">Required</span></div>
    </div>
  </div>
</div></body></html>
