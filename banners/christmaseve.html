<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* The site's own look: snowy mountain photo, frosted panel, script title with a blue glow */
  .b {
    background: #cfdbe6 url('../sites/christmaseve/christmas.jpg') center 38% / cover no-repeat;
    font-family: Arial, sans-serif;
    color: #fff;
  }
  .panel {
    position: relative;
    z-index: 1;
    width: 82cqi;
    padding: 2.4cqi 3cqi 2.2cqi;
    text-align: center;
    background: rgba(0, 0, 0, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 2cqi;
    box-shadow: 0 0 2.5cqi rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(8px);
  }
  h1 {
    margin: 0 0 1.6cqi;
    padding: 1.4cqi 2cqi;
    font: bold 6.6cqi/1.1 'Brush Script MT', 'Mountains of Christmas', cursive;
    letter-spacing: .3cqi;
    white-space: nowrap;
    border: .5cqi double #fff;
    border-radius: 1.2cqi;
    background: rgba(0, 0, 0, 0.4);
    text-shadow: .25cqi .25cqi .5cqi rgba(0, 0, 0, .8), 0 0 2.5cqi rgba(65, 105, 225, .8);
    box-shadow: 0 0 2cqi rgba(0, 123, 255, .5);
  }
  .eves {
    font-size: 2.6cqi;
    line-height: 1.5;
    opacity: .92;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: clip;
  }
  .snow { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
  .snow i {
    position: absolute;
    top: -4cqi;
    font-style: normal;
    font-size: 2cqi;
    color: #fff;
    animation: fall linear infinite;
  }
  @keyframes fall { to { transform: translateY(44cqi); } }
</style></head>
<body><div class="b">
  <div class="panel">
    <h1>Christmas Eve Eve Eve...</h1>
    <div class="eves">Christmas eve eve eve eve eve eve eve eve eve eve eve eve eve eve eve eve eve eve eve eve eve eve eve eve</div>
  </div>
  <div class="snow" id="snow"></div>
</div>
<script>
  // falling ❄, spread over the whole fall so the still frame already has snow everywhere
  const snow = document.getElementById('snow');
  for (let i = 0; i < 34; i++) {
    const f = document.createElement('i');
    f.textContent = '❄';
    const dur = 3 + Math.random() * 3;
    f.style.left = Math.random() * 100 + '%';
    f.style.opacity = 0.35 + Math.random() * 0.65;
    f.style.animationDuration = dur + 's';
    f.style.animationDelay = (-Math.random() * dur) + 's';
    snow.appendChild(f);
  }
</script></body></html>
