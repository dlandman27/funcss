<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Stardos+Stencil:wght@700&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Don't Press The Button: hazard panel, big red button ──── */
  .b-btn { background: #2b2d31; font-family: 'Stardos Stencil', 'Arial Black', sans-serif; color: #f5d000; grid-template-columns: auto auto; gap: 6cqi; }
  .b-btn::before, .b-btn::after { content: ''; position: absolute; left: 0; right: 0; height: 3cqi;
    background: repeating-linear-gradient(-45deg, #f5d000 0 2.4cqi, #1a1a1a 2.4cqi 4.8cqi); }
  .b-btn::before { top: 0; } .b-btn::after { bottom: 0; }
  .b-btn .word { font-size: 8.4cqi; line-height: 1; text-transform: uppercase; letter-spacing: .2cqi; }
  .b-btn .word span { color: #e8e6e1; }
  .b-btn .base { position: relative; width: 26cqi; height: 26cqi; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #5a5d63, #2a2b2e 70%);
    box-shadow: 0 1.4cqi 3cqi rgba(0,0,0,.6), inset 0 0 0 1cqi #45474c; display: grid; place-items: center; }
  .b-btn .red { width: 16cqi; height: 16cqi; border-radius: 50%; background: radial-gradient(circle at 38% 30%, #ff7b6b, #e3261b 45%, #9c1209);
    box-shadow: 0 1.2cqi 0 #6d0b05, 0 1.6cqi 2cqi rgba(0,0,0,.5); transform: translateY(-1cqi); animation: tempt 1.8s ease-in-out infinite; }
  @keyframes tempt { 0%, 100% { transform: translateY(-1cqi); filter: brightness(1); } 50% { transform: translateY(-1cqi) scale(1.05); filter: brightness(1.25); } }
</style></head>
<body><div class="b b-btn">
  <div class="word">Don't Press<br><span>The Button</span></div>
  <div class="base"><div class="red"></div></div>
</div></body></html>
