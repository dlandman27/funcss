<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Brawlers: the title-screen logo itself, sunburst, damage percent ── */
  .b-brawl { background:
      repeating-conic-gradient(from -8deg at 50% -12%, rgba(247,201,72,.08) 0 5deg, transparent 5deg 15deg),
      radial-gradient(ellipse at 50% 0%, #41306b 0%, #1b1830 62%);
    font-family: 'Arial Black', 'Arial Bold', Arial, sans-serif; color: #fff; }
  .b-brawl::before { content: ''; position: absolute; left: 14%; right: 14%; bottom: 6cqi; height: 2.6cqi; border-radius: 0 0 2cqi 2cqi;
    background: linear-gradient(180deg, #6b5ba8, #37306b); border-top: .6cqi solid #9d8fe0; box-shadow: 0 1cqi 0 rgba(0,0,0,.45); }
  .b-brawl .logo { position: relative; margin-top: -7cqi; font: 900 14cqi/.95 'Arial Black', 'Arial Bold', Arial, sans-serif; letter-spacing: .1cqi;
    background: linear-gradient(180deg, #fff3c4 0%, #f7c948 42%, #f47b28 72%, #f0563e 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 1cqi #201a17; paint-order: stroke fill;
    filter: drop-shadow(.9cqi .9cqi 0 rgba(10,8,18,.9)); transform: rotate(-3deg); text-transform: uppercase;
    animation: logobob 3.2s ease-in-out infinite; }
  @keyframes logobob { 0%, 100% { transform: rotate(-3deg) scale(1); } 50% { transform: rotate(-2.2deg) scale(1.03); } }
  .b-brawl .pct { position: absolute; bottom: 9.4cqi; display: flex; gap: 30cqi; }
  .b-brawl .pct b { font-size: 4.6cqi; font-style: italic; color: #fff; text-shadow: .3cqi .3cqi 0 #201a17, -.2cqi -.2cqi 0 #201a17; }
  .b-brawl .pct b:last-child { color: #ff7f6a; animation: hit .9s steps(1) infinite; }
  @keyframes hit { 50% { color: #ffb3a6; transform: scale(1.15) rotate(-4deg); } }
  .b-brawl .pct b small { font-size: 2.6cqi; }
</style></head>
<body><div class="b b-brawl">
  <div class="logo">Brawlers</div>
  <div class="pct"><b>12<small>%</small></b><b>137<small>%</small></b></div>
</div></body></html>
