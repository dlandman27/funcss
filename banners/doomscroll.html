<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Source+Serif+4:wght@600&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Doomscroll: dim-mode feed that never ends ─────────────── */
  .b-doom { background: #15202b; font-family: 'DM Sans', sans-serif; color: #e7e9ea; grid-template-columns: 1.1fr 1fr; padding-left: 6cqi; }
  .b-doom .word { font-weight: 700; font-size: 9.6cqi; letter-spacing: -.4cqi; line-height: 1; }
  .b-doom .word small { display: block; margin-top: 1.4cqi; font-size: 2.8cqi; font-weight: 500; letter-spacing: 0; color: #71767b; }
  .b-doom .word small b { color: #f4212e; }
  .b-doom .feed { position: relative; height: 100%; overflow: hidden; border-left: 1px solid #2f3b47; border-right: 1px solid #2f3b47; margin-right: 5cqi;
    -webkit-mask: linear-gradient(transparent, #000 18%, #000 82%, transparent); mask: linear-gradient(transparent, #000 18%, #000 82%, transparent); }
  .b-doom .track { animation: scroll 9s linear infinite; }
  @keyframes scroll { to { transform: translateY(-50%); } }
  .b-doom .post { display: flex; gap: 1.4cqi; padding: 2cqi 2.2cqi; border-bottom: 1px solid #2f3b47; }
  .b-doom .av { flex: none; width: 4.4cqi; height: 4.4cqi; border-radius: 50%; }
  .b-doom .h { font-family: 'Source Serif 4', serif; font-weight: 600; font-size: 2.5cqi; line-height: 1.25; }
  .b-doom .m { font-size: 1.8cqi; color: #71767b; margin-bottom: .4cqi; }
</style></head>
<body><div class="b b-doom">
  <div class="word">Doomscroll<small><b>&#x25CF;</b> 4,812 new headlines</small></div>
  <div class="feed"><div class="track" id="track"></div></div>
</div>
<script>
const H = [
  ['#1d9bf0', 'Local Man Finds Parking Spot On First Try'],
  ['#f4212e', 'Weather Expected To Continue Being Weather'],
  ['#00ba7c', 'New Study Reverses Findings Of Previous Study'],
  ['#f7c948', 'Scientists Discover New Shade Of Beige'],
  ['#a98fd0', 'Area Restaurant Opens, Also Closes'],
  ['#ff7fa5', 'Local Ghost Politely Asks To Be Included In Census'],
];
const html = H.map(([c, h]) => `<div class="post"><span class="av" style="background:${c}"></span><div><div class="m">@thefeed · 1m</div><div class="h">${h}</div></div></div>`).join('');
document.getElementById('track').innerHTML = html + html;
</script></body></html>
