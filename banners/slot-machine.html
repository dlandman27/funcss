<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Project Idea Slot Machine: Bootstrap-blue reels ───────── */
  .b-slot { background: #f8f9fa; color: #212529;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
  .b-slot .wrap { display: flex; flex-direction: column; align-items: center; gap: 3.2cqi; }
  .b-slot h1 { margin: 0; font-size: 7cqi; font-weight: 700; letter-spacing: -.15cqi; }
  .b-slot .reels { display: flex; gap: 2cqi; }
  .b-slot .reel { width: 20cqi; height: 8.5cqi; background: #fff; border: .25cqi solid #dee2e6; border-radius: 1cqi;
    box-shadow: 0 .4cqi 1.2cqi rgba(0,0,0,.06); overflow: hidden; position: relative; }
  .b-slot .reel .strip { position: absolute; left: 0; right: 0; top: 0; }
  .b-slot .reel span { display: grid; place-items: center; height: 8.5cqi; font-size: 3.6cqi; font-weight: 600; color: #007bff; }
  .b-slot .reel::after { content: ''; position: absolute; inset: 0;
    background: linear-gradient(#fff 0, transparent 25%, transparent 75%, #fff 100%); opacity: .6; }
  .b-slot .lever { width: 5.5cqi; height: 8.5cqi; border-radius: 1cqi; background: #007bff; display: grid; place-items: center; }
  .b-slot .lever i { width: 0; height: 0; border-left: 1.6cqi solid #fff; border-top: 1.2cqi solid transparent; border-bottom: 1.2cqi solid transparent; }
  .b-slot .strip { animation: spin 4s cubic-bezier(.5,0,.3,1) infinite; }
  .b-slot .reel:nth-child(2) .strip { animation-delay: .25s; }
  .b-slot .reel:nth-child(3) .strip { animation-delay: .5s; }
  @keyframes spin { 0%, 15% { transform: translateY(0); } 55%, 100% { transform: translateY(-34cqi); } }
</style></head>
<body><div class="b b-slot">
  <div class="wrap">
    <h1>Project Idea Slot Machine</h1>
    <div class="reels">
      <div class="reel"><div class="strip"><span>App</span><span>Game</span><span>Bot</span><span>Zine</span><span>Website</span></div></div>
      <div class="reel"><div class="strip"><span>Cats</span><span>Weather</span><span>Pizza</span><span>Space</span><span>Plants</span></div></div>
      <div class="reel"><div class="strip"><span>Minimal</span><span>Retro</span><span>Brutalist</span><span>Y2K</span><span>Noir</span></div></div>
      <div class="lever"><i></i></div>
    </div>
  </div>
</div></body></html>
