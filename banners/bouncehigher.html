<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Winter Bells: night-blue sky, a ladder of gold bells, a snow bunny on the way up ── */
  .b-bells { background: linear-gradient(180deg, #10192c 0%, #1a2740 55%, #2b3d5e 100%); font-family: Georgia, 'Times New Roman', serif; color: #fdfdfb;
    place-items: center start; }
  .b-bells .snow { position: absolute; inset: 0; }
  .b-bells .snow i { position: absolute; width: .7cqi; height: .7cqi; border-radius: 50%; background: #c9d4e6; opacity: .75; animation: fall 6s linear infinite; }
  @keyframes fall { to { transform: translate(-2cqi, 40cqi); } }
  .b-bells .word { position: relative; padding-left: 7cqi; font-size: 11cqi; font-style: italic; line-height: 1; letter-spacing: -.1cqi;
    text-shadow: 0 .5cqi 2cqi rgba(0,0,0,.4); }
  .b-bells .word small { display: block; margin-top: 2cqi; font-size: 2.8cqi; font-style: normal; letter-spacing: .5cqi; text-transform: uppercase; color: #8ea0c0; }
  .b-bells .word small b { color: #f7c948; font-weight: 400; }
  .b-bells svg { position: absolute; right: 2cqi; top: 0; height: 100%; width: 42cqi; overflow: visible; }
  .b-bells .bell { animation: ring 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 0; }
  @keyframes ring { 25% { transform: rotate(14deg); } 75% { transform: rotate(-14deg); } }
  .b-bells .bunny { animation: jump 1.2s cubic-bezier(.3,0,.3,1) infinite; }
  @keyframes jump { 50% { transform: translate(-6px, -38px); } }
</style></head>
<body><div class="b b-bells">
  <div class="snow" id="snow"></div>
  <div class="word">Winter Bells<small>combo <b>×4</b> · climbing</small></div>
  <svg viewBox="0 0 336 300">
    <defs><g id="bell"><path d="M-14 10 C -14 -10, -9 -18, 0 -18 C 9 -18, 14 -10, 14 10 L 18 15 L -18 15z" fill="#f7c948" stroke="#7a5a10" stroke-width="2"/>
      <circle cx="0" cy="18" r="4.5" fill="#e0a92a" stroke="#7a5a10" stroke-width="1.6"/><path d="M-6 -10 q 2 -4 6 -4" stroke="#fff3c4" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M-3 -18 a 3 3 0 1 1 6 0" fill="none" stroke="#7a5a10" stroke-width="2"/></g></defs>
    <g opacity=".95">
      <g transform="translate(272 58) scale(1.6)"><use href="#bell" class="bell"/></g>
      <g transform="translate(140 92) scale(1.25)"><use href="#bell" class="bell" style="animation-delay:-.4s"/></g>
      <g transform="translate(240 160) scale(1.1)"><use href="#bell" class="bell" style="animation-delay:-.8s"/></g>
    </g>
    <g fill="#f7c948" opacity=".9"><circle cx="200" cy="198" r="2.4"/><circle cx="226" cy="206" r="3"/><circle cx="214" cy="186" r="1.8"/></g>
    <g class="bunny" transform="translate(0,0)">
      <g transform="translate(140 236) scale(1.45)">
        <ellipse cx="0" cy="0" rx="20" ry="17" fill="#fdfdfb"/>
        <circle cx="16" cy="-14" r="12" fill="#fdfdfb"/>
        <ellipse cx="12" cy="-34" rx="4.5" ry="13" fill="#fdfdfb" transform="rotate(-10 12 -34)"/>
        <ellipse cx="22" cy="-33" rx="4.5" ry="13" fill="#fdfdfb" transform="rotate(14 22 -33)"/>
        <ellipse cx="22" cy="-33" rx="2" ry="8" fill="#ff7fa5" transform="rotate(14 22 -33)"/>
        <circle cx="20" cy="-16" r="2" fill="#201a17"/><circle cx="-19" cy="-2" r="6" fill="#fdfdfb"/>
      </g>
    </g>
  </svg>
</div>
<script>
const s = document.getElementById('snow');
for (let i = 0; i < 46; i++) { const f = document.createElement('i'); f.style.left = Math.random() * 100 + '%'; f.style.top = (Math.random() * 120 - 20) + '%';
  f.style.animationDelay = (-Math.random() * 6) + 's'; f.style.transform = `scale(${.5 + Math.random()})`; s.appendChild(f); }
</script></body></html>
