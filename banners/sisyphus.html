<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Sisyphus: black-figure pottery, boulder on a slope ────── */
  .b-sis { background: #c8642c; font-family: 'Marcellus', serif; color: #1a0f0a; place-items: start; }
  .b-sis .band { position: absolute; left: 0; right: 0; height: 2.6cqi;
    background: repeating-linear-gradient(90deg, #1a0f0a 0 1.4cqi, transparent 1.4cqi 2.8cqi); opacity: .9; }
  .b-sis .band.t { top: 2cqi; } .b-sis .band.bt { bottom: 2cqi; }
  .b-sis svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .b-sis h1 { position: relative; margin: 9cqi 0 0 6cqi; font-weight: 400; font-size: 10cqi; letter-spacing: 1.2cqi; line-height: 1; }
  .b-sis h1 small { display: block; font-size: 3.2cqi; letter-spacing: .6cqi; margin-top: 1.6cqi; opacity: .8; }
  .b-sis .climber { animation: push 4s ease-in-out infinite; transform-box: view-box; }
  @keyframes push { 0%, 100% { transform: translate(0, 0); } 70% { transform: translate(-30px, 16px); } 85% { transform: translate(14px, -7px); } }
  .b-sis .rock { animation: roll 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes roll { 0%, 100% { transform: rotate(0); } 70% { transform: rotate(-60deg); } 85% { transform: rotate(20deg); } }
</style></head>
<body><div class="b b-sis">
  <div class="band t"></div><div class="band bt"></div>
  <svg viewBox="0 0 800 300" preserveAspectRatio="none">
    <path d="M300 284 L800 80 L800 284 Z" fill="#1a0f0a"/>
    <g class="climber">
      <g transform="translate(645 146) rotate(-22) scale(1.15)">
        <circle class="rock" cx="0" cy="-46" r="40" fill="#1a0f0a"/>
        <!-- figure leaning into the rock -->
        <circle cx="-62" cy="-56" r="10" fill="#1a0f0a"/>
        <path d="M-66 -46 L-48 -40 L-46 -30 L-56 -6 L-80 0 L-90 -2 L-78 -10 L-66 -12 L-62 -30 Z" fill="#1a0f0a"/>
        <path d="M-56 -6 L-70 4 L-82 2" stroke="#1a0f0a" stroke-width="7" fill="none" stroke-linecap="round"/>
        <path d="M-62 -40 L-42 -52" stroke="#1a0f0a" stroke-width="6" stroke-linecap="round"/>
      </g>
    </g>
  </svg>
  <h1>SISYPHUS<small>the mountain never ends</small></h1>
</div></body></html>
