<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Fontsmith: every letter hand-drawn into its own glyph cell ── */
  .b-smith { background: #eef3fa; color: #201a17; font-family: 'Caveat', cursive;
    background-image: linear-gradient(rgba(90,160,219,.14) 1px, transparent 1px), linear-gradient(90deg, rgba(90,160,219,.14) 1px, transparent 1px);
    background-size: 2cqi 2cqi; }
  .b-smith .cells { display: flex; gap: .9cqi; }
  .b-smith .cell { position: relative; width: 9cqi; height: 15cqi; background: #fff; border: .25cqi solid rgba(32,26,23,.5); border-radius: .8cqi;
    display: grid; place-items: end center; font-size: 13cqi; font-weight: 700; line-height: 1; padding-bottom: 1.6cqi; }
  .b-smith .cell::before { content: ''; position: absolute; left: 0; right: 0; bottom: 3.2cqi; border-top: .2cqi dashed rgba(32,26,23,.25); }
  .b-smith .cell::after { content: attr(data-c); position: absolute; top: .5cqi; left: .7cqi; font-family: Arial, sans-serif; font-size: 1.5cqi;
    font-weight: 400; color: rgba(32,26,23,.4); }
  .b-smith .cell b { position: relative; font-weight: 700; transform: translateY(1.3cqi); }
  .b-smith .cell.on { border-color: #f47b28; box-shadow: 0 0 0 .5cqi rgba(244,123,40,.25); }
  .b-smith .hl { position: absolute; width: 9cqi; height: 15cqi; border: .35cqi solid #f47b28; border-radius: .8cqi; pointer-events: none;
    animation: walk 4.5s steps(1) infinite; }
  @keyframes walk { 0% { transform: translateX(0); } 11% { transform: translateX(9.9cqi); } 22% { transform: translateX(19.8cqi); }
    33% { transform: translateX(29.7cqi); } 44% { transform: translateX(39.6cqi); } 55% { transform: translateX(49.5cqi); }
    66% { transform: translateX(59.4cqi); } 77% { transform: translateX(69.3cqi); } 88% { transform: translateX(79.2cqi); } }
  .b-smith .wrap { position: relative; }
  .b-smith .note { position: absolute; right: 0; top: -4.2cqi; font-family: Arial, sans-serif; font-size: 2cqi; color: #5d6b7a; letter-spacing: .04em; }
</style></head>
<body><div class="b b-smith">
  <div class="wrap">
    <div class="cells">
      <span class="cell" data-c="F"><b>F</b></span><span class="cell" data-c="o"><b>o</b></span><span class="cell" data-c="n"><b>n</b></span>
      <span class="cell" data-c="t"><b>t</b></span><span class="cell" data-c="s"><b>s</b></span><span class="cell" data-c="m"><b>m</b></span>
      <span class="cell" data-c="i"><b>i</b></span><span class="cell" data-c="t"><b>t</b></span><span class="cell" data-c="h"><b>h</b></span>
    </div>
    <div class="hl" style="left:0;top:0"></div>
  </div>
</div></body></html>
