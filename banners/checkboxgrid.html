<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Checkbox Grid: plain Arial, real checkboxes ───────────── */
  .b-checkbox { background: #f0f0f0; font-family: Arial, sans-serif; }
  .b-checkbox .boxes {
    position: absolute; inset: 0;
    display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; padding: 6px;
    opacity: .9;
  }
  .b-checkbox .boxes i {
    border: 1.5px solid #999; border-radius: 3px; background: #fff;
  }
  .b-checkbox .boxes i.on { background: #2f6fde; border-color: #2f6fde; }
  .b-checkbox .label {
    position: relative; display: flex; align-items: center; gap: 4cqi;
    background: #fff; border: 2px solid #bbb; border-radius: 8px;
    padding: 2.5cqi 5cqi; box-shadow: 0 2px 10px rgba(0,0,0,.15);
    font-size: 7.5cqi; color: #222;
  }
  .b-checkbox .tick {
    width: 8cqi; height: 8cqi; border-radius: 4px; background: #2f6fde;
    display: grid; place-items: center; color: #fff; font-size: 6cqi; font-weight: 700;
  }
</style></head>
<body><div class="b b-checkbox">
      <div class="boxes" id="boxes"></div>
      <div class="label"><span class="tick">✓</span>Checkbox Grid</div>
</div>
<script>
const boxes = document.getElementById('boxes');
for (let i = 0; i < 24 * 9; i++) { const b = document.createElement('i'); if (Math.random() < 0.18) b.className = 'on'; boxes.appendChild(b); }
</script></body></html>
