<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── ASCII Earth: the real land-mask globe, phosphor green Courier ── */
  .b-earth { background: #05080a; font-family: 'Courier New', Courier, monospace; color: #5eff9e; place-items: center start; }
  .b-earth canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .b-earth::after { content: ''; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 1px, transparent 1px 3px); }
  .b-earth .word { position: relative; z-index: 1; padding-left: 7cqi; font-size: 10.5cqi; font-weight: 700; line-height: 1;
    text-shadow: 0 0 1.2cqi rgba(94,255,158,.55); }
  .b-earth .word small { display: block; margin-top: 2.2cqi; font-size: 2.7cqi; font-weight: 400; color: #3fae6c; letter-spacing: .2cqi; text-shadow: none; }
</style></head>
<body><div class="b b-earth">
  <canvas id="c" width="800" height="300"></canvas>
  <div class="word">ASCII<br>Earth<small>" .:-=+*#%@"</small></div>
</div>
<script>
const MASK = Uint8Array.from(atob('AAAAAAAP4AfhAAAAAAAAAAAAAAAAAAAAAAAAA//Bv/gAAAAAAAAAAAAAAAAAAAAAAAD74v/73gAAAACwACAAAAAAAAAAAAAAMHx///+AAAAAuQAAwAAAAAAAAAAAAIO+B///8AAUwAAAAB4AAAAAAAAAAAACPuH///4AASIAAAAAHAAAAAAAAAAACABwH///4AAEAAAAAATAAAAAAAAAAAgCYIP///4AAAAAACAAD4AABAAAAAAAG1EAAP//4AAAAAA4AB/8ADAAAAAAABwAAAAH//IAAAAABAAH/sAAAAAAAAAB0RZUAD//AAAAAACAg//f+AAAAAAAABPwD/AB/+wAAAAACBrf//+B8AAAB4AAB4Z/gD//AAAAcAABvf/////4AAH/8PzA6w4D//AAAD/gQMj///////ngP/+/4Y+wcB/wAAAH/5P/v////////4B//////wLB/gAAAP/Z//f/////////P/////8A4B+AHAAfPH///////////mB/////+wcB8AMAAffv///////////AH/////4AIA4AAAB8/////////////gP7////wDgAYAAAD89//////////14AH8f///gDwAAAAAj8D//////////CAAAwA///wH2AAAAECcf/////////AEAAAoA///4D/AAAAHAef////////8AeAAAAAP//+D/AAAADAA/////////4AcAAAAAP///j/wAAAFgD/////////4AYAAgAAH///n/4AAANj///////////gYAAAAAH///3/4AAABn///////////gAAAAAAF////8AAAAAP//////////+gAAAAAAB////2cAAAB///////////+AAAAAAAB//898OAAAA///////////8AAAAAAAB//+n9AAAAAfv8vnv/////4EAAAAAAB//+9wAAAAA+n4Hn//////4wAAAAAAB///3gAAAAH4R4D3//////BAAAAAAAB////AAAAAHgN7/z/////+BAAAAAAAB///+AAAAAHgEn/z/////CBAAAAAAAA///+AAAAAHAIn/z/////iDAAAAAAAA///8AAAAAAfABf//////gOAAAAAAAAf//8AAAAAH/AAf//////gwAAAAAAAAP//4CAAAAH/gAf//////wgAAAAAAAAD//wAAAAAP/9////////wAAAAAAAAAF/0QAAAAAP////n/////wAAAAAAAAAA/AMAAAAAf///fz/////gAAAAAAAAAC/AIAAAAA////Py/////gAAAAAAAAABfAAAAAAB////v/B////QAAAAAAAAAAPAYAAAAB////n/g/9/4QAAAAAAAAAAPCDAAAAB////n/Afw/AAAAAAAAAAAAHmA0AAAB////z+Afg/AAAAAAAAAAAAA+AAAAAB////58APAvgQAAAAAAAAAAAHgAAAAB////5wAOAPgQAAAAAAAAAAABgAAAAB////8AAOAPgQAAAAAAAAAAAAgwAAAB////+IAGABgAAAAAAAAAAAAAV/AAAA/////wAAAAAAAAAAAAAAAAAAD/gAAAf////wABAAAMABAAAAAAAAAAD/wAAAf////gAAAEBAIAAAAAAAAAAAD/+AAAAA///gAQAWDAAAAAAAAAAAAAD/+AAAAA///AAAAKHAAAAAAAAAAAAAH/+AAAAA//+AAAAEfQAAAAAAAAAAAAH//QAAAA//8AAAAGPYQAAEAAAAAAAAH//+AAAA//4AAAADGBPBAAAAAAAAAAP///AAAAf/4AAAABAADiAAAAAAAAAAH///gAAAf/wAAAAA4AD4IAAAAAAAAAH///gAAAP/4AAAAAASBoEAAAAAAAAAD///AAAAP/4AAAAAAAAAAAAAAAAAAAD//+AAAAP/6AAAAAAAYgAAAAAAAAAAB//+AAAAf/4QAAAAAA4gAABAAAAAAAA//+AAAAf/4wAAAAAH4wAAAAAAAAAAAf/+AAAAf/hwAAAAAP/wAAAAAAAAAAAf/+AAAAf/hgAAAAAf/wAAAAACAAAAAf/8AAAAP/BhAAAAA//4BAAAAAAAAAAf/wAAAAP/hgAAAAD//8AAAAAAAAAAAf/gAAAAP/BgAAAAD//+AAAAAAAAAAAf/AAAAAH+AAAAAAD///AAAAAAAAAAAf/AAAAAH+AAAAAAD///AAAAAAAAAAAf+AAAAAD+AAAAAAB//+AAAAAAAAAAAf+AAAAAD8AAAAAAB//+AAAAAAAAAAAf8AAAAAD4AAAAAAB4L+AAAAAAAAAAAfwAAAAAAAAAAAAABAD8AAAAAAAAAAA/wAAAAAAAAAAAAAAAB8AAAAAAAAAAA/gAAAAAAAAAAAAAAAA4ADAAAAAAAAA+AAAAAAAAAAAAAAAAAAACAAAAAAAAA8AAAAAAAAAAAAAAAAAYAEAAAAAAAAA8AAAAAAAAAAAAAAAAAAAIAAAAAAAAA4AAAAAAAAAAAAAAAAAAAYAAAAAAAAA4AAAAAAAAAAAAAAAAAAAYAAAAAAAAA8AAAAAAAAAAAAAAAAAAAAAAAAAAAAA4AAAAAAAAAABAAAAAAAAAAAAAAAAAAwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAIAAAAAAAAAAAAAAAAAAAAAAAAAAAAAIAAAAAAAAAAAAAAAAAAAAA'), (ch) => ch.charCodeAt(0));
const c = document.getElementById('c'), g = c.getContext('2d');
const RAMP = ' .:-=+*#%@', FS = 12, CW = FS * .62, CH = FS * 1.05, COLS = Math.ceil(800 / CW), ROWS = Math.ceil(300 / CH);
const TILT = 23.4 * Math.PI / 180, L = (() => { const v = [-.25, .35, .9], n = Math.hypot(...v); return v.map((x) => x / n); })();
const R = 132, CX = 575, CY = 150;
function land(lon, lat) {
  const col = Math.min(179, Math.max(0, Math.floor((lon + 180) / 360 * 180))), row = Math.min(89, Math.max(0, Math.floor((90 - lat) / 180 * 90)));
  const bit = row * 180 + col; return (MASK[bit >> 3] >> (7 - (bit & 7))) & 1;
}
function draw(yaw) {
  const buf = new Array(COLS * ROWS).fill(' '), isL = new Uint8Array(COLS * ROWS), depth = new Float32Array(COLS * ROWS).fill(-9);
  const cy = Math.cos(yaw), sy = Math.sin(yaw), ct = Math.cos(TILT), st = Math.sin(TILT);
  for (let i = 0; i < 90; i++) {
    const th = (i + .5) / 90 * Math.PI, sT = Math.sin(th), cT = Math.cos(th), lat = 90 - th * 180 / Math.PI;
    for (let j = 0; j < 200; j++) {
      const ph = j / 200 * Math.PI * 2, px = sT * Math.cos(ph), py = cT, pz = sT * Math.sin(ph);
      let x = px * cy + pz * sy, y = py, z = -px * sy + pz * cy;
      const y2 = y * ct - z * st, z2 = y * st + z * ct;
      const q = ((CX + x * R) / CW) | 0, r = ((CY - y2 * R) / CH) | 0, k = r * COLS + q;
      if (q < 0 || q >= COLS || r < 0 || r >= ROWS || z2 <= depth[k]) continue;
      depth[k] = z2;
      const inten = Math.max(.08, x * L[0] + y2 * L[1] + z2 * L[2]);
      const ld = land(ph * 180 / Math.PI - 180, lat); isL[k] = ld;
      buf[k] = RAMP[ld ? Math.min(9, 3 + Math.floor(inten * 6)) : Math.max(1, Math.min(4, Math.floor(inten * 4)))];
    }
  }
  g.clearRect(0, 0, 800, 300);
  g.font = FS + 'px "Courier New", Courier, monospace'; g.textBaseline = 'top';
  g.shadowColor = 'rgba(94,255,158,.5)';
  for (let k = 0; k < buf.length; k++) { if (buf[k] === ' ') continue;
    g.fillStyle = isL[k] ? 'rgba(130,255,175,1)' : 'rgba(60,150,100,.75)'; g.shadowBlur = isL[k] ? 4 : 0;
    g.fillText(buf[k], (k % COLS) * CW, Math.floor(k / COLS) * CH); }
}
let yaw = 1.2, last = 0;
(function loop(t) { if (t && last) yaw += (t - last) / 1000 * .35; last = t || 0; draw(yaw); if (LIVE) requestAnimationFrame(loop); })();
</script></body></html>
