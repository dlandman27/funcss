<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Pong: black field, white Courier ──────────────────────── */
  .b-pong { background: #000; color: #fff; font-family: 'Courier New', monospace; }
  .b-pong::before {
    content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 0;
    border-left: 1.2cqi dashed #fff; opacity: .5;
  }
  .b-pong .paddle { position: absolute; width: 2.2cqi; height: 16cqi; background: #fff; }
  .b-pong .p1 { left: 5cqi; top: 8cqi; }
  .b-pong .p2 { right: 5cqi; bottom: 6cqi; }
  .b-pong .ball { position: absolute; width: 3cqi; height: 3cqi; background: #fff; left: 70%; top: 22%; }
  .b-pong .word { position: relative; font-size: 15cqi; font-weight: 700; letter-spacing: 3cqi; background: #000; padding: 0 2cqi; }
  .b-pong .score { position: absolute; top: 3cqi; left: 0; right: 0; display: flex; justify-content: center; gap: 22cqi; font-size: 6cqi; opacity: .8; }
</style></head>
<body><div class="b b-pong">
      <div class="score"><span>3</span><span>7</span></div>
      <div class="paddle p1"></div><div class="paddle p2"></div><div class="ball"></div>
      <div class="word">PONG</div>
</div></body></html>
