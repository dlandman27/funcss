<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Black+Ops+One&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Cool (and Uncool) Loaders: a wall of spinners, one stamp ─ */
  .b-load { background: #eef0f4; font-family: 'Space Grotesk', sans-serif; color: #15171c; grid-template-columns: 1.15fr 1fr; padding: 0 4cqi 0 6cqi; gap: 3cqi; }
  .b-load .word { font-size: 9cqi; line-height: .98; letter-spacing: -.3cqi; }
  .b-load .word i { font-style: normal; color: #8a8f9c; }
  .b-load .wall { position: relative; display: grid; grid-template-columns: repeat(3, 11cqi); gap: 1.6cqi; justify-content: center; }
  .b-load .t { width: 11cqi; height: 11cqi; background: #fff; border-radius: 1.4cqi; display: grid; place-items: center; box-shadow: 0 .3cqi 1cqi rgba(20,25,40,.08); }
  .b-load .ring { width: 5.6cqi; height: 5.6cqi; border-radius: 50%; border: .9cqi solid #dfe3ea; border-top-color: #5a6cf0; animation: spin .9s linear infinite; }
  .b-load .dots { display: flex; gap: .8cqi; } .b-load .dots b { width: 1.4cqi; height: 1.4cqi; border-radius: 50%; background: #2fb0a3; animation: hop .9s ease-in-out infinite; }
  .b-load .dots b:nth-child(2) { animation-delay: .15s; } .b-load .dots b:nth-child(3) { animation-delay: .3s; }
  .b-load .bar { width: 7cqi; height: 1.2cqi; border-radius: 1cqi; background: #dfe3ea; overflow: hidden; }
  .b-load .bar b { display: block; width: 45%; height: 100%; background: #f0563e; animation: slide 1.2s ease-in-out -.5s infinite; }
  .b-load .sq { width: 4.4cqi; height: 4.4cqi; background: #f7c948; animation: spin 1.6s cubic-bezier(.6,0,.4,1) infinite; }
  .b-load .bars { display: flex; gap: .5cqi; align-items: center; height: 5cqi; } .b-load .bars b { width: .9cqi; height: 100%; background: #a98fd0; animation: eq 1s ease-in-out infinite; }
  .b-load .bars b:nth-child(2) { animation-delay: -.2s; } .b-load .bars b:nth-child(3) { animation-delay: -.4s; } .b-load .bars b:nth-child(4) { animation-delay: -.6s; }
  .b-load .hg { font-family: 'Courier New', monospace; font-size: 3.4cqi; color: #15171c; animation: spin 2s steps(4) infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes hop { 50% { transform: translateY(-1.2cqi); } }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(230%); } }
  @keyframes eq { 50% { transform: scaleY(.35); } }
  .b-load .stamp { position: absolute; left: 50%; top: 50%; font-family: 'Black Ops One', sans-serif; font-size: 5.6cqi; color: #d1242f;
    border: .6cqi solid #d1242f; padding: 0 1.6cqi; border-radius: .8cqi; transform: translate(-50%,-50%) rotate(-14deg); opacity: .82; mix-blend-mode: multiply; }
</style></head>
<body><div class="b b-load">
  <div class="word">Cool <i>(and Uncool)</i> Loaders</div>
  <div class="wall">
    <div class="t"><div class="ring"></div></div>
    <div class="t"><div class="dots"><b></b><b></b><b></b></div></div>
    <div class="t"><div class="bar"><b></b></div></div>
    <div class="t"><div class="sq"></div></div>
    <div class="t"><div class="hg">|</div></div>
    <div class="t"><div class="bars"><b></b><b></b><b></b><b></b></div></div>
    <div class="stamp">UNCOOL</div>
  </div>
</div></body></html>
