<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Under the Rug: a patterned rug, one corner peeled up ───── */
  .b-rug { background: #8a6a48; font-family: Georgia, serif; color: #fff8ef;
    background-image: repeating-linear-gradient(90deg, rgba(0,0,0,.12) 0 .3cqi, transparent .3cqi 12cqi); }
  .b-rug .rug { position: absolute; left: 4cqi; right: 4cqi; top: 4cqi; bottom: 4cqi; background: #be5947;
    clip-path: polygon(0 0, 100% 0, 100% 52%, 84% 100%, 0 100%);
    box-shadow: inset 0 0 0 1.4cqi #be5947, inset 0 0 0 2cqi #f7c948, inset 0 0 0 3.6cqi #be5947, inset 0 0 0 4.1cqi #e7bd76;
    background-image: radial-gradient(circle at 50% 50%, rgba(247,201,72,.28) 0 1cqi, transparent 1.1cqi),
      linear-gradient(45deg, rgba(32,26,23,.12) 25%, transparent 25% 75%, rgba(32,26,23,.12) 75%),
      linear-gradient(-45deg, rgba(32,26,23,.12) 25%, transparent 25% 75%, rgba(32,26,23,.12) 75%);
    background-size: 7cqi 7cqi, 7cqi 7cqi, 7cqi 7cqi; }
  .b-rug svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .b-rug .eyes { animation: peek 3.2s infinite; transform-origin: 744px 246px; }
  @keyframes peek { 0%, 44%, 52%, 100% { transform: scaleY(1); } 48% { transform: scaleY(.1); } }
  .b-rug .flap { transform-origin: 709px 211px; animation: lift 3.2s ease-in-out infinite; }
  @keyframes lift { 50% { transform: scale(1.07); } }
  .b-rug .word { position: relative; margin-right: 10cqi; text-align: center; font-size: 12cqi; line-height: 1; font-style: italic;
    text-shadow: .4cqi .5cqi 0 rgba(32,26,23,.45); }
  .b-rug .word small { display: block; font-size: 3cqi; letter-spacing: .4cqi; font-style: normal; color: #f7c948; margin-top: 1.6cqi; }
</style></head>
<body><div class="b b-rug">
  <div class="rug"></div>
  <svg viewBox="0 0 800 300">
    <polygon points="768,155 768,268 650,268" fill="#1d1612"/>
    <g class="eyes" fill="#f7c948"><ellipse cx="736" cy="246" rx="5" ry="5"/><ellipse cx="752" cy="246" rx="5" ry="5"/></g>
    <polygon class="flap" points="768,155 650,268 655,150" fill="#e2cfaa" stroke="#9c7a52" stroke-width="2" stroke-linejoin="round"/>
  </svg>
  <div class="word">Under the Rug<small>a perfectly ordinary rug. apparently.</small></div>
</div></body></html>
