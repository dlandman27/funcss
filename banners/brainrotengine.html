<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Brain Rot Engine: balls in a spinning cream ring, short-form caption title ── */
  .b-rot { background: #16120e; font-family: 'Arial Black', Arial, sans-serif; color: #fff8ef; place-items: center start; }
  .b-rot canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .b-rot .word { position: relative; padding-left: 7cqi; font-size: 8.4cqi; line-height: 1.05; text-transform: uppercase;
    -webkit-text-stroke: .9cqi #000; paint-order: stroke fill; }
  .b-rot .word span { color: #f7c948; }
  .b-rot .word small { display: block; margin-top: 2cqi; font: 400 2.6cqi Georgia, serif; text-transform: none; color: #b8ab9b; -webkit-text-stroke: 0; }
</style></head>
<body><div class="b b-rot">
  <canvas id="c" width="800" height="300"></canvas>
  <div class="word">Brain Rot<br><span>Engine</span><small>attention span: 0:47</small></div>
</div>
<script>
const c = document.getElementById('c'), g = c.getContext('2d');
const R = { x: 600, y: 150, r: 118 }, CREAM = '#fff8ef';
let rot = .4, seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const balls = [];
for (let i = 0; i < 9; i++) { const a = rnd() * 6.28, d = rnd() * 70; balls.push({ x: R.x + Math.cos(a) * d, y: R.y + Math.sin(a) * d,
  vx: (rnd() - .5) * 6, vy: (rnd() - .5) * 6, r: 9 + rnd() * 14, hue: Math.floor(rnd() * 360) }); }
function step() {
  for (const b of balls) {
    b.vy += .1; b.x += b.vx; b.y += b.vy;
    const dx = b.x - R.x, dy = b.y - R.y, d = Math.hypot(dx, dy);
    if (d + b.r > R.r) { const nx = dx / d, ny = dy / d, dot = b.vx * nx + b.vy * ny;
      b.vx -= 2 * dot * nx; b.vy -= 2 * dot * ny; { const s = Math.hypot(b.vx, b.vy); if (s < 7) { b.vx *= 7 / s; b.vy *= 7 / s; } } b.x = R.x + nx * (R.r - b.r); b.y = R.y + ny * (R.r - b.r);
      if (balls.length < 26 && rnd() < .12) balls.push({ ...b, vx: -b.vx, vy: b.vy * .8, r: 8 + rnd() * 10, hue: Math.floor(rnd() * 360) }); }
    const sp = Math.hypot(b.vx, b.vy); if (sp > 11) { b.vx *= 11 / sp; b.vy *= 11 / sp; }
  }
}
function draw() {
  g.fillStyle = 'rgba(22,18,14,.35)'; g.fillRect(0, 0, 800, 300);
  g.lineWidth = 6; g.strokeStyle = CREAM; g.beginPath(); g.arc(R.x, R.y, R.r, 0, 7); g.stroke();
  g.strokeStyle = '#f0563e'; g.beginPath(); g.arc(R.x, R.y, R.r, rot, rot + .7); g.stroke();
  for (const b of balls) { g.beginPath(); g.arc(b.x, b.y, b.r, 0, 7); g.fillStyle = `hsl(${b.hue},85%,60%)`; g.fill(); g.lineWidth = 2; g.strokeStyle = CREAM; g.stroke(); }
}
g.fillStyle = '#16120e'; g.fillRect(0, 0, 800, 300);
for (let i = 0; i < 40; i++) step();
draw();
(function loop() { if (!LIVE) return; rot += .02; step(); draw(); requestAnimationFrame(loop); })();
</script></body></html>
