<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── 3D Snake: slate night, isometric cube snake ───────────── */
  .b-snake { background: radial-gradient(ellipse at 70% 60%, #1e293b 0%, #0f172a 70%); font-family: 'Press Start 2P', monospace; color: #e2e8f0; place-items: center start; }
  .b-snake canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .b-snake h1 { position: relative; margin: 0 0 0 6cqi; font-weight: 400; font-size: 7cqi; line-height: 1.35; }
  .b-snake h1 b { color: #4ade80; font-weight: 400; }
  .b-snake h1 small { display: block; font-size: 1.9cqi; color: #94a3b8; margin-top: 2cqi; }
</style></head>
<body><div class="b b-snake">
  <canvas id="c" width="800" height="300"></canvas>
  <h1><b>3D</b><br>SNAKE<small>SCORE 0042</small></h1>
</div>
<script>
const c = document.getElementById('c'), g = c.getContext('2d');
const N = 10, S = 18; // grid N×N, tile size
const ox = 560, oy = 70;
const iso = (x, y, z = 0) => [ox + (x - y) * S, oy + (x + y) * S * 0.5 - z * S];
function cube(x, y, top, l, r) {
  const [ax, ay] = iso(x, y, 1), [bx, by] = iso(x + 1, y, 1), [cx, cy] = iso(x + 1, y + 1, 1), [dx, dy] = iso(x, y + 1, 1);
  const [ex, ey] = iso(x + 1, y + 1, 0), [fx, fy] = iso(x, y + 1, 0), [hx, hy] = iso(x + 1, y, 0);
  g.fillStyle = top; g.beginPath(); g.moveTo(ax, ay); g.lineTo(bx, by); g.lineTo(cx, cy); g.lineTo(dx, dy); g.fill();
  g.fillStyle = l; g.beginPath(); g.moveTo(dx, dy); g.lineTo(cx, cy); g.lineTo(ex, ey); g.lineTo(fx, fy); g.fill();
  g.fillStyle = r; g.beginPath(); g.moveTo(bx, by); g.lineTo(cx, cy); g.lineTo(ex, ey); g.lineTo(hx, hy); g.fill();
}
const path = [];
for (let x = 1; x <= 8; x++) path.push([x, 1]);
for (let y = 2; y <= 8; y++) path.push([8, y]);
for (let x = 7; x >= 1; x--) path.push([x, 8]);
for (let y = 7; y >= 2; y--) path.push([1, y]);
const LEN = 9, food = [5, 5];
function draw(step) {
  g.clearRect(0, 0, 800, 300);
  for (let x = 0; x < N; x++) for (let y = 0; y < N; y++) {
    const p = [iso(x, y), iso(x + 1, y), iso(x + 1, y + 1), iso(x, y + 1)];
    g.fillStyle = (x + y) % 2 ? '#1e293b' : '#243349'; g.beginPath(); p.forEach(([a, b], i) => i ? g.lineTo(a, b) : g.moveTo(a, b)); g.fill();
  }
  const body = [];
  for (let i = 0; i < LEN; i++) body.push(path[(step - i + path.length * 10) % path.length]);
  const items = body.map((p, i) => ({ p, i })).concat([{ p: food, i: -1 }]);
  items.sort((a, b) => (a.p[0] + a.p[1]) - (b.p[0] + b.p[1]));
  for (const { p, i } of items) {
    if (i === -1) cube(p[0], p[1], '#f87171', '#b91c1c', '#dc2626');
    else if (i === 0) cube(p[0], p[1], '#86efac', '#15803d', '#16a34a');
    else cube(p[0], p[1], '#4ade80', '#166534', '#15803d');
  }
}
let step = 12;
(function loop() { draw(step); step++; if (LIVE) setTimeout(loop, 160); })();
</script></body></html>
