<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Duplicate: one "a", doubled until it fills the page ───── */
  .b-dup { background: #fbfbf8; font-family: 'IBM Plex Mono', monospace; color: #1b1b1b; place-items: center start; }
  .b-dup .as { position: absolute; left: 0; right: 0; top: 0; bottom: 0; padding: 2cqi 3cqi; font-size: 2.2cqi; line-height: 1.32; color: rgba(27,27,27,.16);
    word-break: break-all; overflow: hidden; }
  .b-dup .as span { color: rgba(27,27,27,.4); }
  .b-dup .panel { position: relative; margin-left: 7cqi; background: #fbfbf8; padding: 2cqi 3cqi 2.4cqi 0; box-shadow: 3cqi 0 3cqi #fbfbf8; }
  .b-dup .word { font-weight: 700; font-size: 11cqi; line-height: 1; letter-spacing: -.4cqi; }
  .b-dup .row { display: flex; align-items: center; gap: 2cqi; margin-top: 2cqi; }
  .b-dup button { font: 700 3.4cqi 'IBM Plex Mono', monospace; background: #1b1b1b; color: #fbfbf8; border: 0; border-radius: .6cqi; padding: 1cqi 2.4cqi; }
  .b-dup .n { font-size: 3cqi; color: #6b6b6b; }
</style></head>
<body><div class="b b-dup">
  <div class="as" id="as"></div>
  <div class="panel">
    <div class="word">Duplicate</div>
    <div class="row"><button>&times;2</button><span class="n" id="n">2,048 a</span></div>
  </div>
</div>
<script>
const as = document.getElementById('as'), n = document.getElementById('n');
let k = 11;
function show() { const c = 2 ** k; n.textContent = c.toLocaleString('en-US') + ' a'; as.innerHTML = 'a'.repeat(Math.min(c, 4000)); }
show();
if (LIVE) { k = 0; setInterval(() => { k = k >= 12 ? 0 : k + 1; show(); }, 500); }
</script></body></html>
