<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Ruler: an actual-size yellow ruler, cm ticks ──────────── */
  .b-ruler { background: #eef1f4; font-family: 'Barlow Condensed', sans-serif; color: #201a17; }
  .b-ruler .stick { position: relative; width: 110cqi; height: 21cqi; transform: rotate(-4deg); background: linear-gradient(180deg, #ffd84f, #f7c948 60%, #e9b631);
    box-shadow: 0 1.4cqi 2cqi rgba(30, 40, 60, .25), inset 0 -.4cqi 0 rgba(0,0,0,.12); }
  .b-ruler .ticks { position: absolute; left: 0; right: 0; top: 0; height: 5cqi;
    background: repeating-linear-gradient(90deg, #201a17 0 1px, transparent 1px 40px) 0 0 / 100% 5cqi no-repeat,
                repeating-linear-gradient(90deg, #201a17 0 1px, transparent 1px 20px) 0 0 / 100% 3.4cqi no-repeat,
                repeating-linear-gradient(90deg, #201a17 0 1px, transparent 1px 4px) 0 0 / 100% 1.8cqi no-repeat; }
  .b-ruler .nums { position: absolute; left: 0; top: 5.2cqi; display: flex; font-weight: 600; font-size: 2.6cqi; }
  .b-ruler .nums span { width: 40px; text-indent: -.6cqi; }
  .b-ruler .word { position: absolute; left: 16cqi; bottom: 1.6cqi; font-weight: 800; font-size: 10.5cqi; line-height: 1; letter-spacing: .06em; text-transform: uppercase; }
  .b-ruler .word small { font-weight: 600; font-size: 3.2cqi; letter-spacing: .1em; margin-left: 2cqi; color: #6b5a2a; }
  .b-ruler .mark { position: absolute; top: -2.6cqi; left: 20cqi; width: 0; height: 0; border: 1.4cqi solid transparent; border-top: 2.2cqi solid #f0563e; border-bottom: 0; animation: slide 4s ease-in-out infinite alternate; }
  .b-ruler .mark::after { content: ''; position: absolute; left: -1px; top: 0; width: 2px; height: 5cqi; background: #f0563e; }
  @keyframes slide { to { transform: translateX(60cqi); } }
</style></head>
<body><div class="b b-ruler">
  <div class="stick">
    <div class="ticks"></div><div class="nums" id="nums"></div>
    <div class="mark"></div>
    <div class="word">Ruler<small>actual size · cm &amp; in</small></div>
  </div>
</div>
<script>
const nums = document.getElementById('nums');
for (let i = 0; i < 23; i++) nums.insertAdjacentHTML('beforeend', `<span>${i || ''}</span>`);
</script></body></html>
