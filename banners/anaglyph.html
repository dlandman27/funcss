<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Anaglyph: red/cyan colour-split, printed like an old 3-D comic ── */
  .b-ana { background: #f4f1ea; font-family: Georgia, 'Times New Roman', serif; isolation: isolate; }
  .b-ana .layer { position: absolute; inset: 0; mix-blend-mode: multiply; }
  .b-ana .red  { animation: sepR 3s ease-in-out infinite; }
  .b-ana .cyan { animation: sepC 3s ease-in-out infinite; }
  @keyframes sepR { 50% { transform: translateX(-1.4cqi); } }
  @keyframes sepC { 50% { transform: translateX(1.4cqi); } }
  .b-ana .layer .word { position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 11.5cqi; font-weight: 700; letter-spacing: .5cqi; text-transform: uppercase; }
  .b-ana .red .word, .b-ana .red svg { color: #ff1a2a; fill: #ff1a2a; stroke: #ff1a2a; transform: translateX(-.9cqi); }
  .b-ana .cyan .word, .b-ana .cyan svg { color: #00c8e8; fill: #00c8e8; stroke: #00c8e8; transform: translateX(.9cqi); }
  .b-ana svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .b-ana .glasses { position: absolute; right: 4cqi; bottom: 3.4cqi; display: flex; align-items: center; gap: .8cqi; }
  .b-ana .glasses i { width: 7cqi; height: 4.4cqi; border: .5cqi solid #201a17; border-radius: 1cqi 1cqi 2cqi 2cqi; }
  .b-ana .glasses i:first-child { background: rgba(255,26,42,.75); }
  .b-ana .glasses i:last-child { background: rgba(0,200,232,.75); }
  .b-ana .glasses span { width: 1.6cqi; height: .5cqi; background: #201a17; }
</style></head>
<body><div class="b b-ana">
  <div class="layer red">
    <svg viewBox="0 0 800 300"><g stroke-width="5" fill="none">
      <circle cx="74" cy="62" r="24"/><polygon points="712,30 748,92 676,92" /><rect x="80" y="214" width="40" height="40" transform="rotate(20 100 234)"/>
      <circle cx="250" cy="52" r="10" fill="currentColor"/><path d="M560 270 l16 -28 l16 28z" fill="currentColor"/><path d="M36 150 l12 -22 12 22 -12 22z"/><circle cx="520" cy="44" r="16"/>
    </g></svg>
    <div class="word">Anaglyph</div>
  </div>
  <div class="layer cyan">
    <svg viewBox="0 0 800 300"><g stroke-width="5" fill="none">
      <circle cx="74" cy="62" r="24"/><polygon points="712,30 748,92 676,92" /><rect x="80" y="214" width="40" height="40" transform="rotate(20 100 234)"/>
      <circle cx="250" cy="52" r="10" fill="currentColor"/><path d="M560 270 l16 -28 l16 28z" fill="currentColor"/><path d="M36 150 l12 -22 12 22 -12 22z"/><circle cx="520" cy="44" r="16"/>
    </g></svg>
    <div class="word">Anaglyph</div>
  </div>
  <div class="glasses"><i></i><span></span><i></i></div>
</div></body></html>
