<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Terms and Conditions: the endless agreement UI ────────── */
  .b-tc { background: #f7f7f8; color: #1d1d22;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; place-items: start; }
  .b-tc .top { position: absolute; left: 0; right: 0; top: 0; height: 7cqi; background: #fff; border-bottom: .2cqi solid #e3e3e7;
    display: flex; align-items: center; justify-content: flex-end; gap: 1.6cqi; padding: 0 4cqi; font-size: 2.6cqi; color: #9a9aa2; }
  .b-tc .top .bar { width: 18cqi; height: 1cqi; border-radius: 1cqi; background: #e3e3e7; overflow: hidden; }
  .b-tc .top .bar i { display: block; height: 100%; width: 98%; background: #2563eb; animation: read 5s ease-in-out infinite; }
  @keyframes read { 0%, 100% { width: 98%; } 60% { width: 99.6%; } 75% { width: 31%; } }
  .b-tc .doc { position: absolute; left: 6cqi; top: 10.5cqi; right: 6cqi; }
  .b-tc h1 { margin: 0; font-family: Georgia, serif; font-weight: 400; font-size: 9cqi; letter-spacing: -.2cqi; line-height: 1.05; }
  .b-tc .lines { margin-top: 2.4cqi; display: grid; gap: 1.3cqi; }
  .b-tc .lines i { display: block; height: 1.1cqi; border-radius: 1cqi; background: #e3e3e7; }
  .b-tc .foot { position: absolute; left: 0; right: 0; bottom: 0; height: 9cqi; background: #fff; border-top: .2cqi solid #e3e3e7;
    display: flex; align-items: center; gap: 1.6cqi; padding: 0 6cqi; font-size: 2.6cqi; color: #9a9aa2; }
  .b-tc .box { width: 3cqi; height: 3cqi; border: .3cqi solid #c4c4cc; border-radius: .6cqi; background: #fff; }
  .b-tc .btn { margin-left: auto; background: #2563eb; color: #fff; opacity: .4; border-radius: .8cqi; padding: 1.2cqi 3cqi; font-weight: 600; }
</style></head>
<body><div class="b b-tc">
  <div class="top"><span>Read: 98%</span><span class="bar"><i></i></span></div>
  <div class="doc">
    <h1>Terms and Conditions</h1>
    <div class="lines"><i style="width:92%"></i><i style="width:64%"></i></div>
  </div>
  <div class="foot"><span class="box"></span>I have read and agree to the Terms and Conditions<span class="btn">Continue</span></div>
</div></body></html>
