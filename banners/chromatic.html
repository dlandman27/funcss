<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Chromatic: a white brushstroke split into R, G, B followers that lag behind ── */
  .b-chrom { background: #0a0a0f; font-family: Georgia, 'Times New Roman', serif; color: #fff; isolation: isolate; }
  .b-chrom canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .b-chrom .word { position: relative; font-size: 14cqi; line-height: 1; letter-spacing: .2cqi; }
  .b-chrom .word span { position: absolute; inset: 0; mix-blend-mode: screen; }
  .b-chrom .word .r { color: #ff2828; animation: r 2.6s ease-in-out infinite; transform: translate(-1.1cqi, -.2cqi); }
  .b-chrom .word .g { color: #28ff5a; animation: gg 2.6s ease-in-out infinite; transform: translate(.5cqi, .3cqi); }
  .b-chrom .word .bl { color: #3c78ff; animation: bl 2.6s ease-in-out infinite; transform: translate(1.2cqi, -.1cqi); }
  .b-chrom .word .ghost { visibility: hidden; position: static; }
  @keyframes r  { 50% { transform: translate(0, 0); } }
  @keyframes gg { 50% { transform: translate(0, 0); } }
  @keyframes bl { 50% { transform: translate(0, 0); } }
</style></head>
<body><div class="b b-chrom">
  <canvas id="c" width="800" height="300"></canvas>
  <div class="word"><span class="ghost">Chromatic</span><span class="r">Chromatic</span><span class="g">Chromatic</span><span class="bl">Chromatic</span></div>
</div>
<script>
const c = document.getElementById('c'), g = c.getContext('2d');
g.globalCompositeOperation = 'lighter'; g.lineCap = 'round'; g.lineJoin = 'round';
function stroke(off, col) {
  g.strokeStyle = `rgba(${col},.85)`; g.lineWidth = 9; g.beginPath();
  for (let i = 0; i <= 80; i++) { const t = i / 80, x = 40 + t * 720, y = 236 + Math.sin(t * 9) * 26 - t * 20 + off * Math.cos(t * 9); i ? g.lineTo(x - off * 1.6, y) : g.moveTo(x - off * 1.6, y); }
  g.stroke();
  g.beginPath();
  for (let i = 0; i <= 50; i++) { const t = i / 50, x = 60 + t * 260, y = 58 - Math.sin(t * 6) * 18 + off; i ? g.lineTo(x + off * 2, y) : g.moveTo(x + off * 2, y); }
  g.stroke();
}
function draw(k) {
  g.globalCompositeOperation = 'source-over'; g.fillStyle = '#0a0a0f'; g.fillRect(0, 0, 800, 300); g.globalCompositeOperation = 'lighter';
  stroke(-5 * k, '255,40,40'); stroke(2 * k, '40,255,90'); stroke(6 * k, '60,120,255');
}
draw(1);
if (LIVE) (function loop(t) { draw(Math.cos((t || 0) / 2600 * Math.PI * 2)); requestAnimationFrame(loop); })();
</script></body></html>
