<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Clicker Pen: ruled notebook + a retractable ballpoint ──── */
  .b-pen { background: #fdfcf6; font-family: 'Caveat', cursive; color: #1d3a8a; place-items: start center; }
  .b-pen::before { content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent 9cqi, #f2a3a3 9cqi 9.25cqi, transparent 9.25cqi),
      repeating-linear-gradient(180deg, transparent 0 5.7cqi, #b9d3ea 5.7cqi 5.85cqi); }
  .b-pen .word { position: relative; margin-top: 4.6cqi; font-size: 14cqi; line-height: 1; transform: rotate(-2deg); }
  .b-pen .pen { position: absolute; left: 12cqi; top: 25cqi; width: 76cqi; height: 6cqi; transform: rotate(-3deg); filter: drop-shadow(0 .8cqi .6cqi rgba(0,0,0,.18)); }
  .b-pen .barrel { position: absolute; left: 8cqi; right: 6cqi; top: 0; bottom: 0; border-radius: 1cqi 3cqi 3cqi 1cqi;
    background: linear-gradient(#5d8ae0, #2550b8 55%, #173a8f); }
  .b-pen .grip { position: absolute; left: 6cqi; width: 18cqi; top: .3cqi; bottom: .3cqi; border-radius: 1.5cqi 0 0 1.5cqi;
    background: repeating-linear-gradient(90deg, #222 0 .5cqi, #3b3b3b .5cqi 1cqi); }
  .b-pen .cone { position: absolute; left: 1.4cqi; top: .8cqi; width: 5cqi; height: 4.4cqi; background: linear-gradient(#e9e9ec, #a7a9b0);
    clip-path: polygon(0 40%, 100% 0, 100% 100%, 0 60%); }
  .b-pen .tip { position: absolute; left: -.6cqi; top: 2.6cqi; width: 2.4cqi; height: .8cqi; background: #555; border-radius: 1cqi;
    animation: tip 1.2s steps(1) infinite; }
  .b-pen .clip { position: absolute; right: 9cqi; width: 20cqi; top: -1.2cqi; height: 1.6cqi; border-radius: 1cqi; background: linear-gradient(#f4f4f6, #9ea1aa); }
  .b-pen .plunger { position: absolute; right: 0; top: .9cqi; width: 7cqi; height: 4.2cqi; border-radius: .6cqi 1.6cqi 1.6cqi .6cqi;
    background: linear-gradient(#f4f4f6, #9ea1aa); animation: plunge 1.2s steps(1) infinite; }
  @keyframes plunge { 50% { transform: translateX(-2cqi); } }
  @keyframes tip { 50% { transform: translateX(1.6cqi); } }
  .b-pen .count { position: absolute; right: 6cqi; bottom: 5cqi; font-size: 5.2cqi; color: #c0392b; transform: rotate(-4deg); }
</style></head>
<body><div class="b b-pen">
  <div class="word">Clicker Pen</div>
  <div class="pen">
    <div class="tip"></div><div class="cone"></div><div class="barrel"></div><div class="grip"></div><div class="clip"></div><div class="plunger"></div>
  </div>
  <div class="count">click.</div>
</div></body></html>
