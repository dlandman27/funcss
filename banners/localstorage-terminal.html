<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── LocalStorage Terminal: green-on-black prompt ──────────── */
  .b-term { background: #1e1e1e; font-family: monospace; color: #00ff00; place-items: center start; }
  .b-term .bar { position: absolute; top: 0; left: 0; right: 0; height: 7cqi; background: #333;
    display: flex; align-items: center; gap: 1.6cqi; padding-left: 3cqi; }
  .b-term .bar i { width: 2.4cqi; height: 2.4cqi; border-radius: 50%; background: #ff5f56; }
  .b-term .bar i:nth-child(2) { background: #ffbd2e; } .b-term .bar i:nth-child(3) { background: #27c93f; }
  .b-term .lines { padding: 9cqi 6cqi 0; font-size: 6.4cqi; line-height: 1.35; }
  .b-term .dim { color: #00aa00; font-size: 4.4cqi; }
  .b-term .cursor { display: inline-block; width: 3.4cqi; height: 6.4cqi; background: #00ff00;
    vertical-align: -1cqi; animation: blink 1s steps(1) infinite;  }
  @keyframes blink { 50% { opacity: 0; } }
</style></head>
<body><div class="b b-term">
      <div class="bar"><i></i><i></i><i></i></div>
      <div class="lines">
        <div class="dim">$ localStorage.setItem()</div>
        <div>&gt; LocalStorage</div>
        <div>&gt; Terminal<span class="cursor"></span></div>
      </div>
</div></body></html>
