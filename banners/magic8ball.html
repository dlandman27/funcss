<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Magic 8 Ball: violet night, black ball, blue die ──────── */
  .b-8 { background: linear-gradient(135deg, #0d0314, #1a0627); font-family: Georgia, 'Times New Roman', serif; color: #e8e2f8; place-items: center start; }
  .b-8 .stars { position: absolute; inset: 0;
    background-image: radial-gradient(1px 1px at 12% 20%, #d9b6ff, transparent), radial-gradient(1px 1px at 30% 78%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 48% 14%, #d9b6ff, transparent), radial-gradient(1px 1px at 8% 64%, #fff, transparent),
      radial-gradient(1px 1px at 42% 46%, #d9b6ff, transparent), radial-gradient(1.5px 1.5px at 22% 40%, #fff, transparent); opacity: .7; }
  .b-8 .word { position: relative; margin-left: 6cqi; font-size: 9.6cqi; line-height: 1; }
  .b-8 .word small { display: block; font-size: 3.2cqi; font-style: italic; color: #d9b6ff; opacity: .75; margin-top: 2.4cqi; letter-spacing: .1cqi; }
  .b-8 .ball { position: absolute; right: 5cqi; top: 50%; width: 29cqi; height: 29cqi; margin-top: -14.5cqi; border-radius: 50%;
    background: radial-gradient(circle at 34% 28%, #5a5a66, #17171d 38%, #050507 75%);
    box-shadow: 0 0 6cqi rgba(160, 100, 255, .25); animation: shake 2.4s ease-in-out infinite; }
  .b-8 .gloss { position: absolute; left: 16%; top: 9%; width: 34%; height: 20%; border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255,255,255,.35), transparent 70%); transform: rotate(-24deg); }
  .b-8 .window { position: absolute; left: 26.5%; top: 26.5%; width: 47%; height: 47%; border-radius: 50%; overflow: hidden;
    background: radial-gradient(circle at 45% 35%, #241048, #12062b 62%, #0a0318); box-shadow: inset 0 .8cqi 2cqi rgba(0,0,0,.9), 0 0 0 .8cqi #0a0a0d; }
  .b-8 .die { position: absolute; left: 13%; top: 14%; width: 74%; height: 68%;
    clip-path: polygon(50% 4%, 96% 92%, 4% 92%); background: linear-gradient(160deg, #2a55c0 0%, #16307f 42%, #0a1a52 100%);
    display: grid; place-items: end center; padding-bottom: 18%; animation: bob 2.4s ease-in-out infinite; }
  .b-8 .die span { font-size: 2.8cqi; line-height: 1.1; text-align: center; color: #dfe9ff; letter-spacing: .1cqi; font-weight: 700; text-transform: uppercase; }
  @keyframes shake { 0%, 55%, 100% { transform: none; } 62% { transform: rotate(-9deg) translateX(-1cqi); } 70% { transform: rotate(8deg) translateX(1cqi); } 78% { transform: rotate(-5deg); } 86% { transform: rotate(3deg); } }
  @keyframes bob { 0%, 55%, 100% { transform: none; opacity: 1; } 66% { transform: translateY(30%) rotate(12deg); opacity: .2; } 90% { transform: translateY(4%); opacity: .9; } }
</style></head>
<body><div class="b b-8">
  <div class="stars"></div>
  <div class="word">Magic 8 Ball<small>ask it a yes-or-no question…</small></div>
  <div class="ball"><div class="gloss"></div><div class="window"><div class="die"><span>yes</span></div></div></div>
</div></body></html>
