<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@800&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Eyes on Me: the drawn face, staring at the title ──────── */
  .b-eom { background: #201a17; color: #fff8ef; font-family: 'Rubik', sans-serif; place-items: center start; }
  .b-eom .word { position: relative; padding-left: 7cqi; font-size: 11cqi; font-weight: 800; line-height: .95; letter-spacing: -.02em; }
  .b-eom .word span { color: #f7c948; }
  .b-eom svg { position: absolute; right: -3cqi; top: 50%; width: 44cqi; height: 44cqi; transform: translateY(-50%); }
  .b-eom .pupils { animation: look 4s ease-in-out infinite; }
  @keyframes look { 0%, 35% { transform: translate(0, 0); } 45%, 70% { transform: translate(13px, 2px); } 80%, 100% { transform: translate(0, 0); } }
  .b-eom .lids { transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }
  @keyframes blink { 0%, 88%, 94%, 100% { transform: scaleY(1); } 91% { transform: scaleY(.1); } }
</style></head>
<body><div class="b b-eom">
  <div class="word">Eyes<br>on <span>Me</span></div>
  <svg viewBox="0 0 200 200">
    <circle cx="100" cy="100" r="80" fill="#f7c948" stroke="#fff8ef" stroke-width="6"/>
    <g class="lids">
      <ellipse cx="72" cy="88" rx="17" ry="21" fill="#fff8ef" stroke="#201a17" stroke-width="4"/>
      <ellipse cx="118" cy="88" rx="17" ry="21" fill="#fff8ef" stroke="#201a17" stroke-width="4"/>
      <g class="pupils"><circle cx="63" cy="91" r="8" fill="#201a17"/><circle cx="109" cy="91" r="8" fill="#201a17"/></g>
    </g>
    <path d="M68 128 Q92 148 118 128" fill="none" stroke="#201a17" stroke-width="5" stroke-linecap="round"/>
    <path d="M56 60 Q70 52 84 58 M106 58 Q120 52 134 60" fill="none" stroke="#201a17" stroke-width="5" stroke-linecap="round"/>
  </svg>
</div></body></html>
