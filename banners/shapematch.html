<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Shape Match: same or mirrored? two polyominoes ────────── */
  .b-shape { background: #201a17; font-family: 'Arial Black', Arial, sans-serif; color: #fff8ef;
    grid-template-columns: 1fr 1fr; padding: 0 5cqi; }
  .b-shape .pair { display: flex; gap: 6cqi; align-items: center; justify-self: center; }
  .b-shape svg { width: 15cqi; height: 20cqi; overflow: visible; }
  .b-shape svg rect { stroke: #201a17; stroke-width: 2; }
  .b-shape .a rect { fill: #f7c948; }
  .b-shape .m rect { fill: #5aa0db; }
  .b-shape .m { animation: flip 3.2s ease-in-out infinite; }
  @keyframes flip { 0%, 30% { transform: scaleX(-1) rotate(0deg); } 50%, 80% { transform: scaleX(1) rotate(0deg); } 100% { transform: scaleX(-1); } }
  .b-shape .q { font-family: Georgia, serif; font-style: italic; font-size: 4cqi; color: #f0563e; }
  .b-shape h1 { margin: 0; font-size: 10.5cqi; line-height: .95; letter-spacing: -.2cqi; }
  .b-shape h1 small { display: block; margin-top: 2cqi; font-family: Georgia, serif; font-weight: 400;
    font-style: italic; font-size: 3.6cqi; letter-spacing: 0; color: #b9b2a8; }
</style></head>
<body><div class="b b-shape">
  <div class="pair">
    <svg class="a" viewBox="0 0 60 80"><rect x="0" y="0" width="20" height="20"/><rect x="0" y="20" width="20" height="20"/><rect x="0" y="40" width="20" height="20"/><rect x="20" y="40" width="20" height="20"/><rect x="40" y="40" width="20" height="20"/><rect x="20" y="60" width="20" height="20"/></svg>
    <svg class="m" viewBox="0 0 60 80"><rect x="0" y="0" width="20" height="20"/><rect x="0" y="20" width="20" height="20"/><rect x="0" y="40" width="20" height="20"/><rect x="20" y="40" width="20" height="20"/><rect x="40" y="40" width="20" height="20"/><rect x="20" y="60" width="20" height="20"/></svg>
  </div>
  <h1>Shape<br>Match<small>same, or mirrored?</small></h1>
</div></body></html>
