<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Infinite Loader: a progress bar at 99.99…%, forever ── */
  .b-load { background: radial-gradient(circle at 50% 38%, #fff8ef 0%, #f2ede2 75%); color: #201a17; font-family: 'Arial Black', Arial, sans-serif; }
  .b-load .wrap { width: 76cqi; }
  .b-load .top { display: flex; justify-content: space-between; align-items: baseline; }
  .b-load .word { font-size: 9.4cqi; letter-spacing: -.2cqi; line-height: 1; }
  .b-load .pct { font-family: 'Courier New', monospace; font-weight: 700; font-size: 3.4cqi; color: #f0563e; font-variant-numeric: tabular-nums; }
  .b-load .bar { margin-top: 2.6cqi; height: 5.6cqi; border: .5cqi solid #201a17; border-radius: 3cqi; background: #fff8ef; overflow: hidden; padding: .6cqi; }
  .b-load .fill { height: 100%; width: 99.4%; border-radius: 2cqi;
    background: repeating-linear-gradient(-45deg, #f0563e 0 2cqi, #f47b28 2cqi 4cqi); background-size: 5.66cqi 100%; animation: crawl 1s linear infinite; }
  @keyframes crawl { to { background-position: 5.66cqi 0; } }
  .b-load .status { margin-top: 1.8cqi; font-family: Georgia, serif; font-style: italic; font-size: 2.8cqi; color: #6d625a; }
</style></head>
<body><div class="b b-load">
  <div class="wrap">
    <div class="top"><div class="word">Infinite Loader</div><div class="pct" id="p">99.9997%</div></div>
    <div class="bar"><div class="fill"></div></div>
    <div class="status">almost there. (it will not arrive.)</div>
  </div>
</div>
<script>
let d = 4; const p = document.getElementById('p');
if (LIVE) setInterval(() => { d = d >= 9 ? 4 : d + 1; p.textContent = '99.' + '9'.repeat(d - 1) + '7%'; }, 900);
</script></body></html>
