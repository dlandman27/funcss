<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Chicanery: a court transcript page; the witness's outburst in the site's red caps ── */
  .b-chic { background: #fbfaf6; font-family: Georgia, serif; color: #1a1a1a; place-items: center start; }
  .b-chic::before { content: ''; position: absolute; top: 0; bottom: 0; left: 11cqi; border-left: .25cqi double #c7392f; box-shadow: .6cqi 0 0 -.1cqi #fbfaf6, .7cqi 0 0 0 #c7392f; }
  .b-chic .nums { position: absolute; top: 2.4cqi; left: 4cqi; font: 2.2cqi/4.6cqi 'Courier New', monospace; color: #9a958b; text-align: right; width: 4.6cqi; }
  .b-chic .lines { position: absolute; inset: 0; background: repeating-linear-gradient(180deg, transparent 0 calc(4.6cqi - 1px), rgba(26,26,26,.06) calc(4.6cqi - 1px) 4.6cqi); background-position: 0 2.4cqi; }
  .b-chic .t { position: relative; padding-left: 17cqi; }
  .b-chic .who { font: 700 2.6cqi 'Courier New', monospace; letter-spacing: .3cqi; color: #555; }
  .b-chic h1 { margin: .4cqi 0 0; font-size: 14cqi; font-weight: 400; line-height: 1; letter-spacing: -.3cqi; }
  .b-chic .yell { margin-top: 1.4cqi; display: inline-block; font-size: 4.6cqi; text-transform: uppercase; color: #ff3333; letter-spacing: .1cqi;
    text-shadow: .2cqi .2cqi .4cqi rgba(255,0,0,.25); animation: shake .5s ease-in-out infinite; }
  @keyframes shake { 0%, 100% { transform: translate(0, 0) rotate(0); } 20% { transform: translate(-.5cqi, .2cqi) rotate(-1deg); } 40% { transform: translate(.5cqi, -.2cqi) rotate(1deg); } 60% { transform: translate(-.4cqi, 0) rotate(-.5deg); } 80% { transform: translate(.4cqi, .2cqi); } }
</style></head>
<body><div class="b b-chic">
  <div class="lines"></div>
  <div class="nums">1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9<br>10<br>11<br>12<br>13</div>
  <div class="t">
    <div class="who">MR. McGILL:</div>
    <h1>Chicanery</h1>
    <div class="yell">I am not crazy!</div>
  </div>
</div></body></html>
