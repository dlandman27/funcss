<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Digits of Now: the Unix epoch, ticking on paper ───────── */
  .b-now { background: #f2ede2; font-family: 'Courier Prime', 'Courier New', monospace; color: #201a17; }
  .b-now .epoch { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center;
    font-weight: 700; font-size: 21cqi; letter-spacing: -.6cqi; color: rgba(32,26,23,.05); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .b-now .word { position: relative; text-align: center; font-weight: 700; font-size: 11cqi; line-height: 1; }
  .b-now .word small { display: block; margin-top: 1.6cqi; font-weight: 400; font-size: 3.2cqi; letter-spacing: .3cqi; color: #8a7f6f; font-variant-numeric: tabular-nums; }
  .b-now .word small b { color: #201a17; background: #f7c948; padding: 0 .6cqi; }
</style></head>
<body><div class="b b-now">
  <div class="epoch" id="big">1794268800</div>
  <div class="word">Digits of Now<small>seconds since 1970 &middot; <b id="n">1794268800</b></small></div>
</div>
<script>
const n = document.getElementById('n'), big = document.getElementById('big');
const show = () => { const s = Math.floor(Date.now() / 1000); n.textContent = big.textContent = s; };
show(); if (LIVE) setInterval(show, 250);
</script></body></html>
