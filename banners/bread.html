<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,144,600&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Bread: a scored sourdough boule on a floured board, warm and plain ── */
  .b-bread { background: radial-gradient(ellipse at 70% 40%, #fff8ef, #f2e6d2 70%); font-family: 'Fraunces', Georgia, serif; color: #3b2414;
    grid-template-columns: 1fr 1fr; padding: 0 4cqi 0 9cqi; }
  .b-bread .word { font-size: 17cqi; font-style: italic; font-weight: 600; line-height: 1; letter-spacing: -.4cqi; }
  .b-bread .word small { display: block; margin-top: 1cqi; font: 2.8cqi Georgia, serif; letter-spacing: .2cqi; color: #9a7656; font-style: italic; }
  .b-bread .stage { position: relative; width: 42cqi; height: 30cqi; justify-self: center; }
  .b-bread .board { position: absolute; left: 0; right: 0; bottom: 0; height: 9cqi; border-radius: 50%; background: radial-gradient(ellipse, #c9a173, #a37b4f 70%);
    box-shadow: 0 1cqi 2cqi rgba(59,36,20,.25); }
  .b-bread .board::after { content: ''; position: absolute; inset: 1cqi 4cqi; border-radius: 50%;
    background: radial-gradient(circle at 30% 40%, rgba(255,255,255,.5) 0 .3cqi, transparent .4cqi) 0 0 / 2.2cqi 1.6cqi; opacity: .35; }
  .b-bread .loaf { position: absolute; left: 6cqi; right: 6cqi; bottom: 4cqi; height: 21cqi; border-radius: 50% 50% 44% 44% / 62% 62% 38% 38%;
    background: radial-gradient(ellipse at 40% 25%, #e9b06a, #c47a33 45%, #8a4b1c 85%); box-shadow: inset -1.4cqi -1.6cqi 0 rgba(80,40,10,.35); }
  .b-bread .cut { position: absolute; height: 2cqi; border-radius: 50%; background: linear-gradient(180deg, #f6dcae, #e2b77a);
    box-shadow: 0 .3cqi 0 rgba(80,40,10,.35); transform: rotate(-18deg); }
  .b-bread .flour { position: absolute; inset: 0; border-radius: inherit;
    background: radial-gradient(circle, rgba(255,255,255,.55) 0 .25cqi, transparent .35cqi) 0 0 / 1.8cqi 1.4cqi; mask: radial-gradient(ellipse at 40% 20%, #000 20%, transparent 60%); opacity: .45; }
  .b-bread .steam { position: absolute; bottom: 24cqi; width: 2cqi; height: 8cqi; border-radius: 50%; border-left: .45cqi solid rgba(160,130,100,.4);
    animation: steam 2.6s ease-in-out infinite; }
  @keyframes steam { 50% { transform: translate(.8cqi, -2cqi) scaleY(1.2); opacity: .2; } }
</style></head>
<body><div class="b b-bread">
  <div class="word">Bread<small>that's it. that's the site.</small></div>
  <div class="stage">
    <div class="board"></div>
    <div class="loaf"><div class="flour"></div>
      <i class="cut" style="left:7cqi;top:6cqi;width:16cqi"></i><i class="cut" style="left:10cqi;top:10.5cqi;width:16cqi"></i><i class="cut" style="left:13cqi;top:15cqi;width:12cqi"></i></div>
    <i class="steam" style="left:16cqi"></i><i class="steam" style="left:21cqi;animation-delay:-.9s"></i><i class="steam" style="left:26cqi;animation-delay:-1.7s"></i>
  </div>
</div></body></html>
