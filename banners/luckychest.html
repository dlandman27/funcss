<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Lucky Chest: the chunky treasure chest, lid popping, loot light pouring out ── */
  .b-chest { background: radial-gradient(circle at 26% 55%, #8fd0f0 0%, #5aa0db 60%, #3f86c6 100%); color: #201a17; font-family: 'Arial Black', Arial, sans-serif; grid-template-columns: 40cqi 1fr; padding: 0 5cqi 0 3cqi; gap: 2cqi; }
  .b-chest .rays { position: absolute; left: 22cqi; top: 50%; width: 120cqi; height: 120cqi; margin: -60cqi; background: repeating-conic-gradient(rgba(255,248,239,.16) 0 9deg, transparent 9deg 22deg); animation: rays 30s linear infinite; }
  @keyframes rays { to { transform: rotate(360deg); } }
  .b-chest svg { position: relative; width: 36cqi; overflow: visible; margin-top: 4cqi; }
  .b-chest #lid { animation: lid 1.8s cubic-bezier(.3, 1.6, .5, 1) infinite; transform-box: view-box; transform-origin: 22px 96px; }
  @keyframes lid { 0%, 100% { transform: rotate(-24deg); } 50% { transform: rotate(-8deg); } }
  .b-chest #beam { opacity: .75; }
  .b-chest .word { position: relative; font-size: 10.4cqi; line-height: .92; color: #fff8ef; -webkit-text-stroke: 1.1cqi #201a17; paint-order: stroke fill; text-shadow: .8cqi .8cqi 0 #201a17; transform: rotate(-3deg); }
  .b-chest .word span { display: block; color: #f7c948; transform: translateX(4cqi); }
  .b-chest .word small { display: block; -webkit-text-stroke: 0; text-shadow: none; font-family: Georgia, serif; font-style: italic; font-weight: 400; font-size: 2.8cqi; color: #201a17; margin-top: 2.2cqi; transform: translateX(4cqi); }
</style></head>
<body><div class="b b-chest">
  <div class="rays"></div>
  <svg viewBox="0 0 240 205">
    <path id="beam" d="M60 96 L80 -60 L170 -60 L180 96 Z" fill="#fff3cf"/>
    <rect x="30" y="182" width="26" height="14" rx="4" fill="#f7c948" stroke="#201a17" stroke-width="3.5"/>
    <rect x="184" y="182" width="26" height="14" rx="4" fill="#f7c948" stroke="#201a17" stroke-width="3.5"/>
    <rect x="22" y="96" width="196" height="92" rx="10" fill="#f47b28" stroke="#201a17" stroke-width="4.5"/>
    <line x1="26" y1="126" x2="214" y2="126" stroke="#201a17" stroke-width="2.5" opacity=".22"/>
    <line x1="26" y1="156" x2="214" y2="156" stroke="#201a17" stroke-width="2.5" opacity=".22"/>
    <rect x="48" y="94" width="20" height="96" fill="#f7c948" stroke="#201a17" stroke-width="3.5"/>
    <rect x="172" y="94" width="20" height="96" fill="#f7c948" stroke="#201a17" stroke-width="3.5"/>
    <rect x="102" y="96" width="36" height="34" rx="7" fill="#f7c948" stroke="#201a17" stroke-width="4"/>
    <circle cx="120" cy="108" r="5" fill="#201a17"/><path d="M120 108 L115 122 L125 122 Z" fill="#201a17"/>
    <ellipse cx="120" cy="96" rx="92" ry="12" fill="#fff3cf"/>
    <g id="lid">
      <path d="M22 96 Q22 34 120 34 Q218 34 218 96 Z" fill="#f0563e" stroke="#201a17" stroke-width="4.5"/>
      <path d="M48 96 Q50 52 74 42 L92 42 Q62 56 68 96 Z" fill="#f7c948" stroke="#201a17" stroke-width="3.5"/>
      <path d="M192 96 Q190 52 166 42 L148 42 Q178 56 172 96 Z" fill="#f7c948" stroke="#201a17" stroke-width="3.5"/>
      <rect x="22" y="82" width="196" height="15" fill="#f7c948" stroke="#201a17" stroke-width="4"/>
      <rect x="106" y="82" width="28" height="22" rx="6" fill="#f7c948" stroke="#201a17" stroke-width="4"/>
      <path d="M52 58 Q72 42 100 40 L112 40 Q80 48 64 66 Z" fill="#fff8ef" opacity=".35"/>
    </g>
    <polygon points="100,-10 104,4 118,8 104,12 100,26 96,12 82,8 96,4" fill="#fff8ef" stroke="#201a17" stroke-width="2.5"/>
    <polygon points="150,20 153,30 163,33 153,36 150,46 147,36 137,33 147,30" fill="#f7c948" stroke="#201a17" stroke-width="2.5"/>
  </svg>
  <div class="word">Lucky<span>Chest</span><small>tap it. it might get luckier.</small></div>
</div></body></html>
