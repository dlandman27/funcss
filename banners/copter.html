<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Copter: rock cave, little red helicopter ──────────────── */
  .b-cop { background: #f2ede2; font-family: 'Bungee', 'Arial Black', sans-serif; color: #201a17; place-items: center end; }
  .b-cop canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .b-cop .word { position: relative; margin-right: 8cqi; font-size: 11cqi; line-height: 1; color: #fff8ef; -webkit-text-stroke: .5cqi #201a17; paint-order: stroke fill; text-shadow: .6cqi .6cqi 0 #201a17; }
</style></head>
<body><div class="b b-cop">
  <canvas id="cave" width="800" height="300"></canvas>
  <div class="word">Copter</div>
</div>
<script>
const c = document.getElementById('cave'), g = c.getContext('2d');
const INK = '#201a17', ROCK = '#6b5545', ROCK_HI = '#7d6553', RED = '#f0563e', CREAM = '#fff8ef';
const ceil = x => 46 + 22 * Math.sin(x / 70) + 12 * Math.sin(x / 23 + 1);
const bot = x => 254 - 22 * Math.sin(x / 80 + 2) - 12 * Math.sin(x / 31);
let off = 0, t = 0;
function wall(f, edge) {
  g.beginPath(); g.moveTo(-10, edge);
  for (let x = -10; x <= 810; x += 10) g.lineTo(x, f(x + off));
  g.lineTo(810, edge); g.closePath();
  g.fillStyle = ROCK; g.fill(); g.lineWidth = 4; g.strokeStyle = INK; g.lineJoin = 'round'; g.stroke();
}
function copter(x, y, rw) {
  g.save(); g.translate(x, y); g.scale(1.5, 1.5); g.rotate(-.06);
  g.lineWidth = 3; g.strokeStyle = INK;
  g.beginPath(); g.moveTo(-14, 0); g.lineTo(-38, -4); g.lineTo(-38, 2); g.lineTo(-14, 6); g.fillStyle = RED; g.fill(); g.stroke();
  g.beginPath(); g.moveTo(-34, -3); g.lineTo(-44, -13); g.lineTo(-38, -1); g.fill(); g.stroke();
  g.beginPath(); g.ellipse(0, 0, 20, 13, 0, 0, 7); g.fillStyle = RED; g.fill(); g.stroke();
  g.beginPath(); g.arc(7, -1, 7, 0, 7); g.fillStyle = CREAM; g.fill(); g.stroke();
  g.beginPath(); g.moveTo(-10, 17); g.lineTo(14, 17); g.moveTo(-4, 12); g.lineTo(-6, 17); g.moveTo(6, 12); g.lineTo(8, 17); g.stroke();
  g.beginPath(); g.moveTo(0, -13); g.lineTo(0, -20); g.stroke();
  g.beginPath(); g.ellipse(0, -20, rw, 3.2, 0, 0, 7); g.fillStyle = INK; g.fill();
  g.restore();
}
(function frame() {
  g.clearRect(0, 0, 800, 300);
  g.strokeStyle = 'rgba(32,26,23,.18)'; g.lineWidth = 3; g.setLineDash([2, 14]);
  g.beginPath(); for (let x = 30; x < 200; x += 4) g.lineTo(x, 150 + 18 * Math.sin((x + t * 2) / 40)); g.stroke(); g.setLineDash([]);
  wall(ceil, -10); wall(bot, 310);
  copter(230, 150 + 18 * Math.sin((200 + t * 2) / 40), 30 * Math.abs(Math.cos(t / 2)) + 4);
  if (LIVE) { off += 2.2; t += 1; requestAnimationFrame(frame); }
})();
</script></body></html>
