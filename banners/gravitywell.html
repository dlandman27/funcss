<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Gravity Well: ice-blue particles caught in orbit ──────── */
  .b-grav { background: #06060a; color: #e9defe; font-family: Georgia, 'Times New Roman', serif; place-items: center start; }
  .b-grav canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .b-grav .word { position: relative; padding-left: 7cqi; font-size: 10cqi; line-height: 1.02; font-style: italic; letter-spacing: .02em;
    text-shadow: 0 0 3cqi rgba(160,130,255,.45); }
</style></head>
<body><div class="b b-grav">
  <canvas id="c" width="800" height="300"></canvas>
  <div class="word">Gravity<br>Well</div>
</div>
<script>
const c = document.getElementById('c'), g = c.getContext('2d'), CX = 590, CY = 150;
let seed = 5; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const P = [];
for (let i = 0; i < 140; i++) {
  const r = 22 + Math.pow(rnd(), .8) * 190;
  P.push({ r, a: rnd() * 6.28, tilt: .32 + rnd() * .12, w: 9 / Math.pow(r, 1.5), gold: rnd() < .05, s: .8 + rnd() * 1.3 });
}
function pos(p, a) { return [CX + Math.cos(a) * p.r, CY + Math.sin(a) * p.r * p.tilt * 2.2 * .5 + Math.cos(a) * p.r * .08]; }
function draw() {
  g.fillStyle = '#06060a'; g.fillRect(0, 0, 800, 300);
  const glow = g.createRadialGradient(CX, CY, 0, CX, CY, 70); glow.addColorStop(0, 'rgba(160,130,255,.35)'); glow.addColorStop(1, 'rgba(160,130,255,0)');
  g.fillStyle = glow; g.fillRect(CX - 70, CY - 70, 140, 140);
  for (const p of P) {
    const col = p.gold ? '247,201,72' : '191,224,255';
    g.beginPath();
    for (let k = 0; k <= 14; k++) { const [x, y] = pos(p, p.a - k * p.w * 2.2); k ? g.lineTo(x, y) : g.moveTo(x, y); }
    g.strokeStyle = `rgba(${col},.18)`; g.lineWidth = p.s; g.stroke();
    const [x, y] = pos(p, p.a); g.fillStyle = `rgb(${col})`; g.beginPath(); g.arc(x, y, p.s, 0, 6.28); g.fill();
  }
  g.fillStyle = '#06060a'; g.beginPath(); g.arc(CX, CY, 7, 0, 6.28); g.fill();
}
draw();
(function loop() {
  if (!LIVE) return;
  for (const p of P) p.a += p.w * .5;
  draw(); requestAnimationFrame(loop);
})();
</script></body></html>
