<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── The Longest Name: a HELLO my name is sticker ──────────── */
  .b-tag { background: #dfe3e8; }
  .b-tag .tag { position: relative; width: 84cqi; border-radius: 3cqi; background: #d8322b; padding: 1.4cqi 1.4cqi 3.6cqi; box-shadow: 0 1cqi 2cqi rgba(0,0,0,.18);
    transform: rotate(-1.5deg); transform-origin: left center; animation: stretch 4s ease-in-out infinite; }
  @keyframes stretch { 50% { transform: rotate(-1.5deg) scaleX(1.06); } }
  .b-tag .head { text-align: center; color: #fff; font-family: 'Arial Black', Arial, sans-serif; font-size: 7.5cqi; line-height: 1; letter-spacing: .06em; padding-top: .8cqi; }
  .b-tag .head small { display: block; font-family: Arial, sans-serif; font-weight: 700; font-size: 3cqi; letter-spacing: .02em; margin-top: .4cqi; }
  .b-tag .name { margin-top: 1.6cqi; background: #fff; border-radius: 1.2cqi; height: 16cqi; display: grid; place-items: center;
    font-family: 'Comic Sans MS', 'Comic Sans', cursive; font-weight: 700; font-size: 9cqi; color: #1b2a6b; white-space: nowrap; }
</style></head>
<body><div class="b b-tag">
  <div class="tag">
    <div class="head">HELLO<small>my name is</small></div>
    <div class="name">The Longest Name</div>
  </div>
</div></body></html>
