<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Balance the Stick: the cart-pole problem on graph paper ── */
  .b-stick { background-color: #f7f9fb; font-family: 'Space Mono', 'Courier New', monospace; color: #1d3c6e;
    background-image: linear-gradient(rgba(90,160,219,.18) 1px, transparent 1px), linear-gradient(90deg, rgba(90,160,219,.18) 1px, transparent 1px);
    background-size: 2.5cqi 2.5cqi; place-items: center start; }
  .b-stick .word { position: relative; padding-left: 7cqi; font-size: 8cqi; font-weight: 700; line-height: 1.02; letter-spacing: -.3cqi; }
  .b-stick .word small { display: block; margin-top: 2cqi; font-size: 2.6cqi; letter-spacing: 0; color: #5aa0db; }
  .b-stick svg { position: absolute; right: 3cqi; top: 0; width: 46cqi; height: 100%; overflow: visible; }
  .b-stick .pole { animation: tip 2.4s ease-in-out infinite; transform-origin: 200px 214px; }
  @keyframes tip { 0%, 100% { transform: rotate(14deg); } 50% { transform: rotate(-9deg); } }
  .b-stick .cart { animation: chase 2.4s ease-in-out infinite; }
  @keyframes chase { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-26px); } }
  .b-stick .gust { animation: gust 1.2s linear infinite; }
  @keyframes gust { to { stroke-dashoffset: -40; } }
</style></head>
<body><div class="b b-stick">
  <div class="word">Balance<br>the Stick<small>θ → 0. the wind disagrees.</small></div>
  <svg viewBox="40 20 300 260">
    <g fill="none" stroke="#1d3c6e" stroke-width="3" stroke-linecap="round">
      <line x1="10" y1="258" x2="342" y2="258" />
      <g stroke="#5aa0db" stroke-dasharray="14 10" class="gust"><path d="M60 110 h70"/><path d="M50 140 h50"/><path d="M70 170 h40"/></g>
      <path d="M200 50 v30" stroke-dasharray="4 6" stroke-width="2"/>
    </g>
    <g class="cart">
      <g class="pole">
        <line x1="200" y1="214" x2="200" y2="58" stroke="#1d3c6e" stroke-width="7" stroke-linecap="round"/>
        <circle cx="200" cy="58" r="9" fill="#f0563e" stroke="#1d3c6e" stroke-width="3"/>
      </g>
      <rect x="150" y="206" width="100" height="36" rx="5" fill="#fff" stroke="#1d3c6e" stroke-width="3.5"/>
      <circle cx="175" cy="248" r="10" fill="#fff" stroke="#1d3c6e" stroke-width="3.5"/>
      <circle cx="225" cy="248" r="10" fill="#fff" stroke="#1d3c6e" stroke-width="3.5"/>
      <circle cx="200" cy="214" r="4" fill="#1d3c6e"/>
      <path d="M200 140 A 74 74 0 0 1 218 142" fill="none" stroke="#f0563e" stroke-width="2.5"/>
      <text x="214" y="132" font-family="Space Mono, monospace" font-size="16" fill="#f0563e">θ</text>
    </g>
  </svg>
</div></body></html>
