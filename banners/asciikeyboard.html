<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── ASCII Key Tester: one chunky keycap being pressed, inspector readout ── */
  .b-key { background: #dfe4ea; font-family: 'Courier New', monospace; color: #201a17;
    grid-template-columns: auto 1fr; gap: 6cqi; padding: 0 6cqi 0 9cqi; }
  .b-key::before { content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 1px 1px, rgba(32,26,23,.12) 1.2px, transparent 1.4px) 0 0 / 3cqi 3cqi; }
  .b-key .cap { position: relative; width: 25cqi; height: 25cqi; }
  .b-key .cap .base { position: absolute; inset: 0; border-radius: 3cqi; background: #2f3a46; }
  .b-key .cap .top { position: absolute; inset: 0 0 2.6cqi 0; border-radius: 3cqi; background: linear-gradient(180deg, #fbfbf8, #e6e3dc);
    border: .45cqi solid #2f3a46; display: grid; place-items: center; font: 900 13cqi/1 'Arial Black', Arial, sans-serif;
    animation: press 1.6s ease-in-out infinite; }
  @keyframes press { 0%, 40%, 100% { transform: translateY(0); } 50%, 62% { transform: translateY(2cqi); background: #f7c948; } }
  .b-key .cap .top small { position: absolute; top: 1.8cqi; left: 2.2cqi; font: 700 2.4cqi 'Courier New', monospace; color: #6b7480; }
  .b-key .title { position: relative; }
  .b-key h1 { margin: 0; font: 900 8.6cqi/1 'Arial Black', Arial, sans-serif; letter-spacing: -.2cqi; }
  .b-key .read { margin-top: 2.6cqi; display: flex; gap: 1.4cqi; font-size: 3cqi; font-weight: 700; }
  .b-key .read span { background: #fff; border: .3cqi solid #201a17; border-radius: 1cqi; padding: .6cqi 1.4cqi; }
  .b-key .read b { color: #2fb0a3; }
</style></head>
<body><div class="b b-key">
  <div class="cap"><div class="base"></div><div class="top"><small>shift</small>A</div></div>
  <div class="title">
    <h1>ASCII<br>Key Tester</h1>
    <div class="read"><span>key: <b>"A"</b></span><span>code: <b>65</b></span><span><b>0x41</b></span></div>
  </div>
</div></body></html>
