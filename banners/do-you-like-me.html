<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Do You Like Me?: plain Arial, the No button runs away ─── */
  .b-like { background: #fff0f3; font-family: Arial, sans-serif; color: #222; }
  .b-like .box { text-align: center; }
  .b-like .word { font-size: 10cqi; font-weight: 700; line-height: 1; }
  .b-like .btns { position: relative; margin-top: 4cqi; display: flex; justify-content: center; gap: 4cqi; }
  .b-like button { font: 700 3.6cqi Arial, sans-serif; color: #fff; border: 0; border-radius: .8cqi; padding: 1.4cqi 5cqi; }
  .b-like .yes { background: #4CAF50; }
  .b-like .no { background: #f44336; animation: flee 2.4s ease-in-out infinite; }
  @keyframes flee { 0%, 20%, 100% { transform: translate(0, 0); } 30%, 45% { transform: translate(22cqi, -9cqi) rotate(6deg); } 55%, 70% { transform: translate(-40cqi, 6cqi) rotate(-5deg); } 80% { transform: translate(0, 0); } }
  .b-like .heart { position: absolute; color: #f44336; opacity: .14; font-size: 9cqi; }
</style></head>
<body><div class="b b-like">
  <span class="heart" style="left:7%;top:10%;transform:rotate(-14deg)">&#x2665;</span>
  <span class="heart" style="right:8%;bottom:8%;transform:rotate(12deg);font-size:13cqi">&#x2665;</span>
  <div class="box">
    <div class="word">Do You Like Me?</div>
    <div class="btns"><button class="yes">Yes</button><button class="no">No</button></div>
  </div>
</div></body></html>
