<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Spin the Bottle: green felt table, spinning bottle ────── */
  .b-bottle { background: radial-gradient(ellipse at 70% 50%, #1e5c3a 0%, #123a24 60%, #0b2416 100%);
    font-family: Georgia, 'Times New Roman', serif; color: #fff8ef; place-items: center start; }
  .b-bottle h1 { position: relative; margin: 0 0 0 6cqi; font-weight: 400; font-style: italic; font-size: 10cqi; line-height: 1; }
  .b-bottle h1 b { display: block; font-style: normal; font-family: 'Arial Black', sans-serif; color: #f7c948; font-size: 12.5cqi; letter-spacing: -.2cqi; }
  .b-bottle .ring { position: absolute; right: 8cqi; top: 50%; width: 32cqi; height: 32cqi; margin-top: -16cqi; border-radius: 50%;
    border: .3cqi dashed rgba(247, 201, 72, .35); }
  .b-bottle svg { position: absolute; right: 8cqi; top: 50%; width: 32cqi; height: 32cqi; margin-top: -16cqi;
    transform: rotate(-35deg); animation: spin 4.5s cubic-bezier(.15,.7,.2,1) infinite; }
  @keyframes spin { 0% { transform: rotate(-35deg); } 85%, 100% { transform: rotate(1405deg); } }
  .b-bottle .seat { position: absolute; width: 4cqi; height: 4cqi; border-radius: 50%; background: #fff8ef; opacity: .85; }
</style></head>
<body><div class="b b-bottle">
  <h1>Spin <span style="font-size:.7em">the</span><b>Bottle</b></h1>
  <div class="ring"></div>
  <svg viewBox="0 0 100 100">
    <g>
      <rect x="45.5" y="6" width="9" height="10" rx="1.5" fill="#c9a24a"/>
      <path d="M46 14 L54 14 L55 30 Q64 36 64 46 L64 88 Q64 94 58 94 L42 94 Q36 94 36 88 L36 46 Q36 36 45 30 Z" fill="#2f8f4e" stroke="#0b2416" stroke-width="1.2"/>
      <path d="M40 48 L40 86" stroke="rgba(255,255,255,.45)" stroke-width="3" stroke-linecap="round"/>
      <rect x="38" y="56" width="24" height="16" rx="2" fill="#fff8ef"/>
      <rect x="41" y="61" width="18" height="2" fill="#f0563e"/><rect x="41" y="65" width="12" height="2" fill="#201a17"/>
    </g>
  </svg>
</div>
<script>
const b = document.querySelector('.b'); const R = 22, cx = 800 - 64 - 128, cy = 150;
for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2 + Math.PI / 6; const s = document.createElement('i'); s.className = 'seat';
  s.style.left = (cx + Math.cos(a) * 150 - 16) + 'px'; s.style.top = (cy + Math.sin(a) * 100 - 16) + 'px'; b.appendChild(s); }
</script></body></html>
