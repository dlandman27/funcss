<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Spend Your Life: hours as currency, draining counter ──── */
  .b-spend { background: #f2ede2; color: #201a17; font-family: 'Arial Black', Arial, sans-serif; }
  .b-spend .wrap { display: flex; flex-direction: column; align-items: center; gap: 2.6cqi; }
  .b-spend h1 { margin: 0; font-size: 10cqi; letter-spacing: -.3cqi; line-height: 1; }
  .b-spend .bar { display: flex; align-items: baseline; gap: 1.6cqi; background: #2e9e5b; color: #fff; padding: 1.4cqi 4cqi; border-radius: .8cqi;
    box-shadow: 0 .6cqi 0 #1f7442; }
  .b-spend .bar b { font-size: 5.2cqi; font-variant-numeric: tabular-nums; letter-spacing: .1cqi; }
  .b-spend .bar span { font-family: Georgia, serif; font-weight: 400; font-style: italic; font-size: 3cqi; opacity: .9; }
  .b-spend .chip { position: absolute; font-family: Georgia, serif; font-style: italic; font-size: 2.6cqi; color: #8a837a;
    border: .25cqi solid #cfc6b4; border-radius: 4cqi; padding: .6cqi 1.8cqi; background: #fff8ef; }
</style></head>
<body><div class="b b-spend">
  <div class="chip" style="left:8cqi;top:4cqi;transform:rotate(-5deg)">sleep · 8h</div>
  <div class="chip" style="right:4cqi;top:3.5cqi;transform:rotate(4deg)">guitar · 1h</div>
  <div class="chip" style="left:14cqi;bottom:4cqi;transform:rotate(4deg)">meetings · 3h</div>
  <div class="chip" style="right:8cqi;bottom:4.5cqi;transform:rotate(-4deg)">falling in love</div>
  <div class="wrap">
    <h1>Spend Your Life</h1>
    <div class="bar"><b id="h">438,291</b><span>hours left</span></div>
  </div>
</div>
<script>
let h = 438291; const el = document.getElementById('h');
if (LIVE) setInterval(() => { h -= 1 + (Math.random() * 7 | 0); el.textContent = h.toLocaleString('en-US'); }, 140);
</script></body></html>
