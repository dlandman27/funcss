<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Horrible Forms: grey system-UI form card, a submit button that runs away ── */
  .b-forms { background: #e8e8e8; color: #222; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  .b-forms .card { position: relative; width: 84cqi; background: #fff; border: 1px solid #ccc; border-radius: .8cqi; padding: 3.6cqi 4.4cqi 3.4cqi; }
  .b-forms .id { font-size: 1.9cqi; color: #888; text-transform: uppercase; letter-spacing: .14cqi; }
  .b-forms h2 { margin: .4cqi 0 2.6cqi; font-size: 9cqi; font-weight: 600; letter-spacing: -.2cqi; line-height: 1; }
  .b-forms label { display: block; font-weight: 600; font-size: 2.6cqi; margin-bottom: .6cqi; }
  .b-forms .row { display: flex; align-items: center; gap: 2cqi; }
  .b-forms .track { position: relative; flex: 1; height: .7cqi; background: #d6d6d6; border-radius: 1cqi; }
  .b-forms .track b { position: absolute; left: 0; top: 0; bottom: 0; width: 63%; background: #2f6fd6; border-radius: 1cqi; }
  .b-forms .track i { position: absolute; left: 63%; top: 50%; width: 2.4cqi; height: 2.4cqi; margin: -1.2cqi; border-radius: 50%; background: #fff; border: 1px solid #aaa; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .b-forms .read { font: 2.6cqi ui-monospace, Menlo, Consolas, monospace; background: #f6f6f6; border: 1px solid #ddd; border-radius: .5cqi; padding: .6cqi 1.2cqi; white-space: nowrap; }
  .b-forms .act { margin-top: 2.6cqi; padding-top: 2cqi; border-top: 1px solid #eee; height: 7cqi; position: relative; }
  .b-forms .btn { position: absolute; left: 0; top: 2cqi; font-size: 2.4cqi; padding: .8cqi 2.2cqi; border-radius: .5cqi; background: #2f6fd6; border: 1px solid #2a62bd; color: #fff; animation: dodge 3.2s steps(1) infinite; }
  @keyframes dodge { 0% { transform: translateX(62cqi) rotate(-4deg); } 33% { transform: translateX(14cqi) rotate(3deg); } 66% { transform: translateX(44cqi) translateY(-.6cqi) rotate(-1deg); } }
  .b-forms .cur { position: absolute; left: 58cqi; top: 3cqi; width: 2.4cqi; }
</style></head>
<body><div class="b b-forms">
  <div class="card">
    <div class="id">form 7 of 12 · required</div>
    <h2>Horrible Forms</h2>
    <label>Date of birth</label>
    <div class="row"><div class="track"><b></b><i></i></div><div class="read">1,184,302 BC</div></div>
    <div class="act">
      <span class="btn">Submit</span>
      <svg class="cur" viewBox="0 0 12 18"><path d="M1 1v14l3.5-3.2 2.4 5.4 2.2-1-2.3-5.3H11z" fill="#fff" stroke="#000" stroke-width="1.2"/></svg>
    </div>
  </div>
</div></body></html>
