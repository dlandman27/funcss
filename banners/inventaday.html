<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Invent-A-Day: two tear-off calendar days smashed into a new one ── */
  .b-day { background: #e9e3d6; color: #201a17; font-family: 'Oswald', 'Arial Narrow', sans-serif; grid-template-columns: auto auto; gap: 7cqi; }
  .b-day .word { font-size: 10cqi; font-weight: 700; line-height: .92; text-transform: none; letter-spacing: -.1cqi; }
  .b-day .word small { display: block; font-family: Georgia, serif; font-style: italic; font-weight: 400; font-size: 2.8cqi; letter-spacing: 0; color: #6d625a; margin-top: 1.6cqi; }
  .b-day .pages { display: flex; align-items: flex-end; }
  .b-day .page { width: 19cqi; background: #fffdf8; box-shadow: 0 .8cqi 2cqi rgba(32,26,23,.18); text-align: center; overflow: hidden; }
  .b-day .page .top { height: 4.4cqi; font-size: 2.2cqi; font-weight: 500; letter-spacing: .5cqi; color: #fff8ef; display: grid; place-items: center; }
  .b-day .page .d { font-size: 7.4cqi; padding-top: 1.2cqi; font-weight: 700; line-height: 1.1; }
  .b-day .page .n { font-size: 1.8cqi; font-weight: 500; letter-spacing: .4cqi; text-transform: uppercase; color: #a89f93; padding-bottom: 1.6cqi; }
  .b-day .l { transform: rotate(-6deg); animation: pushL 2.4s ease-in-out infinite; }
  .b-day .r { transform: rotate(5deg); margin-left: -1.4cqi; animation: pushR 2.4s ease-in-out infinite; }
  @keyframes pushL { 0%, 100% { transform: rotate(-6deg); } 45% { transform: translateX(-3cqi) rotate(-10deg); } 55% { transform: translateX(1cqi) rotate(-3deg); } }
  @keyframes pushR { 0%, 100% { transform: rotate(5deg); } 45% { transform: translateX(3cqi) rotate(9deg); } 55% { transform: translateX(-1cqi) rotate(2deg); } }
  .b-day .l .top { background: #a98fd0; } .b-day .r .top { background: #f0563e; }
</style></head>
<body><div class="b b-day">
  <div class="word">Invent-A-Day<small>two days in. one day out.</small></div>
  <div class="pages">
    <div class="page l"><div class="top">SATURDAY</div><div class="d">Satur</div><div class="n">left half</div></div>
    <div class="page r"><div class="top">MONDAY</div><div class="d">day</div><div class="n">right half</div></div>
  </div>
</div></body></html>
