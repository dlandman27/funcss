<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@700&family=IBM+Plex+Mono:wght@500&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Password Security Checker: field, strength meter, lock ── */
  .b-ps { background: #f5f6f8; font-family: 'IBM Plex Sans', sans-serif; color: #16181d; place-items: center start; }
  .b-ps .inner { margin-left: 6cqi; width: 62cqi; }
  .b-ps .word { font-size: 6.8cqi; line-height: 1.08; letter-spacing: -.2cqi; }
  .b-ps .field { margin-top: 3.4cqi; display: flex; align-items: center; justify-content: space-between; background: #fff; border: .3cqi solid #16181d; border-radius: 1cqi; padding: 1.4cqi 2.4cqi;
    font-family: 'IBM Plex Mono', monospace; font-size: 4cqi; letter-spacing: .6cqi; }
  .b-ps .field small { font-size: 2.2cqi; letter-spacing: .1cqi; color: #6b7080; }
  .b-ps .meter { display: flex; gap: 1cqi; margin-top: 1.8cqi; }
  .b-ps .meter i { flex: 1; height: 1.4cqi; border-radius: .7cqi; background: #dde0e6; }
  .b-ps .meter i:nth-child(1) { background: #e0453a; } .b-ps .meter i:nth-child(2) { background: #f08c2e; }
  .b-ps .meter i:nth-child(3) { animation: m3 4s steps(1) infinite; } .b-ps .meter i:nth-child(4) { animation: m4 4s steps(1) infinite; } .b-ps .meter i:nth-child(5) { animation: m5 4s steps(1) infinite; }
  @keyframes m3 { 40% { background: #f2c230; } 92% { background: #dde0e6; } } @keyframes m4 { 55% { background: #8cc63f; } 92% { background: #dde0e6; } } @keyframes m5 { 70% { background: #2fa84f; } 92% { background: #dde0e6; } }
  .b-ps .verdict { margin-top: 1.2cqi; font-family: 'IBM Plex Mono', monospace; font-size: 2.4cqi; color: #e0453a; }
  .b-ps .lock { position: absolute; right: 9cqi; top: 50%; width: 18cqi; margin-top: -12cqi; }
  .b-ps .shackle { transform-origin: 70% 100%; animation: shut 4s ease-in-out infinite; }
  @keyframes shut { 0%, 60% { transform: translateY(-14px); } 72%, 92% { transform: none; } 100% { transform: translateY(-14px); } }
</style></head>
<body><div class="b b-ps">
  <div class="inner">
    <div class="word">Password Security<br>Checker</div>
    <div class="field"><span>••••••••••</span><small>show</small></div>
    <div class="meter"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="verdict">crack time: 3 hours. be judged.</div>
  </div>
  <svg class="lock" viewBox="0 0 90 120">
    <path class="shackle" d="M22 56 V34 a23 23 0 0 1 46 0 V56" fill="none" stroke="#16181d" stroke-width="9" stroke-linecap="round"/>
    <rect x="8" y="52" width="74" height="60" rx="10" fill="#f2c230" stroke="#16181d" stroke-width="4"/>
    <circle cx="45" cy="78" r="7" fill="#16181d"/><rect x="42" y="80" width="6" height="16" rx="3" fill="#16181d"/>
  </svg>
</div></body></html>
