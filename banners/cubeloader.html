<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Cube Loader: isometric void, lavender cube, gold trail ── */
  .b-cube { background: radial-gradient(ellipse at 70% 50%, #1c1530, #0d0a14 70%); font-family: 'Space Mono', monospace; color: #cfc4e8; place-items: center start; }
  .b-cube svg { position: absolute; right: 2cqi; top: 0; height: 100%; }
  .b-cube .word { position: relative; margin-left: 7cqi; font-size: 9.4cqi; line-height: 1.02; letter-spacing: -.3cqi; }
  .b-cube .word small { display: block; margin-top: 1.4cqi; font-size: 2.8cqi; letter-spacing: .4cqi; color: #8b74b3; }
  .b-cube .word small i { font-style: normal; animation: dot 1.2s steps(1) infinite; }
  .b-cube .word small i:nth-child(2) { animation-delay: .2s; } .b-cube .word small i:nth-child(3) { animation-delay: .4s; }
  @keyframes dot { 50% { opacity: .15; } }
  .b-cube .cube { animation: roll 1.4s cubic-bezier(.5,0,.5,1) infinite; }
  @keyframes roll { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(0, -14px); } }
</style></head>
<body><div class="b b-cube">
  <svg id="iso" viewBox="0 0 400 300"></svg>
  <div class="word">Cube<br>Loader<small>booting<i>.</i><i>.</i><i>.</i></small></div>
</div>
<script>
const s = document.getElementById('iso'), W = 56, H = 28, OX = 200, OY = 70;
const P = (i, j) => [OX + (i - j) * W / 2, OY + (i + j) * H / 2];
const trail = new Set(['1,1', '2,1', '3,1', '3,2', '3,3', '4,3']), gold = '5,2';
let out = '';
for (let i = 0; i < 7; i++) for (let j = 0; j < 7; j++) {
  const [x, y] = P(i, j), k = i + ',' + j;
  const fill = k === gold ? '#f7c948' : trail.has(k) ? '#8b74b3' : 'none';
  const stroke = fill === 'none' ? 'rgba(207,196,232,.12)' : '#0d0a14';
  out += `<path d="M${x} ${y - H / 2}L${x + W / 2} ${y}L${x} ${y + H / 2}L${x - W / 2} ${y}Z" fill="${fill}" stroke="${stroke}" stroke-width="2"/>`;
}
const [cx, cy] = P(4, 3), h = 44;
out += `<g class="cube"><path d="M${cx} ${cy - H / 2 - h}L${cx + W / 2} ${cy - h}L${cx} ${cy + H / 2 - h}L${cx - W / 2} ${cy - h}Z" fill="#c3aee6"/>` +
  `<path d="M${cx + W / 2} ${cy - h}L${cx + W / 2} ${cy}L${cx} ${cy + H / 2}L${cx} ${cy + H / 2 - h}Z" fill="#a98fd0"/>` +
  `<path d="M${cx - W / 2} ${cy - h}L${cx - W / 2} ${cy}L${cx} ${cy + H / 2}L${cx} ${cy + H / 2 - h}Z" fill="#8a6cb8"/></g>`;
s.innerHTML = out;
</script></body></html>
