<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── WOW: stroked, shadowed WOWs slammed onto dotted paper ──── */
  .b-wow { background-color: #f2ede2; background-image: radial-gradient(rgba(32,26,23,.08) 2px, transparent 2.2px); background-size: 22px 22px;
    font-family: 'Arial Black', 'Segoe UI', sans-serif; font-weight: 900; }
  .b-wow .w { position: absolute; white-space: nowrap; -webkit-text-stroke: .35cqi #201a17; paint-order: stroke fill; text-shadow: .5cqi .5cqi 0 #201a17; }
  .b-wow .w.s { -webkit-text-stroke: .25cqi #201a17; text-shadow: .3cqi .3cqi 0 #201a17; }
  .b-wow .w.i { font-family: Georgia, serif; font-weight: 400; font-style: italic; -webkit-text-stroke: 0; text-shadow: none; color: rgba(32,26,23,.45) !important; }
  .b-wow .hero { position: relative; font-size: 26cqi; line-height: 1; color: #f7c948; -webkit-text-stroke: .9cqi #201a17; paint-order: stroke fill;
    text-shadow: 1.4cqi 1.4cqi 0 #201a17; transform: rotate(-4deg); animation: slam 1.6s cubic-bezier(.3,1.6,.5,1) infinite; }
  @keyframes slam { 0%, 60% { transform: rotate(-4deg) scale(1); } 70% { transform: rotate(-4deg) scale(1.12); } 85% { transform: rotate(-4deg) scale(.96); } 100% { transform: rotate(-4deg) scale(1); } }
</style></head>
<body><div class="b b-wow">
  <div class="w s" style="left:5cqi;top:5cqi;font-size:4.6cqi;color:#5aa0db;transform:rotate(-12deg)">wow</div>
  <div class="w" style="left:9cqi;bottom:5cqi;font-size:7cqi;color:#f0563e;transform:rotate(8deg)">WOW</div>
  <div class="w i" style="left:24cqi;top:8cqi;font-size:3.6cqi;transform:rotate(-4deg)">wow.</div>
  <div class="w s" style="right:6cqi;top:6cqi;font-size:6cqi;color:#b7ce3c;transform:rotate(10deg)">WOW!</div>
  <div class="w" style="right:5cqi;bottom:6cqi;font-size:5.2cqi;color:#ff7fa5;transform:rotate(-9deg)">wOw</div>
  <div class="w i" style="right:22cqi;bottom:4cqi;font-size:3.4cqi;transform:rotate(5deg)">(wow)</div>
  <div class="w s" style="left:31cqi;bottom:4.5cqi;font-size:3.8cqi;color:#a98fd0;transform:rotate(-6deg)">WOWWW</div>
  <div class="hero">WOW</div>
</div></body></html>
