<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Wreck This Page: our own homepage grid, shot up ─────────── */
  .b-wtp { background: #fff; font-family: Georgia, 'Times New Roman', serif; color: #201a17; }
  .b-wtp .grid { position: absolute; inset: -2cqi; display: grid; grid-template-columns: repeat(4, 1fr); gap: 2cqi; padding: 4cqi; }
  .b-wtp .grid i { border-radius: 1.4cqi; border: .25cqi solid #e4ded3; background: var(--c); height: 10cqi; }
  .b-wtp .grid i:nth-child(3) { transform: translateY(3cqi) rotate(14deg); }
  .b-wtp .grid i:nth-child(6) { transform: translate(-1cqi, 4cqi) rotate(-9deg); }
  .b-wtp .grid i:nth-child(10) { transform: translateY(2cqi) rotate(22deg); }
  .b-wtp .grid i:nth-child(12) { visibility: hidden; }
  .b-wtp .holes { position: absolute; inset: 0; width: 100%; height: 100%; }
  .b-wtp .hud { position: relative; background: #fff8ef; border: .35cqi solid #201a17; border-radius: 2cqi; box-shadow: .6cqi .6cqi 0 #201a17;
    padding: 2.4cqi 4cqi 2.2cqi; transform: rotate(-1.5deg); text-align: center; }
  .b-wtp .hud h1 { margin: 0; font: 700 8.6cqi/1 Georgia, serif; letter-spacing: -.1cqi; }
  .b-wtp .dmg { margin-top: 1.2cqi; font: 900 4.8cqi/1 'Arial Black', Arial, sans-serif; color: #f7c948; -webkit-text-stroke: .8cqi #201a17; paint-order: stroke fill; }
  .b-wtp .dmg small { font: italic 400 2.6cqi Georgia, serif; color: #201a17; -webkit-text-stroke: 0; margin-left: 1cqi; }
  .b-wtp .hole { animation: hit 2.2s steps(1) infinite; }
  @keyframes hit { 0%, 50% { opacity: 0; } 51%, 100% { opacity: 1; } }
</style></head>
<body><div class="b b-wtp">
  <div class="grid">
    <i style="--c:#f2ede2"></i><i style="--c:#cfe3f4"></i><i style="--c:#f7c948"></i><i style="--c:#1d1d1d"></i>
    <i style="--c:#b7ce3c"></i><i style="--c:#ffd9e2"></i><i style="--c:#201a17"></i><i style="--c:#efe4ff"></i>
    <i style="--c:#5aa0db"></i><i style="--c:#f47b28"></i><i style="--c:#e9e5dd"></i><i style="--c:#fff"></i>
    <i style="--c:#2fb0a3"></i><i style="--c:#f0563e"></i><i style="--c:#fbf9f3"></i><i style="--c:#a98fd0"></i>
  </div>
  <svg class="holes" viewBox="0 0 800 300">
    <g fill="#201a17"><circle cx="96" cy="70" r="6"/><circle cx="700" cy="232" r="7"/><circle cx="640" cy="62" r="5"/></g>
    <g stroke="#201a17" stroke-width="1.5" fill="none" opacity=".7">
      <path d="M96 70 L80 52 M96 70 L118 62 M96 70 L92 94 M700 232 L722 214 M700 232 L676 240 M700 232 L708 262 M640 62 L656 46 M640 62 L622 70"/>
    </g>
    <g class="hole"><circle cx="150" cy="238" r="7" fill="#201a17"/><path d="M150 238 L132 224 M150 238 L172 230 M150 238 L146 262" stroke="#201a17" stroke-width="1.5" opacity=".7"/></g>
  </svg>
  <div class="hud"><h1>Wreck This Page</h1><div class="dmg">$4,210<small>in damages</small></div></div>
</div></body></html>
