<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,800;1,9..144,400&family=Oswald:wght@600&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── On This Day: tear-off desk calendar + almanac type ────── */
  .b-od { background: #ebe7dc; font-family: 'Fraunces', Georgia, serif; color: #1d1b18; grid-template-columns: auto auto; gap: 7cqi; }
  .b-od .pad { position: relative; width: 25cqi; height: 29cqi; }
  .b-od .page { position: absolute; inset: 0; background: #fffdf7; box-shadow: 0 .4cqi 1.4cqi rgba(0,0,0,.18); text-align: center; overflow: hidden; transform-origin: 50% 0; }
  .b-od .page .m { background: #c8302b; color: #fff; font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 4cqi; letter-spacing: .6cqi; padding: 1.4cqi 0; }
  .b-od .page .d { font-size: 15cqi; font-weight: 800; line-height: 1.1; }
  .b-od .page .y { font-style: italic; font-size: 2.6cqi; color: #6b6458; }
  .b-od .under { transform: translate(.6cqi, .6cqi); box-shadow: none; background: #f4f0e6; }
  .b-od .top { animation: tear 4s ease-in infinite; }
  @keyframes tear { 0%, 60% { transform: none; opacity: 1; } 85% { transform: rotate(-24deg) translate(-8cqi, 10cqi); opacity: 0; } 86% { transform: none; opacity: 0; } 100% { opacity: 1; } }
  .b-od .rings { position: absolute; top: -1.4cqi; left: 0; right: 0; display: flex; justify-content: space-around; padding: 0 4cqi; z-index: 2; }
  .b-od .rings i { width: 1.4cqi; height: 3cqi; border-radius: .7cqi; background: #6b6458; }
  .b-od .word { font-size: 11cqi; font-weight: 800; line-height: .95; letter-spacing: -.3cqi; }
  .b-od .word small { display: block; margin-top: 2.6cqi; font-size: 3.2cqi; font-weight: 400; font-style: italic; letter-spacing: 0; color: #6b6458; }
</style></head>
<body><div class="b b-od">
  <div class="pad">
    <div class="rings"><i></i><i></i><i></i></div>
    <div class="page under"><div class="m">JULY</div><div class="d">21</div><div class="y">1969</div></div>
    <div class="page top"><div class="m">JULY</div><div class="d">20</div><div class="y">1969 · moon landing</div></div>
  </div>
  <div class="word">On This<br>Day<small>what happened on your birthday</small></div>
</div></body></html>
