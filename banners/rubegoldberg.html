<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Rube Goldberg Machine: ball, ramp, dominoes ───────────── */
  .b-rube { background: radial-gradient(ellipse at 70% 80%, #1e2a3a, #1a1a2e 60%, #0d1117); font-family: 'Courier New', monospace; place-items: start start; }
  .b-rube .word { position: relative; padding: 5cqi 0 0 5cqi; font-weight: 700; font-size: 8cqi; line-height: 1.05; letter-spacing: .03em; text-transform: uppercase; color: #f0c040; text-shadow: 0 0 2.5cqi rgba(240,192,64,.5); }
  .b-rube .word small { display: block; margin-top: 2cqi; font-size: 3cqi; letter-spacing: .12em; color: #7efff5; text-shadow: 0 0 1.2cqi rgba(126,255,245,.6); }
  .b-rube svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .b-rube .ball { animation: roll 5s cubic-bezier(.5,0,.6,1) infinite; }
  @keyframes roll { 0% { transform: translate(0, 0); } 35% { transform: translate(178px, 82px); } 45%, 100% { transform: translate(224px, 82px); } }
  .b-rube .dom { transform-box: fill-box; transform-origin: 100% 100%; animation: tip 5s ease-in infinite; animation-delay: var(--d); }
  @keyframes tip { 0%, 44% { transform: rotate(0); } 50%, 92% { transform: rotate(62deg); } 100% { transform: rotate(0); } }
</style></head>
<body><div class="b b-rube">
  <svg viewBox="0 0 800 300">
    <line x1="420" y1="250" x2="770" y2="250" stroke="#4a6a7a" stroke-width="3"/>
    <path d="M410 134 L600 222" stroke="#7efff5" stroke-width="5" stroke-linecap="round" style="filter: drop-shadow(0 0 6px rgba(126,255,245,.6))"/>
    <line x1="470" y1="162" x2="470" y2="250" stroke="#4a6a7a" stroke-width="3"/><line x1="560" y1="204" x2="560" y2="250" stroke="#4a6a7a" stroke-width="3"/>
    <circle class="ball" cx="420" cy="116" r="14" fill="#f0c040" stroke="#a07820" stroke-width="3"/>
    <g fill="#e0e0e0" stroke="#806010" stroke-width="2">
      <rect class="dom" style="--d:0s" x="660" y="196" width="10" height="54" rx="2"/>
      <rect class="dom" style="--d:.15s" x="690" y="196" width="10" height="54" rx="2"/>
      <rect class="dom" style="--d:.3s" x="720" y="196" width="10" height="54" rx="2"/>
      <rect class="dom" style="--d:.45s" x="750" y="196" width="10" height="54" rx="2"/>
    </g>
  </svg>
  <div class="word">Rube Goldberg<br>Machine<small>&gt; step 1 of 10</small></div>
</div></body></html>
