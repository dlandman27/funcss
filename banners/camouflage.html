<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Camouflage: white text on a white page, only visible because it's been selected ── */
  .b-camo { background: #ffffff; font-family: Georgia, 'Times New Roman', serif; color: #fff; }
  .b-camo .word { position: relative; font-size: 13cqi; line-height: 1.12; }
  .b-camo .sel { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: #b4d5fe; z-index: 0;
    animation: select 3.4s ease-in-out infinite; }
  @keyframes select { 0%, 30% { width: 100%; } 45% { width: 0; } 60% { width: 0; } 92%, 100% { width: 100%; } }
  .b-camo .word span { position: relative; z-index: 1; text-shadow: 0 0 .05cqi rgba(0,0,0,.05); }
  .b-camo .ibeam { position: absolute; left: 100%; margin-left: .2cqi; top: 1.4cqi; width: .35cqi; height: 13.6cqi; background: #222;
    animation: drag 3.4s ease-in-out infinite; }
  .b-camo .ibeam::before, .b-camo .ibeam::after { content: ''; position: absolute; left: -1cqi; width: 2.35cqi; height: .35cqi; background: #222; }
  .b-camo .ibeam::before { top: 0; } .b-camo .ibeam::after { bottom: 0; }
  @keyframes drag { 0%, 30% { left: 100%; } 45%, 60% { left: 0; } 92%, 100% { left: 100%; } }
  .b-camo .hint { position: absolute; bottom: 4cqi; font-size: 2.6cqi; font-style: italic; color: #e4e4e4; }
</style></head>
<body><div class="b b-camo">
  <div class="word"><div class="sel"></div><span>Camouflage</span><i class="ibeam"></i></div>
  <div class="hint">it's in there somewhere</div>
</div></body></html>
