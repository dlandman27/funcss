<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── String Art: ring of pins, coral thread on paper ───────── */
  .b-string { background: #efe8db; font-family: Georgia, 'Times New Roman', serif; color: #201a17; place-items: center start; }
  .b-string canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .b-string h1 { position: relative; margin: 0 0 0 7cqi; font-weight: 400; font-size: 11cqi; line-height: 1; letter-spacing: -.1cqi; }
  .b-string h1 i { display: block; font-size: 3.4cqi; color: #f0563e; margin-top: 1.6cqi; letter-spacing: .2cqi; }
</style></head>
<body><div class="b b-string">
  <canvas id="c" width="800" height="300"></canvas>
  <h1>String Art<i>sweep the pins</i></h1>
</div>
<script>
const c = document.getElementById('c'), g = c.getContext('2d');
const CX = 600, CY = 150, R = 118, N = 48;
const pin = (i) => { const a = i / N * Math.PI * 2 - Math.PI / 2; return [CX + Math.cos(a) * R, CY + Math.sin(a) * R]; };
const threads = [];
let a = 0;
function add() { const step = 17; threads.push([a % N, (a + step) % N]); a += 1; }
for (let i = 0; i < 40; i++) add();
function draw() {
  g.clearRect(0, 0, 800, 300);
  g.lineWidth = 1; g.strokeStyle = 'rgba(240, 86, 62, .55)';
  threads.forEach(([p, q], i) => { const [x1, y1] = pin(p), [x2, y2] = pin(q); g.globalAlpha = i === threads.length - 1 ? 1 : .8; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); });
  g.globalAlpha = 1;
  for (let i = 0; i < N; i++) { const [x, y] = pin(i); g.fillStyle = '#201a17'; g.beginPath(); g.arc(x, y, 2.6, 0, Math.PI * 2); g.fill(); }
}
draw();
if (LIVE) setInterval(() => { add(); if (threads.length > N) threads.shift(); draw(); }, 140);
</script></body></html>
