<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,800;1,400&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Metronome: walnut, brass pendulum, tempo marking ──────── */
  .b-mt { background: radial-gradient(ellipse at 30% 40%, #4a2c1c, #2a170e 70%); font-family: 'Playfair Display', Georgia, serif; color: #f3e6cf; grid-template-columns: auto auto; gap: 9cqi; }
  .b-mt .word { font-size: 10cqi; font-weight: 800; line-height: 1; }
  .b-mt .word small { display: block; margin-top: 2.6cqi; font-size: 3.6cqi; font-weight: 400; font-style: italic; color: #d8b26a; }
  .b-mt .metro { position: relative; justify-self: start; width: 26cqi; height: 33cqi; margin-top: 6cqi; }
  .b-mt .body { position: absolute; inset: 0; clip-path: polygon(32% 0, 68% 0, 100% 100%, 0 100%);
    background: linear-gradient(90deg, #6b3d22, #9a5e34 45%, #5a3019); }
  .b-mt .face { position: absolute; left: 36%; right: 36%; top: 8%; bottom: 22%; background: #f3e6cf;
    clip-path: polygon(18% 0, 82% 0, 100% 100%, 0 100%); }
  .b-mt .face::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(transparent 0 1.4cqi, rgba(42,23,14,.5) 1.4cqi 1.6cqi); clip-path: polygon(40% 0, 60% 0, 60% 100%, 40% 100%); }
  .b-mt .base { position: absolute; left: -6%; right: -6%; bottom: -1.6cqi; height: 2.4cqi; background: #3c2112; border-radius: .4cqi; }
  .b-mt .arm { position: absolute; left: 50%; bottom: 20%; width: .7cqi; height: 26cqi; margin-left: -.35cqi; background: linear-gradient(90deg, #b8913f, #f5d68a, #b8913f);
    transform-origin: 50% 100%; transform: rotate(-24deg); animation: swing 1s ease-in-out infinite alternate; }
  .b-mt .arm i { position: absolute; left: 50%; top: 18%; width: 3.6cqi; height: 4cqi; margin-left: -1.8cqi; background: linear-gradient(90deg, #b8913f, #f5d68a 50%, #b8913f); clip-path: polygon(20% 0, 80% 0, 100% 100%, 0 100%); }
  @keyframes swing { to { transform: rotate(24deg); } }
</style></head>
<body><div class="b b-mt">
  <div class="word">Metronome<small>♩ = 120 · moderato</small></div>
  <div class="metro"><div class="body"></div><div class="face"></div><div class="arm"><i></i></div><div class="base"></div></div>
</div></body></html>
