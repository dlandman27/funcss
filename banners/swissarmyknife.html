<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Swiss Army Knife: red handle, a blade folding out ─────── */
  .b-knife { background: #ece6db; font-family: 'Arial Black', Arial, sans-serif; color: #201a17; place-items: start; }
  .b-knife h1 { position: relative; margin: 5cqi 0 0 6cqi; font-size: 8.6cqi; line-height: 1; letter-spacing: -.3cqi; }
  .b-knife h1 small { display: block; font-family: Georgia, serif; font-weight: 400; font-style: italic; font-size: 3.2cqi;
    letter-spacing: 0; color: #6a635c; margin-top: 1.8cqi; }
  .b-knife .knife { position: absolute; left: 46cqi; top: 20cqi; width: 42cqi; height: 12.5cqi; }
  .b-knife .handle { position: absolute; inset: 0; border-radius: 5.5cqi; background: linear-gradient(#e2372b, #b81f16);
    box-shadow: inset 0 .5cqi 0 rgba(255,255,255,.25), 0 1cqi 0 #7e140e, 0 2.4cqi 3cqi rgba(0,0,0,.16); z-index: 3; }
  .b-knife .handle::before { content: ''; position: absolute; left: 50%; top: 50%; width: 5cqi; height: 5cqi; margin: -2.5cqi;
    background: linear-gradient(#fff, #fff) center / 1.6cqi 100% no-repeat, linear-gradient(#fff, #fff) center / 100% 1.6cqi no-repeat; }
  .b-knife .handle::after { content: ''; position: absolute; top: 50%; width: 1.8cqi; height: 1.8cqi; margin-top: -.9cqi; left: 3.6cqi;
    border-radius: 50%; background: #d9d2c4; box-shadow: 33cqi 0 0 #d9d2c4; }
  /* tools pivot at the handle's ends */
  .b-knife .tool { position: absolute; z-index: 1; }
  .b-knife .blade { left: 4.5cqi; top: 1.5cqi; width: 33cqi; height: 7.5cqi; transform-origin: 0 50%;
    background: linear-gradient(#f4f6f8, #b8c0c7); clip-path: polygon(0 0, 80% 0, 100% 62%, 92% 100%, 0 100%);
    transform: rotate(-174deg); animation: blade 3.8s ease-in-out infinite; }
  @keyframes blade { 0%, 100% { transform: rotate(-174deg); } 45%, 55% { transform: rotate(-196deg); } }
  .b-knife .scis { right: 4.5cqi; top: 3cqi; width: 14cqi; height: 3cqi; transform-origin: 100% 50%; border-radius: 0 0 0 3cqi;
    background: linear-gradient(#e6eaed, #a9b1b8); transform: rotate(38deg); }
  .b-knife .cork { right: 4.5cqi; top: 4cqi; width: 12cqi; height: 2.4cqi; transform-origin: 100% 50%;
    background: repeating-linear-gradient(90deg, #b8c0c7 0 1cqi, #8d959c 1cqi 1.6cqi); border-radius: 1cqi; transform: rotate(70deg); }
</style></head>
<body><div class="b b-knife">
  <h1>Swiss Army Knife</h1>
  <div class="knife">
    <div class="tool blade"></div>
    <div class="tool scis"></div>
    <div class="tool cork"></div>
    <div class="handle"></div>
  </div>
</div></body></html>
