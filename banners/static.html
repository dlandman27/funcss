<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Static: TV snow + Press Start ─────────────────────────── */
  .b-static { background: #111; font-family: 'Press Start 2P', monospace; }
  .b-static canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
  .b-static::after {
    content: ''; position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.35) 0 2px, transparent 2px 4px);
  }
  .b-static .word {
    position: relative; z-index: 1; font-size: 10cqi; color: #fff;
    background: #000; padding: 2.5cqi 4cqi; border: .6cqi solid #fff;
  }
</style></head>
<body><div class="b b-static">
      <canvas id="snow" width="160" height="60"></canvas>
      <div class="word">STATIC</div>
</div>
<script>
const c = document.getElementById('snow'), g = c.getContext('2d'), img = g.createImageData(c.width, c.height);
(function snow() {
  for (let i = 0; i < img.data.length; i += 4) { const v = Math.random() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  g.putImageData(img, 0, 0);
  if (LIVE) setTimeout(() => requestAnimationFrame(snow), 70);
})();
</script></body></html>
