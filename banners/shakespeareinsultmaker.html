<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Crimson+Text:ital,wght@1,400;1,600&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Shakespeare Insult Maker: parchment scroll, blackletter ─ */
  .b-bard { background: radial-gradient(ellipse at 50% 45%, #f8ecca 0%, #f4e4bc 55%, #e2c992 100%); color: #2c1810; }
  .b-bard::before { content: ''; position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 50%, transparent 60%, rgba(139, 69, 19, .28) 100%); }
  .b-bard .rule { position: absolute; left: 6cqi; right: 6cqi; height: .3cqi; background: #8B4513; opacity: .55; }
  .b-bard .rule.t { top: 4cqi; } .b-bard .rule.bt { bottom: 4cqi; }
  .b-bard .wrap { position: relative; text-align: center; }
  .b-bard h1 { margin: 0; font-family: 'UnifrakturMaguntia', serif; font-weight: 400;
    font-size: 8.6cqi; line-height: 1.05; color: #2c1810; }
  .b-bard .insult { margin-top: 2.2cqi; font-family: 'Crimson Text', serif; font-style: italic; font-weight: 600;
    font-size: 4.2cqi; color: #8B4513; height: 5.6cqi; }
  .b-bard .insult span { display: inline-block; transition: opacity .5s; }
  .b-bard .insult span.out { opacity: 0; }
</style></head>
<body><div class="b b-bard">
  <div class="rule t"></div><div class="rule bt"></div>
  <div class="wrap">
    <h1>Shakespeare<br>Insult Maker</h1>
    <div class="insult"><span id="ins">“Thou beef-witted clotpole!”</span></div>
  </div>
</div>
<script>
const A = ['artless','bawdy','churlish','craven','frothy','gleeking','loggerheaded','mammering','puny','reeky','saucy','yeasty'];
const B = ['beef-witted','boil-brained','clay-brained','dizzy-eyed','fool-born','hasty-witted','onion-eyed','rump-fed','toad-spotted'];
const C = ['clotpole','barnacle','codpiece','coxcomb','flap-dragon','hedge-pig','maggot-pie','pigeon-egg','ratsbane','scut'];
const pick = (a) => a[Math.random() * a.length | 0], el = document.getElementById('ins');
if (LIVE) setInterval(() => {
  el.classList.add('out');
  setTimeout(() => { el.textContent = `“Thou ${pick(A)} ${pick(B)} ${pick(C)}!”`; el.classList.remove('out'); }, 500);
}, 2600);
</script></body></html>
