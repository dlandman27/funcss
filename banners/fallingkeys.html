<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Falling Keys: the title typed out in loose keycaps ─────── */
  .b-keys { background: #f0e8d8; font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; color: #2b2622; }
  .b-keys .rows { position: absolute; left: 6cqi; top: 4.5cqi; display: grid; gap: 1.6cqi; }
  .b-keys .row { display: flex; gap: 1.2cqi; }
  .b-keys .k { width: 10cqi; height: 10cqi; border-radius: 1.4cqi; background: #fffdf8; display: grid; place-items: center;
    font-size: 6.6cqi; font-weight: 600; box-shadow: inset 0 -.9cqi 0 #ddd3c2, 0 .4cqi 0 #b9ad98, 0 .9cqi 1.2cqi rgba(60,40,20,.18); padding-bottom: .6cqi; }
  .b-keys .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 3cqi; background: #e2d7c2; }
  .b-keys .pile { position: absolute; bottom: 2.2cqi; }
  .b-keys .pile .k { position: absolute; width: 7.5cqi; height: 7.5cqi; font-size: 4.2cqi; color: #6b6158; }
  .b-keys .drop { animation: fall 2.6s cubic-bezier(.55,0,1,.45) infinite; }
  @keyframes fall { 0%, 30% { transform: translateY(0) rotate(0); } 62% { transform: translateY(18.5cqi) rotate(24deg); }
    70% { transform: translateY(15cqi) rotate(30deg); } 78%, 92% { transform: translateY(18.5cqi) rotate(34deg); opacity: 1; } 100% { transform: translateY(18.5cqi) rotate(34deg); opacity: 0; } }
</style></head>
<body><div class="b b-keys">
  <div class="floor"></div>
  <div class="rows">
    <div class="row"><span class="k">F</span><span class="k" style="transform:rotate(-3deg)">A</span><span class="k">L</span><span class="k" style="transform:translateY(.8cqi) rotate(4deg)">L</span><span class="k">I</span><span class="k" style="transform:rotate(-2deg)">N</span><span class="k">G</span></div>
    <div class="row"><span class="k" style="transform:rotate(2deg)">K</span><span class="k">E</span><span class="k" style="transform:translateY(1.2cqi) rotate(-6deg)">Y</span><span class="k drop">S</span></div>
  </div>
  <div class="pile" style="left:76cqi;width:20cqi;height:12cqi">
    <span class="k" style="left:0;bottom:0;transform:rotate(-14deg)">Q</span>
    <span class="k" style="left:7.4cqi;bottom:0;transform:rotate(9deg)">⌘</span>
    <span class="k" style="left:14cqi;bottom:0;transform:rotate(-4deg)">J</span>
    <span class="k" style="left:3.6cqi;bottom:6.8cqi;transform:rotate(22deg)">Z</span>
    <span class="k" style="left:11cqi;bottom:6.6cqi;transform:rotate(-30deg)">R</span>
  </div>
</div></body></html>
