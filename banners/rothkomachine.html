<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Rothko Machine: a color field under a gallery light ───── */
  .b-rothko { background: radial-gradient(ellipse 60% 90% at 24% 40%, rgba(255, 240, 214, .10), transparent 70%), #211e1a; font-family: Georgia, 'Times New Roman', serif; place-items: center end; }
  .b-rothko .canvas { position: absolute; left: 8cqi; top: 50%; width: 22cqi; height: 30cqi; margin-top: -15cqi; background: #7a2a1f; box-shadow: 0 3cqi 7cqi rgba(0,0,0,.55);
    animation: shift 8s ease-in-out infinite alternate; }
  .b-rothko .canvas i { position: absolute; left: 1.6cqi; right: 1.6cqi; filter: blur(.35cqi); border-radius: .5cqi; }
  .b-rothko .canvas .a { top: 1.6cqi; height: 15cqi; background: #c25e1c; }
  .b-rothko .canvas .bb { top: 17.6cqi; height: 3cqi; background: #5b1d18; }
  .b-rothko .canvas .c { top: 21.6cqi; bottom: 1.6cqi; background: #d4a83b; }
  @keyframes shift { to { filter: hue-rotate(-38deg) saturate(.85); } }
  .b-rothko .word { position: relative; padding-right: 8cqi; text-align: left; width: 56cqi; font-style: italic; font-size: 10cqi; line-height: 1; color: #d8cfba; }
  .b-rothko .word small { display: block; margin-top: 2.6cqi; font-style: normal; font-size: 2.4cqi; letter-spacing: .16em; text-transform: uppercase; color: #8d8371; }
</style></head>
<body><div class="b b-rothko">
  <div class="canvas"><i class="a"></i><i class="bb"></i><i class="c"></i></div>
  <div class="word">Rothko<br>Machine<small>No. 4,812 · oil on screen</small></div>
</div></body></html>
