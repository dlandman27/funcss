<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── The Stress Dummy: crash-test yellow, floppy ragdoll ───── */
  .b-dummy { background: #f7c948; font-family: 'Arial Black', Arial, sans-serif; color: #201a17; place-items: center start; }
  .b-dummy .stripe { position: absolute; left: 0; right: 0; bottom: 0; height: 4cqi;
    background: repeating-linear-gradient(-45deg, #201a17 0 2.5cqi, #f7c948 2.5cqi 5cqi); }
  .b-dummy h1 { position: relative; margin: 0 0 0 6cqi; font-size: 10cqi; line-height: .95; letter-spacing: -.3cqi; }
  .b-dummy h1 small { display: block; font-size: 4.2cqi; letter-spacing: .2cqi; }
  .b-dummy svg { position: absolute; right: 7cqi; top: 50%; width: 30cqi; height: 34cqi; margin-top: -18cqi; overflow: visible;
    transform-origin: 50% 10%; animation: fling 2.4s cubic-bezier(.3,1.6,.5,1) infinite; }
  @keyframes fling { 0%, 100% { transform: rotate(-14deg); } 30% { transform: rotate(26deg) translateY(-2cqi); } 60% { transform: rotate(-6deg); } }
  .b-dummy .arm { animation: flop 2.4s ease-in-out infinite; transform-box: fill-box; }
  @keyframes flop { 30% { transform: rotate(-24deg); } 60% { transform: rotate(10deg); } }
</style></head>
<body><div class="b b-dummy">
  <div class="stripe"></div>
  <h1><small>THE</small>Stress<br>Dummy</h1>
  <svg viewBox="0 0 120 140">
    <g stroke="#201a17" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
      <path class="arm" style="transform-origin:0 0" d="M44 50 Q26 62 18 84" fill="none" stroke="#fff8ef" stroke-width="13"/>
      <path class="arm" style="transform-origin:100% 0" d="M76 50 Q96 58 104 80" fill="none" stroke="#fff8ef" stroke-width="13"/>
      <path d="M50 92 Q44 112 40 132" fill="none" stroke="#fff8ef" stroke-width="14"/>
      <path d="M70 92 Q80 110 86 130" fill="none" stroke="#fff8ef" stroke-width="14"/>
      <rect x="40" y="42" width="40" height="56" rx="14" fill="#fff8ef"/>
      <circle cx="60" cy="22" r="19" fill="#fff8ef"/>
    </g>
    <!-- crash test target -->
    <g transform="translate(60 22)"><circle r="8" fill="#fff8ef" stroke="#201a17" stroke-width="2"/><path d="M0 -8 A8 8 0 0 1 8 0 L0 0 Z M0 8 A8 8 0 0 1 -8 0 L0 0 Z" fill="#201a17"/></g>
    <g transform="translate(60 68)"><circle r="9" fill="#fff8ef" stroke="#201a17" stroke-width="2"/><path d="M0 -9 A9 9 0 0 1 9 0 L0 0 Z M0 9 A9 9 0 0 1 -9 0 L0 0 Z" fill="#201a17"/></g>
  </svg>
</div></body></html>
