<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;800&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Password Generator: the mint strikes character tiles ──── */
  .b-pg { background: radial-gradient(ellipse at 50% 30%, #222a44, #121628 75%); font-family: 'JetBrains Mono', monospace; color: #eef0f8; }
  .b-pg .inner { text-align: center; }
  .b-pg .dept { font-size: 2.4cqi; letter-spacing: .5cqi; text-transform: uppercase; color: #8d95b5; }
  .b-pg .word { font-size: 8cqi; font-weight: 800; letter-spacing: -.3cqi; line-height: 1.1; margin: .8cqi 0 3.4cqi; }
  .b-pg .tray { display: flex; gap: 1.1cqi; justify-content: center; }
  .b-pg .t { width: 5.6cqi; height: 7.4cqi; display: grid; place-items: center; font-size: 4.2cqi; font-weight: 800; border-radius: .6cqi;
    color: #121628; box-shadow: inset 0 -.5cqi 0 rgba(0,0,0,.22), inset 0 .3cqi 0 rgba(255,255,255,.5), 0 .5cqi 1cqi rgba(0,0,0,.4); --r: 0deg; transform: rotate(var(--r)); }
  .b-pg .u { background: linear-gradient(#bcd6f5, #7fa6d6); } .b-pg .l { background: linear-gradient(#f2efe6, #cfcabb); }
  .b-pg .d { background: linear-gradient(#f8dc7c, #d7a93c); } .b-pg .y { background: linear-gradient(#f59a86, #d0583f); color: #fff; }
  .b-pg .hot { animation: strike 2.4s cubic-bezier(.3,1.6,.5,1) infinite; }
  @keyframes strike { 0%, 55%, 100% { transform: rotate(var(--r)); } 62% { transform: scale(.3) rotate(24deg); opacity: .2; } 74% { transform: scale(1.18) rotate(-6deg); opacity: 1; } }
</style></head>
<body><div class="b b-pg">
  <div class="inner">
    <div class="dept">bureau of engraving &amp; entropy</div>
    <div class="word">Password Generator</div>
    <div class="tray">
      <i class="t u" style="--r:-3deg">K</i><i class="t d" style="--r:2deg">7</i><i class="t l" style="--r:-1deg">m</i><i class="t y" style="--r:4deg">#</i>
      <i class="t l" style="--r:-2deg">q</i><i class="t u hot" style="--r:1deg">X</i><i class="t d" style="--r:-4deg">2</i><i class="t l" style="--r:3deg">f</i>
      <i class="t y" style="--r:-2deg">!</i><i class="t u" style="--r:2deg">R</i><i class="t l" style="--r:-3deg">w</i><i class="t d" style="--r:1deg">9</i>
    </div>
  </div>
</div></body></html>
