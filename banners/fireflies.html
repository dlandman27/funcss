<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Fireflies: night meadow, Georgia ──────────────────────── */
  .b-fire { background: radial-gradient(ellipse at 50% 120%, #1b3a16, #081009 55%, #04070c); font-family: Georgia, serif; }
  .b-fire .grass { position: absolute; left: 0; right: 0; bottom: 0; height: 22%;
    background: repeating-linear-gradient(100deg, transparent 0 6px, #0f2a0c 6px 8px), linear-gradient(transparent, #050b04); }
  .b-fire .fly { position: absolute; width: 1.4cqi; height: 1.4cqi; border-radius: 50%;
    background: #f9f3a0; box-shadow: 0 0 2cqi 1cqi rgba(249, 243, 160, .7); animation: glow 3s ease-in-out infinite;  }
  @keyframes glow { 50% { opacity: .15; } }
  .b-fire .word { position: relative; font-size: 12cqi; font-style: italic; color: #f3eecb;
    text-shadow: 0 0 3cqi rgba(249, 243, 160, .45); }
</style></head>
<body><div class="b b-fire">
      <div class="grass"></div>
      <span id="flies"></span>
      <div class="word">Fireflies</div>
</div>
<script>
const flies = document.getElementById('flies');
for (let i = 0; i < 22; i++) { const f = document.createElement('i'); f.className = 'fly';
  f.style.left = Math.random() * 100 + '%'; f.style.top = 10 + Math.random() * 75 + '%'; f.style.animationDelay = (-Math.random() * 3) + 's'; flies.appendChild(f); }
</script></body></html>
