<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Morse Code: red telegraph, Courier ────────────────────── */
  .b-morse { background: #f8f8f8; font-family: 'Courier New', monospace; color: #b91d19; }
  .b-morse .dots { position: absolute; left: 0; right: 0; top: 7cqi; text-align: center;
    font-size: 6cqi; letter-spacing: 1.4cqi; color: #e3342f; opacity: .55; font-weight: 700; }
  .b-morse .dots.b { top: auto; bottom: 6cqi; }
  .b-morse .word { font-size: 11cqi; font-weight: 700; letter-spacing: .5cqi; }
  .b-morse .word small { display: block; text-align: center; font-size: 4.2cqi; letter-spacing: 1.2cqi; color: #555; font-weight: 400; }
</style></head>
<body><div class="b b-morse">
      <div class="dots">-- --- .-. ... .</div>
      <div class="word">Morse Code<small>· – TRAINER – ·</small></div>
      <div class="dots b">-.-. --- -.. .</div>
</div></body></html>
