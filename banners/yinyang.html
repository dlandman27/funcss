<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Yin Yang: half white, half black, one symbol in the seam ── */
  .b-yy { background: linear-gradient(90deg, #fff 50%, #000 50%); font-family: Georgia, 'Times New Roman', serif; font-style: italic;
    grid-template-columns: 1fr auto 1fr; gap: 4cqi; padding: 0 5cqi; }
  .b-yy .w { font-size: 12cqi; letter-spacing: .3cqi; line-height: 1; }
  .b-yy .yin { text-align: right; color: #000; }
  .b-yy .yang { text-align: left; color: #fff; }
  .b-yy svg { width: 26cqi; height: 26cqi; animation: spin 6s cubic-bezier(.5,0,.3,1) infinite; filter: drop-shadow(0 0 .1cqi #888); }
  @keyframes spin { to { transform: rotate(360deg); } }
</style></head>
<body><div class="b b-yy">
  <div class="w yin">Yin</div>
  <svg viewBox="-102 -102 204 204">
    <circle r="100" fill="#fff" stroke="#000" stroke-width="3"/>
    <path d="M0 -100 A100 100 0 0 1 0 100 A50 50 0 0 1 0 0 A50 50 0 0 0 0 -100 Z" fill="#000"/>
    <circle cy="-50" r="14" fill="#fff"/><circle cy="50" r="14" fill="#000"/>
    <circle r="100" fill="none" stroke="#777" stroke-width="2"/>
  </svg>
  <div class="w yang">Yang</div>
</div></body></html>
