<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Write Me a Story: plain monospace page, the story types itself ── */
  .b-story { background: #f5f5f5; font-family: monospace; color: #222; }
  .b-story .paper { position: relative; width: 84cqi; background: #fff; border-radius: .5cqi; box-shadow: 0 .25cqi .5cqi rgba(0,0,0,.1);
    padding: 3.4cqi 4cqi 3.6cqi; }
  .b-story .lbl { font-size: 2.6cqi; font-weight: 700; color: #888; margin-bottom: 1.4cqi; }
  .b-story .t { font-size: 8.4cqi; font-weight: 700; line-height: 1.1; letter-spacing: -.2cqi; white-space: nowrap; }
  .b-story .s { margin-top: 2cqi; font-size: 2.8cqi; line-height: 1.6; color: #666; white-space: pre-wrap; min-height: 9cqi; }
  .b-story .cur { display: inline-block; animation: blink 1s infinite; color: #222; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
</style></head>
<body><div class="b b-story">
  <div class="paper">
    <div class="lbl">Start Typing:</div>
    <div class="t">Write Me a Story</div>
    <div class="s"><span id="s">Once upon a time, a person pressed a key, and the story kept going</span><span class="cur">|</span></div>
  </div>
</div>
<script>
const full = 'Once upon a time, a person pressed a key, and the story kept going without them. Every letter they hit, it wrote two more.';
const el = document.getElementById('s'); let n = el.textContent.length;
if (LIVE) setInterval(() => { n = n >= full.length ? 18 : n + 1; el.textContent = full.slice(0, n); }, 70);
</script></body></html>
