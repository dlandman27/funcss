<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Names in a Hat: magic-show curtain, top hat, paper slips ── */
  .b-nh { background: repeating-linear-gradient(90deg, #7a1424 0 3cqi, #8e1c2d 3cqi 4.6cqi, #6a101e 4.6cqi 6cqi); font-family: 'Rye', Georgia, serif; color: #f7e9c8; grid-template-columns: 1.25fr 1fr; }
  .b-nh::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 30% 55%, rgba(255,220,150,.22), rgba(0,0,0,.45) 75%); }
  .b-nh .word { position: relative; justify-self: end; margin-right: 2cqi; font-size: 8.4cqi; line-height: 1.08; text-align: center; text-shadow: .5cqi .5cqi 0 #2a0710; }
  .b-nh .word small { display: block; font-family: Georgia, serif; font-style: italic; font-size: 3cqi; color: #f7c948; margin-top: 1.6cqi; text-shadow: none; }
  .b-nh .hat { position: relative; justify-self: start; margin-left: 4cqi; width: 26cqi; height: 28cqi; margin-top: 4cqi; }
  .b-nh .crown { position: absolute; left: 4cqi; right: 4cqi; top: 6cqi; bottom: 3cqi; background: linear-gradient(90deg, #111 0%, #2b2b2b 30%, #0b0b0b 100%); border-radius: .8cqi .8cqi 0 0; }
  .b-nh .crown::before { content: ''; position: absolute; left: 0; right: 0; top: -1.6cqi; height: 3.2cqi; border-radius: 50%; background: #050505; }
  .b-nh .band { position: absolute; left: 4cqi; right: 4cqi; bottom: 4cqi; height: 4cqi; background: #c8302b; }
  .b-nh .brim { position: absolute; left: 0; right: 0; bottom: 1cqi; height: 4.6cqi; border-radius: 50%; background: linear-gradient(#2b2b2b, #050505); }
  .b-nh .slip { position: absolute; top: 2cqi; width: 6.4cqi; height: 8cqi; background: #fff8ef; border: .25cqi solid #201a17; transform-origin: 50% 100%; }
  .b-nh .slip::after { content: ''; position: absolute; left: 20%; right: 20%; top: 30%; height: .5cqi; background: #201a17; box-shadow: 0 1.4cqi 0 #201a17; opacity: .6; }
  .b-nh .s1 { left: 6cqi; transform: rotate(-16deg); } .b-nh .s2 { left: 10.5cqi; top: 0; transform: rotate(4deg); animation: draw 3s ease-in-out infinite; } .b-nh .s3 { left: 14.5cqi; transform: rotate(18deg); }
  @keyframes draw { 0%, 50%, 100% { transform: rotate(4deg); } 70% { transform: translateY(-6cqi) rotate(-6deg); } 80% { transform: translateY(-6.5cqi) rotate(8deg); } }
</style></head>
<body><div class="b b-nh">
  <div class="word">Names<br>in a Hat<small>the hat decides</small></div>
  <div class="hat"><i class="slip s1"></i><i class="slip s3"></i><i class="slip s2"></i><div class="crown"></div><div class="band"></div><div class="brim"></div></div>
</div></body></html>
