<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Perfect Circle: pencil loop around a dot, a score ─────── */
  .b-pc { background: #fbfaf6; font-family: 'Caveat', cursive; color: #2b2a28; grid-template-columns: 1fr 1fr; }
  .b-pc::before { content: ''; position: absolute; inset: 0; background-image: linear-gradient(rgba(90,160,219,.16) 1px, transparent 1px); background-size: 100% 4cqi; }
  .b-pc .word { position: relative; justify-self: end; margin-right: 3cqi; font-size: 13cqi; line-height: .9; text-align: right; }
  .b-pc .word small { display: block; font-family: Georgia, serif; font-size: 3cqi; font-style: italic; color: #7a766c; margin-top: 2cqi; }
  .b-pc svg { position: relative; justify-self: start; width: 34cqi; height: 34cqi; margin-left: 2cqi; overflow: visible; }
  .b-pc .loop { fill: none; stroke: #2b2a28; stroke-width: 3.2; stroke-linecap: round; stroke-dasharray: 820; stroke-dashoffset: 0; animation: draw 4s ease-in-out infinite; }
  @keyframes draw { 0%, 15% { stroke-dashoffset: 0; } 20% { stroke-dashoffset: 820; } 60%, 100% { stroke-dashoffset: 0; } }
  .b-pc .score { font-family: 'Caveat', cursive; font-size: 26px; fill: #2fa36b; }
</style></head>
<body><div class="b b-pc">
  <div class="word">Perfect<br>Circle<small>draw one freehand</small></div>
  <svg viewBox="0 0 120 120">
    <path class="loop" d="M60 14 C86 13 106 32 106 59 C107 86 87 106 60 105 C33 106 14 87 15 60 C14 33 34 15 58 15 L66 13"/>
    <circle cx="60" cy="60" r="3.4" fill="#e0453a"/>
    <text class="score" x="60" y="84" text-anchor="middle">97.3%</text>
  </svg>
</div></body></html>
