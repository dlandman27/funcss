<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Limelight&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Shortwave: glowing amber tuning dial at night ─────────── */
  .b-sw { background: radial-gradient(ellipse at 50% 40%, #3a2416 0%, #1c120c 70%, #120b07 100%); }
  .b-sw .glass { position: relative; width: 84cqi; height: 30cqi; border-radius: 1cqi;
    background: linear-gradient(180deg, #ffd88a 0%, #f2b250 55%, #d98a2c 100%);
    box-shadow: 0 0 6cqi rgba(255, 180, 80, .35), inset 0 0 3cqi rgba(120, 50, 0, .45);
    border: .6cqi solid #6b4423; overflow: hidden; }
  .b-sw .scale { position: absolute; left: 0; right: 0; bottom: 2cqi; height: 6cqi;
    background: repeating-linear-gradient(90deg, #4a2a10 0 .25cqi, transparent .25cqi 2cqi); opacity: .7;
    -webkit-mask: linear-gradient(#000 0 0) top / 100% 50% no-repeat, repeating-linear-gradient(90deg, #000 0 .3cqi, transparent .3cqi 10cqi); }
  .b-sw .nums { position: absolute; left: 4cqi; right: 4cqi; bottom: 8.4cqi; display: flex; justify-content: space-between;
    font: 700 2.2cqi Georgia, serif; color: #5a3210; opacity: .8; }
  .b-sw h1 { position: absolute; left: 0; right: 0; top: 3.2cqi; margin: 0; text-align: center;
    font-family: 'Limelight', serif; font-weight: 400; font-size: 12cqi; line-height: 1; color: #3b1d08;
    letter-spacing: .4cqi; z-index: 2; }
  .b-sw .needle { position: absolute; top: 0; bottom: 0; left: 62%; width: .6cqi; background: #c0201a;
    box-shadow: 0 0 1cqi rgba(192, 32, 26, .6); z-index: 1; opacity: .85; animation: tune 7s ease-in-out infinite; }
  @keyframes tune { 0% { transform: translateX(0); } 35% { transform: translateX(-30cqi); } 60% { transform: translateX(-26cqi); } 100% { transform: translateX(0); } }
</style></head>
<body><div class="b b-sw">
  <div class="glass">
    <h1>Shortwave</h1>
    <div class="nums"><span>3</span><span>5</span><span>7</span><span>9</span><span>11</span><span>13</span><span>15</span><span>17</span><span>21</span></div>
    <div class="scale"></div>
    <div class="needle"></div>
  </div>
</div></body></html>
