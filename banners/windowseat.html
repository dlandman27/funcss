<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Window Seat: a foggy train window, one wiped patch ─────── */
  .b-win { background: #201a17; font-family: Georgia, serif; color: #f2ede2; place-items: center start; }
  .b-win .pane { position: absolute; left: 3cqi; right: 3cqi; top: 4cqi; bottom: 4cqi; border-radius: 5cqi; overflow: hidden;
    box-shadow: inset 0 0 0 .8cqi #3a302a, 0 0 0 .8cqi #4a3e36; }
  .b-win .land { position: absolute; inset: 0; background: linear-gradient(#91adb5, #e0d9b9 65%, #9ca58d); }
  .b-win .hills { position: absolute; left: 0; bottom: 0; width: 200%; height: 100%; animation: roll 14s linear infinite; }
  @keyframes roll { to { transform: translateX(-50%); } }
  .b-win .fog { position: absolute; inset: 0; background: rgba(208,220,216,.9);
    -webkit-mask-image: radial-gradient(ellipse 24cqi 15cqi at 77% 52%, transparent 55%, #000 100%); }
  .b-win .drops { position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(255,255,255,.55) 0 .25cqi, transparent .35cqi);
    background-size: 5.3cqi 4.1cqi; opacity: .5;
    -webkit-mask-image: radial-gradient(ellipse 24cqi 15cqi at 77% 52%, transparent 55%, #000 100%); }
  .b-win .word { position: relative; margin-left: 8cqi; font-size: 11cqi; line-height: 1; color: #201a17; }
  .b-win .word small { display: block; margin-top: 1.8cqi; font-size: 2.8cqi; font-style: italic; letter-spacing: .2cqi; color: rgba(32,26,23,.65); }
</style></head>
<body><div class="b b-win">
  <div class="pane">
    <div class="land"></div>
    <svg class="hills" viewBox="0 0 1600 300" preserveAspectRatio="none">
      <g id="h">
        <path d="M0 190 C120 160 220 175 340 150 C470 125 560 170 700 160 C750 156 780 178 800 190 V300 H0 Z" fill="#7f9a8e"/>
        <path d="M0 230 C100 215 180 200 300 212 C420 224 500 196 640 205 C740 212 800 230 800 230 V300 H0 Z" fill="#5f7b62"/>
        <g fill="#4a6650"><rect x="520" y="168" width="10" height="36"/><circle cx="525" cy="160" r="20"/><rect x="180" y="178" width="8" height="28"/><circle cx="184" cy="172" r="15"/></g>
        <path d="M0 262 H800" stroke="#3d4a3c" stroke-width="3"/>
      </g>
      <use href="#h" x="800"/>
    </svg>
    <div class="fog"></div>
    <div class="drops"></div>
  </div>
  <div class="word">Window Seat<small>carriage 04 · seat 12A</small></div>
</div></body></html>
