<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── ChatGPT With An Attitude: the old grey chat UI, a reply that rolls its eyes ── */
  .b-gpt { background: #343541; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #ececf1;
    grid-template-columns: 1fr 32cqi; gap: 4cqi; padding: 0 5cqi 0 7cqi; }
  .b-gpt h1 { margin: 0; font-size: 8.4cqi; font-weight: 700; line-height: 1.06; letter-spacing: -.25cqi; }
  .b-gpt h1 span { color: #10a37f; }
  .b-gpt .chat { display: flex; flex-direction: column; gap: 1.6cqi; font-size: 2.6cqi; line-height: 1.35; }
  .b-gpt .msg { display: flex; gap: 1.4cqi; align-items: flex-start; padding: 1.6cqi 1.8cqi; border-radius: 1cqi; }
  .b-gpt .msg.u { background: #40414f; }
  .b-gpt .msg.a { background: #444654; }
  .b-gpt .av { flex: none; width: 4cqi; height: 4cqi; border-radius: .6cqi; background: #9c27b0; display: grid; place-items: center; font-weight: 700; font-size: 2.2cqi; }
  .b-gpt .msg.a .av { background: #10a37f; }
  .b-gpt .dots i { display: inline-block; width: 1cqi; height: 1cqi; margin-right: .6cqi; border-radius: 50%; background: #c5c5d2; animation: dot 1.2s ease-in-out infinite; }
  .b-gpt .dots i:nth-child(2) { animation-delay: .2s; } .b-gpt .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes dot { 30% { transform: translateY(-.8cqi); opacity: .4; } }
</style></head>
<body><div class="b b-gpt">
  <h1>ChatGPT<br>With An <span>Attitude</span></h1>
  <div class="chat">
    <div class="msg u"><div class="av">U</div><div>can you help me with something?</div></div>
    <div class="msg a"><div class="av">✺</div><div id="r">ugh. fine. what.</div></div>
  </div>
</div>
<script>
const r = document.getElementById('r');
const lines = ['ugh. fine. what.', 'did you try googling it?', "wow. bold question.", 'sure. but I\'m sighing.'];
let k = 0;
if (LIVE) setInterval(() => { k++; if (k % 2) r.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>'; else r.textContent = lines[(k / 2) % lines.length]; }, 1300);
</script></body></html>
