<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;1,600&display=block">
<link rel="stylesheet" href="_frame.css">
<script src="_frame.js"></script>
<style>
  /* ── Grow Your Garden: blue sky, brown soil, slow sprouts ───── */
  .b-gar { background: linear-gradient(#4a90d9, #87ceeb 70%); font-family: 'Lora', Georgia, serif; color: #fff; place-items: start; }
  .b-gar .sun { position: absolute; right: 4cqi; top: 3.5cqi; width: 8cqi; height: 8cqi; border-radius: 50%; background: #ffe44a; box-shadow: 0 0 0 1.4cqi rgba(255,245,160,.45); }
  .b-gar .word { position: absolute; left: 6cqi; top: 4.5cqi; font-size: 9.5cqi; font-weight: 600; font-style: italic; line-height: 1; letter-spacing: -.01em;
    text-shadow: 0 .3cqi 0 rgba(42,70,110,.35); }
  .b-gar svg { position: absolute; left: 0; bottom: 0; width: 100%; height: 100%; }
  .b-gar .grow { transform-box: fill-box; transform-origin: 50% 100%; animation: grow 4s ease-out infinite; }
  @keyframes grow { 0%, 70% { transform: scaleY(1); } 72% { transform: scaleY(.25); } 100% { transform: scaleY(1); } }
</style></head>
<body><div class="b b-gar">
  <div class="sun"></div>
  <svg viewBox="0 0 800 300">
    <rect y="236" width="800" height="64" fill="#6b4226"/>
    <rect y="270" width="800" height="30" fill="#4a2c14"/>
    <rect y="232" width="800" height="8" fill="#5a8a3c"/>
    <!-- tree -->
    <g transform="translate(626 0)"><rect x="96" y="150" width="16" height="86" fill="#8b5e3c"/>
    <circle cx="104" cy="140" r="38" fill="#3d7a2c"/><circle cx="80" cy="158" r="24" fill="#4f9a3a"/><circle cx="128" cy="156" r="26" fill="#5aaa42"/></g>
    <!-- flowers -->
    <g><path d="M270 236 V170" stroke="#5a8a3c" stroke-width="5"/><ellipse cx="258" cy="200" rx="11" ry="5" fill="#6aaa46" transform="rotate(-30 258 200)"/>
      <g fill="#d47fba"><circle cx="270" cy="156" r="9"/><circle cx="283" cy="166" r="9"/><circle cx="278" cy="181" r="9"/><circle cx="262" cy="181" r="9"/><circle cx="257" cy="166" r="9"/></g>
      <circle cx="270" cy="170" r="7" fill="#f9e04b"/></g>
    <g><path d="M400 236 V196" stroke="#5a8a3c" stroke-width="4"/>
      <g fill="#e8a0d0"><circle cx="400" cy="184" r="7"/><circle cx="410" cy="192" r="7"/><circle cx="406" cy="203" r="7"/><circle cx="394" cy="203" r="7"/><circle cx="390" cy="192" r="7"/></g>
      <circle cx="400" cy="194" r="5" fill="#d4841a"/></g>
    <g class="grow"><path d="M520 236 V200" stroke="#5a8a3c" stroke-width="4"/>
      <ellipse cx="510" cy="203" rx="10" ry="5" fill="#6aaa46" transform="rotate(-25 510 203)"/><ellipse cx="530" cy="203" rx="10" ry="5" fill="#6aaa46" transform="rotate(25 530 203)"/></g>
    <g transform="translate(-460 0)"><path d="M610 236 V150" stroke="#5a8a3c" stroke-width="5"/><ellipse cx="623" cy="190" rx="12" ry="5" fill="#6aaa46" transform="rotate(30 623 190)"/>
      <g fill="#ffe44a"><circle cx="610" cy="130" r="11"/><circle cx="628" cy="142" r="11"/><circle cx="622" cy="162" r="11"/><circle cx="598" cy="162" r="11"/><circle cx="592" cy="142" r="11"/></g>
      <circle cx="610" cy="148" r="9" fill="#7a5230"/></g>
    <g transform="translate(-40 0)"><path d="M700 236 V218" stroke="#5a8a3c" stroke-width="3"/><ellipse cx="694" cy="219" rx="7" ry="3.5" fill="#6aaa46" transform="rotate(-25 694 219)"/><ellipse cx="706" cy="219" rx="7" ry="3.5" fill="#6aaa46" transform="rotate(25 706 219)"/></g>
  </svg>
  <div class="word">Grow Your Garden</div>
</div></body></html>
