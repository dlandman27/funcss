<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4f477b"><title>GBA · Cube controls</title><link rel="stylesheet" href="./style.css"></head><body>
<main class="controller" aria-label="Game Boy Advance controller">
<button class="shoulder l" data-input="l" aria-label="L (Q)"><span>L</span></button><button class="shoulder r" data-input="r" aria-label="R (E)"><span>R</span></button>
<div class="brand">NINTENDO<span>GAME BOY ADVANCE</span></div>
<div class="dpad-well"><img src="./assets/dpad.png" alt="" draggable="false"><button class="up" data-input="up" aria-label="Up"></button><button class="down" data-input="down" aria-label="Down"></button><button class="left" data-input="left" aria-label="Left"></button><button class="right" data-input="right" aria-label="Right"></button></div>
<div class="face-well"></div><button class="face a" data-input="a" aria-label="A (X)"><img src="./assets/a.png" alt="" draggable="false"></button><button class="face b" data-input="b" aria-label="B (Z)"><img src="./assets/b.png" alt="" draggable="false"></button>
<div class="system select"><button data-input="select" aria-label="Select (Shift)"><img src="./assets/start.png" alt="" draggable="false"></button><span>SELECT</span></div><div class="system start"><button data-input="start" aria-label="Start (Enter)"><img src="./assets/start.png" alt="" draggable="false"></button><span>START</span></div>
<button class="menu" data-input="menu" aria-label="Menu">•••</button><div class="speaker" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
</main><dialog><h1>GBA controller</h1><p>Arrow keys · D-pad<br>X / Z · A / B<br>Q / E · L / R<br>Shift / Enter · Select / Start<br>Escape · Menu</p><form method="dialog"><button class="resume">Resume</button></form></dialog><script type="module" src="./controller.js"></script></body></html>
